<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sack Lewis II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800;900&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-window canvas arena (letterboxed 16:9 world) with HTML menus floating over a live attract-mode scene. Single theme: Pompeian fresco. */
:root{
  --pompeii:#a52a1f;
  --pompeii-deep:#6a1912;
  --ochre:#e3a93b;
  --marble:#f3ebda;
  --marble-2:#e8dcc4;
  --ink:#1c1510;
  --tiber:#2b6b60;
  --muted:#7a6650;
  --display:"Cinzel Decorative","Cinzel",Georgia,serif;
  --head:"Cinzel",Georgia,serif;
  --body:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#120d0a;overflow:hidden;font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#game.playing{cursor:none}

#overlay{position:fixed;inset:0;z-index:5;overflow-y:auto;display:flex;padding:28px 20px}
#overlay[hidden]{display:none}
.scrim{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 45%,rgba(18,13,10,.35),rgba(18,13,10,.85))}
.panel{margin:auto;position:relative;background:var(--marble);border-radius:3px;padding:28px 30px 24px;
  box-shadow:0 0 0 5px var(--pompeii),0 0 0 7px var(--ochre),0 30px 80px rgba(0,0,0,.6);
  display:flex;flex-direction:column;gap:14px;animation:rise .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translateY(18px) scale(.98);opacity:.3}to{transform:none;opacity:1}}
.w-sm{width:min(540px,100%)} .w-md{width:min(780px,100%)} .w-lg{width:min(1060px,100%)}

.eyebrow{margin:0;font-weight:700;letter-spacing:.24em;font-size:13px;color:var(--pompeii);text-transform:uppercase}
.title{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(54px,8vw,92px);line-height:.9;color:var(--pompeii);text-shadow:3px 4px 0 var(--ochre);text-wrap:balance}
.title .ii{font-family:var(--head);font-weight:900;font-size:.6em;vertical-align:.18em;color:var(--ink);text-shadow:none;letter-spacing:.04em}
.sub{margin:-6px 0 0;font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.display{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(32px,4.4vw,46px);line-height:1;color:var(--pompeii);text-shadow:2px 3px 0 var(--ochre);text-wrap:balance}
h3{margin:4px 0 6px;font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
h3 small{font-family:var(--body);font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:none;font-size:14px}
p{margin:0}
.lede,.charge{font-size:19px;line-height:1.3;font-weight:500;max-width:64ch}
.charge b{color:var(--pompeii)}
.muted{color:var(--muted);font-size:16px;font-weight:600}
.fine{font-size:14px;color:var(--muted);font-weight:600;text-align:center}

.btn{font-family:var(--head);font-weight:900;font-size:17px;letter-spacing:.04em;background:var(--pompeii);color:var(--marble);border:0;border-radius:3px;padding:12px 18px;box-shadow:0 4px 0 var(--pompeii-deep);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pompeii-deep)}
.btn small{font-family:var(--body);font-weight:600;font-size:14px;letter-spacing:.02em;opacity:.85}
.btn.big{font-size:20px;padding:15px 22px}
.btn.ghost{background:transparent;color:var(--pompeii);box-shadow:inset 0 0 0 2px var(--pompeii)}
.btn.small{padding:8px 14px;font-size:15px;min-width:64px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.btn:focus-visible,.toggle:focus-visible,.card.decree:focus-visible,.tabs button:focus-visible{outline:3px solid var(--ochre);outline-offset:3px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 180px}

.menu .stack{max-width:440px}
.records{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:0}
.records div{border-top:2px solid var(--pompeii);padding-top:5px}
.records dt{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.records dd{margin:0;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.settings{display:flex;gap:8px;flex-wrap:wrap}
.toggle{font-family:var(--body);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:6px 14px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--marble)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--marble-2);border:2px solid rgba(28,21,16,.18);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit}
.card h3{margin:0;font-size:18px}
.card p{font-size:17px;line-height:1.25;font-weight:500}
.card.locked{opacity:.75}
.card .portrait{width:120px;height:120px;border-radius:50%;align-self:center;box-shadow:0 0 0 3px var(--pompeii),0 0 0 5px var(--ochre)}
.card.locked .portrait{filter:grayscale(1) brightness(.6)}
.perks{margin:0;padding-left:18px;font-size:16px;font-weight:600;display:grid;gap:2px}
.lock{display:flex;flex-direction:column;gap:5px;font-weight:700;color:var(--muted);margin-top:auto}
.lock .bar{height:8px;background:rgba(28,21,16,.15);border-radius:4px;overflow:hidden}
.lock .bar i{display:block;height:100%;background:var(--ochre)}
.card.decree{cursor:pointer;min-height:190px;transition:transform .12s,box-shadow .12s}
.card.decree:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.card.decree small{margin-top:auto;font-weight:700;color:var(--muted);font-size:14px}
.rarity,.rar{font-weight:800;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.r-c{border-color:rgba(28,21,16,.25)} .r-c .rarity,.r-c .rar{color:var(--muted)}
.r-r{border-color:var(--tiber)} .r-r .rarity,.r-r .rar{color:var(--tiber)}
.r-l{border-color:var(--ochre);background:linear-gradient(160deg,#fbefc8,var(--marble-2));box-shadow:0 0 0 2px rgba(227,169,59,.4)} .r-l .rarity,.r-l .rar{color:#a8740f}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(28,21,16,.07);border:1px solid rgba(28,21,16,.15);border-radius:999px;padding:3px 12px 3px 5px;font-weight:700;font-size:16px}
.chip em{font-style:normal;color:#9a6a10;font-weight:800}
.chip.ach{background:#fbefc8;border-color:var(--ochre);padding-left:12px}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:20px;line-height:1;width:26px;text-align:center;flex:none}
.emo.lw{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pompeii);color:var(--marble);font-family:var(--head);font-weight:900;font-size:13px}
.excuses{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.excuses li{border-left:4px solid var(--pompeii);padding:4px 10px;background:rgba(165,42,31,.06);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.excuses li b{font-size:17px}
.excuses li span:last-child{flex-basis:100%;font-size:16px;font-weight:500;color:#4d3f31}
.excuses li.new{background:#fbefc8;border-left-color:var(--ochre)}
.tag-new{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:var(--pompeii);color:var(--marble);border-radius:3px;padding:1px 6px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:17px;font-weight:600;padding:10px 0;border-top:2px solid var(--pompeii);border-bottom:1px solid rgba(28,21,16,.15)}
.facts b{font-weight:800}
.facts.center{justify-content:center}
.laurels{display:inline-flex;gap:4px;align-items:center}
.laurel{display:inline-block;width:14px;height:14px;border-radius:0 70% 0 70%;background:rgba(28,21,16,.15);transform:rotate(-20deg)}
.laurel.on{background:#5f8f2f}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.coin{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums}
.coin::before{content:"";width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a6,#d79b22 70%);box-shadow:0 0 0 1.5px #8a5e0f}
.treasury{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.tally{width:100%;border-collapse:collapse;font-size:17px;font-variant-numeric:tabular-nums}
.tally td{padding:5px 0;border-bottom:1px solid rgba(28,21,16,.1);font-weight:600}
.tally td:last-child{text-align:right;font-weight:800;color:#8a5e0f}
.tally tr.total td{border-top:2px solid var(--pompeii);border-bottom:0;font-size:21px;font-weight:800;color:var(--ink);padding-top:8px}

.shop{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 12px;background:var(--marble-2);border-radius:4px}
.item div{display:flex;flex-direction:column;gap:1px}
.item b{font-size:18px}
.item span{font-size:16px;font-weight:500;color:#4d3f31}
.item small{font-size:14px;font-weight:700;color:var(--muted)}
.item .btn{flex-direction:row}
.item .btn::before{content:"";width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a6,#d79b22 70%)}
details.owned{font-size:16px}
details.owned summary{cursor:pointer;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.mini{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.mini li{border:2px solid;border-radius:3px;padding:2px 8px;font-size:15px;background:var(--marble-2)}

.keys{border-collapse:collapse;font-size:16px;width:100%}
.keys td{padding:4px 6px;vertical-align:top;font-weight:500}
.keys td:first-child{white-space:nowrap;width:1%}
kbd{font-family:var(--body);font-weight:800;font-size:14px;background:var(--ink);color:var(--marble);border-radius:3px;padding:2px 7px;letter-spacing:.04em}
.steps{margin:0;padding-left:22px;display:grid;gap:8px;font-size:17px;line-height:1.3}
.tips{margin:0;padding-left:18px;display:grid;gap:5px;font-size:16px;line-height:1.25;font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--pompeii);flex-wrap:wrap}
.tabs button{font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.06em;background:transparent;border:0;padding:8px 14px;cursor:pointer;color:var(--muted);border-radius:3px 3px 0 0}
.tabs button[aria-selected="true"]{background:var(--pompeii);color:var(--marble)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;max-height:52vh;overflow:auto;padding-right:4px}
.entry{display:flex;gap:10px;align-items:flex-start;background:var(--marble-2);border:2px solid transparent;border-radius:4px;padding:9px 10px}
.entry div{display:flex;flex-direction:column;gap:2px}
.entry b{font-size:17px}
.entry span:not(.emo):not(.rar){font-size:15px;line-height:1.25;color:#4d3f31;font-weight:500}
.entry.locked{opacity:.55}
.entry.got{border-color:var(--ochre)}
.entry .rar{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px}

#banner{position:fixed;left:50%;top:38%;z-index:3;font-family:var(--display);font-weight:900;font-size:clamp(34px,6vw,76px);color:var(--marble);text-shadow:3px 3px 0 var(--pompeii),7px 7px 0 rgba(0,0,0,.35);white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
#banner.go{animation:ban 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-7deg)}16%{opacity:1;transform:translate(-50%,-50%) scale(1.06) rotate(-2deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}100%{opacity:0;transform:translate(-50%,-62%) scale(1) rotate(-2deg)}}
#toasts{position:fixed;right:16px;top:110px;z-index:6;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:rgba(28,21,16,.94);color:var(--marble);border:2px solid var(--ochre);border-radius:4px;padding:10px 14px;display:flex;flex-direction:column;gap:1px;min-width:240px;max-width:320px;animation:tin .35s cubic-bezier(.2,1.3,.4,1);transition:opacity .5s,transform .5s}
.toast.out{opacity:0;transform:translateX(30px)}
.toast b{font-family:var(--head);font-weight:900;font-size:18px;color:var(--ochre)}
.toast span{font-size:15px;font-weight:500}
.t-eyebrow{font-size:11px !important;font-weight:800 !important;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
@keyframes tin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

@media (max-width:760px){ .cols{grid-template-columns:1fr} .panel{padding:22px 18px} }
@media (prefers-reduced-motion: reduce){
  .panel,.toast{animation:none}
  #banner.go{animation:banr 1.5s linear forwards}
  @keyframes banr{0%,80%{opacity:1;transform:translate(-50%,-50%) rotate(-2deg)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-2deg)}}
}
</style>
</head>
<body>
<canvas id="game" aria-label="Sack Lewis II arena"></canvas>
<div id="banner" aria-live="polite"></div>
<div id="toasts" aria-live="polite"></div>
<div id="overlay" hidden></div>
<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
