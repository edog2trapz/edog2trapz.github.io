<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shrimp Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one full-screen canvas (overworld / battle), pixel-UI panels docked to the bottom and right like a handheld. Single seafloor look by choice. */
:root {
  --ink: #142038;
  --navy: #1e2d52;
  --cream: #fff4dc;
  --shell: #ffe2b8;
  --coral: #ff6b57;
  --sea: #2fb5c9;
  --kelp: #58b368;
  --gold: #ffc94d;
  --ui: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --logo: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--ink); color: var(--ink); font-family: var(--ui); user-select: none; -webkit-user-select: none; touch-action: none; }
#cv { position: fixed; inset: 0; display: block; image-rendering: pixelated; }

.box { background: var(--cream); border: 4px solid var(--navy); box-shadow: inset 0 0 0 3px var(--shell), 0 4px 0 rgba(0,0,0,.35); border-radius: 10px; color: var(--ink); }

#dlg { position: fixed; z-index: 10; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); min-height: 96px; padding: 14px 20px; font-size: clamp(17px, 2.2vw, 22px); line-height: 1.35; }
#dlgText { max-width: 70ch; white-space: pre-wrap; }
#dlgMore { position: absolute; right: 16px; bottom: 8px; color: var(--coral); animation: bob .6s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }

.hpbox { position: fixed; z-index: 5; padding: 8px 14px 10px; width: min(300px, 46vw); font-size: 17px; }
#foeBox { left: max(12px, env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); }
#meBox { right: max(12px, env(safe-area-inset-right, 0px)); }
.hb-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 700; }
.hb-top b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hb-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.hpl { font-size: 12px; font-weight: 700; color: var(--gold); background: var(--navy); padding: 0 4px; border-radius: 3px; }
.hpbar { flex: 1; height: 9px; background: #5b5148; border: 2px solid var(--navy); border-radius: 5px; overflow: hidden; }
.hpbar i { display: block; height: 100%; width: 100%; background: var(--kelp); transition: width .45s ease-out, background .3s; }
.hpnum { text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; margin-top: 2px; }
.expbar { height: 5px; background: #cdbfa6; margin-top: 4px; border-radius: 3px; overflow: hidden; }
.expbar i { display: block; height: 100%; width: 0; background: var(--sea); transition: width .5s; }
.tag { font-size: 11px; font-weight: 700; color: var(--cream); padding: 1px 5px; border-radius: 3px; letter-spacing: .05em; }
.tag:empty { display: none; }
.shiny { color: var(--gold); }

#menus { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
.menu { position: absolute; pointer-events: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; max-height: 80%; overflow-y: auto; font-size: clamp(16px, 2vw, 20px); }
.menu.right { right: max(12px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); min-width: 190px; }
.menu.ask { right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(126px + env(safe-area-inset-bottom, 0px)); min-width: 150px; }
.menu.center { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 24px)); }
.menu.battle { right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(380px, 60vw); display: grid; grid-template-columns: 1fr 1fr; }
.menu.battle .mtitle, .menu.battle .mfoot { grid-column: 1 / -1; }
.menu.titlemenu { left: 50%; transform: translateX(-50%); bottom: calc(14% + env(safe-area-inset-bottom, 0px)); min-width: 240px; text-align: center; }
.mtitle { font-weight: 700; padding: 2px 12px 6px; color: var(--navy); border-bottom: 2px dashed var(--shell); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 10px; }
.mi { padding: 6px 12px 6px 26px; border-radius: 6px; cursor: pointer; position: relative; display: flex; align-items: center; gap: 10px; min-width: 0; }
.mi.sel { background: var(--navy); color: var(--cream); }
.mi.sel::before { content: "▶"; position: absolute; left: 8px; font-size: .7em; color: var(--gold); }
.mi.dis { opacity: .45; }
.mi .r { margin-left: auto; font-variant-numeric: tabular-nums; }
.mfoot { padding: 6px 12px 2px; border-top: 2px dashed var(--shell); margin-top: 4px; font-size: 15px; min-height: 1.4em; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; padding: 1px 6px; border-radius: 4px; letter-spacing: .04em; text-transform: uppercase; vertical-align: middle; }
canvas.mini { width: 54px; height: 38px; flex: none; }
.mon { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
.mon .top { display: flex; justify-content: space-between; gap: 8px; }
.mon .hpbar { height: 7px; flex: none; }

.panel { position: absolute; pointer-events: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(600px, calc(100vw - 24px)); max-height: calc(100% - 40px); overflow-y: auto; padding: 18px 20px; font-size: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h3 { margin: 0; font-size: 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.panel canvas.big { width: 220px; height: 160px; max-width: 100%; background: radial-gradient(circle at 50% 60%, #bfeaf2, #6fc3d6); border: 3px solid var(--navy); border-radius: 8px; flex: none; }
.panel .stats { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 10px; align-items: center; flex: 1; min-width: 200px; font-variant-numeric: tabular-nums; }
.panel .sbar { height: 7px; background: #e8dcc4; border-radius: 4px; overflow: hidden; }
.panel .sbar i { display: block; height: 100%; background: var(--sea); }
.panel .moves { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.panel .moves div { border: 2px solid var(--shell); border-radius: 6px; padding: 5px 8px; display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.panel p { margin: 0; line-height: 1.45; max-width: 62ch; }
.panel .hint { font-size: 13px; color: #6b6150; }
.dexgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; }
.badges { display: flex; gap: 8px; }
.badge { width: 34px; height: 34px; border-radius: 50%; border: 3px dashed #c9b998; display: grid; place-items: center; font-size: 12px; }
.badge.got { border: 3px solid var(--navy); background: var(--gold); }

#title { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; padding-top: calc(9vh + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; text-align: center; }
#title h1 { font-family: var(--logo); font-weight: 700; font-size: clamp(42px, 10vw, 104px); line-height: .9; margin: 0; color: var(--cream); text-shadow: 0 5px 0 var(--coral), 0 10px 0 var(--navy); letter-spacing: .02em; text-wrap: balance; }
#title p { margin: 22px 0 0; font-size: clamp(16px, 2.4vw, 22px); color: var(--cream); background: var(--navy); padding: 4px 14px; border-radius: 6px; }
#credit { position: fixed; z-index: 20; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; color: var(--cream); opacity: .7; font-size: 13px; pointer-events: none; padding-inline: 16px; }

#nameBox { position: fixed; z-index: 40; left: 50%; top: 40%; transform: translate(-50%, -50%); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; width: min(360px, calc(100vw - 24px)); font-size: 18px; }
#nameBox input { font: inherit; font-size: 22px; padding: 6px 10px; border: 3px solid var(--navy); border-radius: 6px; background: #fff; color: var(--ink); width: 100%; box-sizing: border-box; }
#nameBox button, .btn { font: inherit; font-weight: 700; background: var(--coral); color: var(--cream); border: 3px solid var(--navy); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
#nameBox button:focus-visible, .btn:focus-visible, #nameBox input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

#toast { position: fixed; z-index: 6; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); padding: 6px 16px; font-size: 18px; font-weight: 700; transition: transform .35s, opacity .35s; transform: translateY(-140%); opacity: 0; }
#toast.on { transform: none; opacity: 1; }
#fade { position: fixed; inset: 0; z-index: 50; background: #000; opacity: 0; pointer-events: none; transition: opacity .18s; }
#fade.white { background: #fff; }

#mute { position: fixed; z-index: 36; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); width: 40px; height: 40px; padding: 0; font-size: 18px; }
body.inbattle #mute, body.menuopen #mute { display: none; }
#wanted { position: fixed; z-index: 36; right: calc(max(12px, env(safe-area-inset-right, 0px)) + 50px); top: calc(12px + env(safe-area-inset-top, 0px)); padding: 4px 10px; font-size: 22px; letter-spacing: .08em; color: var(--coral); line-height: 1.2; }
#wanted small { display: block; font-size: 11px; letter-spacing: .1em; color: var(--navy); text-align: center; }
body.inbattle #wanted { display: none; }
.menu.admin .mtitle { color: var(--coral); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: baseline; }
.keys kbd { font-family: var(--ui); font-weight: 700; background: var(--navy); color: var(--cream); padding: 1px 7px; border-radius: 4px; white-space: nowrap; justify-self: start; }
.keys h4 { grid-column: 1 / -1; margin: 6px 0 0; font-size: 15px; color: var(--coral); }
#codeBox { position: fixed; z-index: 40; left: 50%; top: 40%; transform: translate(-50%, -50%); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; width: min(360px, calc(100vw - 24px)); font-size: 18px; }
#codeBox input { font: inherit; font-size: 22px; padding: 6px 10px; border: 3px solid var(--navy); border-radius: 6px; background: #fff; color: var(--ink); width: 100%; box-sizing: border-box; }
#codeBox .row2 { display: flex; gap: 8px; }

#pad { position: fixed; inset: auto 0 0 0; z-index: 35; pointer-events: none; height: 0; }
.pbtn { position: fixed; pointer-events: auto; background: rgba(20,32,56,.55); border: 3px solid rgba(255,244,220,.7); color: var(--cream); font-family: var(--ui); font-weight: 700; display: grid; place-items: center; border-radius: 50%; touch-action: none; }
#dpad { position: fixed; pointer-events: auto; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); width: 138px; height: 138px; touch-action: none; }
#dpad div { position: absolute; width: 46px; height: 46px; background: rgba(20,32,56,.55); border: 3px solid rgba(255,244,220,.7); border-radius: 8px; color: var(--cream); display: grid; place-items: center; font-size: 16px; }
#dpad .u { left: 46px; top: 0; } #dpad .d { left: 46px; bottom: 0; } #dpad .l { left: 0; top: 46px; } #dpad .rr { right: 0; top: 46px; }
#pa { right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(196px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 64px; font-size: 22px; }
#pb { right: calc(max(20px, env(safe-area-inset-right, 0px)) + 72px); bottom: calc(160px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; font-size: 20px; }
#pcar { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 150px); bottom: calc(160px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; font-size: 12px; }
#psic { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 150px); bottom: calc(222px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; font-size: 12px; }
#pm { right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(280px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 30px; border-radius: 15px; font-size: 12px; }
@media (max-width: 640px) { .hpbox { font-size: 14px; padding: 6px 10px 8px; } .menu.battle { width: calc(100vw - 24px); } }
@media (prefers-reduced-motion: reduce) { #dlgMore { animation: none; } #toast { transition: none; } }
</style>

<canvas id="cv"></canvas>
<div id="toast" class="box"></div>
<div id="foeBox" class="hpbox box" hidden>
  <div class="hb-top"><b id="foeName"></b><span id="foeLv"></span></div>
  <div class="hb-row"><span class="tag" id="foeSt"></span><span class="hpl">HP</span><div class="hpbar"><i id="foeHp"></i></div></div>
</div>
<div id="meBox" class="hpbox box" hidden>
  <div class="hb-top"><b id="meName"></b><span id="meLv"></span></div>
  <div class="hb-row"><span class="tag" id="meSt"></span><span class="hpl">HP</span><div class="hpbar"><i id="meHp"></i></div></div>
  <div class="hpnum" id="meHpN"></div>
  <div class="expbar"><i id="meExp"></i></div>
</div>
<div id="dlg" class="box" hidden><div id="dlgText"></div><span id="dlgMore" hidden>▼</span></div>
<div id="title" hidden>
  <h1>SHRIMP<br>QUEST</h1>
  <p>Catch. Battle. Do not peel.</p>
</div>
<div id="credit" hidden>Arrows / WASD move · Z or Space = A · X = B · Enter = Menu · Shift = run</div>
<form id="nameBox" class="box" hidden>
  <label for="nameIn">What's your name, shrimper?</label>
  <input id="nameIn" maxlength="10" autocomplete="off" value="Rook">
  <button type="submit">That's me!</button>
</form>
<button id="mute" class="btn" type="button" aria-label="Toggle music">♪</button>
<div id="wanted" class="box" hidden></div>
<form id="codeBox" class="box" hidden>
  <label for="codeIn">Enter a code</label>
  <input id="codeIn" maxlength="20" autocomplete="off">
  <div class="row2"><button type="submit" class="btn">Enter</button><button type="button" class="btn" id="codeCancel">Cancel</button></div>
</form>
<div id="menus"></div>
<div id="pad" hidden>
  <div id="dpad"><div class="u">▲</div><div class="d">▼</div><div class="l">◀</div><div class="rr">▶</div></div>
  <div class="pbtn" id="pa">A</div>
  <div class="pbtn" id="pb">B</div>
  <div class="pbtn" id="pm">MENU</div>
  <div class="pbtn" id="pcar">CAR</div>
  <div class="pbtn" id="psic">SIC</div>
</div>
<div id="fade"></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const cv = $("cv"); let g = cv.getContext("2d");
let W = 0, H = 0, TS = 48;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
  cv.style.width = W + "px"; cv.style.height = H + "px";
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.imageSmoothingEnabled = false;
  TS = Math.max(32, Math.floor(Math.min(H / 11, W / 13) / 4) * 4);
}
resize(); addEventListener("resize", resize);
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];

// =====================================================================
// DATA
// =====================================================================
const TYPES = { Plain: "#a39a80", Brine: "#3d7fe6", Coral: "#f0628f", Thermal: "#f06a24", Volt: "#d4ad0f", Snap: "#c0503a", Abyss: "#5a4cb0", Toxic: "#9a46c8", Shell: "#7f7967" };
const CHART = {
  Brine: { Thermal: 2, Shell: 2, Brine: .5, Coral: .5 },
  Coral: { Brine: 2, Shell: 2, Thermal: .5, Coral: .5, Toxic: .5 },
  Thermal: { Coral: 2, Toxic: 2, Brine: .5, Thermal: .5, Shell: .5 },
  Volt: { Brine: 2, Abyss: 2, Coral: .5, Volt: .5, Shell: .5 },
  Snap: { Shell: 2, Plain: 2, Abyss: 2, Toxic: .5, Volt: .5 },
  Abyss: { Volt: 2, Toxic: 2, Abyss: .5, Snap: .5 },
  Toxic: { Coral: 2, Brine: 2, Snap: 2, Toxic: .5, Shell: .5 },
  Shell: { Thermal: 2, Volt: 2, Snap: .5, Shell: .5 },
  Plain: { Shell: .5 }
};
const eff = (t, defT) => defT.reduce((m, d) => m * ((CHART[t] || {})[d] ?? 1), 1);
const pill = t => `<span class="pill" style="background:${TYPES[t]}">${t}</span>`;

const MOVES = {};
[
  ["tackle", "Tail Flick", "Plain", 40, 100, 35, "phys", null, "A quick flick of the tail fan."],
  ["growl", "Antenna Wave", "Plain", 0, 100, 40, "status", { foe: { atk: -1 } }, "Waves antennae menacingly. Lowers the foe's Attack."],
  ["harden", "Molt Harden", "Plain", 0, 0, 30, "status", { self: { def: 1 } }, "Hardens the shell. Raises Defense."],
  ["quick", "Dart Back", "Plain", 40, 100, 30, "phys", { prio: 1 }, "Shrimp flee backwards at speed. Always strikes first."],
  ["bodyslam", "Belly Flop", "Plain", 85, 100, 15, "phys", { status: "par", chance: 30 }, "A full-body flop. May paralyze."],
  ["recover", "Fresh Molt", "Plain", 0, 0, 10, "status", { heal: .5 }, "Sheds its old shell to restore half its HP."],
  ["flail", "Flail", "Plain", 50, 100, 1, "phys", { recoil: .25 }, "Desperate flailing. Hurts the user too."],
  ["prism", "Prism Smash", "Plain", 120, 100, 10, "phys", { crit: 1 }, "A punch seen in sixteen colors. High critical-hit rate."],
  ["skydive", "Sky Dive", "Plain", 90, 95, 15, "phys", null, "Rockets out of the water, then slams down from the sky."],
  ["gust", "Fin Gust", "Plain", 40, 100, 35, "spec", null, "Flaps its swimmerets hard enough to make wind."],
  ["bubble", "Bubble Spit", "Brine", 40, 100, 30, "spec", { foe: { spe: -1 }, chance: 10 }, "Spits bubbles. May lower Speed."],
  ["watergun", "Brine Jet", "Brine", 60, 100, 25, "spec", null, "Blasts a jet of salty water."],
  ["surge", "Tidal Surge", "Brine", 90, 100, 10, "spec", null, "Summons a wall of seawater."],
  ["tsunami", "Krill Tsunami", "Brine", 120, 85, 5, "spec", null, "A wave made of a billion tiny krill. Gross. Powerful."],
  ["polyp", "Polyp Sting", "Coral", 40, 100, 30, "phys", null, "Stings with tiny coral polyps."],
  ["leech", "Reef Leech", "Coral", 60, 100, 15, "spec", { drain: .5 }, "Drains energy like a hungry reef. Heals the user."],
  ["coralblade", "Coral Blade", "Coral", 90, 100, 15, "phys", { crit: 1 }, "Slashes with razor coral. High critical-hit rate."],
  ["bloom", "Bleaching Bloom", "Coral", 120, 85, 5, "spec", null, "A blinding burst of coral spawn."],
  ["spore", "Spore Cloud", "Coral", 0, 75, 15, "status", { status: "slp" }, "Releases sleepy spawn. Puts the foe to sleep."],
  ["ember", "Ember Puff", "Thermal", 40, 100, 25, "spec", { status: "brn", chance: 10 }, "A puff of vent heat. May burn."],
  ["scald", "Scald", "Thermal", 65, 100, 15, "spec", { status: "brn", chance: 30 }, "Superheated water. May burn."],
  ["magma", "Magma Claw", "Thermal", 85, 100, 15, "phys", { status: "brn", chance: 10 }, "A claw dipped in magma. May burn."],
  ["eruption", "Black Smoker", "Thermal", 120, 85, 5, "spec", { status: "brn", chance: 20 }, "Erupts like a hydrothermal vent. May burn."],
  ["fry", "Deep Fry", "Thermal", 100, 95, 10, "phys", { status: "brn", chance: 30 }, "Dunks the foe in imaginary oil. 350°F of pain."],
  ["zap", "Zap Feelers", "Volt", 40, 100, 30, "spec", { status: "par", chance: 10 }, "Electric antennae. May paralyze."],
  ["shock", "Shock Snap", "Volt", 70, 100, 15, "phys", { status: "par", chance: 20 }, "An electrified pinch. May paralyze."],
  ["thunder", "Bio-Thunder", "Volt", 110, 80, 5, "spec", { status: "par", chance: 30 }, "Bioelectric lightning. May paralyze."],
  ["glare", "Strobe Glare", "Volt", 0, 90, 20, "status", { status: "par" }, "Strobes like a nightclub. Paralyzes the foe."],
  ["pinch", "Pinch", "Snap", 40, 100, 35, "phys", null, "A classic pinch. Rude but effective."],
  ["clack", "Claw Clack", "Snap", 65, 100, 20, "phys", { flinch: .2 }, "Clacks claws loudly. May make the foe flinch."],
  ["cavitation", "Cavitation Snap", "Snap", 130, 80, 5, "phys", null, "Snaps so fast it boils the water. 218 decibels."],
  ["uppercut", "Mantis Punch", "Snap", 90, 100, 10, "phys", { prio: 1 }, "The fastest punch in the sea. Strikes first."],

const expFor = l => Math.floor(Math.pow(l, 3) * 0.8);
function st(m) {
  const b = baseOf(m), l = m.lvl, f = (x) => Math.floor(2 * x * l / 100) + 5;
  const s = { hp: Math.floor(2 * b[0] * l / 100) + l + 10, atk: f(b[1]), def: f(b[2]), spa: f(b[3]), spd: f(b[4]), spe: f(b[5]) };
  for (const k of (m.muts || [])) { const ms = MUTS[k] && MUTS[k].st; if (ms) for (const j in ms) s[j] = Math.max(1, Math.floor(s[j] * ms[j])); }

const MAPS = {};
function mk(id, o) {
  const m = Object.assign({ id, warps: [], npcs: [], signs: {}, exits: {}, enc: null, encRate: 0, encTiles: '"', env: "reef", dark: false, filler: "T", indoor: false, music: "town" }, o);
  m.g = Array.from({ length: m.h }, () => Array(m.w).fill(o.base)); MAPS[id] = m; return m;
}
const set = (m, x, y, c) => { if (x >= 0 && y >= 0 && x < m.w && y < m.h) m.g[y][x] = c; };
const rect = (m, x, y, w, h, c) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) set(m, i, j, c); };
const border = (m, c) => { rect(m, 0, 0, m.w, 1, c); rect(m, 0, m.h - 1, m.w, 1, c); rect(m, 0, 0, 1, m.h, c); rect(m, m.w - 1, 0, 1, m.h, c); };
const building = (m, x, y, w, roof, dx) => { rect(m, x, y, w, 2, roof); rect(m, x, y + 2, w, 1, "W"); set(m, x + dx, y + 2, "D"); return [x + dx, y + 2]; };
const warp = (m, x, y, to, tx, ty, dir) => m.warps.push({ x, y, to, tx, ty, dir });
function room(id, name, w, h, o) {
  const m = mk(id, Object.assign({ name, w, h, base: "w", indoor: true, filler: "x", env: "lab", music: "town" }, o || {}));

}

function askCode() {
  return new Promise(res => {
    const f = $("codeBox"), inp = $("codeIn"); inp.value = ""; f.hidden = false; setTimeout(() => inp.focus(), 50);
    const done = v => { f.hidden = true; inp.blur(); res(v); };
    f.onsubmit = e => { e.preventDefault(); done(inp.value.trim().toLowerCase()); };
    $("codeCancel").onclick = () => done("");
  });
}
async function settingsMenu(fromTitle) {
  const speeds = { 1: "Slow", 2: "Normal", 4: "Fast", 99: "Instant" }, order = [1, 2, 4, 99];
  for (;;) {
    const opts = ["Controls", `Music: ${muted ? "Off" : "On"}`, `Sound effects: ${SET.sfx ? "On" : "Off"}`, `Text speed: ${speeds[SET.text] || "Normal"}`, "Enter a code", "Back"];
    const i = await openMenu({ title: "Settings", items: opts, cls: "center" });
    if (i < 0 || i === 5) return;
    if (i === 0) await openPanel(controlsHTML());
    if (i === 1) { audio(); setMute(!muted); }
    if (i === 2) { SET.sfx = !SET.sfx; saveSet(); sfx("select"); }
    if (i === 3) { SET.text = order[(order.indexOf(SET.text) + 1) % order.length]; saveSet(); }
    if (i === 4) {
      const c = await askCode();
      if (c === "enoch") { if (fromTitle || !G) toast("Start or continue a game first, then enter the code."); else { await adminPanel(); return; } }
      else if (c) toast("Nothing happens. The shrimp look at you, confused.");
    }
  }
}
async function adminPanel() {

  const on = v => v ? "ON" : "off";
  try {
    for (;;) {
      const lead = G.party.find(x => !x.egg);
      const opts = ["+₽99,999", "Heal everything", "Party +10 levels", "Spawn any shrimp", "99 of every item", `God mode: ${on(A.god)}`, `One-hit KOs: ${on(A.ohko)}`, `Wild encounters: ${on(!A.noenc)}`, `Super speed: ${on(A.speed)}`,
        "Teleport", "Spawn a car next to me", "Wanted level 5 (chaos)", "Clear wanted level", "Mutate lead shrimp", "Toggle lead shrimp shiny", "Complete the Shrimpdex", "Unlock badge + all fly spots", "Close"];
      const i = await openMenu({ title: "ADMIN PANEL <span>enoch mode</span>", items: opts, cls: "center admin", start: 0 });

        toast("+10 levels!"); await checkEvolutions();
      }
      if (i === 3) {
        const j = await openMenu({ title: "Spawn which shrimp?", cls: "center", items: DEX.map(id => `${String(SPECIES[id].no).padStart(3, "0")} ${SPECIES[id].name}<span class="r">${SPECIES[id].types.map(pill).join(" ")}</span>`) });

        const L = [5, 25, 50, 100], li = await openMenu({ title: "Level", items: L.map(String), cls: "ask" }); if (li < 0) continue;
        const MO = ["No mutations", "1 random mutation", "3 random mutations", "Giant Prismatic Two-Headed"], mi = await openMenu({ title: "Mutations", items: MO, cls: "ask" }); if (mi < 0) continue;
        const x = makeWild(DEX[j], L[li], 0);
        if (mi === 1 || mi === 2) for (let k = 0; k < (mi === 1 ? 1 : 3); k++) { const mu = randomMut(x.muts); mu && x.muts.push(mu); }

      }
      if (i === 4) { Object.keys(ITEMS).forEach(id => G.bag[id] = 99); toast("99 of everything!"); sfx("item"); }
      if (i === 5) A.god = !A.god;
      if (i === 6) A.ohko = !A.ohko;
      if (i === 7) A.noenc = !A.noenc;
      if (i === 8) A.speed = !A.speed;
      if (i === 9) {
        const ids = Object.keys(MAPS), j = await openMenu({ title: "Teleport to...", cls: "center", items: ids.map(id => MAPS[id].name + (MAPS[id].indoor ? " (inside)" : "")) });
        if (j < 0) continue;
        const T2 = MAPS[ids[j]]; let spot = FLY_SPOTS[ids[j]] ? FLY_SPOTS[ids[j]].slice(0, 2) : null;
        if (!spot) { const cx = T2.w >> 1, cy = T2.h >> 1; outer: for (let r = 0; r < 20; r++) for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) { const t = tileAt(T2, x, y); if (t && !SOLID.has(t) && !"DmM".includes(t) && !T2.npcs.some(n => n.x === x && n.y === y)) { spot = [x, y]; break outer; } } }
        if (spot) { driving = null; await warpTo(ids[j], spot[0], spot[1], "down"); }
        break;
      }
      if (i === 10) {
        if (curMap().indoor) { toast("Cars only work outside."); continue; }

        for (const d of [G.dir, "up", "down", "left", "right"]) { const [dx, dy] = DIRS[d], x = G.x + dx, y = G.y + dy, t = tileAt(curMap(), x, y); if (t && !SOLID.has(t) && t !== "~" && !npcAt(x, y) && !carAt(x, y)) { carsOf(G.map).push({ x, y, dir: d, color: pick(["#d9373b", "#3a7fd1", "#ffc94d", "#58b368", "#a983ec", "#ff9a3a", "#111111", "#ffffff"]), mine: true }); placed = true; break; } }
        toast(placed ? "A car appeared! Press F facing it." : "No room for a car here.");
      }
      if (i === 11) { wanted = 4; addWanted(1, "MAXIMUM CHAOS!"); }
      if (i === 12) { wanted = 0; updWanted(); clearCops(); toast("Wanted level cleared."); }
      if (i === 13) { if (!lead) continue; const mu = randomMut(lead.muts); if (mu) { lead.muts.push(mu); noteTraits(lead); toast(`${nm(lead)} became ${MUTS[mu].name}!`); } else toast("It can't mutate any further."); }

    }
  } finally { hideDlg(); busy = wasBusy; }
}
async function titleScreen() {
  view = "title"; $("title").hidden = false; $("credit").hidden = false; playSong("title");
  const sv = loadSave();
  const opts = sv ? ["Continue", "New Game", "Settings"] : ["New Game", "Settings"];
  let i; for (;;) { i = await openMenu({ items: opts, cls: "titlemenu", cancel: false }); if (opts[i] !== "Settings") break; await settingsMenu(true); }
  audio(); playSong("");
  $("title").hidden = true; $("credit").hidden = true;
  if (opts[i] === "Continue") { G = upgradeSave(sv); enterWorld(); }
  else await newGame();
}
async function newGame() {
  view = "intro"; G = freshState("Rook"); playSong("title");
  await say("Hello there! Welcome to the world of SHRIMP!");
  await say("My name is Krill. People call me the Shrimp Professor. Mostly my mom.");
  await say("This world is home to creatures called shrimp. Some people keep them as pets. Others battle them.");
  await say("Some people... *shudder* ... dip them in cocktail sauce. I study them.");
  await say("Now. What's your name?");
  hideDlg();
  const name = await askName(); G.name = name;
  await say(`${name}! Your very own shrimp legend is about to unfold!`);
  await say("A world of claws, snaps and questionable smells awaits! Let's go!");
  hideDlg();
  await fade(true);
  enterWorld(true);
}
function upgradeSave(s) {

  return s;
}
function enterWorld(fresh) {
  loadMap(G.map, G.x, G.y, G.dir); view = "world"; busy = false;
  fade(false); toast(curMap().name);
  if (fresh) (async () => { busy = true; await wait(500); await say("You wake up to the smell of the sea. Today feels important. Mom is downstairs."); hideDlg(); busy = false; })();
}
function boot(data) {

  titleScreen();
}
window.claude?.hot?.snapshot?.(() => (view === "world" && G && !busy) ? { save: JSON.stringify(G) } : {});
