<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Nightwire</title>
<meta name="description" content="Nightwire: a 3D stealth game. Four night operations, real light and shadow, guards with flashlights, cameras, laser grids, keycard doors, ceiling vents, takedowns and gadgets.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D scene; HUD hugs the corners like a field device; menus are case files over a slowly orbiting camera */
:root{--bg:#05070b;--panel:rgba(8,11,16,.9);--line:rgba(200,214,230,.14);--ink:#e8edf2;--dim:#8d99a6;--amber:#ffb45a;--green:#3dff6a;--red:#ff3b2f;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:fixed;inset:0}#game canvas{display:block;width:100%;height:100%}
#game.nv canvas{filter:sepia(1) hue-rotate(62deg) saturate(3.4) contrast(1.15)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
kbd{font:600 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;background:rgba(255,255,255,.05)}
#hud{position:fixed;inset:0;pointer-events:none}
#over{position:absolute;inset:0;width:100%;height:100%}
#xh{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1px rgba(0,0,0,.7),0 0 0 7px rgba(232,237,242,.12)}
#hm{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;opacity:0;border:2px solid var(--ink);transform:rotate(45deg);border-radius:2px}#hm.kill{border-color:var(--red)}
.box{background:linear-gradient(90deg,rgba(5,8,12,.82),rgba(5,8,12,.4));border-left:2px solid var(--green);padding:9px 12px}
#ops{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));width:min(330px,42vw)}
#ops h4{margin:0;font:600 10.5px var(--mono);letter-spacing:.24em;color:var(--green)}#ops .n{font:700 15px var(--sans);margin-top:2px}
#ops ul{list-style:none;margin:6px 0 0;padding:0;font-size:13px;line-height:1.5}#ops li::before{content:"› ";color:var(--amber)}#ops li.done{color:var(--dim);text-decoration:line-through}#ops li.done::before{content:"✓ ";color:var(--green)}#ops li.al{color:var(--red);font:600 12px var(--mono);letter-spacing:.1em}#ops li.al::before{content:""}
#mini{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));background:rgba(5,8,12,.75);border:1px solid var(--line);max-width:30vw;height:auto}
#meters{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(300px,46vw)}
.meter{height:7px;background:rgba(255,255,255,.08);margin:4px 0 8px;position:relative}.meter i{position:absolute;inset:0 auto 0 0;background:var(--amber);transition:width .15s}
.lab{display:flex;justify-content:space-between;font:600 10.5px var(--mono);letter-spacing:.18em;color:var(--dim)}.lab b{color:var(--ink);font-weight:600}
#right{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:right}
#ammo{font:600 34px/1 var(--mono)}#ammo small{font-size:15px;color:var(--dim)}
#gad{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
.chip{font:600 10.5px var(--mono);letter-spacing:.08em;padding:3px 7px;border:1px solid var(--line);background:rgba(5,8,12,.6);color:var(--dim)}.chip.on{color:var(--green);border-color:var(--green)}.chip.key{color:#3ddc84;border-color:#3ddc84}
#prompt{position:absolute;left:50%;top:60%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;font:600 14px var(--sans);background:rgba(5,8,12,.82);border:1px solid var(--line);padding:7px 13px}
#prompt .ring{width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--green) var(--p,0%),rgba(255,255,255,.15) 0)}
#say{position:absolute;left:50%;top:20%;transform:translateX(-50%);max-width:82vw;text-align:center;font:500 16px var(--sans);background:rgba(5,8,12,.78);padding:8px 15px;border-left:2px solid var(--amber)}
#alert{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:600 12px var(--mono);letter-spacing:.3em;background:var(--red);color:#fff;padding:3px 12px;display:none}#alert.on{display:block;animation:bl .6s steps(2) infinite}@keyframes bl{50%{opacity:.45}}
#vig{position:absolute;inset:0;box-shadow:inset 0 0 160px 50px rgba(200,20,20,.85);opacity:0;transition:opacity .2s}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px;background:linear-gradient(90deg,rgba(4,6,9,.94),rgba(4,6,9,.72) 60%,rgba(4,6,9,.4));overflow:auto;touch-action:pan-y;z-index:5}
.pane{width:min(1000px,100%)}
.back{position:fixed;left:14px;top:12px;color:var(--dim);font:600 13px var(--sans);text-decoration:none;z-index:9}.back:hover{color:var(--ink)}
.kick{font:600 11px var(--mono);letter-spacing:.3em;color:var(--green);margin-bottom:8px}
h1{font:700 clamp(46px,8vw,96px)/.95 var(--sans);letter-spacing:-.03em;margin:0}h1 span{color:var(--amber)}
h2{font:700 30px var(--sans);margin:0 0 6px;letter-spacing:-.01em}h3{margin:0 0 4px;font:700 15px var(--sans)}
.lede{color:#c3ccd5;max-width:58ch;line-height:1.55;font-size:16px}.fine{color:var(--dim);font-size:13.5px}
.ops{display:flex;flex-direction:column;gap:6px;margin:20px 0;max-width:620px}
.op{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);padding:12px 14px;background:rgba(255,255,255,.02)}
.op:hover:not(:disabled){border-color:var(--green);background:rgba(61,255,106,.05)}.op:disabled{opacity:.35;cursor:default}
.op .n{font:600 22px var(--mono);color:var(--dim)}.op b{display:block;font-size:17px}.op small{color:var(--dim);font-size:13px}.op .r{font:600 12px var(--mono);color:var(--amber);letter-spacing:.06em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--sans);letter-spacing:.04em;padding:11px 20px;border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--green);color:#03110a;border-color:var(--green)}.btn.pri:hover{filter:brightness(1.1)}.btn.ghost:hover{border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line)}.seg button{padding:9px 12px;font:600 12.5px var(--sans);color:var(--dim)}.seg button.on{background:rgba(255,255,255,.1);color:var(--ink)}
.objs{line-height:1.7;padding-left:20px}.objs li.done{color:var(--dim);text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:12px}.card{border:1px solid var(--line);padding:12px}.card p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}.stats div{border:1px solid var(--line);padding:9px}.stats small{display:block;font:600 10px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}.stats b{font:600 20px var(--mono)}
.rating{font:700 64px var(--sans);letter-spacing:.06em;color:var(--amber)}
.doc{max-width:560px;background:#e9e2cf;color:#1d1a14;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.6)}.doc .kick{color:#7a5a20}.doc .lede{color:#2b2720;font-family:var(--mono);font-size:14.5px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.opt input{width:170px;accent-color:var(--green)}
#touch{position:fixed;inset:0;pointer-events:none;z-index:3}#touch button{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1px solid rgba(232,237,242,.5);background:rgba(5,8,12,.45);font:600 10.5px var(--mono)}#touch button:active{background:rgba(61,255,106,.35)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}#mini{display:none}}
@media (max-height:520px){h1{font-size:44px}.ops{margin:10px 0}.op{padding:7px 12px}}
</style></head>
<body>
<div id="game"></div>
<div id="hud" hidden>
  <canvas id="over"></canvas>
  <div id="alert"></div><div id="vig"></div>
  <div id="xh"></div><div id="hm"></div>
  <div id="ops" class="box"><h4>OPERATION</h4><div class="n" id="opname"></div><ul id="olist"></ul></div>
  <canvas id="mini" width="150" height="96"></canvas>
  <div id="meters" class="box">
    <div class="lab"><span>LIGHT</span><b id="lighttxt">HIDDEN</b></div><div class="meter"><i id="lightbar"></i></div>
    <div class="lab"><span>NOISE</span><span>HEALTH</span></div><div class="meter"><i id="noisebar" style="background:#6db8ff"></i></div><div class="meter" style="margin-bottom:0"><i id="hp" style="background:#e8edf2"></i></div>
  </div>
  <div id="right"><div id="ammo">10<small> / 30</small></div><div id="gad"></div></div>
  <div id="prompt" hidden><span class="ring"></span><span id="ptxt"></span></div>
  <div id="say" hidden></div>
</div>
<div id="touch" hidden></div>
<a class="back" id="backlink" href="../../index.html">&lt; 2trapz games</a>
<div id="ui"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/levels.js"></script>
<script src="js/engine.js"></script>
<script src="js/actors.js"></script>
<script src="js/game.js"></script>
</body></html>
