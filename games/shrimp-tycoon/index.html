const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),P=a=>a[RI(0,a.length-1)],$=i=>document.getElementById(i),cp=(v,a,b)=>Math.max(a,Math.min(b,v));

let S={money:300,day:0,speed:1,xp:0,lv:1,scr:'room',tank:0,tt:'res',cs:0,fl:-1,sel:null,id:0,log:[],shop:[],tanks:[],orders:[],nw:[],bp:[null,null],cx:{st:[],mu:[]},rs:0,idx:ST.map(()=>({p:1,h:[1],t:0}))};

const save=()=>{try{localStorage.setItem('shrimp3',JSON.stringify(S))}catch(e){}};
const M={v:S.money,x:0},ani={page(){},modal(){},close(f){f()},kill(){},sway(){},murk(w){let m=document.querySelector('#sv .mur');if(m)m.setAttribute('opacity',(1-w/100)*.65)},swim(){},out(){},burst(){},money(){M.v=S.money;M.x=S.xp/need(S.lv)*100},toast(e){e.style.opacity=1;clearTimeout(ani.t);ani.t=setTimeout(()=>e.style.opacity=0,3000)}};
const nt=z=>({size:z,plants:[],fl:0,pu:0,fe:0,water:85,fed:0,food:0,shr:[],eggs:[]});
const mk=(st,pat,q,mut,age=10,sex)=>({id:++S.id,st,pat,q,mut,age,sex:sex||(Math.random()<.5?'♂':'♀'),cd:0,br:0,h:[]});
const gr=s=>GT.filter(t=>s.pat>=t).length-1;
const val=s=>ST[s.st][1]*S.idx[s.st].p*GM[gr(s)]*(.4+s.q/100*1.6)*(s.mut>=0?MU[s.mut][1]:1)*(.5+Math.min(s.age,10)/20);
const nm=s=>(s.mut>=0?MU[s.mut][0]+' ':'')+ST[s.st][0],ql=q=>GL[q<20?0:q<40?1:q<60?2:q<75?3:q<88?4:q<96?5:6],fm=n=>'$'+(n>=100?Math.round(n).toLocaleString():n.toFixed(1)),need=l=>Math.round(80*Math.pow(l,1.6));
const T=()=>S.tanks[S.tank],AL=()=>S.tanks.flatMap((t,i)=>t.shr.map(s=>(s.ti=i,s))),tm=()=>1+.04*(S.up.lab4||0),nw=()=>S.money-S.debt+AL().reduce((a,s)=>a+val(s),0),cost=s=>Math.ceil(val(s)*1.2*(1-.04*(S.up.lab5||0)));

const msg=t=>{S.log.unshift('D'+S.day+' · '+t);S.log=S.log.slice(0,40);let e=$('toast');e.textContent=t;ani.toast(e)};
function xp(n){S.xp+=n;while(S.xp>=need(S.lv)){S.xp-=need(S.lv);S.lv++;msg('⭐ Level '+S.lv+'! New things unlock');ani.burst('⭐',16,innerWidth/2,150)}}
function add(t,s){t.shr.push(s);if(!S.cx.st.includes(s.st)){S.cx.st.push(s.st);xp(40);msg('📖 New strain: '+ST[s.st][0])}if(s.mut>=0&&!S.cx.mu.includes(s.mut)){S.cx.mu.push(s.mut);xp(40);msg('📖 New mutation: '+MU[s.mut][0])}}
const step=(x,i)=>{x.t=(x.t||0)*.9+R(-1,1)*.02;x.p=cp(x.p*Math.exp(x.t+R(-1,1)*(.03+i*.01))+(1-x.p)*.03,.3,3);x.h.push(x.p);if(x.h.length>90)x.h.shift()};
const odds=(a,b)=>{let pa=(a.pat+b.pat)/2,k=Math.max(a.st,b.st)<5&&pa>=55?(pa-55)/100:-1;return{pa,ev:k<0?0:cp((a.st==b.st?.04+k*.35:.02+k*.15)+(a.q+b.q)/1000,0,.5),mu:(a.st==b.st?.06:.12)*(1+.3*(S.up.lab1||0))}};
function child(a,b){let o=odds(a,b),st=P([a,b]).st,pat=cp((a.pat+b.pat)/2+R(-10,10)+(a.q+b.q)/200*3-Math.pow((a.pat+b.pat)/200,2)*(13-1.2*(S.up.lab2||0)),0,100),mt=Math.random()<.55?P([a,b]).mut:-1,ev=0,n2=0;if(st<5&&Math.random()<o.ev){st++;ev=1;pat*=.55}if(mt<0&&Math.random()<o.mu){mt=RI(0,5);n2=1}let k=mk(st,pat,25,mt,0);k.ev=ev;k.nm=n2;return k}
const unl=()=>ST.map((_,i)=>i).filter(i=>ST[i][3]<=S.lv);
function ord(){let st=P(unl()),mp=RI(0,Math.min(5,1+S.lv/2|0)),mq=P([30,45,60]);return{st,mp,mq,price:Math.ceil(ST[st][1]*GM[mp]*(.4+mq/100*1.6)*R(2,3)),d:RI(8,16)}}
function gen(){let u=unl();S.shop=[];for(let i=0;i<8;i++)S.shop.push(mk(u[Math.random()**2*u.length|0],Math.random()**1.8*85,RI(35,75),Math.random()<.1?RI(0,5):-1));if(Math.random()<.4)S.shop[7]=mk(u[u.length-1],RI(60,95),RI(60,90),Math.random()<.3?RI(0,5):-1)}
if(!S.tanks.length){let t=nt(0);S.tanks.push(t);t.shr.push(mk(0,22,40,-1,10,'♀'),mk(0,30,40,-1,10,'♂'),mk(0,18,40,-1,10,'♀'));S.cx.st=[0];S.idx.forEach((x,i)=>{for(let k=0;k<50;k++)step(x,i)});gen();S.orders=[ord(),ord(),ord(),ord()];S.nw=[nw()]}
const RS=[['lab1','🧪 Mutation Lab','+30% mutation chance per level',500],['lab2','🧬 Selective Genetics','Weaker pattern regression, higher top grades',1500],['lab3','🥚 Hatchery','+1 shrimplet per clutch',800],['lab4','🤝 Trade Contacts','+4% on every sale',1000],['lab5','📦 Wholesale','-4% shop prices',600]];

const ACH=[['First sale','Sell a shrimp',()=>S.stats.sold>=1,50],['Dealer','Sell 50 shrimp',()=>S.stats.sold>=50,500],['Hatchery','Hatch 25 shrimplets',()=>S.stats.bred>=25,300],['Evolution!','Evolve a shrimp',()=>S.stats.evo>=1,500],['Pattern master','Own an S pattern',()=>S.stats.bestPat>=78,1000],['Triple S','Own an SSS pattern',()=>S.stats.bestPat>=97,10000],['Collector','Discover all 6 strains',()=>S.cx.st.length==6,2500],['Geneticist','Discover all 6 mutations',()=>S.cx.mu.length==6,3000],['Contract king','Fill 10 orders',()=>S.stats.orders>=10,1500],['Show winner','Win a show',()=>S.stats.shows>=1,1000],['Tycoon','Reach $100,000 net worth',()=>nw()>=1e5,5000]];
function lay(t,a,b,f){let n=RI(1,3)+(t.plants.length>1?1:0)+(S.up.lab3||0),ks=[];for(let i=0;i<n;i++)ks.push(child(a,b));f.cd=7;f.br=3;t.eggs.push({f:f.id,d:3,k:ks})}
function autob(t){let a=t.shr.filter(s=>s.sex=='♂'&&s.age>=5).sort((x,y)=>y.pat-x.pat)[0],b=t.shr.filter(s=>s.sex=='♀'&&s.age>=5&&s.cd==0).sort((x,y)=>y.pat-x.pat)[0];if(a&&b&&TK[t.size][1]-t.shr.length-t.eggs.reduce((q,e)=>q+e.k.length,0)>2)lay(t,a,b,b)}
function autos(t){if(t.shr.length<TK[t.size][1]-1)return;let c=t.shr.filter(s=>s.age>=10&&gr(s)<=2&&!S.bp.includes(s.id)&&!t.eggs.some(e=>e.f==s.id)).sort((x,y)=>val(x)-val(y))[0];if(c){S.money+=val(c)*tm();S.stats.sold++;t.shr=t.shr.filter(x=>x!=c)}}
const sc=s=>Math.min(100,s.pat*.6+s.q*.4+(s.mut>=0?8:0)+s.st*2);
function newShow(){S.show={end:S.day+3,rv:[0,1,2].map(i=>Math.round(cp(R(38,68)+S.lv*2.5+i*3,0,98))),en:null,res:null};msg('🏆 Shrimp show open! Enter by day '+S.show.end)}
function endShow(){let w=S.show,s=w.en&&AL().find(x=>x.id==w.en);if(!s){w.res='No entry';return}let m=sc(s),p=1+w.rv.filter(r=>r>m).length,c=([0,200,100,50][p]||0)*(1+S.lv);if(c){S.money+=c;xp(150-p*40);w.res='Place '+p+' (score '+Math.round(m)+') +'+fm(c)}else w.res='Unplaced (score '+Math.round(m)+')';if(p==1)S.stats.shows++;msg('🏆 Show result: '+w.res);ani.burst('🏆',12,innerWidth/2,150)}
function bulk(g){let n=0,v=0;S.tanks.forEach(t=>{t.shr=t.shr.filter(s=>{if(gr(s)<=g&&s.age>=10&&!S.bp.includes(s.id)&&!t.eggs.some(e=>e.f==s.id)){n++;v+=val(s)*tm();return false}return true})});S.money+=v;S.stats.sold+=n;S.stats.best=Math.max(S.stats.best,v/Math.max(1,n));xp(Math.ceil(v/20));ani.burst('💰',14);msg('💰 Broker sold '+n+' shrimp for '+fm(v));render()}
function borrow(n){let c=2000*S.lv;if(S.debt+n>c)return msg('Credit limit is '+fm(c));S.debt+=n;S.money+=n;render()}

if(Math.random()<.04){let i=RI(0,5),u=Math.random()<.5;S.idx[i].p*=u?1.4:.65;msg((u?'📈 Hype for ':'📉 Glut of ')+ST[i][0]+' shrimp!')}

t.shr=t.shr.filter(s=>{if(t.water<25&&Math.random()<.08){msg('💀 '+nm(s)+' died (dirty water)');return false}return true});

S.orders.forEach(o=>o.d--);S.orders=S.orders.filter(o=>o.d>0);while(S.orders.length<4)S.orders.push(ord());
S.nw.push(nw());if(S.nw.length>120)S.nw.shift();if(S.day%5==0)gen();S.stats.bestPat=AL().reduce((m,s)=>Math.max(m,s.pat),S.stats.bestPat);

ACH.forEach(a=>{if(!S.ach.includes(a[0])&&a[2]()){S.ach.push(a[0]);S.money+=a[3];ani.burst('🏅',12,innerWidth/2,150);msg('🏅 '+a[0]+' +'+fm(a[3]))}});save();render()}
function buy(i){let s=S.shop[i],t=T(),c=cost(s);if(c>S.money)return msg('Not enough money');if(t.shr.length>=TK[t.size][1])return msg('This tank is full');S.money-=c;add(t,s);S.shop.splice(i,1);msg('🛒 Bought '+nm(s));render()}

function deliver(i){let o=S.orders[i],c=AL().filter(s=>s.st==o.st&&gr(s)>=o.mp&&s.q>=o.mq&&s.age>=8).sort((a,b)=>val(a)-val(b))[0];if(!c)return msg('No shrimp qualifies yet');let t=S.tanks[c.ti];t.shr=t.shr.filter(x=>x!=c);S.money+=Math.round(o.price*tm());S.stats.orders++;xp(60+o.mp*20);S.orders[i]=ord();ani.burst('📦',12);msg('📦 Order filled +'+fm(o.price));render()}

const sb=s=>{let g=gr(s),col=s.mut>=0?MU[s.mut][2]:ST[s.st][2],k='stroke="rgba(0,0,0,.45)" stroke-width="1"',o=`<g class="tl"><path d="M-33 0L-43-6L-41 0L-43 8Z" fill="${col}" ${k}/></g>`;
for(let i=6;i>=0;i--)o+=`<ellipse cx="${-i*5.5}" cy="${(-Math.sin(i*.5)*5).toFixed(1)}" rx="${(7.5-i*.6).toFixed(1)}" ry="${(6.5-i*.55).toFixed(2)}" fill="${col}" ${k}/>`;
o+=`<ellipse cx="-14" cy="-9" rx="14" ry="2.5" fill="#fff" opacity=".25"/><path d="M8-7Q20-17 30-7" fill="none" stroke="${col}" stroke-width="1.2"/>`;
for(let i=0;i<4;i++)o+=`<path d="M${-i*6} 3l-2 7" stroke="rgba(0,0,0,.5)" stroke-width="1" fill="none"/>`;
for(let i=0;i<=g;i++)o+=`<circle cx="${(-i*4.3+2).toFixed(1)}" cy="-4" r="1.5" fill="rgba(0,0,0,.4)"/>`;
if(s.br>0)for(let j=0;j<6;j++)o+=`<circle cx="${-8-j*3.5}" cy="${5+(j%2)*2}" r="1.7" fill="#c9d44a"/>`;
return o+'<circle cx="6" cy="-6" r="1.5" fill="#111"/>'};
const sv=(s,c='')=>{let g=gr(s);return `<svg class="${c}" viewBox="-48 -22 84 36"${g>=4?` style="filter:drop-shadow(0 0 ${2+g}px ${g>5?'#fff':'#ffd54a'})"`:''}>${sb(s)}</svg>`};
function plant(k,x){let o='',g=396;
if(k==0)for(let j=0;j<16;j++)o+=`<circle cx="${(x+Math.sin(j*2.1)*22).toFixed(1)}" cy="${(g-Math.abs(Math.cos(j*1.7))*16).toFixed(1)}" r="8" fill="hsl(${95+j%4*8},55%,${30+j%5*5}%)"/>`;
else if(k==1)for(let j=0;j<6;j++)o+=`<ellipse cx="${x}" cy="${g-34}" rx="12" ry="28" transform="rotate(${(-69+j*27.5).toFixed(1)} ${x} ${g})" fill="hsl(${130-j*4},50%,${28+j*3}%)"/>`;
else if(k==2)for(let j=0;j<4;j++){let d='M'+(x+j*9-14)+' '+g;for(let y=1;y<=14;y++)d+='L'+(x+j*9-14+Math.sin(y*.4+j)*y*1.1).toFixed(1)+' '+(g-y*14);o+=`<path d="${d}" fill="none" stroke="rgba(80,210,120,.5)" stroke-width="7"/><path d="${d}" fill="none" stroke="#2fae5c" stroke-width="2"/>`}
else for(let j=-8;j<=8;j++)o+=`<ellipse cx="${x+j*6}" cy="${g-3}" rx="5" ry="3.5" fill="hsl(${110+j*2},60%,${35+Math.abs(j)}%)"/>`;
return `<g class="psw" data-x="${x}">${o}</g>`}
const FSV='<rect x="735" y="14" width="42" height="120" rx="4" fill="#39424d"/>'+[0,1,2,3,4,5].map(i=>`<rect x="740" y="${24+i*17}" width="32" height="6" fill="#222a33"/>`).join(''),AIR='<rect x="30" y="388" width="12" height="8" fill="#555"/>';
const base=w=>`<rect width="800" height="440" fill="url(#wg)"/><rect class="mur" width="800" height="440" fill="#788220" opacity="${((1-w/100)*.65).toFixed(2)}"/><g fill="#fff">${[0,1,2,3,4].map(i=>`<polygon class="ry" points="${i*180},0 ${i*180+60},0 ${i*180-110},440 ${i*180-190},440" opacity=".06"/>`).join('')}</g><rect y="387" width="800" height="53" fill="url(#sg)"/><path d="M620 396a50 24 0 0 1 100 0z" fill="#6b7480"/><path d="M680 396a30 16 0 0 1 60 0z" fill="#8a929c"/>`;
const mini=t=>base(t.water)+t.plants.map((k,i)=>plant(k,PX[i]*800)).join('')+(t.fl?FSV:'')+(t.pu?AIR:'')+t.shr.slice(0,14).map(s=>`<g transform="translate(${60+(s.id*173)%680} ${335+(s.id*91)%60}) scale(${s.id%2?1.3:-1.3} 1.3)">${sb(s)}</g>`).join('');
function ln(id,a,col,lab,w=600,h=150){let e=$(id);if(!e||a.length<2)return;let mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1,y=v=>(h-14-(v-mn)/r*(h-28)).toFixed(1),d=a.map((v,i)=>(i?'L':'M')+(i/(a.length-1)*w).toFixed(1)+' '+y(v)).join('');
e.innerHTML=`<path d="${d}L${w} ${h}L0 ${h}Z" fill="${col}" opacity=".15"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`+(lab?`<text x="4" y="11" font-size="11" fill="#85a8b8">${lab(mx)}</text><text x="4" y="${h-3}" font-size="11" fill="#85a8b8">${lab(mn)}</text>`:'')}
const bar=(v,c)=>`<div class="gauge"><i style="width:${v}%;background:${c}"></i></div>`,gauge=w=>bar(w,w<25?'var(--r)':w<55?'var(--y)':'var(--g)');

const uc=(a,b,c,f,off,lock)=>`<div class="cd" style="cursor:default"><b>${a}</b><div class="m">${b}</div><button onclick="${f}" ${off||lock?'disabled':''}>${lock?'Lv '+lock:off===2?'Owned':fm(c)}</button></div>`;
const th=()=>`<button class="o" onclick="go('room')">← Room</button>`+S.tanks.map((x,i)=>`<button class="${S.tank==i?'on':'o'}" onclick="openTank(${i})">${TK[x.size][0]} #${i+1}</button>`).join('');
const tb=()=>[['res','🦐 Shrimp'],['care','💧 Care'],['gear','🔧 Gear'],['breed','🧬 Breed']].map(([k,l])=>`<button class="${S.tt==k?'on':'o'}" onclick="S.tt='${k}';render()">${l}</button>`).join('');

TP.gear=()=>{let t=T();return `<div class="pn"><h2>Filtration</h2><div class="gr">${FL.slice(1).map((f,i)=>uc(f[0],'Cleans '+(f[1]*.6).toFixed(1)+'/day',f[2],`pay(${f[2]},()=>T().fl=${i+1})`,t.fl>=i+1?2:t.fl<i?1:0)).join('')}</div></div><div class="pn"><h2>Pumps and feeder</h2><div class="gr">${PU.slice(1).map((f,i)=>uc(f[0],'Cleaning '+((i+1)*.8)+'/day',f[1],`pay(${f[1]},()=>T().pu=${i+1})`,t.pu>=i+1?2:t.pu<i?1:0)).join('')}${uc('Auto-feeder','Feeds your chosen food when hungry',120,'pay(120,()=>T().fe=1)',t.fe?2:0)}</div></div><div class="pn"><h2>Plants (${t.plants.length}/6)</h2><div class="m">Tap to remove: ${t.plants.map((k,i)=>`<button class="o" onclick="T().plants.splice(${i},1);render()">${PL[k][0]} ✕</button>`).join('')||'none'}</div><div class="gr" style="margin-top:8px">${PL.map((p,i)=>uc(p[0],'Cleans '+p[2]+'/day, +3 care',p[1],`pay(${p[1]},()=>T().plants.push(${i}))`,t.plants.length>=6?1:0)).join('')}</div></div>`};
TP.breed=()=>{let t=T(),[a,b]=S.bp.map(i=>t.shr.find(s=>s.id==i)),ok=a&&b&&a.sex!=b.sex,o=a&&b?odds(a,b):null,sl=(s,n)=>`<div class="slot">${s?`${sv(s)}<b>${nm(s)}</b><div>${GL[gr(s)]} · ${Math.round(s.pat)} pts · ${ql(s.q)} ${s.sex}</div>`:`<span class="m">Parent ${n}<br>pick below</span>`}</div>`;
return `<div class="pn"><h2>Breeding station</h2><div class="bs">${sl(a,'A')}<span style="font-size:28px">🧬</span>${sl(b,'B')}</div>${o?`<div class="m">${ok?'':'⚠ Needs one ♂ and one ♀ · '}Pattern around <b>${Math.round(o.pa)}</b> ±10 · Evolution <b>${(o.ev*100).toFixed(1)}%</b>${o.ev?'':' (needs avg pattern 55+)'} · New mutation ${(o.mu*100).toFixed(0)}% · hatches in 3 days</div>`:'<div class="m">Choose two mature shrimp (5+ days). High-pattern parents in a well-kept tank breed better offspring. Evolved babies restart with a lower pattern.</div>'}<button onclick="bgo()" ${ok?'':'disabled'}>🥚 Breed</button> ${t.eggs.map(e=>`<span class="pb">Clutch ${e.d}d</span>`).join(' ')}</div><div class="pn"><h2>Mature shrimp</h2><div class="gr">${t.shr.filter(s=>s.age>=5).map(s=>cd(s,`bpick(${s.id})`,`<div class="m">${Math.round(s.pat)} pts${s.cd>0?' · resting '+s.cd+'d':''}</div>`)).join('')||'<span class="m">None yet.</span>'}</div></div>`};

function modal(){let r=S.sel&&find(S.sel);if(!r){$('md').innerHTML='';return}let[t,s]=r,i=S.tanks.indexOf(t);
$('md').innerHTML=`<div class="ov" onclick="cm()"><div class="mo" onclick="event.stopPropagation()">${sv(s,'ms')}<h2>${nm(s)} ${s.sex}</h2><div class="kv"><span>Pattern</span><b>${GL[gr(s)]} · ${Math.round(s.pat)}/100</b></div>${bar(s.pat,'var(--a)')}<div class="kv"><span>Care</span><b>${ql(s.q)} (${Math.round(s.q)})</b><span>Age</span><b>${s.age}d${s.age<5?' (baby)':''}</b><span>Worth</span><b>${fm(val(s))}</b><span>Tank</span><b>#${i+1}</b></div><svg id="mh" class="cv" viewBox="0 0 320 70"></svg><div><button onclick="sell(${s.id})">Sell ${fm(val(s)*tm())}</button>${S.tanks.map((x,j)=>j==i?'':`<button class="o" onclick="mv(${s.id},${j})">To #${j+1}</button>`).join('')}<button class="o" onclick="S.tank=${i};S.scr='tank';S.tt='breed';S.bp=[null,null];bpick(${s.id});cm()">🧬 Breed</button><button class="o" onclick="cm()">Close</button></div></div></div>`;
ani.modal();ln('mh',s.h,'#ff7a59',fm,320,70)}
const op=id=>{S.sel=id;modal()},cm=()=>ani.close(()=>{S.sel=null;modal()}),go=k=>{S.scr=k;fresh=1;render()},openTank=i=>{S.tank=i;S.scr='tank';S.bp=[null,null];fresh=1;render()};
let tsig='',lt='',fresh=1;
function syncTank(){let t=T(),sh=$('shs');if(!$('sv')||!sh)return;let sig=S.tank+'|'+t.plants+'|'+t.fl+'|'+t.pu;
if(sig!=tsig){tsig=sig;$('pls').innerHTML=t.plants.map((k,i)=>plant(k,PX[i]*800)).join('');$('eq').innerHTML=(t.fl?FSV:'')+(t.pu?AIR:'');ani.sway()}

let i=g.firstChild;i.innerHTML=sb(s);i.setAttribute('transform','scale('+((.5+Math.min(s.age,10)/20)*1.1).toFixed(2)+')')});
$('tt').textContent=TK[t.size][0]+' · '+t.shr.length+'/'+TK[t.size][1];ani.murk(t.water)}
function render(){

ani.money();
$('nav').innerHTML=NAV.map(([k,i,l])=>`<button class="${S.scr==k||(k=='room'&&S.scr=='tank')||(k=='more'&&MORE.includes(S.scr))?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');

lt=S.scr;if(S.scr=='tank')syncTank();
if(S.scr=='market'){let h=S.idx[S.cs].h;ln('big',h,h[h.length-1]>=h[0]?'#3ddc97':'#ff5470',v=>fm(ST[S.cs][1]*v),600,180);ST.forEach((_,i)=>{let x=S.idx[i].h.slice(-30);ln('sp'+i,x,x[x.length-1]>=x[0]?'#3ddc97':'#ff5470',null,90,28)})}
if(S.scr=='room')ln('nwc',S.nw,'#d9a400',fm,600,140);
if(fresh){fresh=0;ani.page()}}
if(window.gsap){
const LP={x:innerWidth/2,y:innerHeight/2};
addEventListener('pointerdown',e=>{LP.x=e.clientX;LP.y=e.clientY;let b=e.target.closest&&e.target.closest('button,.cd,.row,.tc');if(b)gsap.fromTo(b,{scale:.93},{scale:1,duration:.35,ease:'back.out(3)'})});
const roam=id=>{let g=$('sh'+id);if(!g||!g.isConnected)return;let x=R(50,750),y=Math.random()<.7?R(330,392):R(130,380),cx=+gsap.getProperty(g,'x'),dist=Math.hypot(x-cx,y-gsap.getProperty(g,'y'));gsap.to(g,{scaleX:x>=cx?1:-1,duration:.25});gsap.to(g,{x,y,duration:Math.max(.5,dist/(y<300?40:22)),ease:'sine.inOut',onComplete:()=>gsap.delayedCall(R(.3,3.5),roam,[id])})};
Object.assign(ani,{
page(){gsap.from('#view > *',{opacity:0,y:16,duration:.4,stagger:.06,ease:'power2.out',clearProps:'opacity,transform'});gsap.from('#view .cd,#view .tc',{opacity:0,scale:.88,duration:.35,stagger:{each:.015,amount:.4},ease:'back.out(1.5)',clearProps:'opacity,transform'})},
modal(){gsap.from('.ov',{opacity:0,duration:.2});gsap.from('.mo',{scale:.8,y:30,opacity:0,duration:.4,ease:'back.out(1.7)'})},
close(f){gsap.to('.mo',{scale:.85,opacity:0,y:20,duration:.2});gsap.to('.ov',{opacity:0,duration:.2,onComplete:f})},

money(){gsap.to(M,{v:S.money,x:S.xp/need(S.lv)*100,duration:.6,onUpdate:()=>{let e=$('mn'),b=$('xi');if(e)e.textContent=fm(M.v);if(b)b.style.width=M.x+'%'}})},
burst(t,n=8,x=LP.x,y=LP.y){for(let i=0;i<n;i++){let e=document.createElement('div');e.className='fx';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);gsap.to(e,{x:R(-90,90),y:R(-120,-30),rotation:R(-60,60),opacity:0,scale:R(.6,1.4),duration:R(.7,1.2),ease:'power2.out',onComplete:()=>e.remove()})}},

out(g){gsap.killTweensOf(g)},
kill(){gsap.killTweensOf('.ry,.psw,#shs g')},
sway(){gsap.killTweensOf('.psw,.ry');document.querySelectorAll('.psw').forEach(g=>{let o=g.dataset.x+' 396';gsap.fromTo(g,{rotation:-2,svgOrigin:o},{rotation:2,svgOrigin:o,duration:R(2,4),yoyo:true,repeat:-1,ease:'sine.inOut'})});gsap.to('.ry',{opacity:.13,duration:3,yoyo:true,repeat:-1,stagger:.7,ease:'sine.inOut'})},

(function bub(){gsap.delayedCall(.25,bub);let v=$('sv'),t=v&&T();if(!v||!(t.pu||t.fl)||Math.random()>.4*(t.pu+t.fl))return;let p=t.pu&&(!t.fl||Math.random()<.5),y0=p?388:140,c=document.createElementNS('http://www.w3.org/2000/svg','circle');
c.setAttribute('cx',p?36+R(-4,4):754+R(-6,6));c.setAttribute('cy',y0);c.setAttribute('r',R(1.5,4));c.setAttribute('fill','none');c.setAttribute('stroke','rgba(255,255,255,.7)');$('bbs').appendChild(c);
gsap.to(c,{y:-y0,x:R(-14,14),duration:R(2,4),ease:'none',opacity:.2,onComplete:()=>c.remove()})})();
