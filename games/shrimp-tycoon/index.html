<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Shrimp Tycoon: breed real-genetics shrimp in living aquariums. Master the nitrogen cycle, discover 40 morphs and rare mutations, run auctions and a store, win shows and beat Dex Krill at the World Shrimp Championship.">
<meta name="theme-color" content="#04141b">
<link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<title>Shrimp Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: a night-time shrimp room. HUD across the top, nav rail on the left (bottom bar on phones), and the tank as a big glowing stage. */
:root{
  --bg:#04141b; --bg2:#06202a; --panel:#0a2832; --panel2:#0e3440; --panel3:#134454; --line:#19495a; --line2:#26667a;
  --text:#e9f7f6; --muted:#93b9c0; --dim:#628a93; --coral:#ff7b5c; --coral2:#ffb08a; --gold:#ffc94d; --mint:#4ce0b3; --red:#ff5d73; --blue:#5cc8ff; --violet:#b48cff;
  --r:16px; --fd:'Baloo 2',system-ui,sans-serif; --fb:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 70% -10%,#0d3a48 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#0b2f2a 0%,transparent 55%),var(--bg);color:var(--text);font:15px/1.4 var(--fb);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--coral2)}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.1;letter-spacing:.2px}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}h4{font-size:15px;margin:12px 0 6px;color:var(--muted)}
p{margin:6px 0}
small{font-size:12.5px}
.dim{color:var(--dim)}.up{color:var(--mint)}.dn{color:var(--red)}.warn{color:var(--gold)}
.sp{flex:1}
#app{display:grid;grid-template-columns:88px 1fr;grid-template-rows:auto 1fr;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
/* HUD */
#hud{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:8px 14px;background:linear-gradient(180deg,#0a2a35,#071f28);border-bottom:1px solid var(--line);min-height:58px;overflow-x:auto;scrollbar-width:none}
#hud::-webkit-scrollbar{display:none}
.back{color:var(--muted);text-decoration:none;font-size:28px;line-height:1;padding:0 4px}
.logo{display:flex;align-items:center;gap:6px;white-space:nowrap}.logo span{font-size:26px}.logo b{font-family:var(--fd);font-size:22px;background:linear-gradient(90deg,var(--coral),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hs{display:flex;flex-direction:column;white-space:nowrap}.hs small{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}.hs b{font-family:var(--fd);font-size:18px}
.hs.money b{font-size:22px;color:var(--gold)}.debt{font-size:11px;color:var(--red);font-style:normal}
.xp{width:110px;margin-top:5px}.st{color:var(--gold);letter-spacing:1px;font-size:15px!important}.st .dim{color:#24505e}
.evchip{background:rgba(255,201,77,.12);border:1px solid rgba(255,201,77,.4);color:var(--gold);padding:5px 10px;border-radius:999px;font-weight:800;font-size:13px;white-space:nowrap;margin-left:auto}
.evchip small{opacity:.7}
.speed{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-left:auto}.evchip+.speed{margin-left:0}
.speed button{background:none;border:0;padding:7px 11px;color:var(--muted);font-weight:800;font-size:13px}.speed button.on{background:var(--coral);color:#1a0b06}
.snd{background:none;border:1px solid var(--line);border-radius:12px;padding:6px 9px}
/* NAV */
#nav{display:flex;flex-direction:column;gap:2px;padding:8px 6px;background:#061c24;border-right:1px solid var(--line);overflow-y:auto}
.nv{position:relative;background:none;border:0;border-radius:14px;padding:9px 2px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;font-size:11.5px}
.nv .ni{font-size:23px;filter:grayscale(.6) opacity(.75);transition:transform .15s}.nv:hover{color:var(--muted);background:rgba(255,255,255,.03)}
.nv.on{color:var(--text);background:linear-gradient(180deg,rgba(255,123,92,.18),rgba(255,123,92,.05));box-shadow:inset 0 0 0 1px rgba(255,123,92,.35)}.nv.on .ni{filter:none;transform:scale(1.08)}
.nb{position:absolute;top:4px;right:8px;background:var(--coral);color:#1a0b06;border-radius:999px;font-size:10px;padding:1px 5px;font-weight:900}
/* VIEW */
#view{overflow-y:auto;padding:18px 20px 40px;scroll-behavior:auto}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}.sh p{color:var(--muted);margin-top:4px}
.card{background:linear-gradient(180deg,rgba(19,68,84,.5),rgba(10,40,50,.65));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card.inner{background:rgba(255,255,255,.03);box-shadow:none}
.card.center{text-align:center}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.gap{gap:8px;margin:8px 0}
.b{background:linear-gradient(135deg,#1d6577,#17505f);border:1px solid #2b7a8e;color:var(--text);border-radius:12px;padding:8px 13px;font-weight:800;font-size:14px;transition:transform .08s,filter .15s;white-space:nowrap}
.b:hover:not(:disabled){filter:brightness(1.15)}.b:active:not(:disabled){transform:scale(.96)}.b:disabled{opacity:.42;cursor:default}
.b.pri{background:linear-gradient(135deg,var(--coral),#ff9a5c);border-color:#ffab85;color:#230c04}
.b.ghost{background:rgba(255,255,255,.04);border-color:var(--line)}
.b.warnb{background:linear-gradient(135deg,#7d2a3a,#5e1f2c);border-color:#a63d50}
.b.sm{padding:5px 9px;font-size:12.5px;border-radius:10px}.b.wide{width:100%;margin-top:10px;padding:11px}
.bar{height:8px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}.bar.thin{height:5px;margin:6px 0 2px}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;color:var(--muted)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--pc)}.pill.neo{color:#ff9b8a;border-color:#6b3a36}.pill.cari{color:#c8a6ff;border-color:#4b3a72}
.gb{display:inline-block;min-width:26px;text-align:center;border-radius:7px;padding:0 5px;font-weight:900;font-size:12px;background:#33434a;color:#cfe}
.gb.g1{background:#3f5a4a}.gb.g2{background:#2f6a5a;color:#d6fff1}.gb.g3{background:#2c6f8f;color:#e0f6ff}.gb.g4{background:#7d4be0;color:#fff}.gb.g5{background:linear-gradient(135deg,#ff7b5c,#ffb347);color:#2a0d00}.gb.g6{background:linear-gradient(135deg,#ffe27a,#ff9ad5,#9ad8ff);color:#2a1300;box-shadow:0 0 10px rgba(255,220,120,.6)}
.sx{font-weight:900}.sx.f{color:#ff9ad5}.sx.m{color:#7cc8ff}
.alert{border-radius:12px;padding:8px 11px;font-size:13px;font-weight:700;margin:6px 0;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.alert.s3{background:rgba(255,93,115,.14);border-color:rgba(255,93,115,.5);color:#ffc0c9}.alert.s2{background:rgba(255,201,77,.11);border-color:rgba(255,201,77,.4);color:#ffe2a0}.alert.s1{color:var(--muted)}
.alert.ok{background:rgba(76,224,179,.09);border-color:rgba(76,224,179,.35);color:#a8f3da}.alert.rare{background:linear-gradient(90deg,rgba(180,140,255,.2),rgba(92,200,255,.15));border-color:rgba(180,140,255,.55);color:#e7dcff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0}.kv span{color:var(--muted)}.kv b{text-align:right}.kv.big2 b{font-family:var(--fd);font-size:20px}
.big{font-size:30px}
.fbar,.ptabs,.stabs,.seg{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.fbar button,.ptabs button,.stabs button,.seg button{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:6px 11px;color:var(--muted);font-weight:800;font-size:13px}
.fbar button.on,.ptabs button.on,.stabs button.on,.seg button.on{background:var(--panel3);border-color:var(--coral);color:var(--text)}
.ptabs button{font-size:15px;padding:9px 15px}
.seg button{display:flex;flex-direction:column;align-items:flex-start;text-align:left}.seg button small{color:var(--dim)}.seg button:disabled{opacity:.4}
select,input[type=text],input[type=number],textarea{background:#05181f;border:1px solid var(--line2);border-radius:10px;padding:7px 9px;max-width:100%}
textarea{width:100%}
.form{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0}.form label,label.form{display:flex;flex-direction:column;gap:4px;font-weight:700;color:var(--muted);font-size:13px}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;margin:6px 0}
.slider{display:flex;flex-direction:column;gap:6px;margin:10px 0;font-weight:700}.slider input{width:100%;accent-color:var(--coral)}
/* home */
.nwbox{display:flex;flex-direction:column;align-items:flex-end}.nwbox small{color:var(--dim);font-weight:800;text-transform:uppercase;font-size:11px}.nwbox b{font-family:var(--fd);font-size:24px;color:var(--gold)}
.homegrid{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.mei{display:flex;gap:14px;align-items:flex-start}.face{font-size:44px;line-height:1;background:radial-gradient(circle,#1d5a6a,#0d3440);border-radius:50%;width:66px;height:66px;display:grid;place-items:center;flex:none;border:2px solid var(--line2)}.face.xl{font-size:64px;width:100px;height:100px;margin:0 auto 8px}
.mt small{color:var(--coral2);font-weight:800}
.goals{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px}.goals li{font-weight:700}.goals li.ok{color:var(--mint)}.goals em{color:var(--dim);font-style:normal;font-size:12px}
.tanks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.tc:hover{transform:translateY(-3px);border-color:var(--line2)}
.thumb{display:block;width:100%;aspect-ratio:1000/560;background:#0c4656}
.tci{padding:10px 12px 12px}.tci .row{justify-content:space-between}.hp{font-weight:900;font-family:var(--fd)}
.tc.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;min-height:220px;border-style:dashed;background:rgba(255,255,255,.02);text-align:center}
.tc.add .plus{font-size:44px;color:var(--coral)}.tc.room{cursor:default}
/* tank */
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ttabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}.tt{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:6px 11px;color:var(--muted);font-weight:800;white-space:nowrap}.tt.on{border-color:var(--coral);color:var(--text);background:var(--panel3)}
.tankwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.stage{position:relative;border-radius:18px;overflow:hidden;border:3px solid #0b1215;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.5),0 0 80px rgba(92,200,255,.08)}
#tv{display:block;width:100%;aspect-ratio:1000/560;touch-action:none;cursor:pointer}
.v-tank .stage:has(.modehint.on) #tv{cursor:crosshair}
.chips{position:absolute;left:10px;bottom:10px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none;max-width:80%}
.chip{background:rgba(4,18,24,.78);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:2px 7px;font-size:12px;font-weight:800;backdrop-filter:blur(4px)}.chip.bad{border-color:var(--red);color:#ffc0c9}.chip.warn{border-color:var(--gold);color:#ffe2a0}
.modehint{position:absolute;top:12px;left:50%;transform:translate(-50%,-30px);background:rgba(255,123,92,.92);color:#230c04;font-weight:900;border-radius:999px;padding:5px 14px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}.modehint.on{opacity:1;transform:translate(-50%,0)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tool{flex:1 1 auto}.tool.on{background:linear-gradient(135deg,var(--gold),#ffb347);color:#2a1500;border-color:#ffd77a}
.netbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding:8px 10px;background:rgba(255,201,77,.08);border:1px solid rgba(255,201,77,.35);border-radius:12px}
.side{background:linear-gradient(180deg,rgba(19,68,84,.5),rgba(10,40,50,.65));border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;max-height:calc(100dvh - 140px);display:flex;flex-direction:column}
.stabs{margin:0 0 6px}.stabs button{flex:1;padding:6px 4px;font-size:12.5px}
#tp{overflow-y:auto;flex:1;padding-right:2px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:6px;margin:6px 0}.sum div{background:rgba(0,0,0,.2);border-radius:10px;padding:6px;text-align:center}.sum b{display:block;font-family:var(--fd);font-size:17px}.sum small{color:var(--dim)}
.morphs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.slist{display:flex;flex-direction:column;gap:4px}.slist.tall{max-height:60vh;overflow-y:auto}
.srow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid transparent;cursor:pointer}.srow:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
.pt{display:block;flex:none;border-radius:9px;background:radial-gradient(circle,#185666,#0a2d38)}
.si{flex:1;min-width:0}.si b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.si small{color:var(--muted)}.sv{font-family:var(--fd);color:var(--gold)}
.pad{padding:12px}
.gg{margin:7px 0}.gl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted)}
.gt{position:relative;height:10px;background:rgba(0,0,0,.35);border-radius:99px;margin-top:4px}.gt i{position:absolute;top:0;bottom:0;border-radius:99px}.gt em{position:absolute;top:-3px;width:4px;height:16px;margin-left:-2px;background:#fff;border-radius:3px;box-shadow:0 0 6px #fff}
.legend{display:flex;gap:6px;margin-bottom:4px}
.medgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.med{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px}.med span{font-size:20px}.med b{font-size:11.5px;line-height:1.15}.med small{color:var(--gold);font-weight:800}
.med:hover{border-color:var(--line2)}
.gear{background:rgba(0,0,0,.15);border-radius:12px;padding:8px;margin:8px 0}.ghd{display:flex;align-items:center;gap:6px}.ghd span{font-size:18px}.ghd em{margin-left:auto;font-style:normal;color:var(--mint);font-size:12px;font-weight:800}
.gops{display:flex;flex-direction:column;gap:4px;margin-top:6px}.gop{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:6px 9px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:0 8px}.gop small{color:var(--gold);font-weight:800}.gop i{grid-column:1/-1;font-style:normal;font-size:11.5px;color:var(--dim)}
.gop.on{border-color:var(--mint);background:rgba(76,224,179,.08)}.gop.on small{color:var(--mint)}.gop:disabled{opacity:.45}
.dlist{display:flex;flex-direction:column;gap:4px}.drow{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border-radius:10px;padding:4px 8px}.drow b{flex:1}.drow small{color:var(--dim)}
.dshop{display:grid;grid-template-columns:1fr 1fr;gap:6px}.dsh{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;align-items:center}.dsh span{font-size:20px;grid-row:span 2}.dsh small{color:var(--gold);font-weight:800}.dsh i{grid-column:2/-1;font-style:normal;font-size:11px;color:var(--dim);line-height:1.2}.dsh:disabled{opacity:.4}
.pairsel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.pairsel label{display:flex;flex-direction:column;gap:4px;font-weight:800;color:var(--muted)}
.pred{margin-top:8px}.prow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;margin:4px 0}.prow .bar{grid-column:2/-1}
/* market */
.mk{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.mkd .pt{margin:0 auto}.mkd h3{font-size:26px;margin:6px 0}.mkd h3 small{font-size:14px}
.chart{width:100%;height:auto;display:block;margin:8px 0}.chart text{fill:var(--dim);font-size:12px;font-family:var(--fb)}
.unk{display:grid;place-items:center;height:120px;font-size:50px;color:var(--dim);font-family:var(--fd)}
.mrows{max-height:62vh;overflow-y:auto}.mrow{display:grid;grid-template-columns:12px 1fr auto 70px 46px;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:14px}.mrow:hover{background:rgba(255,255,255,.05)}.mrow.on{background:var(--panel3)}.mrow i{width:12px;height:12px;border-radius:50%}.mrow span{text-align:right;font-weight:800}.mrow em{font-style:normal;font-weight:800;text-align:right;font-size:12px}
/* sell & shop */
.ogrid,.pgrid,.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.order,.pack{display:flex;flex-direction:column;gap:4px;margin:0}.order .pt,.pack .pt{align-self:center}.pack .big{font-size:38px;text-align:center}
.bay{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:3px}.bay .pt{align-self:center}.bay h4{margin:4px 0 0;color:var(--gold);font-size:20px}.bay.lead{border-color:var(--mint);box-shadow:0 0 0 1px rgba(76,224,179,.3)}.bay.mine{border-color:rgba(255,201,77,.4)}
.note{color:var(--coral2);font-style:italic}.bidrow{display:flex;gap:6px;margin-top:6px}.bidrow input{flex:1;min-width:0}
.blog{font-size:12px;color:var(--muted);margin-top:4px}
.tog{display:flex;align-items:center;gap:6px;font-weight:800;margin-left:auto}
/* lab */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.res{display:flex;flex-direction:column;margin:0}.res p{flex:1}.res.max{opacity:.7}
.dots{display:flex;gap:4px;margin-top:4px}.dots i{width:16px;height:6px;border-radius:9px;background:rgba(255,255,255,.12)}.dots i.on{background:var(--violet)}
/* shows */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0}.cat{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}.cat .pt{align-self:center}
.empty{height:70px;width:100%;display:grid;place-items:center;color:var(--dim);border:1px dashed var(--line);border-radius:10px}
.hist{padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.trophies{display:flex;flex-wrap:wrap;gap:8px}.tro{display:flex;flex-direction:column;align-items:center;background:rgba(255,201,77,.06);border:1px solid rgba(255,201,77,.25);border-radius:12px;padding:6px 8px;min-width:66px}.tro span{font-size:28px}
/* career */
.chlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.ch{margin:0}.ch.lock{opacity:.5}.ch.cur{border-color:var(--coral);box-shadow:0 0 0 1px rgba(255,123,92,.4),0 10px 30px rgba(0,0,0,.3)}.ch.done{border-color:rgba(76,224,179,.4)}
.quote{background:rgba(0,0,0,.2);border-left:3px solid var(--coral);border-radius:0 12px 12px 0;padding:8px 12px;font-style:italic;color:#d7ecec;margin:8px 0}
.dex{display:flex;gap:14px;align-items:center;margin-top:14px}
/* more */
.moregrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.mb{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--text);margin:0}.mb:hover{border-color:var(--line2)}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}.person{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.2);border-radius:14px;padding:10px}.person .face{width:52px;height:52px;font-size:30px}.person>div{flex:1;display:flex;flex-direction:column}
.cxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.cx{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:rgba(0,0,0,.18);border-radius:12px;padding:8px}.cx .unk{height:64px;font-size:36px}.cx.cxu b{color:var(--dim)}.sil img{filter:grayscale(1) brightness(.35) contrast(1.3)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}.ach{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.18);border-radius:12px;padding:8px;opacity:.55}.ach.on{opacity:1;border:1px solid rgba(255,201,77,.35)}.ach span{font-size:22px}.ach div{flex:1;display:flex;flex-direction:column}.ach small{color:var(--dim)}.ach em{font-style:normal;color:var(--gold);font-weight:800;font-size:12px}
.jr{max-height:70vh;overflow-y:auto;font-size:14px}.jr div{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.help h3{margin-top:12px}.help p{color:#cfe6e6}
/* modals */
#modal .ov{position:fixed;inset:0;background:rgba(1,8,12,.72);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;animation:fade .2s}
.mo{position:relative;background:linear-gradient(180deg,#0f3846,#0a2731);border:1px solid var(--line2);border-radius:20px;padding:18px;width:min(560px,100%);max-height:92dvh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
.mo .x{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;width:34px;height:34px;color:var(--muted);z-index:2}
.mo h2{margin-bottom:6px;padding-right:36px}
.live{display:block;width:100%;height:auto;border-radius:14px;margin-bottom:10px}
.mh{display:flex;align-items:center;gap:8px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.statgrid>div{background:rgba(0,0,0,.2);border-radius:10px;padding:6px 8px;display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:center}.statgrid span{color:var(--muted);font-size:12px;font-weight:700}.statgrid .bar{grid-column:1/-1;height:5px}.statgrid .gb{display:none}
.dna{background:rgba(180,140,255,.07);border:1px solid rgba(180,140,255,.25);border-radius:12px;padding:4px 12px 10px;margin:8px 0}.dna h4{margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.mv{display:inline-flex;gap:4px}
.foods{display:grid;grid-template-columns:1fr 1fr;gap:8px}.food{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:0 8px}.food span{font-size:26px;grid-row:span 3}.food small{color:var(--dim)}.food em{color:var(--gold);font-style:normal;font-weight:800}.food:hover:not(:disabled){border-color:var(--coral)}.food:disabled{opacity:.4}
.tkgrid{display:grid;gap:8px}.tk{display:grid;grid-template-columns:1fr auto;text-align:left;margin:0;cursor:pointer;color:var(--text)}.tk small{color:var(--dim);grid-column:1}.tk span{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--fd);color:var(--gold);font-size:18px}.tk:disabled{opacity:.45;cursor:default}
.rarebox,.results,.chapdone,.intro{text-align:center}.rarebox h1{font-size:40px;background:linear-gradient(90deg,#ff9ad5,#ffe27a,#7cf0d0,#9ad8ff,#c79bff);-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0 10px;animation:shim 3s linear infinite;background-size:200%}
.mo.rare{border-color:#b48cff;box-shadow:0 0 60px rgba(180,140,255,.4)}
.results h1,.chapdone h1,.intro h1{font-size:32px;margin:4px 0 10px}
.rc{background:rgba(0,0,0,.2);border-radius:14px;padding:10px;margin:8px 0;text-align:left}
.podium{margin:6px 0 0;padding-left:22px}.podium li{display:flex;justify-content:space-between;padding:2px 0}.podium li.me{color:var(--gold);font-weight:900}.podium li.dexr{color:#ff9ad5}
.tips{display:grid;gap:6px;text-align:left;margin:10px 0}.tips div{background:rgba(0,0,0,.2);border-radius:10px;padding:8px 10px}
.goals{text-align:left}
/* toasts & banner */
#toasts{position:fixed;top:66px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:60;pointer-events:none;width:min(92vw,520px)}
.toast{background:rgba(6,24,32,.95);border:1px solid var(--line2);border-radius:14px;padding:9px 16px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .3s cubic-bezier(.2,1.4,.4,1);text-align:center;transition:opacity .4s,transform .4s}
.toast.good{border-color:rgba(76,224,179,.6)}.toast.bad{border-color:rgba(255,93,115,.7)}.toast.warn{border-color:rgba(255,201,77,.6)}.toast.out{opacity:0;transform:translateY(-10px)}
#banner{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);transition:transform .45s cubic-bezier(.2,1.3,.4,1);z-index:55;width:min(94vw,560px);pointer-events:none}
#banner.on{transform:translate(-50%,0)}
.bn{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#3a1c12,#2a1a0a);border:1px solid var(--gold);border-radius:16px;padding:12px 16px;box-shadow:0 20px 50px rgba(0,0,0,.6)}.bi{font-size:34px}.bn b{display:block;font-family:var(--fd);font-size:19px;color:var(--gold)}.bn small{color:#f3dcc0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.88);opacity:0}}@keyframes fade{from{opacity:0}}@keyframes tin{from{transform:translateY(-14px);opacity:0}}@keyframes shim{to{background-position:200% 0}}
/* responsive */
@media (max-width:1100px){.tankwrap{grid-template-columns:1fr}.side{max-height:none}#tp{overflow:visible}.homegrid{grid-template-columns:1fr}.mk{grid-template-columns:1fr}}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;padding-bottom:0}
  #nav{grid-row:3;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));overflow-x:auto;gap:0}
  .nv{flex:1 0 44px;padding:6px 0;font-size:9.5px}.nv .ni{font-size:20px}.nb{right:2px}
  #view{padding:14px 16px 30px}
  #hud{gap:9px;padding:6px 8px}.logo b,.logo span{display:none}.hs.rep,.hs.lvl,.back{display:none}.hs.money b{font-size:19px}.hs.day small{display:none}.hs.day b{font-size:14px}.speed button{padding:6px 8px}.evchip{display:none}.snd{padding:5px 7px}
  h1{font-size:24px}
  .tanks{grid-template-columns:1fr}
  .medgrid{grid-template-columns:repeat(2,1fr)}.statgrid{grid-template-columns:repeat(2,1fr)}.foods{grid-template-columns:1fr}.dshop{grid-template-columns:1fr}
  .mrow{grid-template-columns:12px 1fr 66px 40px}.mrow .spk{display:none}
  .pairsel{grid-template-columns:1fr}
  .chips{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><header id="hud"></header><nav id="nav" aria-label="Main"></nav><main id="view"></main></div>
<div id="modal"></div><div id="toasts" aria-live="polite"></div><div id="banner"></div>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/tank.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
