<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boss Fight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Boss Fight: full-window letterboxed arena canvas with HTML menus over it. */
:root{--bg:#05030a;--text:#efe8ff;--dim:#8f86ad;--gold:#ffcc4d;--red:#ff4d6a;--line:#2b2440;--display:"Cinzel",Georgia,serif;--ui:"Rajdhani","Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-weight:600;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;background:radial-gradient(ellipse at center,#120a24dd,#05030af2)}
.panel{width:min(980px,100%);text-align:center}
h1{font-family:var(--display);font-weight:900;font-size:clamp(46px,9vw,104px);margin:0;line-height:.95;letter-spacing:.04em;background:linear-gradient(180deg,#fff 0%,#e8c4ff 40%,#b84dff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px #b84dff88)}
.sub{color:var(--dim);font-size:18px;margin:10px 0 18px}
h2{font-family:var(--display);font-size:clamp(28px,5vw,48px);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.card{background:#120d1fdd;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;transition:transform .12s,border-color .12s}
.card:hover:not(:disabled){transform:translateY(-3px);border-color:var(--gold)}
.card:disabled{opacity:.4;cursor:not-allowed}
.card b{font-family:var(--display);font-size:17px;display:block;margin-bottom:4px}
.card small{color:var(--dim);font-size:14px;line-height:1.3;display:block}
.card .em{font-size:30px;display:block;margin-bottom:4px}
.btn{background:linear-gradient(135deg,#b84dff,#ff2bd6);border:0;border-radius:8px;padding:13px 26px;font-size:18px;font-weight:700;color:#fff;box-shadow:0 0 24px #b84dff66;letter-spacing:.04em}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text)}
.btn.ghost:hover{border-color:var(--gold)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.diff{display:inline-flex;gap:4px;margin:6px 0 2px}
.diff button{background:#120d1f;border:1px solid var(--line);border-radius:6px;padding:6px 14px;font-size:15px;color:var(--dim)}
.diff button.on{border-color:var(--gold);color:var(--gold)}
.keys{color:var(--dim);font-size:14px;line-height:1.6;margin-top:16px}
.keys kbd{background:#1d1630;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--text);font-family:var(--ui)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:14px 0}
.stats div{background:#120d1f;border:1px solid var(--line);border-radius:8px;padding:8px}
.stats small{display:block;color:var(--dim);font-size:12px;letter-spacing:.1em}
.stats b{font-size:22px}
.rank{font-family:var(--display);font-size:80px;line-height:1;color:var(--gold);text-shadow:0 0 30px #ffcc4d88}
.back{position:fixed;left:14px;top:12px;color:var(--dim);font-size:14px;text-decoration:none;z-index:5}
.back:hover{color:var(--gold)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ov" id="ov"></div>
<script>
(() => {
'use strict';
/* ================= setup ================= */
const W = 1280, H = 720;
const cv = document.getElementById('c'), g = cv.getContext('2d');
let SC = 1, OX = 0, OY = 0, DPR = 1;
function fit(){ DPR = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * DPR; cv.height = innerHeight * DPR; SC = Math.min(innerWidth / W, innerHeight / H); OX = (innerWidth - W * SC) / 2; OY = (innerHeight - H * SC) / 2; }
addEventListener('resize', fit); fit();
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const ang = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);
const adiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
const $ = s => document.querySelector(s);
const ARENA = { x:60, y:70, w:W - 120, h:H - 150 };

/* ================= data ================= */
const BOSSES = [
  { k:'eye', name:'THE ANCIENT EYE', sub:'Watcher Beyond the Veil', em:'👁️', hp:3800, col:'#b84dff', fl:['#100720', '#1d0b33'], p2:'THE EYE AWAKENS', blurb:'Bullet spirals, sweeping lasers and tentacle slams. At the end it opens its domain.' },
  { k:'colossus', name:'PYRE COLOSSUS', sub:'The Mountain That Walks', em:'🌋', hp:5000, col:'#ff6a1a', fl:['#1a0905', '#2e1308'], p2:'MOLTEN CORE', blurb:'Shockwaves, meteor rain and wall-shaking charges. Then the arena starts to burn.' },
  { k:'king', name:'THE HOLLOW KING', sub:'Last Sword of a Dead Crown', em:'👑', hp:4200, col:'#9ad0ff', fl:['#090b12', '#141a26'], p2:'CROWN OF ASH', blurb:'A blindingly fast duelist. Learn to parry his blade with a perfectly timed Shield.' },
  { k:'sovereign', name:'VOID SOVEREIGN', sub:'All Three, Made One', em:'🌑', hp:7800, col:'#ff2bd6', fl:['#06000a', '#160020'], p2:'END OF ALL THINGS', blurb:'Beat the other three to awaken it. It knows every move they ever made.', secret:true },
];
const ABIL = [
  { k:'slash', key:'1', name:'Slash', cd:.32, col:'#ffffff', ico:'⚔' },
  { k:'fire', key:'2', name:'Fireball', cd:.9, col:'#ff8a3d', ico:'🔥' },
  { k:'shield', key:'3', name:'Shield', cd:3.2, col:'#4ab8ff', ico:'🛡' },
  { k:'dash', key:'4', name:'Dash Strike', cd:2, col:'#00f0ff', ico:'💨' },
  { k:'ult', key:'5', name:'Ultimate', cd:0, col:'#ffe14d', ico:'💥' },
  { k:'void', key:'6', name:'Void Slash', cd:8, col:'#d04dff', ico:'✖' },
];
const UPG = [
  { k:'dmg', ico:'🗡', name:'Sharpened Edge', d:'+20% damage on everything.' },
  { k:'life', ico:'🩸', name:'Vampiric Blade', d:'Heal 3% of all damage you deal.' },
  { k:'split', ico:'🔥', name:'Split Fire', d:'Fireball splits into three.' },
  { k:'wave', ico:'🌙', name:'Crescent Wave', d:'Slash also fires a flying blade.' },
  { k:'mirror', ico:'🪞', name:'Mirror Shield', d:'Shield reflects bullets back at the boss.' },
  { k:'battery', ico:'🔋', name:'Ult Battery', d:'Ultimate charges 40% faster.' },
  { k:'vit', ico:'❤️', name:'Vitality', d:'+30 max HP and heal to full.' },
  { k:'revive', ico:'🪽', name:'Second Wind', d:'Survive one killing blow at 40% HP.', once:true },
  { k:'roll', ico:'🌀', name:'Twin Roll', d:'+1 dodge roll charge.' },
  { k:'burn', ico:'♨️', name:'Cinder', d:'Hits set the boss on fire.' },
  { k:'haste', ico:'⏱', name:'Haste', d:'All cooldowns 18% shorter.' },
  { k:'crit', ico:'🎯', name:'Eagle Eye', d:'+12% critical hit chance.' },
];
const DIFF = [{ n:'Normal', hp:1, dmg:1, spd:1 }, { n:'Hard', hp:1.3, dmg:1.4, spd:1.15 }, { n:'Nightmare', hp:1.7, dmg:2, spd:1.3 }];

/* ================= persistent ================= */
const SAVE = 'bossfight.v2';
let rec = { beaten:{}, best:null, diff:0 };
try { rec = Object.assign(rec, JSON.parse(localStorage.getItem(SAVE)) || {}); } catch (e){}
const saveRec = () => { try { localStorage.setItem(SAVE, JSON.stringify(rec)); } catch (e){} };

/* ================= state ================= */
let mode = 'menu', run = null, P = null, B = null, T = 0, hitstop = 0, slow = 0, shake = 0, flash = 0, flashCol = '#fff';
let HZ = [], EB = [], PB = [], MN = [], FX = [], TXT = [], EV = [];
const keys = new Set(); let mx = W / 2, my = H / 2, mdown = false, rdown = false, paused = false;

function newRun(gauntlet, bossIdx){
  run = { gauntlet, idx:gauntlet ? 0 : bossIdx, U:{}, time:0, taken:0, dealt:0, diff:DIFF[rec.diff] };
  P = { x:W / 2, y:H - 170, vx:0, vy:0, r:14, hp:100, maxHp:100, face:0, inv:0, roll:0, rollCd:0, charges:1, shield:0, parry:0, ult:0, cds:{}, combo:0, comboT:0, revive:false, dashT:0 };
}
const U = k => (run && run.U[k]) || 0;
function startBoss(){
  const def = BOSSES[run.idx], d = run.diff;
  HZ = []; EB = []; PB = []; MN = []; FX = []; TXT = []; EV = []; T = 0;
  P.x = W / 2; P.y = H - 170; P.inv = 1.5; P.shield = 0; P.cds = {}; P.charges = 1 + U('roll');
  B = { def, x:W / 2, y:220, r:def.k === 'colossus' ? 64 : def.k === 'king' ? 26 : def.k === 'sovereign' ? 58 : 60, hp:def.hp * d.hp, maxHp:def.hp * d.hp, phase:1, cd:2.2, stun:0, flash:0, burn:0, face:0, vx:0, vy:0, dash:null, domain:0, domainHits:0, domainDone:false, safeR:0, t:0, tele:0, look:0 };
  mode = 'intro'; introT = 0;
  $('#ov').hidden = true;
  sfx('boss');
}
let introT = 0;

/* ================= input ================= */
function toWorld(e){ return [(e.clientX - OX) / SC, (e.clientY - OY) / SC]; }
cv.addEventListener('mousemove', e => { [mx, my] = toWorld(e); });
cv.addEventListener('mousedown', e => { [mx, my] = toWorld(e); audio(); if (e.button === 0){ mdown = true; use('slash'); } if (e.button === 2){ rdown = true; use('fire'); } });
addEventListener('mouseup', e => { if (e.button === 0) mdown = false; if (e.button === 2) rdown = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys.add(k); audio();
  if (mode !== 'fight') return;
  if (k === ' '){ e.preventDefault(); roll(); }
  const a = ABIL.find(x => x.key === k); if (a) use(a.k);
  if (k === 'escape') togglePause();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => { keys.clear(); mdown = rdown = false; });

/* ================= player actions ================= */
const cdOf = k => ABIL.find(a => a.k === k).cd * Math.pow(.82, U('haste'));
function ready(k){ return !(P.cds[k] > 0); }
function use(k){
  if (mode !== 'fight' || paused || P.hp <= 0) return;
  if (k === 'ult'){ if (P.ult < 100) return; P.ult = 0; ultimate(); return; }
  if (!ready(k)) return;
  P.cds[k] = cdOf(k);
  const a = ang(P.x, P.y, mx, my); P.face = a;
  if (k === 'slash'){
    P.swing = { t:0, a };
    const hitB = dist(P.x, P.y, B.x, B.y) < 100 + B.r && Math.abs(adiff(a, ang(P.x, P.y, B.x, B.y))) < 1.1;
    if (hitB) dmgBoss(42, B.x, B.y);
    for (const m of MN) if (dist(P.x, P.y, m.x, m.y) < 110 + m.r && Math.abs(adiff(a, ang(P.x, P.y, m.x, m.y))) < 1.1) hurtMinion(m, 60);
    for (const b of EB) if (b.cut !== false && dist(P.x, P.y, b.x, b.y) < 80 && Math.abs(adiff(a, ang(P.x, P.y, b.x, b.y))) < 1.1){ b.dead = true; spark(b.x, b.y, '#fff', 4); }
    if (U('wave')) PB.push({ x:P.x, y:P.y, vx:Math.cos(a) * 700, vy:Math.sin(a) * 700, r:18, dmg:28, life:.6, kind:'wave', a });
    sfx('slash');
  }
  if (k === 'fire'){
    const n = U('split') ? 3 : 1;
    for (let i = 0; i < n; i++){ const aa = a + (i - (n - 1) / 2) * .18; PB.push({ x:P.x, y:P.y, vx:Math.cos(aa) * 640, vy:Math.sin(aa) * 640, r:10, dmg:55, life:1.4, kind:'fire' }); }
    sfx('fire');
  }
  if (k === 'shield'){ P.shield = 1.5; P.parry = .28; sfx('shield'); }
  if (k === 'dash'){
    P.dashT = .2; P.dashA = a; P.inv = Math.max(P.inv, .3); P.dashHit = false; sfx('dash');
  }
  if (k === 'void'){
    const tx = mx, ty = my;
    FX.push({ k:'voidmark', x:tx, y:ty, t:0, life:.5 });
    EV.push({ at:T + .45, fn:() => {
      FX.push({ k:'voidx', x:tx, y:ty, t:0, life:.5 }); shake = Math.max(shake, 10); sfx('void');
      if (dist(tx, ty, B.x, B.y) < 160 + B.r) dmgBoss(240, B.x, B.y, true);
      for (const m of MN) if (dist(tx, ty, m.x, m.y) < 170) hurtMinion(m, 999);
      for (const b of EB) if (dist(tx, ty, b.x, b.y) < 160) b.dead = true;
    } });
  }
}
function roll(){
  if (P.charges <= 0 || P.roll > 0) return;
  P.charges--; P.rollCd = .7; P.roll = .26; P.inv = Math.max(P.inv, .3);
  let dx = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0), dy = (keys.has('s') || keys.has('arrowdown') ? 1 : 0) - (keys.has('w') || keys.has('arrowup') ? 1 : 0);
  if (!dx && !dy){ const a = ang(P.x, P.y, mx, my); dx = Math.cos(a); dy = Math.sin(a); }
  const l = Math.hypot(dx, dy); P.rollA = Math.atan2(dy / l, dx / l); sfx('roll');
}
function ultimate(){
  const a = ang(P.x, P.y, mx, my);
  P.beam = { t:0, life:1.8, a }; flash = .6; flashCol = '#fff6c4'; shake = 14; slow = .35; sfx('ult');
  text(P.x, P.y - 40, 'ULTIMATE', '#ffe14d', 34);
}

/* ================= damage ================= */
function dmgBoss(base, x, y, big){
  if (!B || B.hp <= 0) return;
  let d = base * (1 + .2 * U('dmg')) * (B.stun > 0 ? 1.5 : 1);
  const crit = Math.random() < .08 + .12 * U('crit');
  if (crit) d *= 2;
  if (B.domain > 0){ B.domainHits++; if (B.domainHits >= 14) breakDomain(); }
  B.hp -= d; B.flash = .12; run.dealt += d;
  P.ult = Math.min(100, P.ult + d * .045 * (1 + .4 * U('battery')));
  if (U('life')) P.hp = Math.min(P.maxHp, P.hp + d * .03 * U('life'));
  if (U('burn')) B.burn = 3;
  P.combo++; P.comboT = 2.5;
  text(x + rnd(-20, 20), y - B.r - 10, Math.round(d) + (crit ? '!' : ''), crit ? '#ffe14d' : '#fff', crit || big ? 28 : 20);
  spark(x, y, crit ? '#ffe14d' : B.def.col, crit ? 14 : 7);
  if (crit || big) hitstop = Math.max(hitstop, .06);
  if (B.phase === 1 && B.hp <= B.maxHp * .5) phase2();
  if (B.def.k === 'eye' && !B.domainDone && B.hp <= B.maxHp * .22) domain();
  if (B.hp <= 0) bossDie();
}
function hurtMinion(m, d){ m.hp -= d; m.flash = .1; spark(m.x, m.y, '#fff', 6); if (m.hp <= 0){ m.dead = true; boom(m.x, m.y, m.col || B.def.col, 1); P.ult = Math.min(100, P.ult + 6); } }
function hurtPlayer(d, x, y, src){
  if (P.inv > 0 || P.roll > 0 || P.dashT > 0 || mode !== 'fight') return false;
  d *= run.diff.dmg;
  if (P.shield > 0){
    if (P.parry > 0 && src && src.melee){ parry(); return false; }
    d *= .1;
  }
  P.hp -= d; run.taken += d; P.inv = .55; P.combo = 0;
  shake = Math.max(shake, 8); flash = .25; flashCol = '#ff1a3c'; hitstop = Math.max(hitstop, .05);
  text(P.x, P.y - 30, '-' + Math.round(d), '#ff4d6a', 22); sfx('hurt');
  if (P.hp <= 0){
    if (U('revive') && !P.revive){ P.revive = true; P.hp = P.maxHp * .4; P.inv = 2; flash = .8; flashCol = '#fff'; text(P.x, P.y - 50, 'SECOND WIND', '#9be36a', 30); }
    else { P.hp = 0; die(); }
  }
  return true;
}
function parry(){
  B.stun = 1.8; P.ult = Math.min(100, P.ult + 25); P.inv = .5; hitstop = .18; flash = .5; flashCol = '#9ad0ff'; shake = 12;
  text(P.x, P.y - 46, 'PARRY!', '#9ad0ff', 36); spark(P.x, P.y, '#9ad0ff', 20); sfx('parry');
  for (const h of HZ) if (h.melee) h.dead = true;
}

/* ================= hazards ================= */
const hz = o => { const h = Object.assign({ t:0, warn:.8, act:.18, dmg:20, col:'#ff3355', hit:false }, o); HZ.push(h); return h; };
const bullet = (x, y, a, sp, o) => EB.push(Object.assign({ x, y, vx:Math.cos(a) * sp * run.diff.spd, vy:Math.sin(a) * sp * run.diff.spd, r:8, dmg:12, col:B.def.col, life:6 }, o || {}));
const at = (dt, fn) => EV.push({ at:T + dt, fn });
function inHz(h, x, y, r){
  if (h.sh === 'circle') return dist(x, y, h.x, h.y) < h.r + r;
  if (h.sh === 'ring'){ const d = dist(x, y, h.x, h.y), rr = h.r0 + (h.t - h.warn) * h.sp; return Math.abs(d - rr) < h.w / 2 + r; }
  if (h.sh === 'line'){ const dx = x - h.x, dy = y - h.y, c = Math.cos(h.a), s = Math.sin(h.a), along = dx * c + dy * s, perp = Math.abs(-dx * s + dy * c); return along > -r && along < h.len + r && perp < h.w / 2 + r; }
  if (h.sh === 'cone'){ const d = dist(x, y, h.x, h.y); return d < h.r + r && Math.abs(adiff(h.a, ang(h.x, h.y, x, y))) < h.arc / 2; }
  return false;
}

/* ================= boss patterns ================= */
const PAT = {
  eye:{
    1:['spiral', 'tentacles', 'laser', 'watchers', 'aimed'],
    2:['spiral2', 'tentacles', 'crossLaser', 'rings', 'watchers', 'laser'],
  },
  colossus:{ 1:['slam', 'meteors', 'charge', 'pillars'], 2:['slam', 'meteors2', 'charge', 'eruption', 'pillars'] },
  king:{ 1:['combo', 'thrust', 'clones', 'blades'], 2:['combo2', 'afterimage', 'clones', 'swordRain', 'blades'] },
};
function chooseAttack(){
  const k = B.def.k === 'sovereign' ? pick(['eye', 'colossus', 'king']) : B.def.k;
  const list = PAT[k][B.phase];
  let atk = pick(list); if (atk === B.last) atk = pick(list); B.last = atk;
  const sp = run.diff.spd * (B.phase === 2 ? 1.18 : 1);
  ATK[atk](sp);
  if (B.def.k === 'sovereign' && B.phase === 2 && Math.random() < .5){ const k2 = pick(['eye', 'colossus', 'king']); at(.5, () => ATK[pick(PAT[k2][1])](sp)); }
}
const ATK = {
  /* --- eye --- */
  spiral(sp){ let a0 = rnd(0, 6.28); for (let i = 0; i < 26; i++) at(i * .08 / sp, () => { for (let k = 0; k < 4; k++) bullet(B.x, B.y, a0 + k * Math.PI / 2 + i * .21, 230); }); B.cd = 2.6 / sp; },
  spiral2(sp){ let a0 = rnd(0, 6.28); for (let i = 0; i < 34; i++) at(i * .07 / sp, () => { for (let k = 0; k < 6; k++) bullet(B.x, B.y, a0 + k * Math.PI / 3 + i * .17 * (i % 2 ? 1 : -1), 250, { r:7 }); }); B.cd = 2.8 / sp; },
  aimed(sp){ for (let i = 0; i < 5; i++) at(i * .25 / sp, () => { const a = ang(B.x, B.y, P.x, P.y); for (let k = -2; k <= 2; k++) bullet(B.x, B.y, a + k * .14, 340, { r:9 }); }); B.cd = 2 / sp; },
  tentacles(sp){ const n = B.phase === 2 ? 5 : 3; for (let i = 0; i < n; i++){ const a = ang(B.x, B.y, P.x, P.y) + (i - (n - 1) / 2) * .45; hz({ sh:'line', x:B.x, y:B.y, a, len:900, w:46, warn:.85 / sp + i * .08, act:.22, dmg:22, col:'#c86bff', tent:true }); } B.cd = 1.9 / sp; },
  laser(sp){ const h = hz({ sh:'line', x:B.x, y:B.y, a:ang(B.x, B.y, P.x, P.y), len:1500, w:38, warn:1 / sp, act:1.7, dmg:30, col:'#ff4dff', track:.9 * sp, beam:true }); h.multi = true; B.cd = 3.2 / sp; },
  crossLaser(sp){ const a0 = rnd(0, 6.28); for (let k = 0; k < 4; k++){ const h = hz({ sh:'line', x:B.x, y:B.y, a:a0 + k * Math.PI / 2, len:1500, w:30, warn:1.1 / sp, act:2.4, dmg:28, col:'#ff4dff', spin:.7 * sp * (Math.random() < .5 ? 1 : -1), beam:true }); h.multi = true; } B.cd = 3.6 / sp; },

/* ================= update ================= */
function update(dt){
  if (mode === 'intro'){ introT += dt; if (introT > 2.6) mode = 'fight'; updFx(dt); return; }
  if (mode !== 'fight' || paused) { updFx(dt); return; }
  if (hitstop > 0){ hitstop -= dt; return; }
  if (slow > 0){ slow -= dt; dt *= .4; }
  T += dt; run.time += dt;
  // events
  for (let i = EV.length - 1; i >= 0; i--) if (EV[i].at <= T){ const e = EV[i]; EV.splice(i, 1); e.fn(); }
  // player
  for (const k in P.cds) P.cds[k] = Math.max(0, P.cds[k] - dt);
  P.inv = Math.max(0, P.inv - dt); P.shield = Math.max(0, P.shield - dt); P.parry = Math.max(0, P.parry - dt);
  if (P.comboT > 0){ P.comboT -= dt; if (P.comboT <= 0) P.combo = 0; }
  if (P.charges < 1 + U('roll')){ P.rollCd -= dt; if (P.rollCd <= 0){ P.charges++; P.rollCd = .7; } }
  if (mdown && ready('slash')) use('slash');
  if (rdown && ready('fire')) use('fire');
  let spd = 270 * (B.domain > 0 ? .55 : 1) * (P.shield > 0 ? .6 : 1);
  if (P.roll > 0){ P.roll -= dt; P.x += Math.cos(P.rollA) * 720 * dt; P.y += Math.sin(P.rollA) * 720 * dt; if (Math.random() < .7) FX.push({ k:'ghost', x:P.x, y:P.y, t:0, life:.22, a:P.face }); }
  else if (P.dashT > 0){
    P.dashT -= dt; P.x += Math.cos(P.dashA) * 1500 * dt; P.y += Math.sin(P.dashA) * 1500 * dt; FX.push({ k:'ghost', x:P.x, y:P.y, t:0, life:.25, a:P.dashA, col:'#00f0ff' });
    if (!P.dashHit && dist(P.x, P.y, B.x, B.y) < B.r + 30){ P.dashHit = true; dmgBoss(70, B.x, B.y, true); }
    for (const m of MN) if (dist(P.x, P.y, m.x, m.y) < m.r + 26) hurtMinion(m, 80);
  } else {
    const dx = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0), dy = (keys.has('s') || keys.has('arrowdown') ? 1 : 0) - (keys.has('w') || keys.has('arrowup') ? 1 : 0), l = Math.hypot(dx, dy) || 1;
    P.vx = lerp(P.vx, dx / l * spd, Math.min(1, dt * 14)); P.vy = lerp(P.vy, dy / l * spd, Math.min(1, dt * 14));
    P.x += P.vx * dt; P.y += P.vy * dt;
  }
  P.x = clamp(P.x, ARENA.x + P.r, ARENA.x + ARENA.w - P.r); P.y = clamp(P.y, ARENA.y + P.r, ARENA.y + ARENA.h - P.r);
  if (!P.dashT && !P.roll) P.face = ang(P.x, P.y, mx, my);
  if (P.swing){ P.swing.t += dt; if (P.swing.t > .18) P.swing = null; }
  if (P.beam){
    P.beam.t += dt; const b = P.beam; b.a += adiff(b.a, ang(P.x, P.y, mx, my)) * Math.min(1, dt * 3);
    const c = Math.cos(b.a), s = Math.sin(b.a), dx = B.x - P.x, dy = B.y - P.y, along = dx * c + dy * s, perp = Math.abs(-dx * s + dy * c);
    if (along > 0 && perp < 70 + B.r){ b.acc = (b.acc || 0) + dt; if (b.acc > .08){ b.acc = 0; dmgBoss(48, B.x, B.y); } }
    for (const e of EB){ const ex = e.x - P.x, ey = e.y - P.y; if (ex * c + ey * s > 0 && Math.abs(-ex * s + ey * c) < 80) e.dead = true; }
    for (const m of MN){ const ex = m.x - P.x, ey = m.y - P.y; if (ex * c + ey * s > 0 && Math.abs(-ex * s + ey * c) < 80) hurtMinion(m, 999); }
    shake = Math.max(shake, 5); if (b.t > b.life) P.beam = null;
  }
  // player projectiles
  for (const p of PB){
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.kind === 'fire' && Math.random() < .8) FX.push({ k:'ember', x:p.x, y:p.y, vx:rnd(-30, 30), vy:rnd(-30, 30), t:0, life:.35, col:'#ff8a3d' });
    if (dist(p.x, p.y, B.x, B.y) < B.r + p.r){ p.dead = true; if (p.kind === 'fire'){ boom(p.x, p.y, '#ff8a3d', .9); dmgBoss(p.dmg, p.x, p.y); } else dmgBoss(p.dmg, p.x, p.y); }
    for (const m of MN) if (!p.dead && dist(p.x, p.y, m.x, m.y) < m.r + p.r){ hurtMinion(m, p.dmg); if (p.kind !== 'wave') p.dead = true; }
    if (p.life <= 0 || p.x < 0 || p.x > W || p.y < 0 || p.y > H) p.dead = true;
  }
  PB = PB.filter(p => !p.dead);
  // boss
  updBoss(dt);
  // minions
  for (const m of MN){
    m.t += dt; m.cd -= dt; m.flash = Math.max(0, (m.flash || 0) - dt);
    if (m.k === 'watcher'){ m.x += Math.cos(m.t * 1.5 + m.y) * 40 * dt; m.y += Math.sin(m.t * 1.3 + m.x) * 40 * dt; if (m.cd <= 0){ m.cd = rnd(1.1, 1.8) / run.diff.spd; const a = ang(m.x, m.y, P.x, P.y); for (let k = -1; k <= 1; k++) bullet(m.x, m.y, a + k * .2, 300, { r:7, col:'#c86bff', dmg:10 }); } }
    if (m.k === 'clone'){ if (m.cd <= 0 && !m.swung){ m.swung = true; const a = ang(m.x, m.y, P.x, P.y); hz({ sh:'cone', x:m.x, y:m.y, a, r:170, arc:1.7, warn:.5, act:.12, dmg:18, col:'#9ad0ff', melee:true }); m.die = .8; } if (m.die !== undefined){ m.die -= dt; if (m.die <= 0) m.dead = true; } }
  }
  MN = MN.filter(m => !m.dead);
  // enemy bullets
  for (const b of EB){
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40){ b.dead = true; continue; }
    if (dist(b.x, b.y, P.x, P.y) < b.r + P.r - 3){
      if (P.shield > 0){ b.dead = true; spark(b.x, b.y, '#4ab8ff', 4); if (U('mirror')){ const a = ang(P.x, P.y, B.x, B.y); PB.push({ x:b.x, y:b.y, vx:Math.cos(a) * 700, vy:Math.sin(a) * 700, r:8, dmg:24, life:1.5, kind:'reflect' }); } continue; }
      if (hurtPlayer(b.dmg, b.x, b.y)) b.dead = true;
    }
  }
  EB = EB.filter(b => !b.dead);
  // hazards
  for (const h of HZ){
    h.t += dt;
    if (h.track && h.t < h.warn + h.act){ h.x = B.x; h.y = B.y; h.a += adiff(h.a, ang(h.x, h.y, P.x, P.y)) * Math.min(1, dt * h.track); }
    if (h.spin && h.t > h.warn){ h.a += h.spin * dt; h.x = B.x; h.y = B.y; }
    if (h.follow && h.t < h.warn * .6){ h.x = B.x; h.y = B.y; }
    if (h.t >= h.warn && h.t <= h.warn + h.act && h.dmg > 0 && (!h.hit || h.multi)){
      if (inHz(h, P.x, P.y, P.r)){ if (h.multi){ h.tick = (h.tick || 0) - dt; if (h.tick <= 0){ if (hurtPlayer(h.dmg * .5, P.x, P.y, h)) h.tick = .35; } } else if (hurtPlayer(h.dmg, P.x, P.y, h)) h.hit = true; }
    }
    if (h.t >= h.warn && !h.fx){ h.fx = true; if (h.meteor){ boom(h.x, h.y, '#ff6a1a', 1.3); shake = Math.max(shake, 8); sfx('boom'); } else if (h.sword){ spark(h.x, h.y, '#cfe9ff', 10); } else if (h.sh === 'circle'){ boom(h.x, h.y, h.col, 1); } else if (h.melee){ sfx('slash'); } }
    if (h.t > h.warn + h.act) h.dead = true;
  }
  HZ = HZ.filter(h => !h.dead);
  // molten core shrinking arena
  if (B.safeR > 0){ B.safeR = Math.max(300, B.safeR - dt * 16); if (dist(P.x, P.y, W / 2, H / 2 + 20) > B.safeR){ P.lava = (P.lava || 0) - dt; if (P.lava <= 0){ P.lava = .4; hurtPlayer(8, P.x, P.y); } } }
  updFx(dt);
  shake = Math.max(0, shake - dt * 40); flash = Math.max(0, flash - dt * 2);
}
function updBoss(dt){
  if (B.hp <= 0) return;
  B.t += dt; B.flash = Math.max(0, B.flash - dt);
  if (B.burn > 0){ B.burn -= dt; B.burnT = (B.burnT || 0) - dt; if (B.burnT <= 0){ B.burnT = .5; B.hp -= 8 * U('burn'); text(B.x + rnd(-20, 20), B.y - B.r, '8', '#ff8a3d', 14); if (B.hp <= 0) bossDie(); } }
  if (B.domain > 0){ B.domain -= dt; if (B.domain <= 0){ B.stun = 1; } }
  if (B.stun > 0){ B.stun -= dt; return; }
  if (B.dash){
    const d = B.dash; d.t += dt; B.x += Math.cos(d.a) * d.sp * dt; B.y += Math.sin(d.a) * d.sp * dt;
    FX.push({ k:'bghost', x:B.x, y:B.y, t:0, life:.25 });
    if (dist(B.x, B.y, P.x, P.y) < B.r + P.r) hurtPlayer(d.dmg, B.x, B.y, d);
    const hitWall = B.x < ARENA.x + B.r || B.x > ARENA.x + ARENA.w - B.r || B.y < ARENA.y + B.r || B.y > ARENA.y + ARENA.h - B.r;
    if (hitWall || d.t > d.max){ B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r); B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r); B.dash = null; if (hitWall && B.def.k !== 'king'){ B.stun = 1.2; shake = 18; boom(B.x, B.y, '#ffb347', 1.4); text(B.x, B.y - 80, 'STAGGERED', '#ffcc4d', 24); sfx('boom'); } }
    return;
  }
  // movement
  const k = B.def.k;
  if (k === 'eye' || k === 'sovereign'){ const tx = W / 2 + Math.cos(B.t * .5) * 240, ty = 230 + Math.sin(B.t * .8) * 70; B.x = lerp(B.x, tx, dt * .8); B.y = lerp(B.y, ty, dt * .8); }
  if (k === 'colossus'){ const t = B.walkTo || [P.x, P.y]; const a = ang(B.x, B.y, t[0], t[1]); if (dist(B.x, B.y, t[0], t[1]) > 30){ B.x += Math.cos(a) * 80 * dt * run.diff.spd; B.y += Math.sin(a) * 80 * dt * run.diff.spd; } else B.walkTo = null; }
  if (k === 'king'){ const a = ang(B.x, B.y, P.x, P.y), d = dist(B.x, B.y, P.x, P.y); B.face = a; const want = d > 260 ? 1 : d < 160 ? -1 : 0; B.x += (Math.cos(a) * want * 150 + Math.cos(a + 1.57) * 90) * dt; B.y += (Math.sin(a) * want * 150 + Math.sin(a + 1.57) * 90) * dt; }
  B.x = clamp(B.x, ARENA.x + B.r, ARENA.x + ARENA.w - B.r); B.y = clamp(B.y, ARENA.y + B.r, ARENA.y + ARENA.h - B.r);

}
function updFx(dt){
  for (const f of FX){ f.t += dt; if (f.vx !== undefined){ f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= .96; f.vy *= .96; } }
  FX = FX.filter(f => f.t < f.life);
  for (const t of TXT){ t.t += dt; t.y -= dt * 40; }
  TXT = TXT.filter(t => t.t < 1);
  if (banner){ banner.t += dt; if (banner.t > 3) banner = null; }
}
const text = (x, y, s, col, size) => TXT.push({ x, y, s, col, size:size || 18, t:0 });
function spark(x, y, col, n){ for (let i = 0; i < n; i++){ const a = rnd(0, 6.28), sp = rnd(80, 380); FX.push({ k:'spark', x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, t:0, life:rnd(.2, .45), col }); } }
function boom(x, y, col, s){ FX.push({ k:'ring', x, y, t:0, life:.45, col, s }); for (let i = 0; i < 14 * s; i++){ const a = rnd(0, 6.28), sp = rnd(60, 300) * s; FX.push({ k:'ember', x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, t:0, life:rnd(.3, .7), col:pick([col, '#ffd27a', '#ffffff']) }); } }

/* ================= win / lose ================= */
function bossDie(){

  B.hp = 0; mode = 'dying'; slow = 0; HZ = []; EB = []; MN = [];
  rec.beaten[B.def.k] = true; saveRec();
  flash = 1; flashCol = '#fff'; shake = 30; sfx('win');
  for (let i = 0; i < 6; i++) setTimeout(() => boom(B.x + rnd(-60, 60), B.y + rnd(-60, 60), B.def.col, 1.6), i * 180);
  setTimeout(afterWin, 1800);
}
function afterWin(){
  const last = !run.gauntlet || run.idx >= (allThree() ? 3 : 2);
  if (run.gauntlet && run.idx === 2 && allThree() && !run.sovOffered){ run.sovOffered = true; }
  if (!last){ mode = 'upgrade'; showUpgrade(); return; }
  mode = 'win'; showWin();
}
const allThree = () => rec.beaten.eye && rec.beaten.colossus && rec.beaten.king;
function die(){ mode = 'dead'; flash = 1; flashCol = '#ff1a3c'; sfx('lose'); setTimeout(showLose, 1400); }

  else if (p.kind === 'wave'){ g.rotate(p.a); g.strokeStyle = '#e8f6ff'; g.lineWidth = 5; g.shadowColor = '#9ad0ff'; g.shadowBlur = 16; g.beginPath(); g.arc(-14, 0, 22, -1.2, 1.2); g.stroke(); }
  else { g.fillStyle = '#4ab8ff'; g.shadowColor = '#4ab8ff'; g.shadowBlur = 14; g.beginPath(); g.arc(0, 0, p.r, 0, 7); g.fill(); }
  g.restore();
}
function drawEB(b){
  g.save(); g.translate(b.x, b.y);
  if (b.blade){ g.rotate(b.a); g.strokeStyle = b.col; g.lineWidth = 3; g.shadowColor = '#9ad0ff'; g.shadowBlur = 10; g.beginPath(); g.moveTo(-12, 0); g.lineTo(12, 0); g.stroke(); }
  else { g.fillStyle = b.col; g.shadowColor = b.col; g.shadowBlur = 12; g.beginPath(); g.arc(0, 0, b.r, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(0, 0, b.r * .45, 0, 7); g.fill(); }
  g.restore();
}
function drawBeam(time){
  const b = P.beam, w = 70 * Math.min(1, b.t * 6) * (b.t > b.life - .3 ? (b.life - b.t) / .3 : 1);
  g.save(); g.translate(P.x, P.y); g.rotate(b.a);
  const gr = g.createLinearGradient(0, -w, 0, w); gr.addColorStop(0, 'rgba(255,225,77,0)'); gr.addColorStop(.5, 'rgba(255,250,220,1)'); gr.addColorStop(1, 'rgba(255,225,77,0)');
  g.fillStyle = gr; g.shadowColor = '#ffe14d'; g.shadowBlur = 40; g.fillRect(0, -w, 1600, w * 2);
  g.fillStyle = '#fff'; g.fillRect(0, -w * .25, 1600, w * .5);
  for (let i = 0; i < 10; i++){ g.fillStyle = '#ffe14d'; g.beginPath(); g.arc(((time * 1400 + i * 160) % 1600), rnd(-w, w) * .7, 4, 0, 7); g.fill(); }
  g.restore();
}
function drawFx(f){
  const k = f.t / f.life;
  g.save(); g.globalAlpha = 1 - k;
  if (f.k === 'spark'){ g.strokeStyle = f.col; g.lineWidth = 2; g.beginPath(); g.moveTo(f.x, f.y); g.lineTo(f.x - f.vx * .03, f.y - f.vy * .03); g.stroke(); }
  else if (f.k === 'ember'){ g.fillStyle = f.col; g.beginPath(); g.arc(f.x, f.y, 4 * (1 - k) + 1, 0, 7); g.fill(); }
  else if (f.k === 'ring'){ g.strokeStyle = f.col; g.lineWidth = 6 * (1 - k); g.beginPath(); g.arc(f.x, f.y, 20 + k * 110 * f.s, 0, 7); g.stroke(); }
  else if (f.k === 'ghost'){ g.globalAlpha = (1 - k) * .4; g.fillStyle = f.col || '#9ab8ff'; g.beginPath(); g.arc(f.x, f.y, 14, 0, 7); g.fill(); }
  else if (f.k === 'bghost'){ g.globalAlpha = (1 - k) * .3; g.fillStyle = B.def.col; g.beginPath(); g.arc(f.x, f.y, B.r, 0, 7); g.fill(); }
  else if (f.k === 'voidmark'){ g.strokeStyle = '#d04dff'; g.lineWidth = 2; g.beginPath(); g.arc(f.x, f.y, 160 * (1 - k * .3), 0, 7); g.stroke(); }
  else if (f.k === 'voidx'){ g.strokeStyle = '#f0c8ff'; g.shadowColor = '#d04dff'; g.shadowBlur = 30; g.lineWidth = 18 * (1 - k); const r = 180; g.beginPath(); g.moveTo(f.x - r, f.y - r); g.lineTo(f.x + r, f.y + r); g.moveTo(f.x + r, f.y - r); g.lineTo(f.x - r, f.y + r); g.stroke(); }
  g.restore();
}
function drawDomain(time){
  g.save(); g.globalAlpha = .35; g.fillStyle = '#04000a'; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  for (let i = 0; i < 60; i++){ const r = srnd(i), a = r * 6.28 + time * .1, d = 100 + srnd(i + 99) * 700; g.fillStyle = `rgba(200,180,255,${.3 + .5 * Math.abs(Math.sin(time + i))})`; g.fillRect(W / 2 + Math.cos(a) * d, H / 2 + Math.sin(a) * d * .6, 2, 2); }
  g.font = '700 18px Rajdhani'; g.textAlign = 'center'; g.fillStyle = '#e8d8ff'; g.fillText(`UNLIMITED VOID · ${B.domain.toFixed(1)}s · hits ${B.domainHits}/14`, W / 2, ARENA.y + 26);
  g.restore();
}
const srnd = i => { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); };
function drawHUD(time){
  const def = B.def, bw = 760, bx = (W - bw) / 2;
  g.font = '900 22px Cinzel, Georgia, serif'; g.textAlign = 'center'; g.fillStyle = def.col; g.shadowColor = def.col; g.shadowBlur = 12; g.fillText(def.name, W / 2, 30); g.shadowBlur = 0;
  g.fillStyle = '#0008'; g.fillRect(bx, 40, bw, 14);
  const hpF = clamp(B.hp / B.maxHp, 0, 1);
  const hg = g.createLinearGradient(bx, 0, bx + bw, 0); hg.addColorStop(0, def.col); hg.addColorStop(1, '#ffffff'); g.fillStyle = hg; g.fillRect(bx, 40, bw * hpF, 14);
  g.fillStyle = '#fff'; g.fillRect(bx + bw * .5 - 1, 37, 2, 20);
  g.strokeStyle = '#ffffff55'; g.strokeRect(bx, 40, bw, 14);
  if (B.burn > 0){ g.font = '700 13px Rajdhani'; g.fillStyle = '#ff8a3d'; g.textAlign = 'left'; g.fillText('🔥 BURNING', bx + bw + 8, 52); }
  // player HP
  const px = 24, py = H - 54;
  g.textAlign = 'left'; g.font = '700 15px Rajdhani'; g.fillStyle = '#e8eeff'; g.fillText(`HP ${Math.ceil(P.hp)} / ${P.maxHp}`, px, py - 6);
  g.fillStyle = '#0008'; g.fillRect(px, py, 260, 12); g.fillStyle = P.hp / P.maxHp < .3 ? '#ff4d6a' : '#4adf8a'; g.fillRect(px, py, 260 * P.hp / P.maxHp, 12);
  for (let i = 0; i < 1 + U('roll'); i++){ g.fillStyle = i < P.charges ? '#9ab8ff' : '#2a2a3a'; g.beginPath(); g.arc(px + 8 + i * 18, py + 28, 6, 0, 7); g.fill(); }
  g.font = '600 12px Rajdhani'; g.fillStyle = '#8f86ad'; g.fillText('DODGE', px + 14 + (1 + U('roll')) * 18, py + 32);
  // abilities
  const aw = 62, ax0 = W / 2 - (ABIL.length * (aw + 8)) / 2;
  ABIL.forEach((a, i) => {
    const x = ax0 + i * (aw + 8), y = H - 70;
    g.fillStyle = '#120d1fdd'; g.fillRect(x, y, aw, 56); g.strokeStyle = a.col + '88'; g.lineWidth = 1.5; g.strokeRect(x, y, aw, 56);
    g.font = '24px serif'; g.textAlign = 'center'; g.fillStyle = '#fff'; g.fillText(a.ico, x + aw / 2, y + 30);
    g.font = '600 11px Rajdhani'; g.fillStyle = '#c9c0e0'; g.fillText(a.name, x + aw / 2, y + 48);
    g.font = '700 11px Rajdhani'; g.textAlign = 'left'; g.fillStyle = '#8f86ad'; g.fillText(a.key, x + 4, y + 12);
    let f = 0; if (a.k === 'ult') f = 1 - P.ult / 100; else if (P.cds[a.k] > 0) f = P.cds[a.k] / cdOf(a.k);
    if (f > 0){ g.fillStyle = '#000b'; g.fillRect(x, y, aw, 56 * f); }
    if (a.k === 'ult' && P.ult >= 100){ g.strokeStyle = '#ffe14d'; g.lineWidth = 3; g.shadowColor = '#ffe14d'; g.shadowBlur = 16 + Math.sin(time * 8) * 8; g.strokeRect(x, y, aw, 56); g.shadowBlur = 0; }
  });
  // combo + timer
  g.textAlign = 'right'; g.font = '700 15px Rajdhani'; g.fillStyle = '#8f86ad'; g.fillText(`${fmtT(run.time)} · ${run.diff.n}${run.gauntlet ? ' · Gauntlet ' + (run.idx + 1) : ''}`, W - 24, H - 40);
  if (P.combo > 2){ g.font = `900 ${28 + Math.min(20, P.combo)}px Cinzel, serif`; g.fillStyle = '#ffcc4d'; g.shadowColor = '#ffcc4d'; g.shadowBlur = 14; g.fillText(P.combo + ' HIT', W - 24, H - 66); g.shadowBlur = 0; }
  if (Object.keys(run.U).length){ g.font = '16px serif'; g.textAlign = 'left'; let x = 24; for (const k in run.U){ const u = UPG.find(q => q.k === k); g.fillText(u.ico + (run.U[k] > 1 ? run.U[k] : ''), x, H - 92); x += 26; } }
}
function drawIntro(){
  const k = introT / 2.6, a = k < .2 ? k / .2 : k > .8 ? (1 - k) / .2 : 1;
  g.save(); g.globalAlpha = a * .7; g.fillStyle = '#000'; g.fillRect(0, H / 2 - 90, W, 180); g.globalAlpha = a;
  g.textAlign = 'center'; g.font = '900 64px Cinzel, Georgia, serif'; g.fillStyle = B.def.col; g.shadowColor = B.def.col; g.shadowBlur = 30; g.fillText(B.def.name, W / 2 + (1 - Math.min(1, k * 4)) * 200, H / 2 + 10);
  g.shadowBlur = 0; g.font = '600 22px Rajdhani'; g.fillStyle = '#e8e0ff'; g.fillText(B.def.sub.toUpperCase(), W / 2, H / 2 + 48);
  g.restore();
}
function drawBanner(){
  const k = banner.t / 3, a = k < .1 ? k / .1 : k > .8 ? (1 - k) / .2 : 1;
  g.save(); g.globalAlpha = a; g.textAlign = 'center'; g.font = '900 52px Cinzel, Georgia, serif'; g.fillStyle = '#fff'; g.shadowColor = B.def.col; g.shadowBlur = 40; g.fillText(banner.txt, W / 2, H / 2 - 40);
  if (banner.sub){ g.shadowBlur = 0; g.font = '600 20px Rajdhani'; g.fillStyle = '#e8d8ff'; g.fillText(banner.sub, W / 2, H / 2); }
  g.restore();
}

/* ================= audio ================= */
let AC = null;
function audio(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e){} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d, type, v, f2, delay){ if (!AC) return; try { const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), gn = AC.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d); gn.gain.setValueAtTime(v || .05, t); gn.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(gn); gn.connect(AC.destination); o.start(t); o.stop(t + d); } catch (e){} }
function noise(d, v, f){ if (!AC) return; try { const b = AC.createBuffer(1, AC.sampleRate * d, AC.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length); const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), gn = AC.createGain(); s.buffer = b; fl.frequency.value = f || 800; gn.gain.value = v || .2; s.connect(fl); fl.connect(gn); gn.connect(AC.destination); s.start(); } catch (e){} }
const lastS = {};
function sfx(k){
  const n = performance.now(); if (n - (lastS[k] || 0) < 40) return; lastS[k] = n;
  ({ slash:() => noise(.08, .12, 3000), fire:() => tone(300, .2, 'sawtooth', .04, 120), shield:() => tone(600, .25, 'sine', .07, 900), dash:() => noise(.18, .14, 1500), roll:() => noise(.1, .08, 1200),
     void:() => { tone(80, .6, 'sawtooth', .08, 40); noise(.5, .25, 600); }, ult:() => { tone(120, 1.4, 'sawtooth', .07, 600); noise(1.2, .2, 2000); }, hurt:() => tone(180, .2, 'square', .07, 90),
     parry:() => { tone(1400, .25, 'triangle', .1, 2200); tone(900, .3, 'triangle', .06, 1800, .05); }, boom:() => { noise(.5, .3, 300); tone(60, .4, 'sine', .15, 30); },
     boss:() => { tone(80, 1.2, 'sawtooth', .06, 60); tone(120, 1.2, 'sawtooth', .05, 90, .2); }, phase:() => { tone(60, 1.5, 'sawtooth', .08, 200); noise(1, .2, 400); },
     win:() => [523, 659, 784, 1047].forEach((f, i) => tone(f, .4, 'square', .05, 0, i * .12)), lose:() => [392, 330, 262, 196].forEach((f, i) => tone(f, .5, 'sawtooth', .05, 0, i * .18)) }[k] || (() => {}))();
}

/* ================= loop ================= */
let last = performance.now();
function frame(now){ const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); draw(now / 1000); requestAnimationFrame(frame); }
window.__dbg = { step(n){ for (let i = 0; i < n; i++) update(1 / 60); }, get s(){ return { mode, B, P, run, HZ:HZ.length, EB:EB.length, MN:MN.length }; }, use, roll, newRun, startBoss, set mx(v){ mx = v; }, set my(v){ my = v; } };
showMenu();
requestAnimationFrame(frame);
})();
