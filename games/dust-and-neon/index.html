<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dust &amp; Neon · 2trapz games</title>
<meta name="description" content="First-person rally and neon street racing. A friend co-drives your rally stages from another device while you drive with no map.">
<link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: full-bleed WebGL canvas, UI screens float over it as translucent asphalt panels; one bold element = the DUST/NEON logo split. */
:root {
  --asphalt: #131119;
  --panel: rgba(20, 17, 28, 0.84);
  --panel-2: rgba(34, 28, 46, 0.92);
  --line: rgba(239, 230, 214, 0.12);
  --bone: #efe6d6;
  --muted: #9a92a8;
  --dust: #e8a64a;
  --neon: #ff3d9a;
  --ice: #4fe3ff;
  --good: #4dffa0;
  --bad: #ff5a4a;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-ui: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--asphalt); color: var(--bone); font-family: var(--f-ui); font-size: 15px; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
#game { position: fixed; inset: 0; }
#game canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#fatal { position: fixed; inset: auto 16px 16px 16px; padding: 14px; background: #3a0d12; border: 1px solid var(--bad); border-radius: 6px; z-index: 99; }
[hidden] { display: none !important; }

/* ---------- logo ---------- */
.logo { font-family: var(--f-display); font-weight: 900; line-height: 0.82; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 0.12em; font-size: clamp(64px, 13vw, 168px); user-select: none; }
.logo .l-dust { color: var(--dust); text-shadow: 0 2px 0 #7a4a12, 0 0 28px rgba(232, 166, 74, 0.25); background: repeating-linear-gradient(115deg, rgba(0,0,0,0) 0 3px, rgba(60,30,0,0.18) 3px 4px); -webkit-background-clip: text; }
.logo .l-amp { color: var(--muted); font-weight: 600; font-size: 0.45em; transform: translateY(-0.4em); }
.logo .l-neon { color: transparent; -webkit-text-stroke: 3px var(--neon); text-shadow: 0 0 18px rgba(255, 61, 154, 0.75), 0 0 48px rgba(255, 61, 154, 0.35); animation: tube 6s infinite; }
@keyframes tube { 0%, 92%, 100% { opacity: 1; } 93% { opacity: 0.35; } 94% { opacity: 1; } 96% { opacity: 0.55; } }
.logo.sm { font-size: 46px; -webkit-text-stroke-width: 2px; }
.logo.sm .l-neon { -webkit-text-stroke-width: 2px; }

/* ---------- buttons & chips ---------- */
.btn { border: 1px solid var(--line); background: var(--panel-2); padding: 10px 18px; border-radius: 4px; font-weight: 600; letter-spacing: 0.02em; transition: background 0.12s, border-color 0.12s, transform 0.08s; }
.btn:hover:not(:disabled) { border-color: var(--bone); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn.hero { background: var(--neon); border-color: var(--neon); color: #1a0510; font-family: var(--f-display); font-weight: 800; font-size: 24px; padding: 8px 30px; box-shadow: 0 0 24px rgba(255, 61, 154, 0.45); }
.btn.hero:hover { background: #ff63af; }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.chip { border: 1px solid var(--line); background: rgba(255,255,255,0.03); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.chip.on { border-color: var(--ice); color: var(--ice); background: rgba(79, 227, 255, 0.08); }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; }
.chips-row > label { min-width: 150px; color: var(--muted); font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.45; max-width: 62ch; }
.money { font-family: var(--f-display); font-weight: 800; color: var(--dust); font-size: 24px; font-variant-numeric: tabular-nums; }
.rep { font-family: var(--f-display); font-weight: 600; color: var(--ice); font-size: 18px; margin-left: 12px; }

/* ---------- screens ---------- */
#ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
.screen { position: absolute; inset: 0; pointer-events: auto; display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); overflow: auto; }
.sh { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.sh h1 { font-family: var(--f-display); font-weight: 800; font-size: 40px; margin: 0; margin-right: auto; line-height: 1; }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 22px; margin: 18px 0 8px; color: var(--bone); }
h4 { font-family: var(--f-display); font-weight: 600; font-size: 19px; margin: 6px 0 8px; }

.scr-title { align-items: flex-start; justify-content: flex-end; background: linear-gradient(180deg, rgba(10,8,14,0) 30%, rgba(10,8,14,0.85)); }
.title-wrap { max-width: 900px; padding: 0 0 6vh 3vw; }
.title-wrap .tag { font-size: 20px; color: var(--bone); max-width: 36ch; line-height: 1.35; margin: 18px 0 22px; }
.small-note { color: var(--muted); font-size: 13px; }

.scr-main { flex-direction: row; justify-content: space-between; background: linear-gradient(90deg, rgba(12,10,16,0.88) 0, rgba(12,10,16,0.55) 340px, rgba(12,10,16,0) 560px); }
.mainnav { display: flex; flex-direction: column; gap: 2px; width: min(340px, 100%); }
.mainnav .logo { margin-bottom: 18px; }
.mn { display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: none; border: 0; padding: 6px 10px 6px 12px; border-left: 3px solid transparent; }
.mn b { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1; }
.mn.big b { font-size: 44px; color: var(--dust); }
.mn small { color: var(--muted); font-size: 13px; }
.mn:hover, .mn:focus-visible { border-left-color: var(--neon); background: linear-gradient(90deg, rgba(255,61,154,0.16), rgba(255,61,154,0)); outline: none; }
.mn:hover b { color: var(--bone); text-shadow: 0 0 14px rgba(255, 61, 154, 0.6); }
.mn-home { text-decoration: none; color: var(--muted); margin-top: 6px; }
.mn-home b { font-size: 22px !important; color: var(--muted); }
.mn-sep { height: 1px; background: var(--line); margin: 8px 0; width: 70%; }
.maininfo { align-self: flex-end; width: min(330px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; backdrop-filter: blur(8px); }
.wallet { display: flex; align-items: baseline; margin-bottom: 12px; }
.curcar small { color: var(--muted); font-size: 12px; display: block; }
.curcar b { font-family: var(--f-display); font-size: 28px; font-weight: 800; display: inline-block; margin-right: 8px; }
.cls { display: inline-flex; align-items: baseline; gap: 4px; padding: 1px 8px; border-radius: 3px; font-family: var(--f-display); font-weight: 900; font-size: 18px; color: #0b0910; background: var(--bone); vertical-align: middle; }
.cls small { font-weight: 600; font-size: 13px; }
.cls-D { background: #7fd0ff; } .cls-C { background: #9fe870; } .cls-B { background: #ffd24a; } .cls-A { background: #ff8a3a; } .cls-S { background: #ff4a6a; } .cls-X { background: #c07aff; }
.statbar { display: grid; grid-template-columns: 86px 1fr 96px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
.statbar span { color: var(--muted); }
.statbar div { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.statbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--dust), var(--neon)); }
.statbar b { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }

/* setup screens */
.scr-setup, .scr-garage, .scr-story, .scr-settings, .scr-lobby, .scr-join, .scr-driver { background: linear-gradient(180deg, rgba(12,10,16,0.82), rgba(12,10,16,0.7)); }
.setup-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 360px); gap: 18px; flex: 1; min-height: 0; }
.setup-l, .setup-r { overflow: auto; min-width: 0; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.wcard { text-align: left; border: 1px solid var(--line); border-radius: 6px; padding: 12px; min-height: 96px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; background: var(--panel-2); position: relative; overflow: hidden; }
.wcard b { font-family: var(--f-display); font-size: 22px; font-weight: 800; position: relative; }
.wcard small { color: var(--muted); font-size: 12px; position: relative; line-height: 1.3; }
.wcard::before { content: ""; position: absolute; inset: 0; opacity: 0.55; }
.w-forest::before { background: linear-gradient(160deg, #1d3a1e, #0d140c 70%); }
.w-snow::before { background: linear-gradient(160deg, #5d6f86, #161a24 70%); }
.w-desert::before { background: linear-gradient(160deg, #8a3c20, #1c0f0a 70%); }
.w-coast::before { background: linear-gradient(160deg, #1e5470, #101a14 70%); }
.w-japan::before { background: linear-gradient(160deg, #3a1030, #0c0a14 70%); }
.w-vesper::before { background: linear-gradient(160deg, #4a1450, #0a0c1c 70%); }
.wcard.on { border-color: var(--neon); box-shadow: inset 0 0 0 1px var(--neon), 0 0 18px rgba(255, 61, 154, 0.25); }
.cdopts { display: grid; gap: 8px; }
.cdo { text-align: left; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; background: var(--panel-2); display: flex; flex-direction: column; gap: 3px; }
.cdo b { font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.cdo small { color: var(--muted); }
.cdo.on { border-color: var(--dust); box-shadow: inset 3px 0 0 var(--dust); }
.picker { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.picker-h { color: var(--muted); font-size: 12px; margin: 8px 2px 6px; letter-spacing: 0.04em; }
.picker-test { display: flex; flex-wrap: wrap; gap: 5px; }
.carcard { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 5px; border: 1px solid transparent; cursor: pointer; }
.carcard:hover { background: rgba(255,255,255,0.04); }
.carcard.sel { border-color: var(--ice); background: rgba(79, 227, 255, 0.06); }
.cc-sw { width: 10px; height: 34px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
.cc-t b { display: block; font-weight: 700; }
.cc-t small { color: var(--muted); font-size: 12px; }
.sf { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 12px; flex-wrap: wrap; }
#suSum { color: var(--muted); }

/* lobby */
.lobby { max-width: 760px; }
.code-box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: inline-block; min-width: 280px; }
.code-box small { color: var(--muted); }
.code { font-family: var(--f-display); font-weight: 900; font-size: 72px; letter-spacing: 0.08em; color: var(--dust); line-height: 1; }
.lobby-status { color: var(--muted); margin-top: 6px; }
.lobby-status.ok { color: var(--good); }
.steps { line-height: 1.6; max-width: 66ch; padding-left: 18px; }
.steps li { margin: 8px 0; }
#jCode { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; font-family: var(--f-display); font-size: 34px; width: 220px; text-transform: uppercase; letter-spacing: 0.08em; }
.found { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* garage */
.garage { display: grid; grid-template-columns: minmax(280px, 400px) 1fr minmax(240px, 320px); gap: 14px; flex: 1; min-height: 0; }
.g-left, .g-right { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow: auto; min-width: 0; backdrop-filter: blur(6px); }
.g-center { display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
.g-center .g-hint { pointer-events: auto; color: var(--muted); font-size: 13px; background: var(--panel); padding: 6px 10px; border-radius: 4px; display: flex; gap: 8px; align-items: center; }
.scr-garage, .scr-driver { pointer-events: none; }
.scr-garage > *, .scr-driver > * { pointer-events: auto; }
.scr-garage .garage, .scr-driver .garage { pointer-events: none; }
.scr-garage .g-left, .scr-garage .g-right, .scr-driver .g-left, .scr-driver .g-right { pointer-events: auto; }
.gtabs { display: flex; flex-wrap: wrap; gap: 4px; }
.gtab { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 5px 10px; font-size: 13px; font-weight: 600; }
.gtab.on { background: var(--bone); color: #16121c; border-color: var(--bone); }
.g-car b { font-family: var(--f-display); font-size: 26px; font-weight: 800; display: block; line-height: 1.05; }
.g-car small { color: var(--muted); display: block; margin: 4px 0 8px; line-height: 1.35; }
.specs { display: grid; grid-template-columns: 80px 1fr; gap: 4px 10px; font-size: 13px; margin-top: 12px; }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; }
.pcat { margin-bottom: 14px; }
.part { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: rgba(255,255,255,0.025); border: 1px solid transparent; border-radius: 4px; padding: 7px 9px; margin: 3px 0; }
.part:hover:not(:disabled) { border-color: var(--line); background: rgba(255,255,255,0.05); }
.part.eq { border-color: var(--dust); background: rgba(232, 166, 74, 0.08); }
.pn { display: flex; flex-direction: column; font-weight: 600; min-width: 0; }
.pn small { color: var(--muted); font-weight: 400; font-size: 12px; line-height: 1.3; }
.pn em { color: var(--ice); font-style: normal; font-size: 12px; }
.pp { font-family: var(--f-display); font-weight: 600; font-size: 16px; white-space: nowrap; color: var(--dust); }
.part.own .pp { color: var(--muted); }
.part.eq .pp { color: var(--dust); }
.crow { display: flex; gap: 10px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
.colorpick { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.colorpick input[type=color] { width: 34px; height: 26px; border: 1px solid var(--line); background: none; padding: 0; border-radius: 3px; }
.colorpick input[type=number] { width: 54px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; }
select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); }
.swatch.on { border-color: var(--bone); box-shadow: 0 0 0 2px var(--neon); }
.deal { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.deal small { color: var(--muted); display: block; font-size: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.field input { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; color: var(--bone); font-size: 16px; }
.portrait-big img { width: 100%; border-radius: 6px; }

/* tuning laptop */
.laptop { background: #050b07; border: 10px solid #24262c; border-radius: 10px; box-shadow: 0 0 0 1px #3a3c44, 0 14px 30px rgba(0,0,0,0.6); font-family: var(--f-mono); font-size: 12px; color: #a8f5c0; }
.lt-bar { background: var(--neon); color: #1a0510; padding: 5px 8px; font-weight: 700; font-size: 11px; }
.lt-body { padding: 10px; }
.lt-body canvas { width: 100%; height: auto; display: block; border: 1px solid #12301c; }
.lt-maps { margin: 8px 0; color: #6ab884; }
.lt-maps .ok { color: #4dffa0; }
.lt-sl { display: grid; grid-template-columns: 140px 1fr 120px; gap: 8px; align-items: center; margin: 6px 0; font-size: 12px; }
.settings .lt-sl { font-family: var(--f-ui); font-size: 14px; grid-template-columns: 200px minmax(120px, 360px) 80px; }
.lt-sl.dis { opacity: 0.35; }
.lt-sl input[type=range] { width: 100%; accent-color: var(--neon); }
.lt-sl b { font-weight: 400; text-align: right; }
.lt-note { color: #6ab884; }
.laptop .btn { font-family: var(--f-mono); font-size: 12px; background: #0f2416; border-color: #1f5a32; color: #a8f5c0; }

/* story */
.story { display: grid; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr); gap: 16px; flex: 1; min-height: 0; }
.chlist { display: flex; flex-direction: column; gap: 6px; overflow: auto; }
.chb { position: relative; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 10px 12px 10px 18px; display: grid; grid-template-columns: 1fr auto; }
.chb small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.chb b { font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.05; }
.chb i { font-style: normal; color: var(--dust); align-self: center; font-variant-numeric: tabular-nums; }
.chb .gangdot { position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 0 2px 2px 0; }
.chb.on { border-color: var(--bone); background: var(--panel-2); }
.chb.lock { opacity: 0.4; }
.evlist { overflow: auto; min-width: 0; padding-right: 4px; }
.chhead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
.chhead h2 { font-family: var(--f-display); font-weight: 900; font-size: 54px; margin: 0; line-height: 0.9; color: var(--dust); }
.chhead p { color: var(--muted); margin: 0; }
.evcard { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 8px 0; }
.evcard.boss { border-color: rgba(255, 61, 154, 0.5); box-shadow: inset 3px 0 0 var(--neon); }
.evcard.done { opacity: 0.75; }
.evcard.done .ev-t b::after { content: "  won"; font-family: var(--f-ui); font-size: 13px; color: var(--good); font-weight: 600; }
.evcard.lock { opacity: 0.35; }
.ev-por img { width: 64px; height: 64px; border-radius: 4px; display: block; }
.ev-ic { width: 64px; height: 64px; display: grid; place-items: center; background: var(--panel-2); border-radius: 4px; font-family: var(--f-display); font-size: 36px; font-weight: 900; color: var(--ice); }
.ev-t small { color: var(--muted); font-size: 12px; display: block; }
.ev-t b { font-family: var(--f-display); font-size: 26px; font-weight: 800; display: block; line-height: 1.05; }
.ev-t span { color: var(--bone); font-size: 14px; }
.ev-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.req { font-size: 12px; padding: 2px 7px; border-radius: 3px; border: 1px solid; }
.req.ok { color: var(--good); } .req.bad { color: var(--bad); }
.rw { font-family: var(--f-display); font-weight: 800; color: var(--dust); font-size: 20px; }

/* dialogue */
.dlg { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; padding: 0 16px max(24px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.65)); cursor: pointer; }
.dlg-box { position: relative; display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 18px; width: min(920px, 100%); background: rgba(14, 11, 20, 0.94); border: 1px solid var(--line); border-top: 2px solid var(--gc, var(--neon)); border-radius: 6px; padding: 16px 18px; box-shadow: 0 -8px 40px rgba(0,0,0,0.5); }
.dlg-por { width: 140px; height: 140px; border-radius: 4px; }
.dlg-n { font-family: var(--f-display); font-weight: 800; font-size: 28px; color: var(--gc, var(--neon)); line-height: 1; }
.dlg-n small { display: block; font-family: var(--f-ui); font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 3px; }
.dlg-t p { font-size: 19px; line-height: 1.45; margin: 10px 0; min-height: 3em; max-width: 64ch; }
.dlg-more { color: var(--muted); font-size: 12px; }
.dlg-skip { position: absolute; right: 10px; top: 10px; }
.choice { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; background: rgba(0,0,0,0.6); padding: 16px; }

.book-row { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: center; padding: 3px 6px; border-radius: 4px; }
