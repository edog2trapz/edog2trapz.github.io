<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primordial: Evolve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Primordial: Evolve. Full-window world canvas with HUD drawn on it and HTML menus over it. */
:root{--bg:#04121a;--text:#e6f3ee;--dim:#89a8a0;--ac:#7fffd4;--gold:#ffcc4d;--red:#ff5d6c;--line:#1f4f56;--display:"Cinzel",Georgia,serif;--ui:"Rajdhani","Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-weight:600;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;background:radial-gradient(ellipse at center,#0a2a33dd,#03100ff2);z-index:5}
.panel{width:min(1000px,100%);text-align:center}
h1{font-family:var(--display);font-weight:900;font-size:clamp(42px,8vw,96px);line-height:.95;margin:0;background:linear-gradient(180deg,#eafff6,#7fffd4 50%,#2ea88a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px #7fffd466)}
h2{font-family:var(--display);font-size:clamp(26px,4.5vw,44px);margin:0 0 6px}
.sub{color:var(--dim);font-size:18px;margin:10px auto 16px;max-width:680px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0}
.card{background:#0b262ccc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;transition:transform .12s,border-color .12s}
.card:hover:not(:disabled){transform:translateY(-3px);border-color:var(--ac)}
.card:disabled{opacity:.4;cursor:not-allowed}
.card b{font-family:var(--display);font-size:18px;display:block}
.card small{color:var(--dim);font-size:14px;display:block;line-height:1.35;margin-top:4px}
.card .tag{display:inline-block;font-size:11px;letter-spacing:.12em;padding:2px 7px;border-radius:4px;margin:6px 4px 0 0;background:#ffffff14}
.card .st{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:13px;margin-top:8px;color:#bfe9dc}
.btn{background:linear-gradient(135deg,#2ea88a,#7fffd4);border:0;border-radius:10px;padding:13px 28px;font-size:19px;font-weight:700;color:#03211a;box-shadow:0 0 24px #7fffd455}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.keys{color:var(--dim);font-size:14px;line-height:1.7;margin-top:14px}
.keys kbd{background:#0b262c;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--text);font-family:var(--ui)}
.back{position:fixed;left:14px;top:12px;color:var(--dim);font-size:14px;text-decoration:none;z-index:6}
.back:hover{color:var(--ac)}
.dna{color:var(--gold)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ov" id="ov"></div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), g = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function fit(){ DPR = Math.min(devicePixelRatio || 1, 2); VW = innerWidth; VH = innerHeight; cv.width = VW * DPR; cv.height = VH * DPR; }
addEventListener('resize', fit); fit();
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b, c, d) => Math.hypot(a - c, b - d), ang = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);
const adiff = (a, b) => { let d = (b - a) % 6.2832; if (d > 3.1416) d -= 6.2832; if (d < -3.1416) d += 6.2832; return d; };
const fmt = n => n >= 1e4 ? (n / 1e3).toFixed(1) + 'K' : Math.round(n).toString();

/* ================= world layout ================= */
const WW = 6000, WH = 3600, DEEP = 1000, SEA = 2300, BEACH = 2650;
const POOL = { w:2200, h:1400 };
const zoneAt = (x) => x < SEA ? 'sea' : x < BEACH ? 'beach' : 'land';

/* ================= species ================= */
const F = {
  bac:{ n:'Microbe', t:0, h:'pool', k:'cell', s:10, sp:150, hp:20, dm:5, c:'#9be564', nx:['fish1', 'amph', 'dfly'] },
  fish1:{ n:'Jawless Fish', t:1, h:'sea', k:'fish', s:16, sp:205, hp:45, dm:9, c:'#6ec6ff', nx:['plac'], d:'Leave the pool for the open sea. Hide in kelp.' },
  amph:{ n:'Salamander', t:1, h:'land', k:'walk', s:15, sp:180, hp:45, dm:9, c:'#c58a3a', nx:['rapt', 'cyn'], amph:true, d:'Crawl onto land. Swims nearly as well as it walks.' },
  dfly:{ n:'Giant Dragonfly', t:1, h:'sky', k:'bug', s:12, sp:235, hp:32, dm:7, c:'#6fe0c8', nx:['arch'], d:'Take to the air. Hide in clouds.' },
  plac:{ n:'Armored Placoderm', t:2, h:'sea', k:'fish', s:26, sp:205, hp:110, dm:22, c:'#4f8fd6', nx:['mega', 'mosa'], armor:.2, d:'Bone-plated jaws. Takes 20% less damage.' },
  rapt:{ n:'Raptor', t:2, h:'land', k:'walk', s:26, sp:240, hp:90, dm:22, c:'#d1783a', nx:['trex'], d:'Fast, vicious land hunter.' },
  cyn:{ n:'Cynodont', t:2, h:'land', k:'walk', s:22, sp:225, hp:80, dm:18, c:'#a98467', nx:['smil'], sense:1.8, d:'Warm-blooded, with a superb nose.' },
  arch:{ n:'Archaeopteryx', t:2, h:'sky', k:'bird', s:24, sp:265, hp:75, dm:19, c:'#ffc857', nx:['pter', 'arg'], d:'The first true flier.' },
  mega:{ n:'Megalodon', t:3, h:'sea', k:'shark', s:56, sp:245, hp:270, dm:50, c:'#8aa0b5', nx:['levi'], d:'Apex of the sea. Brutal bite.' },
  mosa:{ n:'Mosasaur', t:3, h:'sea', k:'long', s:58, sp:220, hp:350, dm:42, c:'#3f9f7a', nx:['levi'], d:'Armored sea serpent. Huge health.' },
  trex:{ n:'Tyrannosaur', t:3, h:'land', k:'rex', s:60, sp:210, hp:370, dm:60, c:'#b3412f', nx:['kaiju'], d:'Apex of the land. Crushing bite.' },
  smil:{ n:'Smilodon', t:3, h:'land', k:'walk', s:50, sp:270, hp:260, dm:48, c:'#d9a066', nx:['mammoth'], sense:1.8, d:'Fast saber-tooth ambusher.' },
  pter:{ n:'Quetzalcoatlus', t:3, h:'sky', k:'bird', s:58, sp:250, hp:260, dm:46, c:'#9b6bd0', nx:['thund'], d:'Giant of the skies.' },
  arg:{ n:'Argentavis', t:3, h:'sky', k:'bird', s:52, sp:285, hp:230, dm:42, c:'#d89b4a', nx:['thund'], d:'Fastest apex flier.' },
  levi:{ n:'Leviathan', t:4, h:'sea', k:'long', s:100, sp:255, hp:750, dm:95, c:'#2a6f9a', nx:['kraken'], ult:'wave', d:'Ultimate: Tidal Wave.' },
  kaiju:{ n:'Kaiju Rex', t:4, h:'land', k:'rex', s:105, sp:225, hp:850, dm:105, c:'#3c6b3a', nx:['titan'], ult:'breath', glow:'#9dff3a', d:'Ultimate: Atomic Breath.' },
  mammoth:{ n:'Titan Mammoth', t:4, h:'land', k:'mammoth', s:100, sp:215, hp:950, dm:90, c:'#8a6a4a', nx:['titan'], ult:'quake', d:'Ultimate: Earthquake.' },
  thund:{ n:'Thunderbird', t:4, h:'sky', k:'bird', s:95, sp:300, hp:640, dm:90, c:'#4da3ff', nx:['phoenix'], ult:'storm', glow:'#bff6ff', d:'Ultimate: Lightning Storm.' },
  kraken:{ n:'The Kraken', t:5, h:'sea', k:'kraken', s:160, sp:255, hp:1900, dm:175, c:'#9a2a5a', nx:[], ult:'vortex', d:'Mythic. Ultimate: Maelstrom.' },
  titan:{ n:'Primeval Titan', t:5, h:'land', k:'rex', s:170, sp:240, hp:2200, dm:195, c:'#2a3a4a', nx:[], ult:'breath', glow:'#5ee6ff', d:'Mythic. Ultimate: Atomic Breath.' },
  phoenix:{ n:'Phoenix', t:5, h:'sky', k:'bird', s:150, sp:330, hp:1600, dm:165, c:'#ff6a1a', nx:[], ult:'fire', fire:true, d:'Mythic. Ultimate: Firestorm. Rises from death once.' },
};
const EXTRA = [
  { n:'Algae speck', t:-1, h:'pool', k:'dot', s:4, sp:0, hp:1, dm:0, c:'#7fd66a' },
  { n:'Amoeba', t:0, h:'pool', k:'cell', s:7, sp:80, hp:8, dm:0, c:'#c7a0ff' },
  { n:'Paramecium', t:0, h:'pool', k:'cell', s:13, sp:120, hp:22, dm:4, c:'#6ecbd6' },
  { n:'Virus swarm', t:0, h:'pool', k:'virus', s:9, sp:150, hp:12, dm:6, c:'#ff6a8a', agg:true },
  { n:'Giant Rotifer', t:1, h:'pool', k:'cell', s:28, sp:105, hp:70, dm:10, c:'#e6b85c', agg:true },
  { n:'Krill', t:0, h:'sea', k:'fish', s:7, sp:120, hp:6, dm:0, c:'#ff9a8a' },
  { n:'Trilobite', t:0, h:'sea', k:'bug', s:10, sp:70, hp:14, dm:0, c:'#a08a6a' },
  { n:'Ammonite', t:1, h:'sea', k:'cell', s:16, sp:110, hp:30, dm:4, c:'#e0b080' },
  { n:'Beetle', t:0, h:'land', k:'bug', s:8, sp:90, hp:8, dm:0, c:'#5a4a3a' },
  { n:'Lizard', t:1, h:'land', k:'walk', s:12, sp:180, hp:25, dm:4, c:'#7a9a3a' },
  { n:'Mosquito cloud', t:0, h:'sky', k:'bug', s:6, sp:160, hp:5, dm:0, c:'#9a9a9a' },
  { n:'Triceratops', t:3, h:'land', k:'mammoth', s:62, sp:150, hp:420, dm:40, c:'#7a8a5a', agg:false, tough:true },
  { n:'Brachiosaur', t:4, h:'land', k:'mammoth', s:110, sp:110, hp:900, dm:50, c:'#6a8a7a', agg:false, tough:true },
];
for (const k in F) F[k].key = k;
const SPECIES = [...Object.values(F).filter(f => f.t > 0), ...EXTRA];
const ALPHA_NAMES = ['Scarjaw', 'Old Grandfather', 'The Pale Queen', 'Ironhide', 'Skyreaver', 'Bonecrusher', 'Mother of Teeth', 'The Grey Ghost'];
const MUTS = [
  { k:'jaws', ico:'🦷', n:'Bigger Jaws', d:'+25% bite damage.', max:3 },
  { k:'armor', ico:'🛡', n:'Bone Armor', d:'−15% damage taken.', max:3 },
  { k:'speed', ico:'💨', n:'Sleek Body', d:'+12% speed.', max:3 },
  { k:'regen', ico:'💚', n:'Regeneration', d:'Heal 1.5% of max health per second.', max:2 },
  { k:'venom', ico:'🧪', n:'Venom', d:'Bites poison prey.', max:2 },
  { k:'spikes', ico:'🦔', n:'Spikes', d:'Anything that bites you takes damage back.', max:2 },
  { k:'camo', ico:'🍃', n:'Camouflage', d:'Predators notice you 40% later.', max:1 },
  { k:'amph', ico:'🐸', n:'Amphibious', d:'No penalty for leaving your habitat.', max:1 },
  { k:'electro', ico:'⚡', n:'Electric Organ', d:'Your dash shocks everything nearby.', max:1 },
  { k:'growth', ico:'🌱', n:'Rapid Growth', d:'+30% growth from every meal.', max:2 },
  { k:'nose', ico:'👃', n:'Keen Senses', d:'Sense lasts longer and reaches twice as far.', max:1 },
  { k:'metab', ico:'🍖', n:'Iron Stomach', d:'Hunger drains 40% slower.', max:2 },
];

/* ================= state ================= */
const SAVE = 'primordial.v2';
let rec = { bestTier:0, wins:0 };
try { rec = Object.assign(rec, JSON.parse(localStorage.getItem(SAVE)) || {}); } catch (e){}
const saveRec = () => { try { localStorage.setItem(SAVE, JSON.stringify(rec)); } catch (e){} };
let mode = 'menu', stage = 'pool', P = null, C = [], FX = [], TXT = [], HZ = [], cover = [], clouds = [], food = [];
let T = 0, cam = { x:0, y:0, z:1 }, shake = 0, paused = false, evt = null, evT = 140, ext = null, alphaT = 0, banner = null, dayT = 0;
const keys = new Set(); let mxs = 0, mys = 0, mdown = false;
const M = k => (P && P.mut[k]) || 0;

function newGame(){
  stage = 'pool'; T = 0; dayT = 0; evt = null; evT = 140; ext = null; alphaT = 0; banner = null; C = []; FX = []; TXT = []; HZ = []; food = [];
  P = { f:'bac', x:POOL.w / 2, y:POOL.h / 2, a:0, vx:0, vy:0, hp:20, hunger:100, grow:0, dna:0, eggs:1, mut:{}, cds:{}, dashT:0, biteT:0, bite:0, senseT:0, inv:0, poison:0, lastBite:-9, kills:0, reborn:false, best:0 };
  P.hp = maxHp();
  for (let i = 0; i < 280; i++) food.push({ x:rnd(30, POOL.w - 30), y:rnd(30, POOL.h - 30), r:rnd(3, 5) });
  cover = []; clouds = [];
  mode = 'play'; $('#ov').hidden = true;
  banner = { t:0, txt:'THE PRIMORDIAL POOL', sub:'Eat what is smaller. Flee what is bigger. Grow.' };
}
function buildWorld(){
  cover = [];
  for (let i = 0; i < 60; i++) cover.push({ k:'kelp', x:rnd(150, SEA - 150), y:rnd(150, WH - 150), r:rnd(70, 150), s:Math.random() });
  for (let i = 0; i < 70; i++) cover.push({ k:'bush', x:rnd(BEACH + 120, WW - 150), y:rnd(150, WH - 150), r:rnd(60, 130), s:Math.random() });
  clouds = [];
  for (let i = 0; i < 40; i++) clouds.push({ x:rnd(0, WW), y:rnd(0, WH), r:rnd(110, 230), s:Math.random() });
}
const form = () => F[P.f];
const maxHp = () => form().hp;
const pSize = () => form().s * (.7 + .3 * P.grow / 100);
const tier = () => form().t;

/* ================= input ================= */
cv.addEventListener('mousemove', e => { mxs = e.clientX; mys = e.clientY; });
cv.addEventListener('mousedown', e => { audio(); if (e.button === 0){ mdown = true; bite(); } });
addEventListener('mouseup', e => { if (e.button === 0) mdown = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys.add(k); audio();
  if (mode !== 'play') return;
  if (k === ' '){ e.preventDefault(); dash(); }
  if (k === 'q') sense(); if (k === 'e') roar(); if (k === 'r') ult();
  if (k === 'f' && P.grow >= 100) evolveMenu();
  if (k === 'm') mutMenu();
  if (k === 'escape') pauseMenu();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => { keys.clear(); mdown = false; });
const s2w = (sx, sy) => [(sx - VW / 2) / cam.z + cam.x, (sy - VH / 2) / cam.z + cam.y];
const w2s = (x, y) => [(x - cam.x) * cam.z + VW / 2, (y - cam.y) * cam.z + VH / 2];

/* ================= player actions ================= */
function cdReady(k){ return !(P.cds[k] > 0); }
function bite(){
  if (mode !== 'play' || paused || P.biteT > 0) return;
  P.biteT = .42; P.bite = .2; P.lastBite = T;
  const [wx, wy] = s2w(mxs, mys), a = ang(P.x, P.y, wx, wy), s = pSize();
  P.vx += Math.cos(a) * form().sp * .9; P.vy += Math.sin(a) * form().sp * .9;
  let hit = false;
  for (const c of C){
    if (c.dead) continue;
    const d = dist(P.x, P.y, c.x, c.y);
    if (d < (s + c.s) * 1.25 + 10 && Math.abs(adiff(a, ang(P.x, P.y, c.x, c.y))) < 1.1){
      const dmg = form().dm * (1 + .25 * M('jaws')) * (Math.random() < .1 ? 2 : 1) * (c.stun > 0 ? 1.4 : 1);
      hurtC(c, dmg, true); hit = true;
      if (M('venom')) c.poison = 4;
    }
  }
  sfx(hit ? 'chomp' : 'snap');
}
function dash(){
  if (!cdReady('dash')) return;
  P.cds.dash = 2.4; P.dashT = .28; P.inv = Math.max(P.inv, .3);
  const [wx, wy] = s2w(mxs, mys), a = ang(P.x, P.y, wx, wy); P.vx = Math.cos(a) * form().sp * 3.2; P.vy = Math.sin(a) * form().sp * 3.2;
  if (M('electro')){ const r = 140 + pSize() * 2.5; for (const c of C) if (dist(P.x, P.y, c.x, c.y) < r){ hurtC(c, form().dm * .6, true); c.stun = 1; } FX.push({ k:'zap', x:P.x, y:P.y, t:0, life:.35, r }); }
  sfx('dash');
}
function sense(){
  if (tier() < 2){ text(P.x, P.y - pSize() - 20, 'Sense unlocks at tier 2', '#89a8a0'); return; }
  if (!cdReady('sense')) return; P.cds.sense = 9; P.senseT = 5 + 4 * M('nose'); sfx('sense');
}
function roar(){
  if (tier() < 3){ text(P.x, P.y - pSize() - 20, 'Roar unlocks at tier 3', '#89a8a0'); return; }
  if (!cdReady('roar')) return; P.cds.roar = 12;
  const s = pSize(), r = 320 + s * 3;
  for (const c of C){ const d = dist(P.x, P.y, c.x, c.y); if (d > r) continue; if (c.s < s){ c.stun = 2.6; } else { c.fear = 3; } }
  FX.push({ k:'roar', x:P.x, y:P.y, t:0, life:.7, r }); shake = 12; sfx('roar');
}
function ult(){
  const u = form().ult; if (!u){ text(P.x, P.y - pSize() - 20, 'Ultimates unlock at tier 4', '#89a8a0'); return; }
  if (!cdReady('ult')) return; P.cds.ult = 24;
  const s = pSize(), dm = form().dm, [wx, wy] = s2w(mxs, mys);
  banner = { t:0, txt:({ wave:'TIDAL WAVE', breath:'ATOMIC BREATH', quake:'EARTHQUAKE', storm:'LIGHTNING STORM', vortex:'MAELSTROM', fire:'FIRESTORM' })[u], small:true };
  shake = 20; sfx('ult');
  if (u === 'wave' || u === 'fire'){ HZ.push({ k:u, x:P.x, y:P.y, t:0, life:1.6, r:0, max:700 + s * 2, dmg:dm * 3, hit:new Set() }); }
  if (u === 'quake'){ const r = 520 + s; for (const c of C) if (dist(P.x, P.y, c.x, c.y) < r){ hurtC(c, dm * 2.6, true); c.stun = 3; } FX.push({ k:'quake', x:P.x, y:P.y, t:0, life:1, r }); }
  if (u === 'storm'){ const tg = C.filter(c => dist(P.x, P.y, c.x, c.y) < 900).sort((a, b) => dist(P.x, P.y, a.x, a.y) - dist(P.x, P.y, b.x, b.y)).slice(0, 12); tg.forEach((c, i) => setTimeout(() => { if (c.dead) return; FX.push({ k:'bolt', x:c.x, y:c.y, t:0, life:.35 }); hurtC(c, dm * 2.2, true); c.stun = 1.5; sfx('zap'); }, i * 110)); }
  if (u === 'breath') P.breath = { t:0, life:1.8 };
  if (u === 'vortex') HZ.push({ k:'vortex', x:wx, y:wy, t:0, life:4.5, r:460, dmg:dm * 1.4 });
}

/* ================= damage & rewards ================= */
function hurtC(c, d, byPlayer){
  if (c.dead) return;
  c.hp -= d; c.flash = .12; c.lastHit = byPlayer ? T : c.lastHit;
  if (byPlayer){ text(c.x, c.y - c.s - 6, fmt(d), '#fff', 15); for (let i = 0; i < 5; i++) FX.push({ k:'blood', x:c.x, y:c.y, vx:rnd(-90, 90), vy:rnd(-90, 90), t:0, life:.5, col:c.sp.k === 'cell' || c.sp.k === 'virus' ? c.sp.c : '#c2273a' }); if (c.sp.agg !== false && c.s >= pSize() * .7) c.tgt = 'P'; else c.fear = 2.5; }
  if (c.hp <= 0){ c.dead = true; if (byPlayer || T - (c.lastHit || -99) < 3) eat(c); }
}
function eat(c){
  const s = pSize(), rel = c.s / s;
  P.kills++;
  P.hunger = Math.min(100, P.hunger + clamp(28 * rel, 4, 60));
  P.hp = Math.min(maxHp(), P.hp + maxHp() * clamp(.12 * rel, .02, .4));
  const gain = clamp(16 * Math.pow(rel, 1.2), 1.5, 45) * (1 + .3 * M('growth')) * (evt && evt.k === 'frenzy' ? 1.5 : 1) * (c.alpha ? 3 : 1);
  P.grow = Math.min(100, P.grow + gain);
  const dna = Math.max(1, Math.round(c.s * .5 + (c.sp.t + 1) * 3)) * (c.alpha ? 6 : 1);
  P.dna += dna;
  text(c.x, c.y - c.s - 18, `+${dna} DNA`, '#ffcc4d', 16);
  if (c.alpha){ banner = { t:0, txt:`${c.name.toUpperCase()} IS DEAD`, sub:`+${dna} DNA. Your lineage grows stronger.` }; sfx('win'); }
  if (c.boss){ winGame('slain'); }
  if (P.grow >= 100 && !P.readyShown){ P.readyShown = true; text(P.x, P.y - s - 40, 'EVOLUTION READY: PRESS F', '#7fffd4', 22); sfx('ready'); }
}
function hurtP(d, src){
  if (P.inv > 0 || mode !== 'play') return;
  d *= (1 - .15 * M('armor')) * (1 - (form().armor || 0));
  P.hp -= d; P.inv = .35; shake = Math.max(shake, 6);

     zap:() => noise(.12, .15, 4000), boom:() => { noise(.6, .3, 300); tone(55, .5, 'sine', .15, 30); }, event:() => { tone(110, 1, 'sawtooth', .06, 70); tone(165, 1, 'sawtooth', .05, 110, .15); },
     ready:() => [523, 659, 784].forEach((f, i) => tone(f, .25, 'triangle', .06, 0, i * .09)), evolve:() => [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', .07, 0, i * .08)),
