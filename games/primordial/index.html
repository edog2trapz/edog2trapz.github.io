<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="Primordial: Evolve. Begin as a single cell and evolve through 40 procedurally animated forms on a living island. Design your species, raise a brood, hunt legends and survive the extinction.">
<meta name="theme-color" content="#04121a">
<link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<title>Primordial: Evolve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-window world canvas with the HUD painted on it; menus float over a dimmed view of the living world. */
:root{--bg:#04121a;--text:#e6f3ee;--dim:#89a8a0;--ac:#7fffd4;--gold:#ffcc4d;--red:#ff5d6c;--line:#1f4f56;--card:#0b262ccc;--display:"Cinzel",Georgia,serif;--ui:"Rajdhani","Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-weight:600;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{display:block;width:100%;height:100%;cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;background:radial-gradient(ellipse at center,#0a2a33dd,#03100ff2);z-index:5;touch-action:pan-y}
.ov>.panel{margin:auto}
.panel{width:min(1040px,100%);text-align:center;padding:10px 0}
.panel.wide{width:min(1200px,100%)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(46px,9vw,108px);line-height:.95;margin:0;background:linear-gradient(180deg,#eafff6,#7fffd4 50%,#2ea88a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px #7fffd466)}
.evolve-sub{color:#7fffd4;font-size:clamp(18px,3vw,28px)!important;letter-spacing:.3em}
h2{font-family:var(--display);font-size:clamp(24px,4.5vw,42px);margin:0 0 6px}
h2.gold{color:var(--gold)}h2.red{color:var(--red)}
h4{font-family:var(--display);margin:10px 0 6px;color:var(--ac);font-size:14px;letter-spacing:.12em}
h4.tier{text-align:left;margin-top:18px}
.sub{color:var(--dim);font-size:18px;margin:10px auto 16px;max-width:720px;line-height:1.4}.sub.small{font-size:15px}
.ac{color:var(--ac)}.dna{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}
.grid.mut{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;transition:transform .12s,border-color .12s,box-shadow .12s}
.card:hover:not(:disabled){transform:translateY(-3px);border-color:var(--ac);box-shadow:0 8px 30px #7fffd422}
.card:disabled{opacity:.4;cursor:not-allowed}
.card canvas{display:block;width:100%;height:auto;border-radius:10px;background:radial-gradient(ellipse at center,#14424a,#071c22);margin-bottom:8px}
.card b{font-family:var(--display);font-size:18px;display:block}
.card small{color:var(--dim);font-size:14px;display:block;line-height:1.35;margin-top:4px}
.card small.ab{color:#bfe9dc;margin-top:8px}
.tag{display:inline-block;font-size:11px;letter-spacing:.1em;padding:2px 7px;border-radius:4px;margin:6px 4px 0 0;background:#ffffff14}
.tag.gold{color:var(--gold)}.tag.warn{color:#ff9a8a}
.card .st{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:13px;margin-top:8px;color:#bfe9dc}
.btn{background:linear-gradient(135deg,#2ea88a,#7fffd4);border:0;border-radius:12px;padding:13px 26px;font-size:19px;font-weight:700;color:#03211a;box-shadow:0 0 24px #7fffd455;transition:filter .12s,transform .08s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn small{font-size:13px;opacity:.75;margin-left:4px}
.btn.ghost{background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.sm{padding:9px 16px;font-size:16px}.btn.warn{color:#ff9a8a}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.keys{color:var(--dim);font-size:14px;line-height:1.9;margin-top:16px}
.keys kbd{background:#0b262c;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--text);font-family:var(--ui)}
.back{position:fixed;left:14px;top:12px;color:var(--dim);font-size:15px;text-decoration:none;z-index:6}.back:hover{color:var(--ac)}
.bigprev{width:min(640px,100%);height:auto;border-radius:16px;background:radial-gradient(ellipse at center,#16505a,#061a20);border:1px solid var(--line)}
.design{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin-top:8px}
.sw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:360px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent}.swatch.on{border-color:#fff;box-shadow:0 0 12px #7fffd4}
.pbtn{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:6px 12px;text-transform:capitalize}.pbtn.on{border-color:var(--ac);color:var(--ac)}
input#sname{background:#0b262c;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:18px;color:var(--text);font-family:var(--display);text-align:center;width:260px;user-select:text;-webkit-user-select:text}
.lineage{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:12px 0}.lineage div{display:flex;flex-direction:column;align-items:center}.lineage canvas{width:120px;height:64px;border-radius:10px;background:#0b262c}.lineage span{color:var(--ac);font-size:22px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cx{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center}.cx canvas{width:100%;height:auto;border-radius:8px;background:radial-gradient(ellipse at center,#14424a,#071c22)}.cx b{font-family:var(--display);font-size:14px;margin-top:4px}.cx small{color:var(--dim);font-size:12px}.cx.off b{color:var(--dim)}
.achs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;text-align:left;margin:14px 0}.ach{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;opacity:.5}.ach.on{opacity:1;border-color:#ffcc4d66}.ach span{font-size:24px}.ach b{display:block;font-family:var(--display)}.ach small{color:var(--dim)}
.sets{display:flex;flex-direction:column;gap:12px;align-items:center;font-size:18px;margin:14px 0}.sets input{width:20px;height:20px;accent-color:var(--ac);vertical-align:middle;margin-right:8px}
.help{max-width:760px;text-align:left}.help h2{text-align:center}.help p{color:#cfe6e0;font-size:17px;line-height:1.45}.help .g{color:#78ffa0}.help .y{color:#ffd250}.help .r{color:#ff5a64}
.spin{width:54px;height:54px;margin:20px auto;border:4px solid #7fffd433;border-top-color:#7fffd4;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* touch controls */
#touch{position:fixed;inset:0;pointer-events:none;z-index:4}
.tb{position:absolute;pointer-events:auto;width:70px;height:70px;border-radius:50%;background:rgba(8,40,46,.62);border:2px solid rgba(127,255,212,.45);color:#e6f3ee;font-size:24px;font-weight:700;backdrop-filter:blur(3px);touch-action:none}
.tb:active{background:rgba(127,255,212,.35)}
.tb.sm{width:50px;height:50px;font-size:19px}
.tb.big{right:22px;bottom:22px;width:92px;height:92px;font-size:36px;border-color:#ff8a95}
.tb.evo{left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);width:auto;height:auto;border-radius:30px;padding:12px 22px;font-family:var(--display);font-size:18px;background:linear-gradient(135deg,#2ea88a,#7fffd4);color:#03211a;animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 30px #7fffd4}}
@media (max-width:640px){.sub{font-size:16px}.btn{padding:11px 18px;font-size:17px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch" hidden></div>
<div class="ov" id="ov"></div>
<script src="js/data.js"></script>
<script src="js/body.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
