<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Hungry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* PC command-centre layout: top resource bar / left command tabs / centre map / right intel panel / bottom ticker.
     Single dark imperial world: ink black, imperial violet for your empire, gold for command, red for war. */
  --ink:#08070d;
  --panel:#110f1b;
  --panel-2:#191626;
  --line:#2b2642;
  --text:#ece7f6;
  --muted:#968cb0;
  --gold:#e8b64c;
  --violet:#7c5cff;
  --red:#ff4d5e;
  --volt:#5ee6ff;
  --green:#5ef08a;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --ui:"Rajdhani","Segoe UI","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--ui);font-weight:600;font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{font:inherit;color:inherit;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2f2948;border-radius:5px}::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-rows:58px 1fr 30px}

/* Top bar */
#top{display:flex;align-items:stretch;gap:8px;padding:7px 10px;background:linear-gradient(#15122a,#0c0a14);border-bottom:1px solid var(--line);position:relative}
#top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.brand{display:flex;flex-direction:column;justify-content:center;padding:0 10px 0 4px;min-width:150px}
.brand b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.06em;line-height:1;color:var(--gold)}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.tstat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 10px;display:flex;flex-direction:column;justify-content:center;min-width:120px}
.tstat .l{font-size:10.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.tstat b{font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tstat small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#tCash b{color:#ffd98a}#tEnergy b{color:var(--volt)}#tMil b{color:#c9b8ff}
.mbar{height:4px;background:#0008;border-radius:2px;overflow:hidden;margin-top:2px}
.mbar i{display:block;height:100%;width:0;background:var(--volt);transition:width .25s}
#tTension .mbar i{background:linear-gradient(90deg,var(--gold),var(--red))}
#tUni{flex:1;min-width:250px}
#tUni b{color:#f3e9ff;font-size:17px}
#tUni .mbar{height:6px}
#tUni .mbar i{background:linear-gradient(90deg,#3b2a8c,var(--violet),#ff9bd2)}
.tbtns{display:flex;gap:6px;align-items:center}
.tbtns button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 11px;height:100%;color:var(--muted);font-size:13px}
.tbtns button:hover{color:var(--text);border-color:#4a4170}
.tbtns button.on{color:var(--gold);border-color:var(--gold)}

/* Main */
#main{display:grid;grid-template-columns:330px 1fr 350px;min-height:0}
#left,#right{background:var(--panel);min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
#ltabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
#ltabs button{padding:10px 2px 9px;font-size:12.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;border-bottom:2px solid transparent}
#ltabs button:hover{color:var(--text)}
#ltabs button.on{color:var(--gold);border-bottom-color:var(--gold);background:#1a1628}
#ltabs kbd{display:block;font-size:9.5px;color:#5c5478;font-family:var(--ui)}
.pane{flex:1;overflow-y:auto;padding:12px 12px 24px}
h2.ph{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.05em;margin:2px 0 6px;color:var(--text)}
p.sub{color:var(--muted);font-size:13.5px;margin:0 0 10px;line-height:1.3;font-weight:500}
h3.sec{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:16px 0 7px;font-weight:700}
.list{display:flex;flex-direction:column;gap:6px}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px;display:grid;grid-template-columns:46px 1fr auto;gap:9px;align-items:center}
.card .ic{font-size:24px;text-align:center;line-height:1}
.card .ic canvas{display:block;margin:0 auto}
.card h4{margin:0;font-size:15px;font-weight:700;line-height:1.1}
.card p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.25;font-weight:500}
.card p b{color:var(--text);font-weight:700}
.card .lv{font-size:10px;color:var(--gold);letter-spacing:.12em}
.card.locked{opacity:.45}
.card.wide{grid-template-columns:46px 1fr}
.btn{background:var(--gold);color:#16110a;border-radius:5px;padding:6px 9px;font-size:13px;font-weight:700;white-space:nowrap;text-align:center}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{background:#2a2538;color:#6d6488;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.red{background:var(--red);color:#fff}
.btn.violet{background:var(--violet);color:#fff}
.btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.btns .btn{padding:5px 7px;font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}
.kv span{color:var(--muted)}
.kv b{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;background:#0006;border:1px solid var(--line);border-radius:12px;padding:1px 8px;white-space:nowrap}
button.chip:hover{border-color:var(--gold)}
.pill{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:3px;font-weight:700}
.pill.you{background:var(--violet);color:#fff}.pill.foe{background:#3a2430;color:#ff9aa5}.pill.alien{background:#173a24;color:var(--green)}.pill.gold{background:var(--gold);color:#16110a}

/* Centre */
#center{position:relative;min-width:0;min-height:0;overflow:hidden;background:#060a14}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#map.drag{cursor:grabbing}
#views{position:absolute;top:10px;left:10px;display:flex;gap:4px;z-index:4}
#views button{background:#0d0b16e6;border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:12.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
#views button.on{color:var(--gold);border-color:var(--gold)}
#views button:disabled{opacity:.35;cursor:default}
#views kbd{font-family:var(--ui);color:#5c5478;margin-right:4px}
#zoomer{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;z-index:4}
#zoomer button{width:32px;height:32px;background:#0d0b16e6;border:1px solid var(--line);border-radius:5px;font-size:17px;color:var(--muted)}
#zoomer button:hover{color:var(--gold)}
#banner{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:#0d0b16f0;border:1px solid var(--gold);border-radius:6px;padding:9px 16px;font-family:var(--display);font-size:15px;letter-spacing:.05em;z-index:4;text-align:center;pointer-events:none}
#tip{position:absolute;pointer-events:none;background:#0b0914f2;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;z-index:6;min-width:150px;box-shadow:0 8px 20px #000a;line-height:1.3}
#tip b{font-size:14px}
#tip .m{color:var(--muted);font-size:12px}
#alerts{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:5;width:300px}
.alert{background:#1d0d14f2;border:1px solid var(--red);border-radius:7px;padding:8px 10px;font-size:13px;box-shadow:0 8px 24px #000b;animation:tin .25s}
.alert.alien{background:#0d1d13f2;border-color:var(--green)}
.alert b{display:block;font-size:13.5px;color:#ffb3bb;margin-bottom:2px}
.alert.alien b{color:var(--green)}
.alert .tb{height:3px;background:#0008;border-radius:2px;margin:6px 0;overflow:hidden}
.alert .tb i{display:block;height:100%;background:var(--red)}
.alert .btns{justify-content:flex-start}
#toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:6;pointer-events:none;width:min(560px,90%)}
.toast{background:#0d0b16f2;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:7px 12px;font-size:14px;box-shadow:0 8px 20px #000a;animation:tin .2s;line-height:1.25;text-align:center}
.toast.bad{border-left-color:var(--red)}.toast.good{border-left-color:var(--green)}.toast.out{opacity:0;transition:opacity .3s}
#loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:8;background:#060a14;text-align:center;padding:20px}
#loader h2{font-family:var(--display);font-size:22px;margin:0;color:var(--gold)}
#loader p{color:var(--muted);margin:0;max-width:52ch;line-height:1.35}

/* Right intel */
#intel{flex:1;overflow-y:auto;padding:12px 12px 24px}
.ihead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.badge{min-width:44px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:.06em;border:1px solid var(--line);background:#0006}
.ihead h2{font-family:var(--display);font-weight:800;font-size:19px;margin:0;line-height:1.05;text-wrap:balance}
.odds{margin:8px 0;padding:8px 10px;border-radius:6px;background:#0005;border:1px solid var(--line);font-size:13.5px;line-height:1.3}
.odds b{font-size:15px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.acts .btn{padding:8px 6px;font-size:13px;white-space:normal;line-height:1.15}
.acts .btn kbd{opacity:.6;font-family:var(--ui);margin-left:4px;font-size:11px}
.acts .full{grid-column:1/-1}
.note{font-size:12.5px;color:var(--muted);line-height:1.3;margin:6px 0 0;font-weight:500}
.note.warn{color:#ffb3bb}
.flav{font-size:13.5px;font-style:italic;color:#bdb2d8;line-height:1.35;margin:8px 0;font-weight:500}

#ticker{display:flex;align-items:center;gap:10px;padding:0 12px;background:#0b0914;border-top:1px solid var(--line);font-size:13px;color:var(--muted);overflow:hidden;white-space:nowrap}
#ticker .k{color:var(--gold);font-family:var(--display);font-weight:800;letter-spacing:.08em;font-size:12px}
#tickerTxt{overflow:hidden;text-overflow:ellipsis}

/* Battle */
#battle{position:fixed;inset:0;background:#030207;z-index:20;display:grid;grid-template-rows:62px 1fr 92px}
.b-top{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;padding:8px 16px;background:linear-gradient(#140f22,#07060c);border-bottom:1px solid var(--line)}
.b-side{display:flex;flex-direction:column;gap:3px}
.b-side.foe{text-align:right}
.b-side .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.b-side .hb{height:10px;background:#0009;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.b-side .hb i{display:block;height:100%;background:linear-gradient(90deg,#4b37b0,var(--violet));transition:width .15s}
.b-side.foe .hb i{background:linear-gradient(90deg,#a3202f,var(--red));margin-left:auto}
.b-side b{font-size:13px;font-variant-numeric:tabular-nums}
.b-title{text-align:center}
.b-title div{font-size:11px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.b-title h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0;line-height:1.1}
#bwrap{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
#bc{display:block;width:100%;height:100%}
#bLine{position:absolute;left:16px;bottom:14px;max-width:min(560px,60%);background:#0b0914e6;border:1px solid var(--gold);border-radius:6px;padding:8px 12px 8px 46px;font-family:var(--display);font-size:15px;line-height:1.3;opacity:0;transition:opacity .3s;pointer-events:none}
#bLine.show{opacity:1}
#bLine::before{content:"♚";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--gold)}
.b-bar{display:flex;gap:8px;align-items:stretch;padding:10px 16px;background:linear-gradient(#0b0914,#140f22);border-top:1px solid var(--line)}
.ab{position:relative;flex:1;max-width:150px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;padding:4px}
.ab:hover:not(:disabled){border-color:var(--gold)}
.ab .s{font-size:24px;line-height:1;color:var(--gold)}
.ab .n{font-size:12.5px;font-weight:700;white-space:nowrap}
.ab .c{font-size:11px;color:var(--volt);white-space:nowrap}
.ab kbd{position:absolute;top:3px;left:6px;font-family:var(--ui);font-size:11px;color:#6d6488}
.ab .cd{position:absolute;left:0;right:0;bottom:0;background:#000a;pointer-events:none}
.ab:disabled{opacity:.5;cursor:default}
.ab.mate{border-color:var(--gold);background:linear-gradient(#2a2010,#191626)}
.ab.mate.ready{animation:glow 1s infinite alternate}
.ab.mate .fill{position:absolute;left:0;bottom:0;height:4px;background:var(--gold)}
.b-right{margin-left:auto;display:flex;gap:8px}
.stances{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:150px;flex:none}
.stances button{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;font-size:11px;line-height:1.1;padding:2px 4px;text-align:left;color:var(--muted)}
.stances button.on{border-color:var(--gold);color:var(--gold);background:#2a2010}
.stances button kbd{font-family:var(--ui);opacity:.6;margin-right:3px}
.b-right .btn{padding:0 14px;font-size:13.5px}
#bResult{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000b;z-index:3}
#bResult .box{background:#0f0c1a;border:1px solid var(--gold);border-radius:10px;padding:22px 26px;width:min(520px,92%);text-align:center;box-shadow:0 20px 60px #000}
#bResult h2{font-family:var(--display);font-size:34px;margin:0 0 4px;letter-spacing:.08em}
#bResult .sub{color:var(--muted);margin-bottom:12px}
#bResult ul{list-style:none;padding:0;margin:0 0 16px;text-align:left;font-size:14px;line-height:1.5;max-height:180px;overflow:auto}

/* Modal */
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
#modal.open{display:flex}
.memo{background:#f1ead8;color:#1d1726;width:min(520px,100%);max-height:calc(100% - 30px);overflow-y:auto;border-radius:3px;box-shadow:0 30px 80px #000;animation:drop .3s cubic-bezier(.2,1.3,.4,1);font-weight:500}
.memo .sealbar{height:8px;background:linear-gradient(90deg,#3b2a8c,var(--violet),var(--gold),var(--violet),#3b2a8c)}
.memo .meta{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.16em;color:#77698f;padding:14px 22px 0;font-weight:700}
.memo .big{font-size:46px;text-align:center;margin:8px 0 0;line-height:1}
.memo h2{font-family:var(--display);font-weight:800;font-size:25px;margin:8px 22px 8px;line-height:1.1;text-wrap:balance}
.memo .body{padding:0 22px;font-size:16px;line-height:1.4}
.memo .body p{margin:0 0 9px}
.memo .body ul{margin:4px 0 10px;padding-left:20px}
.memo .body .era{font-family:var(--display);font-weight:800;background:#1d1726;color:var(--gold);padding:8px 12px;border-radius:3px;margin:6px 0 10px;letter-spacing:.04em}
.memo .body kbd{background:#1d1726;color:#f1ead8;border-radius:3px;padding:0 5px;font-family:var(--ui);font-size:13px}
.memo .body table{width:100%;border-collapse:collapse;font-size:14px}
.memo .body td{padding:3px 4px;border-bottom:1px solid #d8cfb8}
.memo .actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 22px 18px;flex-wrap:wrap}
.memo .actions button{font-family:var(--display);font-weight:800;background:#1d1726;color:var(--gold);padding:10px 16px;border-radius:3px;font-size:14px;letter-spacing:.04em}
.memo .actions button.alt{background:transparent;color:#1d1726;border:2px solid #1d1726}
.memo input{background:#fff;color:#1d1726;border-color:#bfb39a;width:100%;font-size:16px;margin:4px 0 8px}

.memo select{background:#fff;color:#1d1726;border:1px solid #bfb39a;border-radius:4px;width:100%;font:inherit;font-size:15px;padding:5px 8px;margin:4px 0 8px}

/* War room, leader */
#ltabs{grid-template-columns:repeat(4,1fr)}
#ltabs button{padding:7px 2px 6px;font-size:11.5px}
.acts .btn small{display:block;font-size:11px;opacity:.8;font-weight:600}
.front{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px}
.front.hot{border-color:#7a2a36;box-shadow:inset 0 0 0 1px #ff4d5e33}
.front .fh{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.front .fh b{font-size:14.5px}
.front .fh span{font-size:12px;color:var(--muted);text-align:right}
.tug{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#4a1820,#a3202f);margin:6px 0 4px;overflow:hidden;border:1px solid #0008}
.tug i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3b2a8c,var(--violet));transition:width .3s}
.tug::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--gold)}
.front .fs{font-size:12.5px;color:var(--muted);font-weight:500;line-height:1.35}
.front .fs b{color:var(--text)}
.front .btns{justify-content:flex-start;margin-top:6px;align-items:center}
.share{display:inline-flex;align-items:center;gap:3px;background:#0005;border:1px solid var(--line);border-radius:5px;padding:2px 3px;font-size:12.5px}
.share b{min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.share button{width:22px;height:22px;border-radius:4px;background:var(--panel);color:var(--gold);font-weight:700}
.share button:disabled{opacity:.35;cursor:default}
.xp{height:6px;background:#0008;border-radius:3px;overflow:hidden;margin:6px 0 4px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe9a8)}
.hero{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;margin-bottom:4px}
.hero canvas{display:block;background:radial-gradient(circle at 50% 40%,#2a2150,#0b0914);border:1px solid var(--gold);border-radius:8px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;text-align:left;width:100%}
.tog .sw{width:38px;height:20px;border-radius:10px;background:#2a2538;position:relative;flex:none}
.tog .sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#6d6488;transition:left .15s}
.tog.on{border-color:var(--gold)}.tog.on .sw{background:var(--gold)}.tog.on .sw::after{left:20px;background:#16110a}
.tog small{display:block;color:var(--muted);font-weight:500;font-size:12px;line-height:1.25;margin-top:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

/* Admin console */
#admin{position:fixed;top:64px;right:10px;width:400px;max-width:calc(100% - 20px);max-height:calc(100% - 76px);overflow:auto;background:#0d0a16f7;border:1px solid var(--red);border-radius:10px;z-index:45;box-shadow:0 20px 60px #000;padding:0 0 14px}
.adm-h{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:linear-gradient(90deg,#3a0d18,#1a0d24);border-bottom:1px solid var(--red);font-family:var(--display);font-weight:800;letter-spacing:.08em;color:#ffb3bb}
.adm-h button{color:var(--muted);font-size:18px}
#admin h3.sec{margin:12px 12px 6px;color:#ff8a95}
.adm-g{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 12px}
.adm-g.three{grid-template-columns:repeat(3,1fr)}
.adm-g.four{grid-template-columns:repeat(4,1fr)}
.adm-g button{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 7px;font-size:12.5px;text-align:left;line-height:1.15}
.adm-g button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.adm-g button:disabled{opacity:.4;cursor:default}
.adm-g button.on{border-color:var(--green);color:var(--green);background:#0f2418}
.adm-g button small{display:block;color:var(--muted);font-size:10.5px;font-weight:500;margin-top:1px}
.adm-note{padding:5px 12px 0;font-size:12px;color:var(--muted);font-weight:500;margin:0}

#runhud{position:absolute;left:10px;bottom:10px;width:290px;max-width:45%;display:flex;flex-direction:column;gap:5px;z-index:4;pointer-events:none}
.rh{background:#0d0b16eb;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:5px 8px;font-size:12px;line-height:1.25;box-shadow:0 6px 16px #0008}
.rh b{color:var(--gold)}
.rh .bar{height:3px;background:#0008;margin-top:4px;border-radius:2px;overflow:hidden}
.rh .bar i{display:block;height:100%;background:var(--gold);transition:width .25s}
.rh.nem{border-left-color:var(--red)}.rh.nem b{color:#ff8a95}
.rh.cr{border-left-color:var(--volt)}.rh.cr b{color:var(--volt)}
/* Cutscenes */
#cs{position:fixed;inset:0;background:#000;z-index:55}
#csc{display:block;width:100%;height:100%}
#csSkip{position:absolute;right:18px;bottom:14px;background:#0d0b16cc;border:1px solid var(--line);border-radius:6px;padding:6px 12px;color:var(--muted);font-size:13px}
#csSkip:hover{color:var(--gold);border-color:var(--gold)}
#csSkip kbd{font-family:var(--ui);opacity:.7}
.bulk{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0 6px}
.bulk .btn{padding:6px 2px;font-size:12px}
.ubtns{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.ubtns .btn{padding:4px 4px;font-size:11.5px}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.ach div{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12px;line-height:1.2}
.ach div b{display:block;font-size:13px}
.ach div.got{border-color:var(--gold)}
.ach div:not(.got){opacity:.5}
.kindtag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-left:4px}

/* Covert ops (sniper) */
#ops{position:fixed;inset:0;background:#000;z-index:30;cursor:none;touch-action:none}
#oc{display:block;width:100%;height:100%}
#opsRes{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000b;cursor:default}
.rbox{background:#0f0c1a;border:1px solid var(--gold);border-radius:10px;padding:22px 26px;width:min(520px,92%);text-align:center;box-shadow:0 20px 60px #000}
.rbox h2{font-family:var(--display);font-size:32px;margin:0 0 6px;letter-spacing:.08em}
.rbox .sub{color:var(--muted);margin-bottom:16px;line-height:1.4;font-weight:500}

@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes glow{from{box-shadow:0 0 0 #e8b64c00}to{box-shadow:0 0 18px #e8b64caa}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1100px){#main{grid-template-columns:290px 1fr 300px}.brand{display:none}}
@media (max-width:860px){
  html,body{overflow:auto}
  #app{height:auto;min-height:100%;grid-template-rows:auto auto 30px}
  #top{flex-wrap:wrap}
  #main{grid-template-columns:1fr;grid-template-rows:62vh auto auto}
  #center{grid-row:1}#right{grid-row:2;max-height:none}#left{grid-row:3;border:0}
  #intel,.pane{overflow:visible}
}

function loadWorld(){
  return new Promise((res, rej) => {
    const J = window.jsVectorMap = window.jsVectorMap || function(){};
    J.maps = J.maps || {};
    if (!J.addMap) J.addMap = (n, d) => { J.maps[n] = d; };
    let i = 0;
    const next = () => {
      if (J.maps.world) return res(J.maps.world);
      if (i >= MAP_SRC.length) return rej(new Error('map'));
      const s = document.createElement('script'); s.src = MAP_SRC[i++]; s.async = true;
      let done = false;
      const fin = () => { if (done) return; done = true; clearTimeout(to); if (J.maps.world) res(J.maps.world); else next(); };
      const to = setTimeout(fin, 9000);
      s.onload = fin; s.onerror = fin;
      document.head.appendChild(s);
    };
    next();
  });
}
function parsePath(d){
  const toks = d.match(/[a-zA-Z]|-?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/gi) || [];
  const rings = []; let ring = null, x = 0, y = 0, sx = 0, sy = 0, cmd = '', i = 0;
  const num = () => parseFloat(toks[i++]);
  const push = () => { if (!ring) ring = [x, y]; else ring.push(x, y); };
  const close = () => { if (ring && ring.length >= 6) rings.push(ring); ring = null; };
  while (i < toks.length){
    const tk = toks[i];
    if (/^[a-zA-Z]$/.test(tk)){ cmd = tk; i++; if (cmd === 'z' || cmd === 'Z'){ close(); x = sx; y = sy; } continue; }
    switch (cmd){
      case 'M': close(); x = num(); y = num(); sx = x; sy = y; ring = [x, y]; cmd = 'L'; break;
      case 'm': close(); x += num(); y += num(); sx = x; sy = y; ring = [x, y]; cmd = 'l'; break;
      case 'L': x = num(); y = num(); push(); break;
      case 'l': x += num(); y += num(); push(); break;
      case 'H': x = num(); push(); break;
      case 'h': x += num(); push(); break;
      case 'V': y = num(); push(); break;
      case 'v': y += num(); push(); break;
      case 'C': num(); num(); num(); num(); x = num(); y = num(); push(); break;
      case 'c': num(); num(); num(); num(); x += num(); y += num(); push(); break;
      case 'Q': case 'S': num(); num(); x = num(); y = num(); push(); break;
      case 'q': case 's': num(); num(); x += num(); y += num(); push(); break;
      default: i++;
    }
  }
  close();
  return rings;
}
function ringArea(r){ let a = 0; const n = r.length / 2; for (let k = 0; k < n; k++){ const j = (k + 1) % n; a += r[2 * k] * r[2 * j + 1] - r[2 * j] * r[2 * k + 1]; } return a / 2; }
function ringCentroid(r){
  const a = ringArea(r), n = r.length / 2;
  if (Math.abs(a) < 1e-6){ let sx = 0, sy = 0; for (let k = 0; k < n; k++){ sx += r[2 * k]; sy += r[2 * k + 1]; } return [sx / n, sy / n]; }
  let cx = 0, cy = 0;
  for (let k = 0; k < n; k++){ const j = (k + 1) % n, f = r[2 * k] * r[2 * j + 1] - r[2 * j] * r[2 * k + 1]; cx += (r[2 * k] + r[2 * j]) * f; cy += (r[2 * k + 1] + r[2 * j + 1]) * f; }
  return [cx / (6 * a), cy / (6 * a)];
}
function initWorld(data){
  W.w = data.width || 900; W.h = data.height || 440;
  W.inset = (data.insets && data.insets[0]) || null;
  W.proj = data.projection || null;
  const paths = data.paths || {};
  for (const id in paths){
    const p = paths[id], d = p.path || p.d; if (!d) continue;
    const rings = parsePath(d); if (!rings.length) continue;
    let area = 0, best = rings[0], bestA = 0, x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const r of rings){
      const a = Math.abs(ringArea(r)); area += a; if (a > bestA){ bestA = a; best = r; }
      for (let k = 0; k < r.length; k += 2){ x0 = Math.min(x0, r[k]); x1 = Math.max(x1, r[k]); y0 = Math.min(y0, r[k + 1]); y1 = Math.max(y1, r[k + 1]); }
    }
    const cen = ringCentroid(best);
    const code = String(id).toUpperCase();
    const pop = POP[code] !== undefined ? POP[code] : Math.max(0.05, area * 0.04);
    const c = { id:code, name:p.name || code, path:new Path2D(d), rings, bbox:[x0, y0, x1, y1], cx:cen[0], cy:cen[1], bw:Math.max(x1 - x0, 1e-3), area, pop,
      mil:MIL[code] || 1, res:{ coal:COAL[code] || 0, oil:OIL[code] || 0, uranium:URAN[code] || 0 }, cont:CONT[code] || '?', nb:[], landlocked:LANDLOCKED.has(code) };
    c.biome = SNOW.has(code) ? 'snow' : DESERT.has(code) ? 'desert' : JUNGLE.has(code) ? 'jungle' : 'temperate';
    c.baseD = Math.round(20 * Math.pow(pop + 0.5, 0.9) * c.mil);
    c.baseY = 1 + Math.sqrt(pop) * 2;
    c.slots = { hamster:2 + Math.floor(Math.sqrt(pop) * 1.5), coal:c.res.coal * 5, oil:c.res.oil * 4, uranium:c.res.uranium * 3, eel:c.landlocked ? 0 : 2 + Math.floor(Math.sqrt(pop)), grid:1 + Math.floor(Math.sqrt(pop) / 3) };

  }

function computeAdjacency(){
  const cell = 1.6, grid = new Map(), pts = [];
  const key = (gx, gy) => (gx + 200) * 100000 + (gy + 200);
  const add = (ci, x, y) => { const k = key(Math.floor(x / cell), Math.floor(y / cell)); let a = grid.get(k); if (!a){ a = []; grid.set(k, a); } a.push(ci, x, y); pts.push(ci, x, y); };
  W.list.forEach((c, ci) => {
    for (const r of c.rings){
      const n = r.length / 2;
      for (let k = 0; k < n; k++){
        const x = r[2 * k], y = r[2 * k + 1], j = (k + 1) % n, nx = r[2 * j], ny = r[2 * j + 1];
        const steps = Math.min(30, Math.max(1, Math.ceil(Math.hypot(nx - x, ny - y) / 0.9)));
        for (let s = 0; s < steps; s++){ const t = s / steps; add(ci, x + (nx - x) * t, y + (ny - y) * t); }
      }
    }
  });
  const pairs = new Map(), R2 = 1.2 * 1.2;
  for (let i = 0; i < pts.length; i += 3){
    const ci = pts[i], x = pts[i + 1], y = pts[i + 2], gx = Math.floor(x / cell), gy = Math.floor(y / cell);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++){
      const a = grid.get(key(gx + dx, gy + dy)); if (!a) continue;
      for (let j = 0; j < a.length; j += 3){
        const cj = a[j]; if (cj === ci) continue;
        const ex = a[j + 1] - x, ey = a[j + 2] - y;
        if (ex * ex + ey * ey < R2){ const pk = ci < cj ? ci * 4096 + cj : cj * 4096 + ci; pairs.set(pk, (pairs.get(pk) || 0) + 1); }
      }
    }
  }
  for (const [pk, n] of pairs){
    if (n < 6) continue;
    const a = W.list[Math.floor(pk / 4096)], b = W.list[pk % 4096];
    if (!a.nb.includes(b.id)) a.nb.push(b.id);
    if (!b.nb.includes(a.id)) b.nb.push(a.id);
  }
}
function lonlat(lon, lat){
  const R0 = 6381372, deg = Math.PI / 180, c = W.proj.centralMeridian || 0;
  let L = lon - c; while (L < -180) L += 360; while (L > 180) L -= 360;
  const px = R0 * L * deg, py = -R0 * Math.log(Math.tan((45 + 0.4 * lat) * deg)) / 0.8;
  const b = W.inset.bbox;
  return [(px - b[0].x) / (b[1].x - b[0].x) * W.inset.width + (W.inset.left || 0), (py - b[0].y) / (b[1].y - b[0].y) * W.inset.height + (W.inset.top || 0)];
}
function buildGraticule(){
  const p = new Path2D();
  const c = W.proj.centralMeridian || 0;
  for (let k = -180; k <= 180; k += 30){
    let first = true;
    for (let lat = -80; lat <= 85; lat += 5){ const [x, y] = lonlat(c + k, lat); if (first){ p.moveTo(x, y); first = false; } else p.lineTo(x, y); }
  }
  for (let lat = -60; lat <= 60; lat += 30){
    const a = lonlat(c - 179.9, lat), b = lonlat(c + 179.9, lat);
    p.moveTo(a[0], a[1]); p.lineTo(b[0], b[1]);
  }
  W.grat = p;
}

function bestTier(){ let t = 1; for (let k = 2; k <= 6; k++) if (tl(TIER_TECH[k])) t = k; return t; }
const ultThreshold = () => Math.max(1.5, DF().ult - 0.5 * tl('intimidation') - 0.1 * S.hero.sk.charisma - .3 * pk('cha'));
function ultThr(t){ let th = ultThreshold(); if (t && t.type === 'c' && csGet(t.id).o === 0 && allianceOf(ownerOf(t.id))) th *= 1.4; return th; }

/* ownership, empires, alliances */
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
const ownerOf = id => { const s = csGet(id); return s.o === 1 ? 'ME' : s.o === 2 ? 'ALIEN' : (s.ow || id); };
const empSize = o => (R.emp.get(o) || []).length;
function ownerName(o){
  if (o === 'ME') return S.empire; if (o === 'ALIEN') return 'the Zorblaxians';
  const c = W.by[o]; if (!c) return String(o);
  const n = empSize(o); return n >= 5 ? c.name + ' Empire' : n >= 2 ? 'Greater ' + c.name : c.name;
}
const OCOL = {};
function ownerColor(o){ return OCOL[o] || (OCOL[o] = `hsl(${Math.floor(hashStr(o + '#') * 360)},46%,37%)`); }
const allianceOf = o => S.alli.find(a => a.m.includes(o));
const truceOn = o => (S.truce[o] || 0) > S.playTime;
const committed = () => S.fronts.reduce((a, f) => a + f.share, 0);
const freeShare = () => Math.max(0, 1 - committed());
const heroOK = () => S.hero.state === 'ok';
const vetMult = () => (1 + 0.03 * S.vet) * (1 + .05 * pk('vet'));
const milz = () => 1 + Math.min(2, S.playTime / 3000) * DF().foe;
const frontFor = b => S.fronts.find(f => f.b === b);
function leaderOf(id){
  if (S.nem && S.nem.host === id) return { title:S.nem.title, name:S.nem.name };
  const g = (S.cs[id] && S.cs[id].lg) || 0, r = srng(hashStr(id + ':' + g) || .5);
  return { title:L_TITLE[Math.floor(r() * L_TITLE.length)], name:L_FIRST[Math.floor(r() * L_FIRST.length)] + ' ' + L_SYL1[Math.floor(r() * L_SYL1.length)] + L_SYL2[Math.floor(r() * L_SYL2.length)] };
}
function ownerPower(o){ return (R.emp.get(o) || []).reduce((a, id) => a + dEffC(id), 0); }

function recalc(){
  R.owned = []; for (const id in S.cs) if (S.cs[id].o === 1 && W.by[id]) R.owned.push(id);
  R.ownedSet = new Set(R.owned);
  R.emp = new Map();
  for (const c of W.list){ const s = S.cs[c.id]; if (s && s.o) continue; const o = (s && s.ow) || c.id; let a = R.emp.get(o); if (!a){ a = []; R.emp.set(o, a); } a.push(c.id); }
  R.empLab = [];
  for (const [o, ids] of R.emp){ if (ids.length < 3) continue; let ax = 0, ay = 0, aw = 0; for (const id of ids){ const c = W.by[id], w = Math.sqrt(c.area) + .1; ax += c.cx * w; ay += c.cy * w; aw += w; } R.empLab.push({ o, x:ax / aw, y:ay / aw, n:ids.length }); }
  const sl = {}; for (const k in SLOT_NAMES) sl[k] = 0;
  let base = 0; const gridM = 1 + 0.5 * tl('grid');
  for (const id of R.owned){
    const c = W.by[id], s = S.cs[id];
    for (const k in c.slots) sl[k] += c.slots[k] * (k === 'hamster' && S.origin === 'cult' ? 3 : 1);
    let y = c.baseY * gridM; if (s.strip) y *= 1.6; if (s.rad > 0) y *= 0.4; if (s.unrest > 0) y *= 0.5;
    base += y;
  }
  for (const n of NODES){ if (n.home || !nodeOwned(n.id)) continue; for (const k in (n.slots || {})) sl[k] += n.slots[k]; }
  R.slots = sl;
  let ind = 0;
  for (const d of IND){ const c = S.ind[d.k] || 0; if (c) ind += Math.min(c, sl[d.slot]) * d.out * (d.k === 'hamster' && S.origin === 'cult' ? 10 : 1) * crisisInd(d.k); }
  R.base = base; R.indOut = ind;
  R.prod = (base + ind) * outMult() * (1 + (S.flags.sci || 0)) * (S.flags.admProd || 1) * (S.hero.state === 'captured' ? 0.75 : 1) * (S.wonders && S.wonders.wheel ? 1.25 : 1) * (1 + .15 * pk('econ')) * (ORIGINK[S.origin] ? ORIGINK[S.origin].prod : 1) * (S.mob ? .7 : 1) * crisisMult('prod');
  computeSites();
  let P = 0; const br = { land:0, air:0, sea:0 }; const dm = docMult();
  for (const u of UNITS){ const n = S.units[u.k] || 0; if (!n) continue; const p = n * u.pow * dm; P += p; br[u.br] += p; }
  R.P = P; R.Pbr = br;
}

/* =====================================================================
   STRENGTH, REACH, ODDS
   ===================================================================== */
function dEffC(id){
  const c = W.by[id], s = csGet(id);
  if (s.o === 2) return (s.ad || c.baseD) * s.dm;
  const frac = R.owned.length / Math.max(1, W.list.length);
  let d = c.baseD * s.dm * (1 + S.tension / 100) * (1 + 1.5 * frac * frac) * DF().foe * milz();
  if (R.coalT > 0) d *= 1.4;
  const o = s.ow || id, n = empSize(o);
  if (n > 1) d *= 1 + 0.08 * Math.min(10, n - 1);
  const al = allianceOf(o); if (al) d *= 1 + 0.12 * Math.min(5, al.m.length - 1);
  if (s.chaos > 0 || csGet(o).chaos > 0) d *= 0.45;
  if (S.nem && S.nem.host === o) d *= 1.4 + .2 * S.nem.lvl;
  d *= crisisMult('foe');
  return d;
}
function aiStr(id){
  const c = W.by[id], s = csGet(id), o = s.ow || id, n = empSize(o), al = allianceOf(o);
  return c.baseD * s.dm * (1 + 0.08 * Math.min(10, Math.max(0, n - 1))) * (al ? 1 + 0.12 * Math.min(5, al.m.length - 1) : 1) * (s.chaos > 0 || csGet(o).chaos > 0 ? 0.45 : 1);
}
const dEffN = id => NK[id].D * (S.ns[id] ? S.ns[id].dm : 1) * DF().foe;
function targetD(t){ return t.type === 'c' ? dEffC(t.id) : dEffN(t.id); }
function reachC(id){
  const c = W.by[id];
  if (!S.started) return { ok:false, why:'Seize a capital first.' };
  if (csGet(id).o === 1) return { ok:false, why:'' };
  if (c.nb.some(n => R.ownedSet.has(n))) return { ok:true, how:'land' };
  if (c.landlocked && !c.nb.length && R.owned.some(o => bboxDist(W.by[o], c) <= 6)) return { ok:true, how:'land' };
  if (c.landlocked) return { ok:false, why:'Landlocked. Conquer a bordering nation first.' };
  if (R.Pbr.sea <= 0) return { ok:false, why:'No land border. Build a navy (Armory) to invade by sea.' };
  const rng = navalRange();
  if (R.owned.some(o => !W.by[o].landlocked && bboxDist(W.by[o], c) <= rng)) return { ok:true, how:'sea' };
  return { ok:false, why:`Beyond your naval range (${Math.round(rng * 44)} km). Research Blue-Water Navy or conquer closer coasts.` };
}
const navalRange = () => tl('bluewater') >= 5 ? 1e9 : 70 + 70 * tl('bluewater');
function bboxDist(a, b){ const dx = Math.max(0, a.bbox[0] - b.bbox[2], b.bbox[0] - a.bbox[2]), dy = Math.max(0, a.bbox[1] - b.bbox[3], b.bbox[1] - a.bbox[3]); return Math.hypot(dx, dy); }
function reachN(id){
  const n = NK[id];
  if (nodeOwned(id)) return { ok:false, why:'' };
  if (!viewOpen(n.v)) return { ok:false, why:'This region is not open yet.' };
  return (n.links || []).some(l => nodeOwned(l)) ? { ok:true, how:'fleet' } : { ok:false, why:'Conquer a linked world first.' };
}
function reachT(t){ return t.type === 'c' ? reachC(t.id) : reachN(t.id); }
function deployPower(t){ if (t.type === 'c' && W.by[t.id].landlocked) return R.P - R.Pbr.sea; return R.P; }
function oddsText(p, d){
  const r = p / Math.max(1e-9, d);
  if (r >= ultThreshold()) return ['Overwhelming', '#5ef08a', 'They will surrender to an ultimatum.'];
  if (r >= 1.6) return ['Decisive', '#9be36a', 'A clean victory is likely.'];
  if (r >= 1.1) return ['Favourable', '#e8b64c', 'You should win, with losses.'];
  if (r >= 0.8) return ['Even', '#ffb35a', 'Too close to call. Your commander abilities will decide it.'];
  if (r >= 0.5) return ['Risky', '#ff7a6a', 'You need abilities, missile strikes or a nuke to win this.'];
  return ['Suicidal', '#ff4d5e', 'Soften them with strikes first, or build a much bigger army.'];
}

/* =====================================================================
   ECONOMY ACTIONS
   ===================================================================== */
const unitCost = u => u.cost * (1 - 0.05 * tl('logistics')) * (1 - .08 * pk('cheap'));
const techCost = k => Math.ceil(TK[k].base * Math.pow(TK[k].mult, tl(k)) * (1 - .12 * pk('sci')) * (S.origin === 'mad' ? .65 : 1));
function indAvail(d){ return !d.tech || tl(d.tech) > 0; }
function indCostN(d, n){ const c = S.ind[d.k] || 0; return d.cost * (n + 0.04 * (n * c + n * (n - 1) / 2)); }
function indMaxN(d){
  const free = Math.max(0, (R.slots[d.slot] || 0) - (S.ind[d.k] || 0));
  let lo = 0, hi = free;
  while (lo < hi){ const mid = Math.ceil((lo + hi) / 2); if (indCostN(d, mid) <= S.cash) lo = mid; else hi = mid - 1; }
  return lo;
}
function buyInd(k, n){
  const d = INDK[k]; if (!indAvail(d)) return 0;
  const free = Math.max(0, (R.slots[d.slot] || 0) - (S.ind[k] || 0));
  if (n === 'max') n = indMaxN(d); n = Math.min(n, free);
  if (n <= 0) return 0;
  const c = indCostN(d, n); if (c > S.cash) return 0;
  S.cash -= c; S.ind[k] = (S.ind[k] || 0) + n; recalc(); return n;
}
function unitAvail(u){ return !TIER_TECH[u.tier] || tl(TIER_TECH[u.tier]) > 0; }
function buyUnit(k, n){
  const u = UK[k]; if (!unitAvail(u)) return 0;
  const c = unitCost(u);
  if (n === 'max') n = Math.floor(S.cash / c);
  if (n <= 0 || n * c > S.cash) return 0;
  S.cash -= n * c; S.units[k] = (S.units[k] || 0) + n; S.stats.bought = (S.stats.bought || 0) + n; recalc(); return n;
}
function techReady(k){ const t = TK[k]; return !t.req || t.req(); }
function buyTech(k){
  const t = TK[k]; if (tl(k) >= t.max || !techReady(k)) return false;
  const c = techCost(k); if (S.cash < c) return false;
  S.cash -= c; S.tech[k] = tl(k) + 1; recalc();
  const V = VIEWS.find(v => v.tech === k);
  if (V){ log(`${t.name} complete. The ${V.name} map is open.`, 'good'); cutscene('ascend', { v:V.k }); modal({ big:'🌌', title:`${V.name} unlocked`, body:`<p>${t.desc(1)}.</p><p>Press <kbd>${V.key}</kbd> or use the map tabs to look up. New units are waiting in the Armory.</p>`, buttons:[{ label:'Look up', fn:() => setView(V.k) }, { label:'Later', alt:true }] }); }
  return true;
}
function sellAll(){
  const e = S.energy; if (e < 1) return;
  const c = e * price(); S.cash += c; S.energy = 0;
  toast(`Sold ${fmt(e)} ⚡ for $${fmt(c)}.`, 'good'); sfx.coin();
}
function tensionAdd(v){ if (v > 0) v *= (1 - .15 * pk('propa')) * (S.origin === 'cult' ? 1.25 : 1); S.tension = clamp(S.tension + v * (1 - 0.1 * tl('propaganda')), 0, 100); }

/* =====================================================================
   CONQUEST ACTIONS
   ===================================================================== */
function tName(t){ return t.type === 'c' ? W.by[t.id].name : NK[t.id].name; }
function capture(t, how){
  if (t.type === 'c'){
    const s = csMut(t.id); const wasAlien = s.o === 2; const prevOwner = ownerOf(t.id);
    s.o = 1; s.dm = 1; s.ad = 0; s.ow = undefined; s.chaos = 0; s.unrest = how === 'ultimatum' ? 20 : how === 'coup' ? 60 : 45;
    if (!S.capital) S.capital = t.id;
    tensionAdd(how === 'ultimatum' ? 1 : 2.5);
    S.stats.conquered++;
    S.fronts = S.fronts.filter(f => f.b !== t.id);
    S.aiFronts = S.aiFronts.filter(f => f.a !== t.id && f.b !== t.id);
    recalc();
    if (prevOwner === t.id) releaseEmpire(t.id);
    if (S.nem && S.nem.host === t.id) nemesisFlee();
    if (pk('loot') && how !== 'admin') S.cash += Math.max(500, R.cashRate * 30) * pk('loot');
    if (S.hero.state === 'captured' && S.hero.capBy === t.id) freeHero('Your troops stormed the prison and carried you out on their shoulders.');
    cleanWars();
    const c = W.by[t.id];
    mapFx.push({ k:'ring', x:c.cx, y:c.cy, t:0, dur:1.4, col:'#e8b64c' });
    log(how === 'ultimatum' ? `${c.name} surrendered to your ultimatum.` : how === 'coup' ? `${c.name} is now your puppet state.` : wasAlien ? `${c.name} liberated from the aliens. It is yours now.` : `${c.name} has fallen. It is yours.`, 'good');
    if (how !== 'domino' && tl('domino')) domino(t.id);
    if (how !== 'admin' && how !== 'domino') addXP(how === 'ultimatum' ? 6 : 10);
    if ((how === 'battle' || how === 'front' || how === 'coup') && (prevOwner === t.id && empSize(t.id) === 0 && c.pop >= 30 || c.pop >= 100) && S.playTime - (R.lastConqCs || -999) > 40){ R.lastConqCs = S.playTime; cutscene('conquest', { id:t.id }); }
    if (!S.flags.earthDone && R.owned.length >= W.list.length){
      S.flags.earthDone = 1; cutscene('earth', {});
      modal({ big:'🌍', title:'Earth is yours', body:`<p>Every nation on the planet now flies the banner of <b>${esc(S.empire)}</b>. Their grids, their oceans, their hamsters: all yours.</p><p>${tl('space') ? 'The Solar System awaits.' : 'Research the <b>Space Program</b> to look beyond the sky.'}</p>`, buttons:[{ label:'Onward' }] });
    }
  } else {
    S.ns[t.id] = { o:1, dm:1 };
    S.stats.worlds++;
    const n = NK[t.id];
    if (n.cash){ S.cash += n.cash; }
    recalc();
    log(`${n.name} conquered. New ${Object.keys(n.slots || {}).map(k => SLOT_NAMES[k]).join(', ')} available.`, 'good');
  }
  sfx.capture();
}
function domino(fromId){
  const c = W.by[fromId], thr = ultThreshold() * 2.5;
  let n = 0;
  for (const nb of c.nb){
    if (n >= 4) break;
    if (csGet(nb).o === 1 || csGet(nb).o === 2 || allianceOf(ownerOf(nb))) continue;
    if (R.P >= dEffC(nb) * thr){ capture({ type:'c', id:nb }, 'domino'); S.stats.ultimatums++; n++; toast(`🀄 ${W.by[nb].name} saw what happened next door and surrendered.`, 'good'); }
  }
}
function ultimatum(t){
  const r = reachT(t); if (!r.ok) return false;
  if (deployPower(t) < targetD(t) * ultThr(t)) return false;
  S.stats.ultimatums++;
  capture(t, 'ultimatum');
  toast(`📜 ${tName(t)} read your ultimatum and surrendered without a shot.`, 'good');
  say(pick(['Kneel, and keep your cities. Refuse, and lose everything.', 'A wise choice. Their people will thank them.', 'The strong do not need to fight. They only need to be believed.']));
  return true;
}
const strikeCost = t => targetD(t) * 1.6;
const wmdCost = t => targetD(t) * 4 * (1 - .3 * pk('nuke'));
function wmdName(){ return tl('wmd4') ? 'Big Crunch' : tl('wmd3') ? 'Black Hole Bomb' : tl('wmd2') ? 'Antimatter Bomb' : 'Nuclear Strike'; }
function strike(t){
  const c = strikeCost(t); if (S.cash < c) return false;
  S.cash -= c; S.stats.strikes++;
  if (t.type === 'c'){ const s = csMut(t.id); s.dm *= 0.75; tensionAdd(3); } else { S.ns[t.id] = S.ns[t.id] || { o:0, dm:1 }; S.ns[t.id].dm *= 0.75; }
  launchMapStrike(t, false);
  log(`${t.type === 'c' ? 'Cruise missiles' : 'Orbital lances'} hit ${tName(t)}. Their defences are down 25%.`);
  return true;
}
function wmd(t){
  const c = wmdCost(t); if (S.cash < c) return false;
  S.cash -= c; S.stats.nukes++;
  const f = tl('wmd4') ? 0.05 : tl('wmd3') ? 0.12 : tl('wmd2') ? 0.2 : 0.3;
  if (t.type === 'c'){ const s = csMut(t.id); s.dm *= f; s.rad = 300; tensionAdd(18); } else { S.ns[t.id] = S.ns[t.id] || { o:0, dm:1 }; S.ns[t.id].dm *= f; }
  launchMapStrike(t, true);
  log(`${wmdName()} detonated over ${tName(t)}. ${t.type === 'c' ? 'The world is horrified. The fallout will halve its output for a while.' : 'Their fleet is in pieces.'}`, 'bad');
  return true;
}
function stripMine(id){
  const s = csMut(id); if (s.o !== 1 || s.strip || !tl('strip')) return;
  const c = W.by[id], cash = c.baseY * 400 * (1 + tl('grid'));
  s.strip = 1; S.cash += cash; tensionAdd(1); recalc();
  toast(`🚜 ${c.name} strip-mined: +$${fmt(cash)}, +60% base output. Nature: gone.`, 'good'); sfx.coin();
}
function loseCountry(id, toAlien, power, newOwner){
  const s = csMut(id); const c = W.by[id];
  s.o = toAlien ? 2 : 0; s.dm = toAlien ? 1 : 0.5; s.ad = toAlien ? power * 1.3 : 0; s.unrest = 0;
  s.ow = !toAlien && newOwner && newOwner !== id && W.by[newOwner] ? newOwner : undefined;
  S.fronts = S.fronts.filter(f => f.a !== id);
  if (S.capital === id){
    recalc();
    S.capital = R.owned.length ? R.owned.slice().sort((a, b) => W.by[b].pop - W.by[a].pop)[0] : null;
  }
  recalc();
  log(toAlien ? `Aliens seized ${c.name}! Take it back.` : `${c.name} has been lost to a counterattack.`, 'bad');
  if (!R.owned.length) gameOver();
}

/* =====================================================================
   WORLD EVENTS
   ===================================================================== */
const garrison = () => R.P * Math.max(0.1, freeShare()) * 0.35 * (1 + 0.5 * tl('fortress')) * (hasW('citadel') ? 2 : 1) * (1 + .3 * pk('fort'));
function events(dt){
  for (const a of R.alerts.slice()){ a.t -= dt; if (a.t <= 0) resolveAlert(a); }
  frontTick(dt);
  aiTick(dt);
  heroTick(dt);
  if (R.laserT > 0) R.laserT -= dt;
  if (hasW('clone')){ R.cloneT = (R.cloneT || 0) + dt; if (R.cloneT >= 20){ R.cloneT = 0; for (const k in S.units) S.units[k] *= 1.01; recalc(); } }
  if (R.owned.length >= 1 && !BT.on && S.playTime > 60){
    R.caT -= dt * DF().agg * (1 + S.tension / 60) * (R.coalT > 0 ? 2 : 1);
    if (R.caT <= 0){ R.caT = rnd(28, 50); aiAggression(); }
  }
  if (!BT.on){ R.rebT -= dt * DF().agg * (1 + R.owned.length / 25); if (R.rebT <= 0){ R.rebT = rnd(80, 140); spawnRebels(); } }
  runTick(dt);
  if (!BT.on && !OPS.on && !modalOpen && R.owned.length >= 2){ R.evT -= dt; if (R.evT <= 0){ R.evT = rnd(150, 250); dilemma(); } }
  if (tl('space') && !BT.on){ R.alienT -= dt; if (R.alienT <= 0){ R.alienT = rnd(260, 420); spawnAlien(); } }
  const nukes = Math.min(S.ind.nuke || 0, R.slots.uranium || 0);
  if (nukes > 0 && tl('coolant') < 3 && Math.random() < dt * nukes * 0.00003 * (3 - tl('coolant'))) meltdown();
  if (R.coalCd > 0) R.coalCd -= dt;
  if (S.tension >= 85 && R.coalT <= 0 && R.coalCd <= 0 && R.owned.length < W.list.length) formCoalition();
  if (R.coalT > 0){ R.coalT -= dt; if (R.coalT <= 0){ R.coalCd = 120; S.alli = S.alli.filter(a => a.name !== 'World Coalition'); log('The World Coalition has collapsed into bickering. Its members are still at war with you.', 'good'); } }
  R.newsT -= dt; if (R.newsT <= 0){ R.newsT = rnd(15, 24); news(); }
}
function spawnCounter(){
  const cand = [];
  for (const id of R.owned){ const foes = W.by[id].nb.filter(n => csGet(n).o !== 1); if (foes.length) cand.push([id, foes]); }
  let target, attacker;
  if (cand.length){ const [t, foes] = pick(cand); target = t; attacker = pick(foes); }
  else {
    const foes = W.list.filter(c => csGet(c.id).o !== 1 && !c.landlocked), mine = R.owned.filter(id => !W.by[id].landlocked);
    if (!foes.length || !mine.length) return;
    target = pick(mine); attacker = pick(foes).id;
  }
  if (R.alerts.some(a => a.target === target)) return;
  const power = dEffC(attacker) * rnd(0.45, 0.8);
  if (power < garrison() * 0.06) return;
  R.alerts.push({ id:++R.aid, target, attacker, power, t:22, max:22, fac:csGet(attacker).o === 2 ? 'alienEarth' : R.coalT > 0 ? 'coalition' : 'human' });
  toast(`⚠️ ${W.by[attacker].name} is invading ${W.by[target].name}!`, 'bad'); sfx.alarm();
  renderAlerts();
}
function spawnAlien(){
  if (!R.owned.length) return;
  const target = pick(R.owned);
  if (R.alerts.some(a => a.target === target)) return;
  let fd = Infinity; for (const n of NODES) if (!n.home && viewOpen(n.v) && !nodeOwned(n.id)) fd = Math.min(fd, dEffN(n.id));
  if (!isFinite(fd)) fd = R.P;
  const power = Math.max(fd * 0.25, R.P * rnd(0.45, 0.7));

function setShare(f, v){ const room = Math.floor((1 - (committed() - f.share)) * 20 + 1e-6) / 20; f.share = clamp(Math.round(v * 20) / 20, 0, Math.max(0, room)); }

function frontTick(dt){

}

function tick(dt, off){
  if (!S.started || S.over) return;
  S.playTime += dt;
  const p = R.prod;
  S.harvested += p * dt;
  const cap = energyCap();
  let sold = p * dt * 0.5;
  S.energy += p * dt * 0.5;
  if (S.energy > cap){ sold += S.energy - cap; S.energy = cap; }
  const cs = sold * price(); S.cash += cs; R.acc.cash += cs;
  R.accT += dt; if (R.accT >= 1){ R.cashRate = R.acc.cash / R.accT; R.acc.cash = 0; R.accT = 0; }
  const tw = hasW('tower') ? 2 : 1;
  for (const id in S.cs){ const s = S.cs[id]; if (s.rad > 0) s.rad = Math.max(0, s.rad - dt); if (s.unrest > 0) s.unrest = Math.max(0, s.unrest - dt * tw); if (s.chaos > 0) s.chaos = Math.max(0, s.chaos - dt); if (s.o !== 1 && s.dm < 1) s.dm = Math.min(1, s.dm + dt * 0.004); }
  for (const id in S.ns){ const s = S.ns[id]; if (s.o !== 1 && s.dm < 1) s.dm = Math.min(1, s.dm + dt * 0.004); }
  S.tension = S.adm.freeze ? 0 : Math.max(0, S.tension - dt * 0.12 * tw);
  R.recalcT -= dt; if (R.recalcT <= 0){ R.recalcT = 0.5; recalc(); }
  if (!off) events(dt);
  if (S.harvested >= UNIVERSE_TOTAL && !S.won) winGame();
}
function runOffline(sec){
  const c0 = S.cash, h0 = S.harvested;
  let left = Math.min(sec, 7200);
  while (left > 0){ const d = Math.min(2, left); tick(d, true); left -= d; }
  return { sec:Math.min(sec, 7200), cash:S.cash - c0, energy:S.harvested - h0 };
}

function newContract(){
  for (let tries = 0; tries < 12; tries++){
    const k = pick(Object.keys(CT)); if (S.contracts.some(o => o.k === k)) continue;
    const c = { id:++S.fid, k, t:0, dur:Math.round(rnd(180, 300)), n:1, base:0 };
    if (k === 'conq'){ c.n = ri(1, 3); c.base = S.stats.conquered; }
    else if (k === 'win'){ c.n = ri(1, 3); c.base = S.stats.won; }
    else if (k === 'kind'){ c.x = pick(['trench', 'air', 'naval']); c.base = (S.stats.kw || {})[c.x] || 0; }
    else if (k === 'pow'){ c.n = Math.max(1000, Math.round(S.pow.held * .5 / 1000) * 1000 + 2000); c.base = S.pow.held; }
    else if (k === 'ind'){ c.n = ri(10, 40); c.base = Object.values(S.ind).reduce((a, b) => a + b, 0); }
    else if (k === 'op'){ c.n = ri(1, 2); c.base = S.hero.ops; }
    else if (k === 'target'){ const tg = reachableTargets().filter(t => t.type === 'c' && csGet(t.id).o === 0); if (!tg.length) continue; c.x = pick(tg.slice(0, 6)).id; }
    else if (k === 'ult'){ c.n = 1; c.base = S.stats.ultimatums; }
    else if (k === 'army'){ c.n = Math.ceil(R.P * 1.6); }
    else if (k === 'energy'){ c.n = Math.max(2000, R.prod * 150); c.base = S.harvested; }

    case 'snipe': { admEnsureStart(); const pool = aiPool(); const id = selC && csGet(selC).o === 0 ? ownerOf(selC) : pool.length ? ownerOf(pick(pool).id) : null; if (id) startSnipe(id); else toast('No foreign rulers left to target.', 'bad'); return; }
    case 'cdr': S.hero.decT = 0; S.hero.opT = 0; S.hero.speechT = 0; R.laserT = 0; break;
    case 'wonders': S.wonders = S.wonders || {}; for (const w of WONDERS) S.wonders[w.k] = 1; break;
    case 'ach': S.ach = S.ach || {}; for (const a of ACH) S.ach[a.k] = 1; break;
    case 'perk': admEnsureStart(); perkDraft(); break;
    case 'nem': admEnsureStart(); if (S.nem) nemesisFlee(); else spawnNemesis(1 + S.nemKills); break;
    case 'crisis': admEnsureStart(); S.crisis = null; R.crT = 0; R.owned.length >= 2 ? runTick(.01) : toast('Needs 2 nations.', 'bad'); break;
    case 'contract': admEnsureStart(); S.contracts = []; R.ctT = 0; for (let i = 0; i < 3; i++){ R.ctT = 0; contractTick(.01); } break;
    case 'score': admEnsureStart(); toggleAdmin(false); endReign(); return;
    case 'cstog': S.flags.csOff = !S.flags.csOff; break;
    case 'cs': { admEnsureStart(); const anyAI = W.list.find(c => csGet(c.id).o === 0); const d0 = { name:W.by[S.capital].name, o:anyAI ? ownerOf(anyAI.id) : S.capital, id:anyAI ? anyAI.id : S.capital, v:pick(['solar', 'stars', 'galaxy', 'universe']), line:'Kneel.', op:{ name:'Commando raid', icon:'⚔', art:'tripod' }, fac:'martian' }; const off = S.flags.csOff; S.flags.csOff = false; toggleAdmin(false); cutscene(d.k, d0); S.flags.csOff = off; return; }
    case 'speed': S.speed = +d.v; break;
    case 'diff': S.diff = +d.v; break;
    case 'wipe': resetGame(); break;
  }
  recalc(); renderAll(); renderAdmin();
}

/* =====================================================================
   INPUT
   ===================================================================== */
let drag = null; const pointers = new Map(); let pinch = null;
mapC.addEventListener('pointerdown', e => {
  audioOn();
  mapC.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.offsetX, e.offsetY]);
  if (pointers.size === 2){ const [a, b] = [...pointers.values()]; pinch = { d:Math.hypot(a[0] - b[0], a[1] - b[1]), z:cam.z }; drag = null; return; }
  drag = { x:e.offsetX, y:e.offsetY, cx:cam.x, cy:cam.y, moved:false };
});
mapC.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.offsetX, e.offsetY]);
  if (pinch && pointers.size === 2 && S.view === 'earth'){ const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); const f = (pinch.z * d / pinch.d) / cam.z; zoomAt(f, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); return; }
  if (drag){
    const dx = e.offsetX - drag.x, dy = e.offsetY - drag.y;
    if (Math.hypot(dx, dy) > 4) drag.moved = true;
    if (drag.moved && S.view === 'earth'){ cam.x = drag.cx - dx / cam.z; cam.y = drag.cy - dy / cam.z; clampCam(); mapC.classList.add('drag'); }
    return;
  }
  if (!W.ready) return;
  const h = hitMap(e.offsetX, e.offsetY);
  hover = h;
  const tip = $('#tip');
  if (!h){ tip.hidden = true; return; }
  let html;
  if (h.type === 'c'){
    const c = W.by[h.id], s = csGet(h.id), f = frontFor(h.id) || S.fronts.find(x => x.a === h.id && x.pos < 0), o = ownerOf(h.id);
    html = `<b>${esc(c.name)}</b><div class="m">${s.o === 1 ? (S.capital === h.id ? 'Your capital' : 'Your territory') + ` · ${fmt(c.baseY * (1 + .5 * tl('grid')) * outMult())} ⚡/s` : `⚔ ${fmt(dEffC(h.id))} · ${S.started ? (reachC(h.id).ok ? '<span style="color:' + oddsText(deployPower(h), dEffC(h.id))[1] + '">' + oddsText(deployPower(h), dEffC(h.id))[0] + '</span>' : 'out of reach') : 'click to inspect'}`}</div>`;
    if (s.o === 0 && o !== h.id) html += `<div class="m">Held by ${esc(ownerName(o))}</div>`;
    if (s.o === 0 && S.wars[o]) html += `<div class="m" style="color:#ff8a95">At war with you</div>`;
    if (f) html += `<div class="m" style="color:${f.pos >= 0 ? '#ffd98a' : '#ff8a95'}">Front: ${f.pos >= 0 ? Math.round(f.pos * 100) + '% taken' : Math.round(-f.pos * 100) + '% lost'} · ${Math.round(f.share * 100)}% of forces</div>`;
  }
  else { const n = NK[h.id]; html = `<b>${esc(n.name)}</b><div class="m">${n.home ? 'Home' : nodeOwned(h.id) ? 'Conquered' : `${esc(FACTIONS[n.fac].name)} · ⚔ ${fmt(dEffN(h.id))}`}</div>`; }
  tip.innerHTML = html; tip.hidden = false;
  tip.style.left = Math.min(e.offsetX + 14, CW - 200) + 'px'; tip.style.top = Math.min(e.offsetY + 14, CH - 60) + 'px';
});
const endPtr = e => {
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null;
  if (!drag) return;
  const d = drag; drag = null; mapC.classList.remove('drag');
  if (d.moved || !W.ready) return;
  const h = hitMap(e.offsetX, e.offsetY);
  select(h, false);
  if (h) sfx.click();
};
mapC.addEventListener('pointerup', endPtr);
mapC.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); drag = null; pinch = null; });
mapC.addEventListener('pointerleave', () => { hover = null; $('#tip').hidden = true; });
mapC.addEventListener('wheel', e => { e.preventDefault(); if (S.view !== 'earth') return; zoomAt(e.deltaY < 0 ? 1.18 : 1 / 1.18, e.offsetX, e.offsetY); }, { passive:false });
mapC.addEventListener('dblclick', e => { if (S.view === 'earth') zoomAt(1.8, e.offsetX, e.offsetY); });
$('#zIn').onclick = () => zoomAt(1.4, CW / 2, CH / 2);
$('#zOut').onclick = () => zoomAt(1 / 1.4, CW / 2, CH / 2);
$('#zHome').onclick = () => { if (S.capital) focusCountry(S.capital, 3); };
$('#tEnergy').onclick = () => { audioOn(); sellAll(); };
$('#bPause').onclick = () => { R.paused = !R.paused; updateTop(); };
$('#bSound').onclick = () => { S.sound = !S.sound; if (S.sound) audioOn(); updateTop(); };
$('#bHelp').onclick = help;
$('#bAdmin').onclick = () => { audioOn(); toggleAdmin(); };
const SPEEDS = [1, 2, 4];
function cycleSpeed(){ const i = SPEEDS.indexOf(S.speed || 1); S.speed = SPEEDS[(i + 1) % SPEEDS.length] || 1; updateTop(); renderAdmin(); toast(`⏩ Game speed ${S.speed}×`); }
$('#bSpeed').onclick = () => { audioOn(); cycleSpeed(); };
const keys = new Set();
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (CS.on){ if (k === ' ' || k === 'escape' || k === 'enter'){ e.preventDefault(); nextCut(); } return; }
  if (OPS.on){
    if (k === 'shift' || k === ' '){ OPS.hold = true; e.preventDefault(); }
    else if (k === 'escape' && !OPS.over) snipeEnd(false, 'abort');
    else if ((k === 'enter' || k === 'escape' || k === ' ') && !$('#opsRes').hidden){ e.preventDefault(); closeOps(); }
    return;
  }
  if (k === '`' || k === '~'){ e.preventDefault(); if (S && W.ready) toggleAdmin(); return; }
  if (modalOpen){ if (k === 'enter' || k === 'escape'){ const b = $('#memo .actions button:not(.alt)') || $('#memo .actions button'); if (b){ e.preventDefault(); b.click(); } } return; }
  audioOn();
  if (BT.on){
    if (!$('#bResult').hidden){ if (k === 'enter' || k === 'escape' || k === ' '){ e.preventDefault(); closeBattle(); } return; }
    const a = ABIL.find(x => x.key === k); if (a){ useAbil(a.k); return; }
    const stk = Object.keys(STANCE).find(x => STANCE[x].key.toLowerCase() === k); if (stk){ setStance(stk); return; }
    if (k === 'q') quickResolve();
    else if (k === 'escape') retreat();
    else if (k === ' '){ e.preventDefault(); R.paused = !R.paused; }
    return;
  }
  if (k === ' '){ e.preventDefault(); R.paused = !R.paused; updateTop(); return; }
  if (k === 't'){ cycleSpeed(); return; }
  const v = VIEWS.find(x => x.key === k); if (v){ setView(v.k); return; }
  const pmap = { z:'empire', g:'war', l:'leader', x:'industry', c:'armory', v:'research', b:'chron' }; if (pmap[k]){ setPane(pmap[k]); return; }
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys.add(k); e.preventDefault(); return; }
  if (k === '+' || k === '=') zoomAt(1.25, CW / 2, CH / 2);
  else if (k === '-' || k === '_') zoomAt(1 / 1.25, CW / 2, CH / 2);
  else if (k === 'f' && S.capital){ setView('earth'); focusCountry(S.capital, 3); }
  else if (k === 'escape'){ if (admOpen) toggleAdmin(false); else select(null); }
  else if (k === 'h' || k === '?') help();
  else if (sel && S.started){
    if (k === 'i') invade(sel);
    else if (k === 'u'){ if (!ultimatum(sel)) sfx.err(); renderAll(); }
    else if (k === 'm'){ if (!strike(sel)) sfx.err(); renderAll(); }
    else if (k === 'n'){ if (!wmd(sel)) sfx.err(); renderAll(); }
  }
});
window.addEventListener('keyup', e => { const k = e.key.toLowerCase(); keys.delete(k); if (OPS.on && (k === 'shift' || k === ' ')) OPS.hold = false; });
window.addEventListener('blur', () => keys.clear());

/* =====================================================================
   LOOP & BOOT
   ===================================================================== */
let last = performance.now(), uiT = 0, paneT = 0, saveT = 0, achT = 0;
function frame(now){
  let dt = (now - last) / 1000; last = now;
  if (dt > 3 && S && S.started && !R.paused){ runOffline(dt); dt = 0; }
  dt = Math.min(dt, 0.1);
  if (S && W.ready){
    if (CS.on){ try { csUpdate(dt); if (CS.on) renderCS(); } catch (err){ console.error(err); nextCut(); } }
    if (OPS.on){ opsUpdate(dt); if (OPS.on) renderOps(); }
    if (!R.paused){ tick(dt * (S.speed || 1)); if (BT.on) btUpdate(dt); }
    updMapFx(dt);
    if (keys.size && S.view === 'earth' && !BT.on && !OPS.on){ const sp = 600 / cam.z * dt; if (keys.has('w') || keys.has('arrowup')) cam.y -= sp; if (keys.has('s') || keys.has('arrowdown')) cam.y += sp; if (keys.has('a') || keys.has('arrowleft')) cam.x -= sp; if (keys.has('d') || keys.has('arrowright')) cam.x += sp; clampCam(); }
    const t = now / 1000;
    if (CS.on){ /* cutscene covers the screen */ }
    else if (BT.on) renderBattle(t); else if (!OPS.on) renderMap(t);
    achT = (achT || 0) + dt; if (achT > 2){ achT = 0; checkAch(); }
    uiT += dt; paneT += dt; saveT += dt;
    if (uiT > .25){ uiT = 0; updateTop(); tickAlerts(); renderRunHud(); if (BT.on) renderAbilBar(); }
    if (paneT > 1 && !holdUI){ paneT = 0; if (!BT.on){ renderPane(); renderIntel(); } }
    if (saveT > 10){ saveT = 0; save(); }
  }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
window.addEventListener('resize', () => { if (W.ready){ sizeMap(); if (BT.on) sizeBattle(); if (OPS.on) sizeOps(); if (CS.on) sizeCS(); } });
new ResizeObserver(() => { if (W.ready) sizeMap(); }).observe($('#center'));

async function start(data){
  try { initWorld(await loadWorld()); }
  catch (e){
    $('#loader').innerHTML = `<h2>Couldn't load the world map</h2><p>The map is downloaded from a public CDN when the game opens, and that request failed. Check your internet connection, then try again.</p><button class="btn" id="retryMap">Try again</button>`;
    $('#retryMap').onclick = () => location.reload();
    return;
  }
  $('#loader').hidden = true;
  let st = (data && data.v === 3) ? data : loadSave();
  const fromHot = !!(data && data.v === 3);
  if (st){ S = migrate(st); } else S = newState();
  recalc();
  sizeMap();
  if (S.capital) focusCountry(S.capital, 2.2);
  setView(S.view && viewOpen(S.view) ? S.view : 'earth');
  renderAll();
  if (!S.started) intro();
  else if (!fromHot){
    const away = (Date.now() - (S.t || Date.now())) / 1000;
    if (away > 20){ const r = runOffline(away); modal({ big:'🗂️', title:'While you were away', body:`<p>Your empire ran itself for ${dur(r.sec)}${away > 7200 ? ' (the maximum)' : ''}.</p><ul><li>Energy harvested: ${fmt(r.energy)} ⚡</li><li>Treasury grew by $${fmt(r.cash)}</li></ul>`, buttons:[{ label:'Resume command' }] }); }
  }
  last = performance.now();
  requestAnimationFrame(frame);
}
window.__pw = { spawnCounter, spawnAlien, defend, wmd, strike, sizeBattle, get S(){ return S; }, R, W, BT, OPS, tick, recalc, buyInd, buyUnit, buyTech, capture, reachableTargets, startBattle, finishBattle, quickResolve, useAbil, invade, ultimatum, massUltimatum, seize, setView, dEffC, dEffN, deployPower, techCost, indCostN, unitCost, select, renderAll, closeBattle,
  applyStage, adminAct, startWar, offensive, aiAggression, startAIWar, tryAlliance, formCoalition, startSnipe, snipeShoot, closeOps, dilemma, frontTick, ownerOf, ownerName, events };
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => { if (!S) return {}; S.t = Date.now(); return JSON.parse(JSON.stringify(S)); });
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
