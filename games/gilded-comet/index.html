<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Gilded Comet Casino: fifteen play-money casino games on one bankroll. Slots, blackjack, Texas Hold'em, video poker, baccarat, roulette, craps, horse racing, crash, plinko, mines, keno and more.">

<title>Gilded Comet Casino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Jost:wght@400;500;600;700&family=Limelight&display=swap">
<style>
:root {
  /* Layout: an art-deco casino floor at night. Marquee header, brass game rail on the left, felt tables as the stage, live-wins ticker at the foot. */
  --velvet: #1a0910;
  --velvet-2: #26101a;
  --velvet-3: #361726;
  --velvet-4: #4a2034;
  --line: rgba(236, 198, 110, .22);
  --line-2: rgba(236, 198, 110, .45);
  --felt: #0f4d39;
  --felt-2: #0a3829;
  --felt-3: #16694d;
  --felt-ink: rgba(247, 239, 220, .78);
  --wood: #5a2c17;
  --wood-2: #3a1a0c;
  --gold: #ecc66e;
  --gold-2: #c89a3e;
  --gold-3: #7d5a1e;
  --ivory: #f7efdc;
  --muted: #c4ad96;
  --dim: #8f7867;
  --ruby: #d33a4f;
  --ruby-2: #9e1f33;
  --sapphire: #4a7fe0;
  --win: #6fe0a0;
  --loss: #ff8080;
  --ink: #14070c;
  --card: #fbf6ea;
  --font-display: 'Limelight', 'Bodoni 72', Didot, Georgia, serif;
  --font-body: 'Jost', 'Futura', 'Century Gothic', 'Avenir Next', system-ui, sans-serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;
  --font-suit: 'DejaVu Sans', 'Segoe UI Symbol', 'Apple Symbols', 'Noto Sans Symbols 2', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background-color: var(--velvet);
  background-image:
    radial-gradient(ellipse 90% 60% at 50% -15%, rgba(236, 198, 110, .12), transparent 70%),
    radial-gradient(circle at 50% 100%, transparent 0 14px, rgba(236, 198, 110, .055) 14px 15px, transparent 15px 21px, rgba(236, 198, 110, .055) 21px 22px, transparent 22px);
  background-size: 100% 100%, 46px 23px;
  background-attachment: fixed;
  color: var(--ivory);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 70; background: #2a0f1b; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; font-weight: 400; }
p { margin: 0; }
button { font-family: inherit; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- buttons ---------- */
.btn {
  appearance: none; border: 1px solid var(--gold-3); color: var(--ivory);
  background: linear-gradient(180deg, var(--velvet-4), var(--velvet-3));
  font: 500 14px/1 var(--font-body); letter-spacing: .04em; padding: 10px 16px; border-radius: 999px;
  cursor: pointer; transition: background .15s, border-color .15s, transform .08s, opacity .15s; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; text-decoration: none;
}
.btn:hover:not(:disabled) { border-color: var(--gold); background: linear-gradient(180deg, #5c2a40, var(--velvet-4)); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.gold { background: linear-gradient(180deg, #fbe5a3, #dcae52 50%, #b5862f); color: var(--ink); border-color: #fbe5a3; font-weight: 700; box-shadow: 0 2px 0 #6b4a14, 0 6px 18px rgba(236, 198, 110, .22); }
.btn.gold:hover:not(:disabled) { background: linear-gradient(180deg, #fff0bf, #e8bd62 50%, #c29236); }
.btn.ruby { background: linear-gradient(180deg, #e2546a, #a9243a); border-color: #f08a9a; font-weight: 600; }
.btn.ruby:hover:not(:disabled) { background: linear-gradient(180deg, #ef6479, #b82c43); }
.btn.green { background: linear-gradient(180deg, #4cc487, #1f8a55); border-color: #9be8bf; font-weight: 700; color: #04170d; }
.btn.green:hover:not(:disabled) { background: linear-gradient(180deg, #62d798, #26a063); }
.btn.ghost { background: rgba(0, 0, 0, .18); border-color: var(--line); }
.btn.big { font-size: 16px; padding: 14px 26px; text-transform: uppercase; letter-spacing: .14em; min-height: 50px; }
.btn.sm { font-size: 12.5px; padding: 7px 11px; min-height: 30px; }
.btn.icon { padding: 0; width: 38px; height: 38px; }
.btn.icon svg { width: 18px; height: 18px; }
.btn.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); color: var(--gold); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; background: rgba(0, 0, 0, .25); flex-wrap: wrap; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 13px/1 var(--font-body); padding: 8px 12px; border-radius: 999px; cursor: pointer; }
.seg button.on { background: var(--gold); color: var(--ink); font-weight: 700; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }

/* ---------- app shell ---------- */
.app { min-height: 100%; display: flex; flex-direction: column; }
.topbar { position: relative; z-index: 50; background: linear-gradient(180deg, #2a0f1b, #1d0b13); border-bottom: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0, 0, 0, .45); }
@media (min-width: 900px) { .topbar { position: sticky; top: env(safe-area-inset-top, 0px); } }
.topbar-in { display: flex; align-items: center; gap: 14px 22px; flex-wrap: wrap; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo { position: relative; display: grid; justify-items: center; text-decoration: none; color: inherit; padding: 9px 18px 7px; border: 1px solid var(--gold-3); border-radius: 6px; background: radial-gradient(ellipse at 50% 0%, #3d1626, #1d0b13 80%); flex: none; }
.logo-word { font-family: var(--font-display); font-size: 25px; letter-spacing: .07em; line-height: 1.05; background: linear-gradient(180deg, #fff4c8 10%, #ecc66e 45%, #a87a28 56%, #f6dc94 85%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo-sub { font: 500 9.5px/1.4 var(--font-body); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.bulbs { position: absolute; inset: -4px; pointer-events: none; }
.bulbs i { position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #5c4521; animation: chase 1.2s steps(1) infinite; }
@keyframes chase { 0% { background: #fff6cc; box-shadow: 0 0 7px 2px rgba(255, 214, 120, .85); } 33.3% { background: #5c4521; box-shadow: none; } }
.vip { display: grid; gap: 5px; min-width: 190px; flex: 1 1 200px; max-width: 320px; }
.vip-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.vip-tier { font: 400 15px var(--font-display); letter-spacing: .08em; }
.vip-bar { height: 7px; border-radius: 99px; background: rgba(0, 0, 0, .45); border: 1px solid var(--line); overflow: hidden; }
.vip-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-2), #fff0b8); transition: width .5s; }
.purse { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.plaque { display: grid; padding: 5px 16px 6px; border-radius: 8px; border: 1px solid var(--gold-2); background: linear-gradient(180deg, #2c1606, #170a03); box-shadow: inset 0 1px 0 rgba(255, 230, 160, .25), 0 0 0 3px rgba(0, 0, 0, .3); min-width: 150px; text-align: right; }
.plaque small { font-size: 9.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.plaque strong { font: 500 21px/1.15 var(--font-mono); font-variant-numeric: tabular-nums; color: #ffe7a6; text-shadow: 0 0 12px rgba(255, 200, 90, .35); transition: color .3s; }
.plaque.up strong { color: var(--win); }
.plaque.down strong { color: var(--loss); }

.layout { flex: 1; display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 36px; }
.rail { position: sticky; top: 104px; align-self: start; display: grid; gap: 14px; max-height: calc(100vh - 120px); overflow: auto; padding-right: 4px; scrollbar-width: thin; }
.rail h4 { font: 600 10.5px var(--font-body); letter-spacing: .28em; text-transform: uppercase; color: var(--dim); margin: 2px 0 4px 10px; }
.rail-group { display: grid; gap: 2px; }
.rail a { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--ivory); text-decoration: none; font-size: 14px; border: 1px solid transparent; }
.rail a svg { width: 22px; height: 22px; color: var(--gold); }
.rail a:hover { background: rgba(236, 198, 110, .07); }
.rail a.active { background: linear-gradient(90deg, rgba(236, 198, 110, .18), rgba(236, 198, 110, .03)); border-color: var(--line); }
.rail a .new { font: 700 9px var(--font-body); letter-spacing: .14em; color: var(--ink); background: var(--gold); border-radius: 4px; padding: 2px 4px; margin-left: 6px; vertical-align: 2px; }
@media (max-width: 899px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 12px 28px; }
  .rail { position: static; max-height: none; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 6px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
  .rail h4 { display: none; }
  .rail-group { display: flex; gap: 6px; }
  .rail a { grid-template-columns: 20px auto; white-space: nowrap; background: rgba(0, 0, 0, .25); border-color: var(--line); padding: 7px 12px; font-size: 13px; }
  .rail a svg { width: 18px; height: 18px; }
  .rail a .new { display: none; }
  .vip { order: 3; max-width: none; flex-basis: 100%; }
  .purse { margin-left: auto; }
}
@media (max-width: 520px) {
  .logo-word { font-size: 21px; }
  .plaque { min-width: 0; }
  .plaque strong { font-size: 18px; }
  .purse { width: 100%; justify-content: space-between; }
}
main { min-width: 0; }
.view { animation: viewIn .35s ease both; }
@keyframes viewIn { from { opacity: .3; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- game frame ---------- */
.ghead { display: flex; align-items: flex-end; gap: 10px 18px; flex-wrap: wrap; margin-bottom: 14px; }
.ghead h2 { font: 400 clamp(26px, 4vw, 38px)/1 var(--font-display); letter-spacing: .03em; color: var(--gold); }
.ghead p { color: var(--muted); max-width: 60ch; }
.ghead .sp { flex: 1; }
.ghead .sess { font: 500 12px var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: rgba(0, 0, 0, .25); }
.ghead .sess b { font-weight: 500; }
.ghead .sess b.pos { color: var(--win); }
.ghead .sess b.neg { color: var(--loss); }
.panel { background: linear-gradient(180deg, rgba(58, 23, 38, .75), rgba(30, 12, 20, .85)); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.panel h3 { font: 600 11px var(--font-body); letter-spacing: .26em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.rail-wood { border-radius: 26px; padding: 12px; background: linear-gradient(180deg, #6b3519, #3d1a0a 60%, #2a1006); box-shadow: inset 0 2px 0 rgba(255, 200, 150, .22), inset 0 -3px 0 rgba(0, 0, 0, .45), 0 14px 40px rgba(0, 0, 0, .5); }
.felt { position: relative; border-radius: 18px; background: radial-gradient(ellipse 80% 70% at 50% 25%, var(--felt-3), var(--felt) 55%, var(--felt-2)); box-shadow: inset 0 0 0 2px rgba(236, 198, 110, .35), inset 0 0 60px rgba(0, 0, 0, .45); color: var(--felt-ink); }
.felt::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: .35; background-image: radial-gradient(rgba(255, 255, 255, .06) 1px, transparent 1.4px); background-size: 4px 4px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.lbl { font: 600 10.5px var(--font-body); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.field { display: grid; gap: 5px; }
.field select, .field input[type=number], .field input[type=text] { background: rgba(0, 0, 0, .35); border: 1px solid var(--line); color: var(--ivory); border-radius: 8px; padding: 8px 10px; font: 500 14px var(--font-mono); min-height: 38px; }
.msg { min-height: 1.5em; font: 500 15px var(--font-body); letter-spacing: .02em; }
.msg.win { color: var(--win); }
.msg.lose { color: var(--loss); }
.msg.gold { color: var(--gold); }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
@media (max-width: 1100px) { .two-col { grid-template-columns: minmax(0, 1fr); } }
.hist { display: flex; gap: 5px; flex-wrap: wrap; }
.pill { font: 600 12px/1 var(--font-mono); padding: 5px 8px; border-radius: 999px; background: rgba(0, 0, 0, .35); border: 1px solid var(--line); color: var(--ivory); }
.pill.r { background: #9e1f33; border-color: #e8697b; }
.pill.b { background: #17171c; border-color: #555; }
.pill.g { background: #1f8a55; border-color: #7fdcae; }
.pill.gold { background: #7d5a1e; border-color: var(--gold); color: #fff1c6; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { font: 600 10.5px var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 7px 8px; border-bottom: 1px solid rgba(236, 198, 110, .08); font-variant-numeric: tabular-nums; }
table.data td.n, table.data th.n { text-align: right; font-family: var(--font-mono); }

/* ---------- bet input ---------- */
.betin { display: grid; gap: 6px; }
.betin-row { display: flex; align-items: stretch; border: 1px solid var(--gold-3); border-radius: 10px; overflow: hidden; background: rgba(0, 0, 0, .4); }
.betin-row button { appearance: none; border: 0; background: rgba(236, 198, 110, .08); color: var(--gold); font: 600 16px var(--font-mono); width: 38px; cursor: pointer; }
.betin-row button:hover:not(:disabled) { background: rgba(236, 198, 110, .18); }
.betin-row input { flex: 1; min-width: 0; width: 100px; border: 0; background: transparent; color: #ffe7a6; text-align: center; font: 500 17px var(--font-mono); padding: 8px 4px; -moz-appearance: textfield; }
.betin-row input::-webkit-outer-spin-button, .betin-row input::-webkit-inner-spin-button { -webkit-appearance: none; }
.betin-quick { display: flex; gap: 4px; }
.betin-quick button { flex: 1; appearance: none; border: 1px solid var(--line); background: rgba(0, 0, 0, .25); color: var(--muted); border-radius: 6px; font: 600 11.5px var(--font-mono); padding: 5px 0; cursor: pointer; }
.betin-quick button:hover:not(:disabled) { color: var(--gold); border-color: var(--gold-3); }
.betin button:disabled { opacity: .35; cursor: not-allowed; }

/* ---------- chips ---------- */
.chip { --c: #c8323f; --e: #f6eedb; --t: #fff; position: relative; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; flex: none;
  background: radial-gradient(circle, var(--c) 0 56%, transparent 57%), repeating-conic-gradient(var(--e) 0 13deg, var(--c) 13deg 45deg);
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .22), 0 2px 0 rgba(0, 0, 0, .55), 0 5px 10px rgba(0, 0, 0, .35); color: var(--t); }
.chip::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--e) 70%, transparent); }
.chip b { position: relative; font: 700 11px/1 var(--font-mono); letter-spacing: -.02em; }
.chip.sm { width: 30px; height: 30px; }
.chip.sm::before { inset: 5px; border-width: 1px; }
.chip.sm b { font-size: 9px; }
.chip.xs { width: 22px; height: 22px; }
.chip.xs::before { inset: 4px; border-width: 1px; }
.chip.xs b { font-size: 7.5px; }
.chip-tray { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 10px; border-radius: 999px; background: linear-gradient(180deg, #2a1006, #160803); border: 1px solid var(--gold-3); box-shadow: inset 0 2px 6px rgba(0, 0, 0, .6); }
.chip-btn { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; transition: transform .12s; }
.chip-btn:hover { transform: translateY(-2px); }
.chip-btn.on { transform: translateY(-4px); }
.chip-btn.on .chip { box-shadow: 0 0 0 2px var(--gold), 0 0 14px 2px rgba(236, 198, 110, .7), 0 4px 0 rgba(0, 0, 0, .5); }
.spot { position: relative; cursor: pointer; }
.spot-chip { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 3; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .5)); animation: chipIn .18s ease-out; }
.spot-chip.stack::after { content: ""; position: absolute; inset: 0; border-radius: 50%; z-index: -1; transform: translate(0, 3px); background: rgba(0, 0, 0, .55); }
@keyframes chipIn { from { transform: translate(-50%, -90%) scale(1.15); opacity: 0; } }
.spot.win { animation: spotWin .9s ease 2; }
@keyframes spotWin { 50% { box-shadow: 0 0 0 3px var(--gold), 0 0 26px rgba(236, 198, 110, .9); } }
.spot.lose .spot-chip { animation: chipLose .6s ease forwards; }
@keyframes chipLose { to { opacity: 0; transform: translate(-50%, -160%) scale(.6); } }
.spot:disabled, .spot.off { opacity: .45; cursor: not-allowed; }

/* ---------- playing cards ---------- */
.card { --w: 70px; position: relative; width: var(--w); height: calc(var(--w) * 1.4); perspective: 700px; flex: none; }
.card .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3, .7, .3, 1); }
.card.down .inner { transform: rotateY(180deg); }
.card .face { position: absolute; inset: 0; border-radius: calc(var(--w) * .09); backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.card .front { background: linear-gradient(155deg, #fffef8, var(--card) 60%, #efe6d0); color: #1c1c24; border: 1px solid rgba(0, 0, 0, .14); box-shadow: 0 1px 0 rgba(0, 0, 0, .2), 0 5px 12px rgba(0, 0, 0, .38); }
.card.red .front { color: #c3263d; }
.card .back { transform: rotateY(180deg); border: calc(var(--w) * .05) solid #f4ead2; box-shadow: 0 5px 12px rgba(0, 0, 0, .38);
  background: radial-gradient(circle at 50% 50%, transparent 0 18%, rgba(236, 198, 110, .55) 18.5% 20%, transparent 20.5%),
    repeating-linear-gradient(45deg, transparent 0 6px, rgba(236, 198, 110, .38) 6px 7px), repeating-linear-gradient(-45deg, transparent 0 6px, rgba(236, 198, 110, .38) 6px 7px), linear-gradient(160deg, #8a1c32, #4e0d1d); }
.card .idx { position: absolute; display: flex; flex-direction: column; align-items: center; font: 600 calc(var(--w) * .21)/.95 var(--font-body); letter-spacing: -.04em; }
.card .idx i { font: normal calc(var(--w) * .17)/1 var(--font-suit); }
.card .idx.tl { top: 5%; left: 6%; }
.card .idx.br { bottom: 5%; right: 6%; transform: rotate(180deg); }
.card .pips { position: absolute; inset: 9% 20%; }
.card .pips span { position: absolute; transform: translate(-50%, -50%); font: calc(var(--w) * .2)/1 var(--font-suit); }
.card .pips span.f { transform: translate(-50%, -50%) rotate(180deg); }
.card .pips span.ace { font-size: calc(var(--w) * .5); }
.card .court { position: absolute; inset: 15% 19%; border: 1.5px solid currentColor; border-radius: 4px; display: grid; place-items: center; align-content: center; gap: 2px; background: linear-gradient(180deg, rgba(236, 198, 110, .28), rgba(236, 198, 110, .06)); box-shadow: inset 0 0 0 2px var(--card), inset 0 0 0 3px rgba(200, 154, 62, .7); }
.card .court b { font: 400 calc(var(--w) * .36)/1 var(--font-display); }
.card .court i { font: normal calc(var(--w) * .2)/1 var(--font-suit); }
.card.glow .front { box-shadow: 0 0 0 3px var(--gold), 0 0 22px rgba(236, 198, 110, .85); }
.card.dim { filter: brightness(.55) saturate(.6); transition: filter .3s; }
.card.sm { --w: 52px; }
.card.xs { --w: 38px; }

/* A table layout of bet spots. Bets sit on the felt until the round settles.

class BetBoard {
  constructor(game, tray, opts = {}) { this.game = game; this.tray = tray; this.bets = {}; this.hist = []; this.last = null; this.spots = {}; this.locked = false; this.immediate = !!opts.immediate; this.onChange = opts.onChange || null; this.small = opts.small || 'sm'; }
  spot(key, node, opts = {}) {
    this.spots[key] = { el: node, ...opts };
    node.classList.add('spot');
    node.addEventListener('click', e => { e.preventDefault(); this.add(key, this.tray.value); });
    node.addEventListener('contextmenu', e => { e.preventDefault(); this.remove(key); });
    return node;
  }
  total() { let t = 0; for (const k in this.bets) t += this.bets[k]; return r2(t); }
  allowed(key) { const sp = this.spots[key]; return !(sp && sp.can && !sp.can()); }
  add(key, amt, silent) {
    if (this.locked) { if (!silent) toast('Bets are closed right now', 'bad'); return false; }
    const sp = this.spots[key]; if (!sp) return false;
    if (sp.can && !sp.can()) { if (!silent) { toast(sp.why || 'That bet is not open right now', 'bad'); Sound.play('error'); } return false; }
    if (sp.max) { const room = sp.max() - (this.bets[key] || 0); if (room <= 0) { if (!silent) toast('That bet is at its limit', 'bad'); return false; } amt = Math.min(amt, room); }
    if (this.immediate) { if (!Wallet.take(amt, this.game, silent)) return false; }
    else if (this.total() + amt > S.balance + 1e-9) { if (!silent) { toast(`Not enough chips. Balance ${fmt(S.balance)}`, 'bad'); Sound.play('error'); } return false; }
    this.bets[key] = r2((this.bets[key] || 0) + amt); this.hist.push([key, amt]);
    if (!silent) Sound.play('chip');
    this.render(key); this.onChange && this.onChange();
    return true;
  }
  remove(key) {
    if (this.locked || !this.bets[key]) return;
    const sp = this.spots[key]; if (sp && sp.fixed && sp.fixed()) { toast('That bet is working and cannot come down', 'bad'); return; }
    if (this.immediate) Wallet.refund(this.bets[key], this.game);
    delete this.bets[key]; this.hist = this.hist.filter(h => h[0] !== key);
    Sound.play('click'); this.render(key); this.onChange && this.onChange();
  }
  undo() { while (this.hist.length) { const [k, a] = this.hist.pop(); if (!this.bets[k]) continue; const sp = this.spots[k]; if (sp && sp.fixed && sp.fixed()) continue; if (this.immediate) Wallet.refund(a, this.game); this.bets[k] = r2(this.bets[k] - a); if (this.bets[k] <= 0) delete this.bets[k]; Sound.play('click'); this.render(k); this.onChange && this.onChange(); return; } }
  clear() { for (const k of Object.keys(this.bets)) this.remove(k); }
  commit() { this.last = { ...this.bets }; }
  rebet(mult = 1) {
    if (!this.last) { toast('No previous bet to repeat'); return; }
    if (!this.immediate) { this.bets = {}; this.hist = []; for (const k in this.spots) this.render(k); }
    let ok = true; for (const k in this.last) if (!this.add(k, r2(this.last[k] * mult), true)) ok = false;
    Sound.play('chip'); if (!ok) toast('Some bets could not be placed', 'bad');
  }
  double() { const cur = { ...this.bets }; let ok = true; for (const k in cur) if (!this.add(k, cur[k], true)) ok = false; Sound.play('chip'); if (!ok) toast('Not enough chips to double everything', 'bad'); }
  set(key, amt) { if (amt > 0) this.bets[key] = r2(amt); else delete this.bets[key]; this.render(key); this.onChange && this.onChange(); }
  render(key) {
    const sp = this.spots[key]; if (!sp) return;
    const old = sp.el.querySelector(':scope > .spot-chip'); if (old) old.remove();
    sp.el.classList.remove('lose', 'win');
    const amt = this.bets[key];
    if (amt > 0) { const c = chipEl(amt, this.small); c.classList.add('spot-chip'); if (amt > chipDef(amt).v) c.classList.add('stack'); sp.el.append(c); }
    sp.el.classList.toggle('has-bet', amt > 0);
  }
  mark(key, kind) { const sp = this.spots[key]; if (!sp) return; sp.el.classList.remove('win', 'lose'); void sp.el.offsetWidth; sp.el.classList.add(kind); }
  lock(b) { this.locked = b; }
}

      const tot = slip.reduce((a, b) => a + b.stake, 0);
      if (tot > 0 && !Wallet.take(tot, 'horses')) return;
      racing = true; goB.disabled = true; addB.disabled = true; paintCard(); paintSlip();
      plans = card.runners.map(h => HR.plan(card, h));
      standings = plans.map(() => ({ x: 0, v: 0, fin: 0 }));
      const winT = Math.min(...plans.map(p => p.finish));
      rate = winT / (REDUCED ? 6 : 19); tRace = 0; lastT = performance.now(); said.clear(); lastLeader = -1; finishOrder = [];
      Sound.play('bell'); banner.textContent = 'The stalls open…';
      let gallopT = 0;
      await new Promise(res => {
        const step = now => {
          const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
          tRace += dt * rate;
          plans.forEach((p, i) => { standings[i].x = HR.posAt(p, tRace); if (!standings[i].fin && tRace >= p.finish) { standings[i].fin = p.finish; finishOrder.push(i); } });
          const ord = paintPositions();
          const frac = ord[0].x / card.D; commentary(ord, frac);
          if (visible && now - gallopT > 300) { gallopT = now; Sound.play('gallop'); }
          if (visible) draw(now);
          if (finishOrder.length < 8) requestAnimationFrame(step); else res();
        };
        requestAnimationFrame(step);
      });
      /* results */
      const fins = finishOrder.map(i => ({ i, t: plans[i].finish }));
      const close = fins[1].t - fins[0].t < .06;
      if (close) { photo.hidden = false; Sound.play('whoosh'); banner.textContent = 'Photo finish! The judge is looking at it…'; await sleep(1800); photo.hidden = true; }
      done = true; racing = false;
      const pos = fins.map(f => f.i);
      const marg = k => HR.margin((fins[k].t - fins[k - 1].t) * plans[fins[k - 1].i].v[8]);
      const W1 = card.runners[pos[0]];
      const m1 = marg(1), by = m1 === 'dead heat' ? 'in a blanket finish' : /^\d|distance/.test(m1) ? 'by ' + m1 : 'by a ' + m1;
      banner.textContent = `${W1.name} wins${close ? ' the photo' : ''} ${by}! ${card.runners[pos[1]].name} 2nd, ${card.runners[pos[2]].name} 3rd.`;
      Sound.play('fanfare');
      /* settle the slip */
      let back = 0;
      for (const b of slip) {
        const s = b.sel;
        b.won = b.type === 'win' ? pos[0] === s[0] : b.type === 'place' ? pos.slice(0, 2).includes(s[0]) : b.type === 'show' ? pos.slice(0, 3).includes(s[0]) : b.type === 'exacta' ? pos[0] === s[0] && pos[1] === s[1] : pos[0] === s[0] && pos[1] === s[1] && pos[2] === s[2];
        if (b.won) { back += b.stake * b.price; if (b.type === 'win' && card.runners[s[0]].frac[0] / card.runners[s[0]].frac[1] >= 10) unlock('longshot'); if (b.type === 'exacta' || b.type === 'trifecta') unlock('exacta'); }
      }
      back = r2(back);
      if (back > 0) { Wallet.give(back, 'horses', tot); Sound.play('cash'); toast(`Your slip returns ${fmt(back)}`, 'good'); }
      else if (tot > 0) toast('Your slip is a loser this time.', 'bad');
      paintSlip(true);
      /* official result in the positions panel */
      posEl.innerHTML = '';
      fins.forEach((f, k) => { const h = card.runners[f.i]; posEl.append(el('div', null, el('b', null, String(k + 1)), el('span', { class: 'silk', style: `background:${silkCSS(h.silks)};width:20px;height:20px` }), el('span', null, `${h.no}. ${h.name}`), el('span', { class: 'gap' }, k ? marg(k) : `${h.frac[0]}/${h.frac[1]}`))); });
      goB.hidden = true; nextB.hidden = false; goB.disabled = false;
    }
    goB.addEventListener('click', run);
    nextB.addEventListener('click', () => {
      raceNo++; card = HR.newCard(raceNo); slip = []; done = false; standings = [];
      nextB.hidden = true; goB.hidden = false; banner.textContent = `Race ${raceNo} is up next. The runners are going to post.`;
      paintHead(); paintCard(); paintSels(); paintSlip(); posEl.innerHTML = ''; idleStandings(); draw(performance.now()); Sound.play('click');
    });
    function idleStandings() { standings = card.runners.map(() => ({ x: 0, v: 0, fin: 0 })); paintPositions(); }
    this.onShow = () => { visible = true; draw(performance.now()); };
    this.onHide = () => { visible = false; };
    paintHead(); paintCard(); paintSels(); paintSlip(); idleStandings();
    banner.textContent = `Race ${raceNo}: the runners are going to post.`;
    draw(performance.now());
  },
});
})();

/* ---- boot.js ---- */
/* ---------- start ---------- */
document.getElementById('statsBtn').append(iconSVG('stats'));
boot();

</script>
