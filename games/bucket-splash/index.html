const SND={ctx:null,master:null,sfxG:null,musG:null,nb:null,fg:null,ff:null,flowState:'',next:0,step:0};
function audioInit(){
  try{
    if(!SND.ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      const a=new AC(); SND.ctx=a;
      const m=a.createGain(); m.gain.value=0.7; m.connect(a.destination); SND.master=m;
      SND.sfxG=a.createGain(); SND.sfxG.gain.value=SAVE.snd?0.85:0; SND.sfxG.connect(m);
      SND.musG=a.createGain(); SND.musG.gain.value=SAVE.mus?0.32:0; SND.musG.connect(m);
      const len=(a.sampleRate*1.5)|0, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      SND.nb=buf;
      const s=a.createBufferSource(); s.buffer=buf; s.loop=true;
      const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=0.7;
      const g=a.createGain(); g.gain.value=0;
      s.connect(f); f.connect(g); g.connect(SND.sfxG); s.start();
      SND.fg=g; SND.ff=f; SND.next=a.currentTime+0.1;
    }
    if(SND.ctx.state==='suspended') SND.ctx.resume();
  }catch(e){}
}
function nb(dur,f0,f1,vol,type='lowpass',delay=0,q=1,dest){
  const a=SND.ctx; if(!a) return; const t=a.currentTime+delay;
  const s=a.createBufferSource(); s.buffer=SND.nb;
  const f=a.createBiquadFilter(); f.type=type; f.Q.value=q;
  f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dest||SND.sfxG); s.start(t,Math.random()*0.5); s.stop(t+dur+0.05);
}
function tn(f0,f1,dur,vol,type='sine',delay=0,dest,at){
  const a=SND.ctx; if(!a) return; const t=at!=null?at:a.currentTime+delay;
  const o=a.createOscillator(); o.type=type;
  o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest||SND.sfxG); o.start(t); o.stop(t+dur+0.05);
}
function sfx(n){
  if(!SND.ctx||!SAVE.snd) return;
  if(G.mode==='attract'&&n!=='click'&&n!=='pop') return;
  try{switch(n){
    case 'splash': nb(0.8,5000,300,0.8); nb(0.3,1800,600,0.35,'bandpass',0.05,0.8); tn(160,50,0.3,0.3); break;
    case 'smallsplash': nb(0.4,4000,400,0.35); break;
    case 'mega': for(let i=0;i<4;i++) nb(1.1,6000,250,0.7,'lowpass',i*0.06); tn(120,40,0.6,0.5); break;
    case 'cheer': for(let i=0;i<6;i++){const f=rand(380,700); tn(f,f*rand(1.3,1.8),rand(0.25,0.45),0.04,'triangle',rand(0,0.25));} nb(0.6,2600,1400,0.1,'bandpass',0,0.6); break;
    case 'pop': tn(500,900,0.09,0.13); break;
    case 'tap': tn(320,240,0.06,0.1,'triangle'); break;
    case 'click': tn(700,700,0.05,0.1,'square'); break;
    case 'boing': tn(180,620,0.22,0.18); tn(620,300,0.15,0.08,'sine',0.2); break;
    case 'brr': { const a=SND.ctx,t=a.currentTime; const o=a.createOscillator(); o.type='square'; o.frequency.value=90;
      const lfo=a.createOscillator(); lfo.frequency.value=28; const lg=a.createGain(); lg.gain.value=40; lfo.connect(lg); lg.connect(o.frequency);
      const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.06,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);

// little chiptune loop (16 steps per bar, 4 bars)
const BASS=[48,48,55,55,57,57,53,55], LEAD=[72,76,79,76,74,77,81,77,72,76,79,84,83,79,76,74];
const midi=n=>440*Math.pow(2,(n-69)/12);
function musicTick(){
  const a=SND.ctx; if(!a||!SAVE.mus) { if(a) SND.next=a.currentTime+0.05; return; }
  const stepDur=60/132/4;
  if(SND.next<a.currentTime) SND.next=a.currentTime+0.05;
  while(SND.next<a.currentTime+0.25){
    const s=SND.step, t=SND.next, bar=(s>>4)&3, inBar=s&15;
    if(inBar%4===0) tn(130,45,0.18,0.5,'sine',0,SND.musG,t);
    if(inBar%4===2) nb(0.05,8000,6000,0.08,'highpass',t-a.currentTime,1,SND.musG);
    if(inBar===4||inBar===12) nb(0.12,2500,800,0.18,'bandpass',t-a.currentTime,0.8,SND.musG);
    if(inBar%2===0){ const bn=BASS[(bar*2+(inBar>>3))%8]; tn(midi(bn-12),midi(bn-12),stepDur*1.8,0.22,'triangle',0,SND.musG,t); }
    if(G.screen==='game'&&(s%2===0)){ const ln=LEAD[(inBar+bar*3)%16]; if(Math.random()<0.75) tn(midi(ln),midi(ln),stepDur*1.6,0.045,'square',0,SND.musG,t); }
    SND.next+=stepDur; SND.step=(s+1)%64;
  }
}

function dock(c,s){ if(c.filling) undock(c); c.filling=s; s.user=c; c.x=s.spot.x; c.y=s.spot.y; c.vx=c.vy=0; c.face=-1; }
function undock(c){ if(c.filling){ const s=c.filling; if(s.user===c) s.user=null; s.flow=false; } c.filling=null; c.tapH=c.tapC=false; }

/* ---------- soaking ---------- */
function soak(t,w,by,o={}){
  if(t.fly||!w||w.vol<=0.5) return 0;
  if(t.umbrella>0&&!o.noBlock){
    t.umbrella--; floater('BLOCKED ☂️',t.x,t.y-130,'#ffd23f',18); sfx('clonk');
    addPuddle(t.x+rand(-30,30),t.y+4,w);
    for(let i=0;i<14;i++) addP({type:'drop',x:t.x+rand(-30,30),y:t.y-120,vx:rand(-150,150),vy:rand(-100,40),g:1000,life:1,size:rand(2,4),col:rgbs(waterRGB(w)),gy:t.y+rand(0,10)});
    return 0;
  }
  const cat=tempCat(w.temp), light=!!o.light, vol=w.vol*(o.share||1);
  t.wet=Math.max(t.wet,light?0.6:1); t.drench=light?0.6:1; t.drenchCol=waterRGB(w);
  t.heat=light?cat.heat*0.5:cat.heat;
  t.wetness=Math.min(100,t.wetness+vol*(light?0.35:0.6));
  if(w.soap) t.foam=light?3.5:7;
  if(w.dye){ t.dye={col:w.dye.col,name:w.dye.name,t:light?20:40}; }
  if(w.ice) for(let i=0;i<(light?3:8);i++) addP({type:'ice',x:t.x+rand(-10,10),y:t.y-100,vx:rand(-120,120),vy:rand(-200,-60),g:900,life:1.2,size:rand(4,6),rot:rand(0,6),vr:rand(-8,8),gy:t.y+rand(0,8)});
  addPuddle(t.x,t.y+3,w);
  // interrupt
  const wasSlipping=t.slipT>0;
  cancelAct(t);
  undock(t);
  if(t.isP&&G.ambushT>0&&t===K.Matthew&&!light) G.surviveHits=(G.surviveHits||0)+1;
  const stun=(cat.big?1.25:(cat.key==='cold'||cat.key==='hot')?0.85:0.45)*(light?0.45:1)*(t.isP?0.55:1);
  t.stunT=Math.max(t.stunT,stun);
  t.setMood(cat.mood,Math.max(stun,light?0.8:1.6));
  if(!t.isP||!light) t.say(light?pick(L.splashZone):pick(cat.lines),light?1.3:2,!light);
  // George off the tap if hit
  if(G.george&&G.george.g===t&&G.george.phase==='on') georgeLeave('splashed',by);
  // points
  let mult=o.mult||1;
  if(by&&!by.isP) mult*=0.85;
  if(by&&by.isP){
    if(!o.noCombo&&!light){
      if(now-G.lastHitAt<4.5) G.combo++; else G.combo=1;
      G.lastHitAt=now;
      if(G.combo>=2){ G.comboPop=1; chEvent({type:'combo',n:G.combo}); }
    }
    mult*=Math.min(2.5,1+0.2*(Math.max(1,G.combo)-1));
    if(G.ambushT>0&&t===K.Matthew){ mult*=2; chEvent({type:'ambushHit'}); }
    if(wasSlipping) chEvent({type:'hitSlip'});
  }
  let pts=Math.max(light?3:5,Math.round(vol*cat.mult*mult));
  if(!light){ if(w.george) pts+=50; if(w.soap) pts+=30; if(w.dye) pts+=40; if(w.ice) pts+=20; }
  if(by&&by!==t){
    by.m.pts+=pts; by.m.dealt++; if(cat.key==='freezing') by.m.freezes++; if(cat.key==='scald') by.m.boils++;
    if(inMatch()){ SAVE.chars[by.name].splashes++; }
    if(by.isP&&!o.mega){ G.meter=Math.min(1,G.meter+pts/1600); }
  }
  t.m.taken++; t.lastHitBy=by;
  if(inMatch()) SAVE.chars[t.name].soaked++;
  if(!t.isP&&by&&by!==t&&Math.random()<0.4) t.revenge=by;
  // feedback
  const involvesP=(by&&by.isP)||t.isP;
  if(o.quiet){
    floater(`${cat.emoji}${by&&by.isP?' +'+pts:''}`,t.x,t.y-130,'#fff',17,1.2);
  } else if(involvesP&&!light){
    floater(`${cat.label} ${cat.emoji}`,t.x,t.y-176,cat.col,cat.big?28:22);
    if(by&&by.isP) later(0.2,()=>floater(`+${pts}`,t.x,t.y-150,'#fff',24));
    if(w.dye) later(0.4,()=>floater(`DYED ${w.dye.name}! ${w.dye.e}`,t.x,t.y-200,rgbs(w.dye.col),17));
  } else if(involvesP||cat.big){
    floater(`${cat.emoji}${by&&by.isP?' +'+pts:''}`,t.x,t.y-120,'#fff',16,1.1);
  }
  if(!light||involvesP){ sfx(cat.sfx); }
  if(cat.big&&!light){ G.shake=Math.max(G.shake,involvesP?10:5); if(involvesP) confetti(t.x,t.y-90,22); }
  if(t.isP){
    G.flash={col:rgbs(waterRGB(w)),t:0,life:light?0.35:0.6,a:light?0.18:0.35};
    G.shake=Math.max(G.shake,light?3:9); sfx('hurt');
    if(!light) toast(`${by&&by!==t?by.name:'The tap'} got you! ${cat.label} ${cat.emoji}`,cat.col,1.8);
  }
  if(by&&by.isP&&!light) chEvent({type:'soak',t:t.name,T:w.temp,dye:!!w.dye});
  // laughter from onlookers
  if(!light&&(cat.big||cat.key==='cold'||cat.key==='hot')){
    const near=KIDS.filter(k=>k!==t&&k!==by&&!k.isP&&!k.stunT&&dist(k,t)<300);
    shuffle(near).slice(0,2).forEach((k,i)=>later(0.2+i*0.2,()=>{ k.setMood('laugh',1.6); k.say(pick(L.laughBig),1.4); }));
  }
  return pts;
}

/* ---------- dumps ---------- */
function startDump(c,t,opt={}){
  if(c.bucket.vol<5||c.act) return false;
  undock(c);
  const side=Math.sign(c.x-t.x)||c.face;
  c.face=-side; c.vx=c.vy=0;
  c.act={type:'dump',t:0,lift:c.isP?0.2:0.34,pour:0.3,target:t,gx:t.x,gy:t.y,side,poured:false,mult:opt.mult||1,brain:!!opt.brain,tilt:0};
  if(t.isP) c.warnT=0.6;
  if(!c.isP&&Math.random()<0.4) c.say(pick(['GOTCHA 😈','SURPRISE','hehehe']),1);
  sfx('pop');
  return true;
}
function resolveDump(c,a){
  const w=cloneW(c.bucket);
  const inArea=(k,rx,ry)=>{ const ex=(k.x-a.gx)/rx, ey=(k.y-a.gy)/ry; return ex*ex+ey*ey<1; };
  const cands=KIDS.filter(k=>k!==c&&!k.fly&&inArea(k,44,30));
  let prim=cands.includes(a.target)?a.target:null;
  if(!prim&&cands.length) prim=cands.sort((p,q)=>Math.hypot(p.x-a.gx,p.y-a.gy)-Math.hypot(q.x-a.gx,q.y-a.gy))[0];
  sfx('splash');
  if(prim){
    let mult=a.mult;
    if(a.brain){ mult*=2; c.brainT=0; }
    if(c.boilBonus){ mult*=1.5; c.boilBonus=false; }
    soak(prim,w,c,{mult});
    const zone=KIDS.filter(k=>k!==c&&k!==prim&&!k.fly&&inArea(k,90,48)&&Math.random()<0.7);
    zone.forEach((k,i)=>later(0.15+i*0.08,()=>soak(k,w,c,{light:true,share:0.3,mult:a.mult})));
    if(c.isP){ if(zone.length) later(0.4,()=>floater(`SPLASH ZONE ×${zone.length}!`,a.gx,a.gy-226,'#5ed0ff',18)); chEvent({type:'multi',n:1+zone.length}); }
    if(c.isP||prim.isP) G.shake=Math.max(G.shake,6);
  } else {
    addPuddle(a.gx,a.gy,w);
    floater('MISS 💨',a.gx,a.gy-100,'#cfe3ff',16,1); sfx('miss');
    if(a.target&&a.target.isP){ G.dodges++; floater('DODGED! 🕺 +20',a.target.x,a.target.y-140,'#a3e635',20); a.target.m.pts+=20; chEvent({type:'dodge'}); }
  }
}

function shove(by){

  const gev=G.george;
  if(gev&&gev.phase==='on'&&dist(by,gev.sink.spot)<120){ pokeGeorge(by); return; }
  let best=null,bd=80;
  for(const k of KIDS){ if(k===by||k.fly||k.forcePose) continue; const d=dist(k,by); if(d<bd){bd=d;best=k;} }
  if(!best){ return; }
  const dx=(best.x-by.x)||by.face, dy=best.y-by.y, d=Math.hypot(dx,dy)||1;
  best.vx=dx/d*420; best.vy=dy/d*260; best.stunT=Math.max(best.stunT,0.35); best.wob=1;
  undock(best); cancelAct(best);
  best.say(pick(L.poke),1,true);
  if(best.bucket.vol>30&&Math.random()<0.5){ const w=cloneW(best.bucket); w.vol*=0.5; best.bucket.vol*=0.5; later(0.1,()=>{ soak(best,w,by,{light:true,share:1}); best.say(pick(L.spill),1.2,true); }); }

function threatTo(c){
  let best=null,bd=170;
  for(const k of KIDS){
    if(k===c) continue;
    if(k.act&&k.act.type==='dump'&&k.act.target===c) return k;
    if(k.bucket.vol>=30&&((k.ai.target===c&&!k.isP)||(k.isP&&dist(k,c)<130))){ const d=dist(k,c); if(d<bd){bd=d;best=k;} }
  }
  return best;
}
function pickTarget(c){
  if(G.ambushT>0&&c!==K.Matthew) return K.Matthew;
  let best=null,bw=0;
  for(const k of KIDS){
    if(k===c||k.fly||k.forcePose) continue;
    let w=1;
    if(k.isP) w*=G.mode==='free'?1.25:1.5;
    if(c.revenge===k) w*=3.2;
    if(k===K.Matthew) w*=1.35;
    if(c.lastTarget===k) w*=0.4;
    if(k.hatT>0) w*=1.5;
    w/=1+dist(c,k)/450;
    w*=rand(0.5,1.5);
    if(w>bw){bw=w;best=k;}
  }
  c.revenge=null; c.lastTarget=best;
  return best;
}
function chooseSource(c){
  const free=SINKS.filter(s=>!s.blocked&&!s.user&&!(s===MSINK&&mattActive()));
  const sink=free.sort((a,b)=>dist(c,a.spot)-dist(c,b.spot))[0];
  if(G.rack.length&&mattActive()&&(!sink||Math.random()<0.55||dist(c,RACK_SPOT)<dist(c,sink.spot))) c.ai.src={type:'rack'};
  else if(sink) c.ai.src={type:'sink',sink};
  else c.ai.src=null;
}

  c.tapH=c.ai.plan==='hot'||c.ai.plan==='mix'; c.tapC=c.ai.plan==='cold'||c.ai.plan==='mix';
  if(Math.random()<0.4) c.say(pick(c.ai.plan==='hot'?L.fillHot:c.ai.plan==='cold'?L.fillCold:L.fillMix),1.5);
}
function wander(c){ const a=c.ai; if(Math.hypot(a.wx-c.x,a.wy-c.y)<10||Math.random()<0.05){ a.wx=clamp(c.x+rand(-200,200),FLOOR.x0+20,FLOOR.x1-20); a.wy=clamp(c.y+rand(-80,80),FLOOR.y0+20,FLOOR.y1); } }

function aiThink(c){
  const a=c.ai;
  if(c.stunT>0||c.slipT>0||c.act||c.fly||c.forcePose||c.frozen) return;
  if(G.george&&G.george.g===c) return;
  if(c===K.Matthew&&!c.isP){ mattThink(c); return; }
  if(c.hatT>0){ a.wx=clamp(c.x+rand(-90,90),FLOOR.x0,FLOOR.x1); a.wy=clamp(c.y+rand(-40,40),FLOOR.y0,FLOOR.y1); return; }
  if(a.state!=='flee'&&!c.filling){
    const th=threatTo(c);
    if(th&&Math.random()<c.fear*0.5){ a.state='flee'; a.t=rand(0.7,1.5); a.threat=th; if(Math.random()<0.4) c.say(pick(L.flee),1.1); }
  }
  if(a.state==='flee'){
    if(a.t<=0||!a.threat){ a.state='idle'; }
    else { const th=a.threat, dx=c.x-th.x, dy=c.y-th.y, d=Math.hypot(dx,dy)||1; a.wx=clamp(c.x+dx/d*180,FLOOR.x0,FLOOR.x1); a.wy=clamp(c.y+dy/d*110,FLOOR.y0,FLOOR.y1); c.sprint=true; return; }
  }
  c.sprint=false;
  if(G.ambushT>0&&c.bucket.vol<30&&!K.Matthew.isP&&c!==K.Matthew){ c.bucket=Object.assign(newWater(),{vol:85,temp:pick([2,6,70,80])}); puffAt(c.x,c.y-30,5); }
  if(c.filling){
    if(c.bucket.vol>=a.goal||c.filling.blocked){ undock(c); a.state='hunt'; a.target=null; }
    return;
  }
  if(c.drying){ if(c.wetness<10||dist(c,DRYER.spot)>40){ c.drying=false; } else return; }
  if(c.wetness>85&&Math.random()<0.25&&!G.ambushT){ a.state='dry'; }
  if(a.state==='dry'){ if(dist(c,DRYER.spot)<20){ c.drying=true; a.state='idle'; c.say(pick(L.dry),1.4); } else { a.wx=DRYER.spot.x+rand(-6,6); a.wy=DRYER.spot.y; } return; }
  // grab nearby pickups
  for(const p of G.pickups){ if(Math.hypot(p.x-c.x,p.y-c.y)<160&&Math.random()<0.5){ a.wx=p.x; a.wy=p.y; return; } }
  if(c.bucket.vol<25){
    if(a.state!=='getWater'||!a.src) { a.state='getWater'; chooseSource(c); }
    const s=a.src;
    if(!s){ wander(c); return; }
    if(s.type==='rack'){
      if(!G.rack.length||!mattActive()){ a.src=null; return; }
      if(dist(c,RACK_SPOT)<24) { takeRack(c); a.state='hunt'; a.target=null; }
      else { a.wx=RACK_SPOT.x; a.wy=RACK_SPOT.y; c.sprint=dist(c,RACK_SPOT)>250; }
    } else {
      const sk=s.sink;
      if(sk.blocked||(sk.user&&sk.user!==c)){ a.src=null; return; }
      if(dist(c,sk.spot)<14){ dock(c,sk); a.goal=rand(55,100); setTapsPref(c); }
      else { a.wx=sk.spot.x; a.wy=sk.spot.y; }
    }
    return;
  }
  // hunting
  a.state='hunt';
  const t=a.target;
  if(!t||t===c||t.fly||t.forcePose||(G.ambushT>0&&t!==K.Matthew&&c!==K.Matthew)) { a.target=pickTarget(c); return; }
  const d=dist(c,t);
  if(d<60&&c.actCD<=0){ startDump(c,t); return; }
  if(d>150&&d<400&&c.throwCD<=0&&Math.random()<c.aggro*0.3){
    const lead=0.28+d/1150;
    startThrow(c,t.x+t.vx*lead*rand(0.4,0.9),t.y+t.vy*lead*rand(0.4,0.9),{target:t});
    c.throwCD=rand(2,4.5); return;
  }
  const side=c.x<t.x?-1:1;
  a.wx=clamp(t.x+side*40,FLOOR.x0,FLOOR.x1); a.wy=clamp(t.y-4,FLOOR.y0,FLOOR.y1);
  c.sprint=d>220&&Math.random()<c.aggro;
  if(Math.random()<0.03) c.say(pick(L.hunt),1.2);
}

function nearestSink(c,r=40){ let best=null,bd=r; for(const s of SINKS){ const d=dist(c,s.spot); if(d<bd){bd=d;best=s;} } return best; }
function playerInteract(){
  const P=G.P; if(!P||P.stunT>0||P.act||P.fly||P.slipT>0) return;
  if(nearestSink(P)) return; // E is the cold tap at sinks
  if(dist(P,RACK_SPOT)<60&&mattActive()){ if(!takeRack(P)) toast('Rack is empty — Matthew is filling one!','#fff',1.4); return; }
  for(const s of STALLS) if(dist(P,s.spot)<55){ if(G.swapT>0){ toast('Already flushed!','#fff',1); } else { flush(P); } return; }
}
function playerSplash(pt){
  const P=G.P; if(!P||P.stunT>0||P.act||P.fly||P.slipT>0||P.forcePose||G.mega) return;
  if(P.bucket.vol<6){ toast("Bucket's empty! Fill it at a sink (hold Q/E) or grab one from Matthew (E)",'#fff',2.2); sfx('tap'); return; }
  let target=kidAt(pt), perfect=false;
  if(target===P) target=null;
  if(P.brainT>0){ let best=null,bd=1e9; for(const k of KIDS){ if(k===P||k.fly) continue; const d=Math.hypot(k.x-pt.x,k.y-pt.y); if(d<bd){bd=d;best=k;} } target=best; perfect=true; }
  if(target&&dist(P,target)<=95){ startDump(P,target,{brain:perfect}); return; }
  let tx=target?target.x:pt.x, ty=target?target.y:pt.y;
  if(perfect&&target){ const d=dist(P,target), lead=0.28+d/1150; tx=target.x+target.vx*lead; ty=target.y+target.vy*lead; }
  ty=clamp(ty,FLOOR.y0,FLOOR.y1);
  const dx=tx-P.x, dy=ty-P.y, d=Math.hypot(dx,dy), R=420;
  if(d>R&&!perfect){ tx=P.x+dx/d*R; ty=P.y+dy/d*R; }
  startThrow(P,tx,ty,{perfect,target});
}
function playerSpace(){
  const P=G.P; if(!P) return;
  let best=null,bd=95; for(const k of KIDS){ if(k===P||k.fly) continue; const d=dist(k,P); if(d<bd){bd=d;best=k;} }
  if(best&&P.bucket.vol>=6&&!P.act&&P.stunT<=0) startDump(P,best,{brain:P.brainT>0});
  else playerSplash(G.mouse);
}

    const dx=b.x-a.x, dy=(b.y-a.y)*1.6, d=Math.hypot(dx,dy);

function update(dt){
  for(let i=timers.length-1;i>=0;i--){ if(now>=timers[i].at){ const t=timers[i]; timers.splice(i,1); t.r(); } }
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i]; tw.t+=dt; const k=Math.min(1,tw.t/tw.dur), e=tw.ez(k);
    for(const p in tw.props) tw.o[p]=lerp(tw.from[p],tw.props[p],e);
    if(k>=1){ tweens.splice(i,1); tw.res(); }
  }
  const play=G.screen==='game';
  // player intents
  const P=G.P;
  if(P&&play){
    const moving=keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight;
    P.sprint=!!(keys.ShiftLeft||keys.ShiftRight);
    if(moving&&P.filling) undock(P);
    const q=!!keys.KeyQ, e=!!keys.KeyE;
    if((q||e)&&!moving&&!P.act&&P.stunT<=0&&!P.filling&&P.slipT<=0&&!P.fly){
      const s=nearestSink(P);
      if(s&&!s.blocked&&(!s.user||s.user===P)) dock(P,s);
      else if(s&&s.blocked&&!P.warnedBlock){ P.warnedBlock=true; toast('George is in the way! Press F to shove him','#c6ff5e',1.6); }
      else if(s&&s.user&&s.user!==P&&!P.warnedBlock){ P.warnedBlock=true; toast(`${s.user.name} is using this sink`,'#fff',1.2); }
    }
    if(!q&&!e) P.warnedBlock=false;
    if(P.filling){ P.tapH=q; P.tapC=e; if(q||e) G.lastTap=q&&e?'mix':q?'hot':'cold'; }
    P.drying=e&&!P.filling&&dist(P,DRYER.spot)<55&&P.stunT<=0&&!P.act;
    if(P.drying&&Math.random()<dt*3) sfx('dryer');
    // hovering
    G.hover=kidAt(G.mouse);
    if(P.wetness>=99&&!P.drenchedSaid){ P.drenchedSaid=true; toast('You\'re DRENCHED — you\'re slower. Use the hand dryer (hold E)','#7cc7ff',2.4); }
    if(P.wetness<60) P.drenchedSaid=false;
  }
  for(const s of SINKS){ s.flow=false; }
  // AI thinking
  for(const k of KIDS){ if(k.isP) continue; k.ai.think-=dt; if(k.ai.think<=0){ k.ai.think=rand(0.15,0.32); aiThink(k); } }
  for(const k of KIDS) updKid(k,dt);
  separate();
  updProjectiles(dt);
  georgeUpdate(dt);
  // pickups
  for(let i=G.pickups.length-1;i>=0;i--){ const p=G.pickups[i]; p.t+=dt; for(const k of KIDS){ if(!k.fly&&!k.forcePose&&Math.hypot(k.x-p.x,(k.y-p.y)*1.4)<34){ G.pickups.splice(i,1); collect(k,p); break; } } if(p.t>25&&G.pickups[i]===p){ G.pickups.splice(i,1); puffAt(p.x,p.y,5); } }
  // director
  if(!G.mega&&G.screen!=='results'){
    G.evT-=dt; G.pickT-=dt;
    if(G.evT<=0&&G.ambushT<=0&&!G.george&&G.forceT<=0){ triggerEvent(); G.evT=rand(20,32); }
    if(G.pickT<=0){ if(G.pickups.length<3) spawnPickup(); G.pickT=rand(8,13); }
  }
  if(G.ambushT>0){ G.ambushT-=dt; if(G.ambushT<=0) endAmbush(); }
  if(G.mega){ G.megaT=(G.megaT||0)+dt; if(G.megaT>7){ G.mega=null; G.megaB=null; KIDS.forEach(k=>{ k.frozen=false; if(k.act&&k.act.type==='mega') k.act=null; }); } } else G.megaT=0;
  G.swapT=Math.max(0,G.swapT-dt); G.forceT=Math.max(0,G.forceT-dt);
  for(const s of STALLS) s.shake=Math.max(0,s.shake-dt);
  for(const s of SINKS){ const ft=s.flow; s.hotAng=lerp(s.hotAng,ft&&s.hot?1.4:0,Math.min(1,dt*10)); s.coldAng=lerp(s.coldAng,ft&&s.cold?-1.4:0,Math.min(1,dt*10)); }
  // war timer
  if(play&&G.mode==='war'){ G.timer-=dt; if(G.timer<=10&&Math.ceil(G.timer)!==G.lastTick&&G.timer>0){ G.lastTick=Math.ceil(G.timer); sfx('beep'); } if(G.timer<=0){ G.timer=0; endWar(); } }
  if(play) G.elapsed+=dt;
  if(G.ambushT>0&&K.Matthew.isP){ /* survival counter handled in soak via taken count */ }
  // particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt; p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.type==='steam'||p.type==='bubble'||p.type==='air'){ p.vx*=0.98; p.x+=Math.sin(p.t*6+p.size)*0.3; }
    if(p.gy!=null&&p.vy>0&&p.y>=p.gy){
      if(p.type==='drop'&&p.size>2.4&&Math.random()<0.18) addP({type:'drop',x:p.x,y:p.gy-1,vx:rand(-60,60),vy:rand(-120,-40),g:900,life:0.4,size:p.size*0.55,col:p.col,gy:p.gy+2});
      p.t=p.life;
    }
    if(p.t>=p.life) parts.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){ floaters[i].t+=dt; if(floaters[i].t>=floaters[i].life) floaters.splice(i,1); }
  for(let i=puddles.length-1;i>=0;i--){ puddles[i].t+=dt; if(puddles[i].t>=puddles[i].life) puddles.splice(i,1); }
  if(G.banner){ G.banner.t+=dt; if(G.banner.t>=G.banner.life) G.banner=null; }
  if(G.toast){ G.toast.t+=dt; if(G.toast.t>=G.toast.life) G.toast=null; }
  if(G.flash){ G.flash.t+=dt; if(G.flash.t>=G.flash.life) G.flash=null; }
  if(G.comboPop>0) G.comboPop=Math.max(0,G.comboPop-dt*1.5);
  if(now-G.lastHitAt>4.5&&G.combo>0) G.combo=0;
  G.shake=Math.max(0,G.shake-dt*30);
  updateFlowSound();
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#0f1724'; ctx.fillRect(0,0,cv.width,cv.height);
  const sh=G.screen==='pause'?0:G.shake, sx=sh?rand(-sh,sh)*0.5:0, sy=sh?rand(-sh,sh)*0.5:0;
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*(OX+sx*SC),DPR*(OY+sy*SC));
  ctx.save(); ctx.beginPath(); ctx.rect(-20,-20,W+40,H+40); ctx.clip();
  drawBG(); drawSinks(); drawPuddles(); drawProjectiles(true);
  const objs=KIDS.map(k=>({y:k.y,k}));
  for(const p of G.pickups) objs.push({y:p.y-1,p});
  objs.sort((a,b)=>a.y-b.y);
  for(const o of objs){ if(o.k) drawKid(o.k); else drawPickup(o.p); }
  if(G.megaB) drawBucket(G.megaB,'#5ed0ff');
  drawProjectiles(false);
  drawAim();
  drawParts(); drawTags(); drawBubbles(); drawFloaters();
  if(G.flash){ const f=G.flash; ctx.fillStyle=f.col; ctx.globalAlpha=f.a*(1-f.t/f.life); ctx.fillRect(-20,-20,W+40,H+40); ctx.globalAlpha=1; }
  if(G.slowT>0){ ctx.fillStyle=`rgba(120,200,255,${Math.min(0.12,G.slowT*0.2)})`; ctx.fillRect(-20,-20,W+40,H+40); }
  ctx.restore();
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  // vignette
  const vg=ctx.createRadialGradient(640,380,300,640,380,820); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.35)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  if(G.P&&G.P.hatT>0&&G.screen==='game'){ ctx.fillStyle=`rgba(0,0,0,${Math.min(0.85,G.P.hatT*0.6)})`; ctx.fillRect(0,0,W,H); txt('who turned the lights off?? 🪣',640,360,40,'#fff','center',800,OUT,6); }
  G.btns=[];
  if(G.screen==='game'||G.screen==='pause'){ drawBanner(); drawHUD(); if(G.showBoard) drawBoardOverlay(); }
  if(G.screen==='title') { drawBanner(); drawTitle(); }
  else if(G.screen==='select') drawSelect();
  else if(G.screen==='how') drawHow();
  else if(G.screen==='stats') drawStats();
  else if(G.screen==='pause') drawPause();
  else if(G.screen==='results') drawResults();
  drawCursor();
}

function toGame(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left-OX)/SC,y:(e.clientY-r.top-OY)/SC}; }
function kidAt(p){
  if(!p) return null;
  const list=KIDS.slice().sort((a,b)=>b.y-a.y);
  for(const c of list){ const top=c.y-c.hopY-(c.flyH||0)+headOff(c)-24; if(p.x>=c.x-26&&p.x<=c.x+26&&p.y>=top&&p.y<=c.y+20) return c; }
  return null;
}
function handleBtn(id){
  sfx('click');
  if(id==='war') startMatch('war');
  else if(id==='free') startMatch('free');
  else if(id==='char') G.screen='select';
  else if(id==='how') G.screen='how';
  else if(id==='stats') G.screen='stats';
  else if(id==='back') G.screen=G.mode==='attract'?'title':'pause';
  else if(id.startsWith('sel:')){ SAVE.sel=id.slice(4); writeSave(); sfx('pop'); }
  else if(id==='snd'){ SAVE.snd=!SAVE.snd; if(SND.sfxG) SND.sfxG.gain.value=SAVE.snd?0.85:0; writeSave(); }
  else if(id==='mus'){ SAVE.mus=!SAVE.mus; if(SND.musG) SND.musG.gain.value=SAVE.mus?0.32:0; writeSave(); }
  else if(id==='resume'){ G.screen='game'; }
  else if(id==='restart'){ startMatch(G.mode); }
  else if(id==='menu'){ quitToMenu(); }
  else if(id==='again'){ startMatch('war'); }
  else if(id==='reset'){ if(G.resetArm&&performance.now()-G.resetArm<3000){ CREW.forEach(d=>SAVE.chars[d.name]={splashes:0,soaked:0,slips:0,wins:0}); SAVE.best={war:0,free:0}; SAVE.wins=0; SAVE.chal=0; SAVE.megas=0; writeSave(); G.resetArm=0; } else G.resetArm=performance.now(); }
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); audioInit();
  const p=toGame(e); G.mouse=p;
  for(const b of G.btns){ if(inRect(p,b)){ handleBtn(b.id); return; } }
  if(G.screen==='game'){ if(e.button===2) shove(G.P); else playerSplash(p); }
});
cv.addEventListener('pointermove',e=>{ G.mouse=toGame(e); });
cv.addEventListener('contextmenu',e=>e.preventDefault());
const BLOCK=new Set(['Tab','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
window.addEventListener('keydown',e=>{
  if(BLOCK.has(e.code)) e.preventDefault();
  audioInit();
  const first=!keys[e.code]; keys[e.code]=true;
  if(!first) return;
  if(e.code==='Escape'){
    if(G.screen==='game') G.screen='pause';
    else if(G.screen==='pause') G.screen='game';
    else if(['select','how','stats'].includes(G.screen)) G.screen=G.mode==='attract'?'title':'pause';
    return;
  }
  if(e.code==='Enter'){ if(G.screen==='title') startMatch('war'); else if(G.screen==='results') startMatch('war'); return; }
  if(e.code==='KeyM'){ handleBtn('mus'); return; }
  if(e.code==='KeyN'){ handleBtn('snd'); return; }
  if(G.screen!=='game') return;
  if(e.code==='Tab') G.showBoard=true;
  else if(e.code==='KeyE') playerInteract();
  else if(e.code==='KeyF') shove(G.P);
  else if(e.code==='KeyR') useAbility();
  else if(e.code==='KeyX'){ if(G.meter>=1&&!G.mega&&G.P.stunT<=0&&!G.P.act&&!G.P.fly){ G.meter=0; megaSplash(G.P); } else if(G.meter<1){ toast(`Mega meter ${Math.floor(G.meter*100)}% — splash people to charge it`,'#5ed0ff',1.4); } }
  else if(e.code==='Digit1') useItem('ice');
  else if(e.code==='Digit2') useItem('soap');
  else if(e.code==='Digit3') useItem('dye');
  else if(e.code==='Space') playerSpace();
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; if(e.code==='Tab') G.showBoard=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; G.showBoard=false; if(G.screen==='game') G.screen='pause'; });

/* =====================================================================
   LOOP
   ===================================================================== */
let last=performance.now();
function frame(ts){
  let real=(ts-last)/1000; last=ts;
  if(!(real>0)) real=0; real=Math.min(real,0.05);
  const paused=G.screen==='pause'||G.screen==='results'||G.screen==='select'&&G.mode!=='attract'||G.screen==='how'&&G.mode!=='attract';
  if(G.slowT>0){ G.slowT-=real; G.timeScale=0.3; } else G.timeScale=Math.min(1,G.timeScale+real*3);
  const dt=paused?0:real*G.timeScale;
  if(dt>0){ now+=dt; update(dt); }
  else now+=0; // frozen
  G.menuT+=real;
  try{ musicTick(); }catch(e){}
  render();
  requestAnimationFrame(frame);
}
startAttract();
requestAnimationFrame(frame);
window.__bs={async step(n){ for(let i=0;i<n;i++){ now+=1/60; update(1/60); await Promise.resolve(); await Promise.resolve(); } },endWar,G,KIDS,K,SINKS,startMatch,startAttract,megaSplash,startAmbush,startGeorge,flush,spawnPickup,keys,playerSplash,useAbility,shove,get now(){return now;}};
