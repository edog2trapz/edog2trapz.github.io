<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Besieged</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Saira+Condensed:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: full-bleed live tactical map underneath; menus are chamfered steel panels over it, top command bar + scrolling content. One committed dark "ops terminal" look. */
:root{
  color-scheme: dark;
  --bg:#0c1117; --bg2:#10171f; --panel:#141c25; --panel2:#1a2430; --panel3:#212d3a;
  --line:#263240; --line2:#33414f; --fg:#e3e8ed; --muted:#8f9bab; --dim:#5a6878;
  --atk:#f0a53a; --atk-ink:#1d1405; --def:#46b9d0; --def-ink:#04171c;
  --bad:#e5534b; --good:#5bc26e;
  --r0:#9aa4ae; --r1:#5bc26e; --r2:#4c8df6; --r3:#a66cf0; --r4:#f2c14e;
  --fd:'Saira Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --fb:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fm:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
#cv.ingame{cursor:crosshair}
#hud{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:2}
h1,h2,h3,h4{font-family:var(--fd);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.05}
p{margin:0}
button{font:inherit;color:inherit}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.label{font-family:var(--fd);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{--c:var(--panel3);--ink:var(--fg);font-family:var(--fd);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px;line-height:1;color:var(--ink);background:var(--c);border:0;padding:12px 18px;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));transition:filter .12s,transform .12s;white-space:nowrap}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--fg)}
.btn[disabled]{opacity:.42;cursor:not-allowed;filter:none}
.btn.atk{--c:var(--atk);--ink:var(--atk-ink)}
.btn.def{--c:var(--def);--ink:var(--def-ink)}
.btn.ghost{--c:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.btn.big{font-size:22px;padding:16px 28px}
.btn.sm{font-size:13px;padding:8px 12px}
.chip{font-family:var(--fd);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:7px 12px;cursor:pointer;border-radius:2px}
.chip.on{color:var(--fg);border-color:var(--fg);background:var(--panel3)}
.chip:focus-visible{outline:2px solid var(--def);outline-offset:1px}

/* ---------- menu shell ---------- */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(9,13,18,.86),rgba(9,13,18,.74) 40%,rgba(9,13,18,.9));z-index:5}
#top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(12px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:rgba(12,17,23,.92)}
.logo{font-family:var(--fd);font-weight:800;font-size:28px;letter-spacing:.16em;line-height:1;display:flex;align-items:center;gap:10px;cursor:pointer}
.logo b{color:var(--atk);font-weight:800}
.logo i{font-style:normal;color:var(--def)}
.logo svg{width:26px;height:26px}
#nav{display:flex;gap:4px;flex-wrap:wrap}
#nav button{background:none;border:0;font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:15px;color:var(--muted);padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent}
#nav button.on{color:var(--fg);border-color:var(--atk)}
#nav button:hover{color:var(--fg)}
#nav button:focus-visible{outline:2px solid var(--def)}
#nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;background:var(--atk);color:var(--atk-ink);font-size:12px;line-height:18px;text-align:center;border-radius:9px;letter-spacing:0}
.wallet{margin-left:auto;display:flex;align-items:center;gap:14px}
.credits{font-family:var(--fm);font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;color:var(--r4)}
.credits svg{width:16px;height:16px}
.lvl{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;letter-spacing:.08em}
.lvl .bar{width:80px;height:5px;background:var(--line);position:relative}
.lvl .bar i{position:absolute;inset:0 auto 0 0;background:var(--def)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.panel{background:rgba(20,28,37,.92);border:1px solid var(--line);padding:18px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:26px;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.hero{display:flex;flex-direction:column;gap:18px;padding:26px;background:linear-gradient(135deg,rgba(26,36,48,.95),rgba(15,21,28,.92));border:1px solid var(--line);position:relative;overflow:hidden}
.hero h1{font-size:clamp(44px,8vw,86px);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.hero h1 span{color:var(--atk)}
.hero .kicker{font-family:var(--fd);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--def);font-size:14px}
.hero p.lede{color:var(--muted);max-width:52ch;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stats div{background:var(--panel);padding:10px 12px}
.stats b{display:block;font-family:var(--fm);font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--fd);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted)}
.showcase{display:flex;flex-direction:column;gap:12px}
.showcase canvas{width:100%;height:auto;aspect-ratio:16/10;max-width:100%;display:block;background:#0a0f14;border:1px solid var(--line)}
.setup{display:grid;gap:14px}
.setup .opt{display:flex;flex-direction:column;gap:6px}
.controls{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.controls kbd{font-family:var(--fm);font-size:12px;background:var(--panel3);border:1px solid var(--line2);padding:1px 6px;color:var(--fg);white-space:nowrap;justify-self:start}

/* ---------- operators ---------- */
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opcard{position:relative;background:var(--panel);border:1px solid var(--line);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;transition:border-color .12s,background .12s}
.opcard:hover{border-color:var(--line2);background:var(--panel2)}
.opcard.sel{border-color:var(--fg);background:var(--panel2)}
.opcard:focus-visible{outline:2px solid var(--def);outline-offset:1px}
.opcard .em{width:44px;height:44px;display:grid;place-items:center;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.opcard .em svg{width:26px;height:26px}
.opcard h3{font-size:22px;letter-spacing:.08em}
.opcard .role{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:var(--fd)}
.pips{display:flex;gap:3px}.pips i{width:14px;height:4px;background:var(--line2)}.pips i.on{background:var(--fg)}
.opcard .lock{position:absolute;top:10px;right:10px;font-family:var(--fm);font-size:12px;color:var(--r4);display:flex;gap:4px;align-items:center}
.opcard.locked .em,.opcard.locked h3{opacity:.45}
.side-atk{--side:var(--atk)} .side-def{--side:var(--def)}
.opdetail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.opdetail .big-em{width:76px;height:76px;display:grid;place-items:center;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.opdetail .big-em svg{width:44px;height:44px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{font-family:var(--fd);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:12px;padding-top:2px}
.kv dd{margin:0}
.gadget-box{border-left:3px solid var(--side,var(--atk));padding:8px 12px;background:var(--panel2)}
.gadget-box h4{font-size:18px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- items ---------- */
.itemgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.item{position:relative;background:var(--panel);border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;min-width:0}
.item canvas{width:100%;height:auto;aspect-ratio:3/2;display:block;background:#0b1015}
.item .nm{font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.03em;line-height:1.1;overflow-wrap:anywhere}
.item .rt{font-family:var(--fd);font-size:11px;text-transform:uppercase;letter-spacing:.14em}
.item::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc)}
.item.r0{--rc:var(--r0)}.item.r1{--rc:var(--r1)}.item.r2{--rc:var(--r2)}.item.r3{--rc:var(--r3)}.item.r4{--rc:var(--r4)}
.item .rt{color:var(--rc)}
.item.unowned canvas{filter:grayscale(.85) brightness(.5)}
.item.unowned .nm{color:var(--muted)}
.item .tag{position:absolute;top:12px;left:12px;font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;background:var(--fg);color:var(--bg)}
.item .tag.lock{background:rgba(0,0,0,.6);color:var(--muted)}
.item.eq{border-color:var(--fg)}
.item:focus-visible{outline:2px solid var(--def);outline-offset:1px}
.locker-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.locker-top canvas{width:100%;height:auto;aspect-ratio:16/9;max-width:100%;display:block;background:#0a0f14;border:1px solid var(--line)}

/* ---------- store ---------- */
.caches{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cache{background:var(--panel);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative;overflow:hidden}
.cache canvas{width:100%;height:auto;aspect-ratio:2/1;display:block}
.cache h3{font-size:24px;text-transform:uppercase;letter-spacing:.06em}
.odds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;font-family:var(--fm);font-size:11px;text-align:center}
.odds span{padding:4px 0;background:var(--panel2);border-top:2px solid var(--rc)}
.price{font-family:var(--fm);font-weight:700;color:var(--r4);display:inline-flex;align-items:center;gap:5px}
.price svg{width:14px;height:14px}
.owned-n{font-family:var(--fm);font-size:13px;color:var(--muted)}

/* ---------- pick / round / end ---------- */
.screen{position:fixed;inset:0;z-index:6;overflow-y:auto;background:rgba(9,13,18,.94);padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:max(30px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:text}
.overlay{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(6,9,13,.72);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;overflow-y:auto}
.ovbox{background:var(--panel);border:1px solid var(--line2);padding:22px;width:min(760px,100%);display:flex;flex-direction:column;gap:16px;max-height:100%;overflow-y:auto}
.pickhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;max-width:1180px;margin:0 auto 16px}
.pickhead h1{font-size:clamp(34px,6vw,58px);text-transform:uppercase;font-weight:800}
.score{font-family:var(--fm);font-size:28px;font-weight:700;display:flex;gap:12px;align-items:center}
.score .you{color:var(--good)} .score .them{color:var(--bad)}
.pickbody{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.weps{display:flex;gap:8px;flex-wrap:wrap}
.board{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.board th{font-family:var(--fd);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.board td{padding:6px 8px;border-bottom:1px solid var(--line)}
.board tr.me td{background:rgba(240,165,58,.08)}
.board .dead{color:var(--dim);text-decoration:line-through}
.tblwrap{overflow-x:auto}
.result-h{font-size:clamp(40px,8vw,72px);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.result-h.win{color:var(--good)} .result-h.loss{color:var(--bad)}
.rewards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rewards div{background:var(--panel2);padding:12px;border:1px solid var(--line)}
.rewards b{display:block;font-family:var(--fm);font-size:22px}
.rewards span{font-family:var(--fd);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted)}

/* ---------- cache opening ---------- */
#cacheov{background:radial-gradient(circle at 50% 45%,rgba(30,40,54,.92),rgba(5,8,11,.97))}
.co{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(520px,100%)}
.co canvas{width:100%;height:auto;aspect-ratio:1/1;max-width:420px;display:block;cursor:pointer}
.co .reveal{text-align:center;display:flex;flex-direction:column;gap:6px;min-height:92px}
.co .reveal h2{font-size:34px;text-transform:uppercase;letter-spacing:.04em}
.co .reveal .rt{font-family:var(--fd);font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.co .reveal .sub{color:var(--muted);font-size:14px}

.modwrap{display:flex;flex-direction:column;gap:6px;min-width:0}
.modrow{gap:6px}
.modrow .chip{font-size:12px;padding:6px 9px}
.chip.swatch.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--panel3);border:1px solid var(--line2);padding:10px 16px;font-family:var(--fd);font-weight:600;letter-spacing:.06em;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}

/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:4;pointer-events:none}
.stick{position:absolute;bottom:max(26px,env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);pointer-events:auto;touch-action:none}
#stickL{left:max(22px,env(safe-area-inset-left,0px))}
#stickR{right:max(22px,env(safe-area-inset-right,0px))}
.stick .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4)}
#stickR .knob{background:rgba(240,165,58,.35);border-color:rgba(240,165,58,.7)}
#tbtns{position:absolute;right:max(170px,calc(env(safe-area-inset-right,0px) + 160px));bottom:max(30px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(6,50px);gap:7px;pointer-events:auto}
#tbtns button.fire{background:rgba(229,83,75,.55);border-color:rgba(255,140,130,.8)}
#tbtns button{width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,14,19,.55);font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--fg);touch-action:none}
#tbtns button.on{background:rgba(70,185,208,.45)}
#tpause{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,14,19,.55);color:var(--fg);font-weight:700}

@media (max-width:860px){
  .home,.opdetail,.pickbody,.locker-top{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .logo{font-size:22px}
  #nav button{font-size:13px;padding:6px 8px}
  .wallet{margin-left:0}
}
@media (max-width:560px){
  #tbtns{right:auto;left:50%;transform:translateX(-50%);bottom:max(160px,calc(env(safe-area-inset-bottom,0px) + 150px));grid-template-columns:repeat(6,44px);gap:5px}
  #tbtns button{width:44px;height:44px;font-size:10px}
  .stick{width:116px;height:116px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Besieged game view"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>

<div id="touch" hidden>
  <div id="stickL" class="stick" aria-hidden="true"><div class="knob"></div></div>
  <div id="stickR" class="stick" aria-hidden="true"><div class="knob"></div></div>
  <div id="tbtns">
    <button data-k="Mouse0" data-hold="1" class="fire" aria-label="Fire">FIRE</button>
    <button data-k="Mouse2" data-hold="1" aria-label="Aim down sights">AIM</button>
    <button data-k="KeyR" aria-label="Reload">RLD</button>
    <button data-k="KeyX" aria-label="Operator gadget">GAD</button>
    <button data-k="KeyG" aria-label="Grenade">NADE</button>
    <button data-k="KeyF" data-hold="1" aria-label="Interact">USE</button>
    <button data-k="KeyV" aria-label="Melee">HIT</button>
    <button data-k="KeyC" aria-label="Crouch">CRCH</button>
    <button data-k="KeyT" aria-label="Drone or cameras">CAM</button>
    <button data-k="Digit9" aria-label="Swap weapon">SWAP</button>
    <button data-k="KeyQ" data-hold="1" aria-label="Lean left">LEAN◂</button>
    <button data-k="KeyE" data-hold="1" aria-label="Lean right">▸LEAN</button>
  </div>
  <button id="tpause" data-k="Escape" aria-label="Pause">II</button>
</div>

<div id="menu">
  <header id="top">
    <div class="logo" id="logo" title="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2"><path d="M4 4h7v7H4z" stroke="#f0a53a"/><path d="M13 13h7v7h-7z" stroke="#46b9d0"/><path d="M13 4l7 7M4 13l7 7" stroke="#e3e8ed"/></svg>
      <span>BE<b>SIEGED</b></span>
    </div>
    <nav id="nav" aria-label="Main">
      <button data-tab="home" class="on">Play</button>
      <button data-tab="ops">Operators</button>
      <button data-tab="locker">Locker</button>
      <button data-tab="store">Store <span class="badge" id="cacheBadge" hidden>0</span></button>
      <button data-tab="settings">Settings</button>
    </nav>
    <div class="wallet">
      <div class="lvl"><span id="lvlNum">LV 1</span><span class="bar"><i id="lvlBar" style="width:0%"></i></span></div>

function rayCircle(sx,sy,dx,dy,cx,cy,r){
  const ox=sx-cx, oy=sy-cy; const b=ox*dx+oy*dy; const c=ox*ox+oy*oy-r*r; const disc=b*b-c;
  if(disc<0) return -1; const sq=Math.sqrt(disc); let t=-b-sq; if(t<0) t=-b+sq; return t<0?-1:t;
}
// segment AB vs segment CD -> t along AB in [0,1] or -1
function segSeg(ax,ay,bx,by,cx,cy,dx,dy){
  const rX=bx-ax, rY=by-ay, sX=dx-cx, sY=dy-cy; const den=rX*sY-rY*sX; if(Math.abs(den)<1e-9) return -1;
  const t=((cx-ax)*sY-(cy-ay)*sX)/den, u=((cx-ax)*rY-(cy-ay)*rX)/den;
  return (t>=0&&t<=1&&u>=0&&u<=1)?t:-1;
}

  ctx:null, out:null, vol:0.6, nb:null, last:{},

  setVol(v){ this.vol=v; if(this.out) this.out.gain.value=v; },
  ok(){ return !!(this.ctx && this.ctx.state==='running' && this.vol>0); },

function randomMods(wid){ const out={}; for(const k of ['sight','barrel','grip','under']){ const l=allowedMods(wid,k); out[k]=(Math.random()<0.5?defaultMods(wid)[k]:pick(l).id); } return sanitizeMods(wid,out); }
function modStats(wid,mods){
  const s={dmg:1,recoil:1,spread:1,hip:1,noise:1,range:1,zoom:1.3,adsSpeed:1};
  for(const k of ['sight','barrel','grip','under']){ const m=MOD_BY[k][mods[k]]; if(!m) continue;
    if(m.dmg) s.dmg*=m.dmg; if(m.recoil) s.recoil*=m.recoil; if(m.spread) s.spread*=m.spread; if(m.hip) s.hip*=m.hip; if(m.noise) s.noise*=m.noise; if(m.range) s.range*=m.range;
    if(k==='sight'){ s.zoom=m.zoom; if(m.adsSlow) s.adsSpeed/=m.adsSlow; } if(m.adsFast) s.adsSpeed*=m.adsFast; if(k==='barrel'&&m.id==='extended') s.noise*=1.2; }
  return s;
}

function rollItem(odds,minR){
  const tot=odds.reduce((a,b)=>a+b,0); let x=Math.random()*tot, r=0;
  for(r=0;r<5;r++){ x-=odds[r]; if(x<0) break; }
  r=Math.min(4,Math.max(r,minR||0));
  const pool=ITEM_LIST.filter(i=>i.rarity===r && !i.def);
  const un=pool.filter(i=>!Save.owns(i.id));
  return pick((un.length && Math.random()<0.75)?un:pool);
}
function openCacheRoll(type){
  const c=CACHES[type]; const out=[];
  for(let i=0;i<c.items;i++){
    const needG = c.guarantee && i===c.items-1 && !out.some(o=>o.rarity>=c.guarantee);
    out.push(rollItem(c.odds, needG?c.guarantee:0));
  }
  return out.map(it=>Object.assign({it}, Save.grant(it.id)));
}
function featuredToday(){
  const day=new Date().toISOString().slice(0,10); const R=mulberry(hashStr('feat'+day));
  const pickR=(arr)=>arr[Math.floor(R()*arr.length)];
  const cats=['skin','uniform','charm','card']; const out=[];
  cats.forEach((cat,i)=>{ const rr = i===0 ? (R()<0.5?4:3) : 1+Math.floor(R()*3); const pool=ITEM_LIST.filter(x=>x.cat===cat && x.rarity===rr && !x.def); if(pool.length) out.push(pickR(pool)); });
  return out;
}

const MAP_BY_ID=Object.fromEntries(MAPS.map(m=>[m.id,m]));

class Level{
  constructor(map){
    this.map=map||MAPS[0];
    this.t=new Uint8Array(W*H); this.hp=new Float32Array(W*H); this.fk=new Uint8Array(W*H);
    this.panel=new Int16Array(W*H).fill(-1); this.room=new Int8Array(W*H).fill(-1);
    this.low=new Float32Array(W*H); this.panels=[]; this.dirty=[]; this.ver=0;
    this.rooms=this.map.rooms; this.sites=this.map.sites; this.spawns=this.map.spawns; this.camSpots=this.map.cams; this.bld=this.map.bld;
    this.build();
  }
  idx(x,y){ return y*W+x; }
  inb(x,y){ return x>=0&&y>=0&&x<W&&y<H; }
  get(x,y){ return (x<0||y<0||x>=W||y>=H)?T.CON:this.t[y*W+x]; }
  setT(x,y,t){ const i=y*W+x; this.t[i]=t; this.hp[i]=MAXHP[t]||0; }
  solid(x,y){ const t=this.get(x,y); return t===T.CON||t===T.SOFT||t===T.REINF||t===T.PLATE||t===T.BARR||t===T.WIN||t===T.CRATE; }
  solidDrone(x,y){ const t=this.get(x,y); return t===T.CON||t===T.SOFT||t===T.REINF||t===T.PLATE||t===T.WIN||t===T.CRATE; }
  visBlock(x,y){
    if(x<0||y<0||x>=W||y>=H) return true; const i=y*W+x, t=this.t[i];
    if(t===T.CON||t===T.REINF||t===T.PLATE) return true;
    if(t===T.CRATE) return this.low[i]===0;
    if(t===T.SOFT||t===T.BARR||t===T.WIN) return this.hp[i]>MAXHP[t]*0.5;
    return false;
  }
  holed(i){ const t=this.t[i]; return (t===T.SOFT||t===T.BARR||t===T.WIN) && this.hp[i]<=MAXHP[t]*0.5; }
  roomAt(x,y){ x=Math.floor(x); y=Math.floor(y); return this.inb(x,y)?this.room[y*W+x]:-1; }
  insideBld(x,y){ const b=this.bld; return x>=b.x0&&x<=b.x1&&y>=b.y0&&y<=b.y1; }
  onPerim(x,y){ const b=this.bld; return (x===b.x0||x===b.x1)&&y>=b.y0&&y<=b.y1 || (y===b.y0||y===b.y1)&&x>=b.x0&&x<=b.x1; }
  isWallish(x,y){ const t=this.get(x,y); return t===T.CON||t===T.SOFT; }
  furnAt(i){ const k=this.fk[i]; return k?FURN_KEYS[k-1]:null; }
  build(){
    const L=this, b=this.bld;
    const S=(x,y,t)=>{ if(L.inb(x,y)) L.t[y*W+x]=t; };
    const F=(x0,y0,x1,y1,t)=>{ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) S(x,y,t); };
    F(0,0,W-1,H-1,T.GRASS);
    this.ground=new Uint8Array(W*H); // 0 natural, 1 asphalt, 2 gravel, 3 paving
    for(const [x0,y0,x1,y1,k] of (this.map.paved||[])){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ if(!L.inb(x,y)) continue; L.ground[y*W+x]={asphalt:1,gravel:2,paving:3}[k]||1; if(k==='asphalt') L.t[y*W+x]=T.ASPH; } }
    F(b.x0,b.y0,b.x1,b.y1,T.FLOOR);
    F(b.x0,b.y0,b.x1,b.y0,T.SOFT); F(b.x0,b.y1,b.x1,b.y1,T.SOFT); F(b.x0,b.y0,b.x0,b.y1,T.SOFT); F(b.x1,b.y0,b.x1,b.y1,T.SOFT);
    const furnList=[];
    const B={
      set:S, fill:F,
      walls(list){ for(const [x0,y0,x1,y1] of list) F(x0,y0,x1,y1,T.SOFT); },
      pillars(){ const pil=[]; for(let y=0;y<H;y++) for(let x=0;x<W;x++){ if(!L.isWallish(x,y)) continue; const h=L.isWallish(x-1,y)||L.isWallish(x+1,y), v=L.isWallish(x,y-1)||L.isWallish(x,y+1); if(h&&v) pil.push([x,y]); } pil.forEach(([x,y])=>S(x,y,T.CON)); },
      doors(list){ list.forEach(([x,y])=>S(x,y,T.DOOR)); },
      barrs(list){ list.forEach(([x,y])=>S(x,y,T.BARR)); },
      wins(list){ list.forEach(([x,y])=>S(x,y,T.WIN)); },
      furn(list){ list.forEach(f=>furnList.push(f)); },
    };
    this.map.build(B);
    // structural pillars on long exterior runs
    const runPillars=(cells)=>{ let run=0; for(const [x,y] of cells){ if(L.get(x,y)===T.SOFT){ run++; if(run>=7){ S(x,y,T.CON); run=0; } } else run=0; } };
    const top=[],bot=[],lef=[],rig=[]; for(let x=b.x0;x<=b.x1;x++){ top.push([x,b.y0]); bot.push([x,b.y1]); } for(let y=b.y0;y<=b.y1;y++){ lef.push([b.x0,y]); rig.push([b.x1,y]); }
    [top,bot,lef,rig].forEach(runPillars);
    // rooms
    this.rooms.forEach((r,ri)=>{ for(let y=r.y0;y<=r.y1;y++) for(let x=r.x0;x<=r.x1;x++){ const t=this.get(x,y); if(t===T.FLOOR) this.room[y*W+x]=ri; } });
    // furniture
    for(const [x,y,kind] of furnList){
      if(!L.inb(x,y)) continue; const i=y*W+x; const t=L.t[i]; if(t!==T.FLOOR&&t!==T.GRASS&&t!==T.ASPH) continue;
      const r=this.roomAt(x,y); const k=kind||(r>=0?this.rooms[r].furn:'crate'); L.t[i]=T.CRATE; L.fk[i]=FURN_KEYS.indexOf(k)+1;
      if(r<0){ for(const ri in this.rooms){ const R=this.rooms[ri]; if(x>=R.x0&&x<=R.x1&&y>=R.y0&&y<=R.y1){ this.room[i]=+ri; break; } } }
    }
    for(let i=0;i<W*H;i++){ const t=this.t[i]; if(t===T.CRATE){ const f=FURN[this.furnAt(i)]||FURN.crate; this.hp[i]=f.hp; this.low[i]=f.low?f.h:0; } else this.hp[i]=MAXHP[t]||0; }

  }
  computePanels(){
    this.panels=[]; this.panel.fill(-1);
    const soft=(x,y)=>this.get(x,y)===T.SOFT;
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      if(!soft(x,y) || this.panel[y*W+x]>=0) continue;
      const horiz = soft(x-1,y)||soft(x+1,y)||(!soft(x,y-1)&&!soft(x,y+1)&&(this.onPerim(x,y)?(y===this.bld.y0||y===this.bld.y1):true));
      const run=[]; let cx=x, cy=y;
      while(soft(cx,cy) && this.panel[cy*W+cx]<0){ run.push([cx,cy]); if(horiz) cx++; else cy++; }
      let k=0;
      while(k<run.length){
        const rem=run.length-k; const take = rem===4?2:Math.min(3,rem);
        const tiles=run.slice(k,k+take); k+=take;
        const id=this.panels.length;
        const ext=tiles.some(([tx,ty])=>this.onPerim(tx,ty));
        const mid=tiles[Math.floor(tiles.length/2)];
        const p={id,tiles:tiles.map(([tx,ty])=>ty*W+tx),horiz,ext,cx:(tiles[0][0]+tiles[tiles.length-1][0])/2+0.5,cy:(tiles[0][1]+tiles[tiles.length-1][1])/2+0.5,mx:mid[0],my:mid[1]};
        this.panels.push(p); p.tiles.forEach(i=>this.panel[i]=id);
      }
    }
  }
  canReinforce(p){ return p.tiles.every(i=>this.t[i]===T.SOFT && this.hp[i]>=MAXHP[T.SOFT]*0.6); }

/* ---------- messages ---------- */

}

    for(let j=i+1;j<A.length;j++){ const b=A[j]; if(!b.alive) continue;
      const dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy, rr=a.r+b.r;

  const c=L.castRay(a.x,a.y,rx,ry,0.75,(x,y)=>L.solid(x,y)); const off=Math.min(Math.abs(a.lean)*0.4,Math.max(0,c-0.17));

function netEvent(){ if(typeof Net!=='undefined' && Net.role==='host') Net.ev([...arguments]); }
function agentTick(a,dt){

/* ---------- combat ---------- */

function emitNoiseAt(x,y,team,radius){ for(const e of G.agents){ if(!e.alive||!e.ai||e.team===team) continue; if(dist(e.x,e.y,x,y)<radius) e.ai.heard={x,y,t:G.t}; } }
function tryFire(a){

  if(G.netClient && a.isPlayer) Net.shot(a);
  a.kick=Math.min(1,a.kick+(w.type==='Shotgun'||w.type==='DMR'?0.9:0.35));
  a.muzzle=0.05; G.flashes.push({x:a.x+Math.cos(a.angle)*0.7,y:a.y+Math.sin(a.angle)*0.7,a:a.angle,t:0.05});

}
function startReload(a){ const wp=a.wp; if(a.reload>0||wp.reserve<=0||wp.mag>=wp.w.mag) return; a.reload=wp.w.reload; if(a.isPlayer){ Sfx.reload(); if(G.netClient) Net.act('r'); } }

function swapWeapon(a,i){ if(i===a.wi) return; a.wi=i; a.reload=0; a.swapT=0.45; if(a.isPlayer){ Sfx.click(); if(G.netClient) Net.act('w',i); } }
function falloff(w,t){ return t<=w.range*0.5?1:lerp(1,0.55,clamp((t-w.range*0.5)/(w.range*0.7),0,1)); }
function zRange(k,e){

function fireRay(a,ang,w,pitch){

    for(let k=0;k<3;k++) addPart(ex-dx*0.05,ey-dy*0.05,-dx*rand(0.5,2)+rand(-1,1),-dy*rand(0.5,2)+rand(-1,1),rand(0.25,0.5),pc,rand(0.03,0.06),ez,rand(0,2));

  const tg=engaged(a)?b.target:null; const sc=siteCenter(); const dSite=dist(a.x,a.y,sc.x,sc.y);

    case 'disruptor': {
      if(a.gadN<=0) break; let best=null;
      for(const g of G.gadgets){ if(!g.dead&&g.team!==a.team&&(g.type==='trip'||g.type==='node'||g.type==='cam'||g.type==='holo')&&dist(a.x,a.y,g.x,g.y)<8&&aiSee(a,g.x,g.y,8)){ best=g; break; } }
      if(!best) for(const c of G.cams) if(c.alive&&!c.gref&&dist(a.x,a.y,c.x,c.y)<8&&aiSee(a,c.x,c.y,8)){ best=c; break; }
      if(best){ a.angle=Math.atan2(best.y-a.y,best.x-a.x); useGadget(a,best.x,best.y); b.gcd=4; }
      break; }
    case 'launcher': if(tg && tg.kind==='agent' && a.gadN>1 && G.t>=b.reactAt){ const d=dist(a.x,a.y,tg.x,tg.y); if(d>2.6&&d<11){ a.angle=Math.atan2(tg.y-a.y,tg.x-a.x); useGadget(a,tg.x,tg.y); b.gcd=3; } } break;
    case 'aegis': {
      if(a.gadN<=0) break;
      const pl=G.agents.find(o=>o.alive&&o.team===a.team&&o.interact&&o.interact.type==='plant');
      if(pl && dist(a.x,a.y,pl.x,pl.y)<3.5){ const ops=roomOpeningsCached(G.site.room); if(ops.length){ const o=ops.reduce((m,q)=>dist(a.x,a.y,q[0]+0.5,q[1]+0.5)<dist(a.x,a.y,m[0]+0.5,m[1]+0.5)?q:m); a.angle=Math.atan2(o[1]+0.5-a.y,o[0]+0.5-a.x); } useGadget(a); b.gcd=10; }
      else if(tg && tg.kind==='agent' && dist(a.x,a.y,tg.x,tg.y)>6){ a.angle=Math.atan2(tg.y-a.y,tg.x-a.x); useGadget(a); b.gcd=14; }
      break; }
    case 'dash': if(tg && tg.kind==='agent' && a.gadN>0){ const d=dist(a.x,a.y,tg.x,tg.y); if(d>2.5&&d<9&&Math.random()<0.3){ const ang=Math.atan2(tg.y-a.y,tg.x-a.x)+(Math.random()<0.5?1:-1)*Math.PI/2; a.mx=Math.cos(ang); a.my=Math.sin(ang); useGadget(a); b.gcd=5; } } break;
    case 'firewall': if(a.gadN>0 && b.known && G.t-b.known.t<1.5){ const d=dist(a.x,a.y,b.known.x,b.known.y); if(d>3.5&&d<9.5&&G.L.los(a.x,a.y,b.known.x,b.known.y)){ a.angle=Math.atan2(b.known.y-a.y,b.known.x-a.x); useGadget(a,b.known.x,b.known.y); b.gcd=10; } } break;
  }
  if(b.ucd<=0 && a.utilN>0 && b.known && G.t-b.known.t<2 && !tg){
    const d=dist(a.x,a.y,b.known.x,b.known.y);
    if(d>3.4 && d<9 && (a.team==='atk'||Math.random()<0.25)){
      const ang=Math.atan2(b.known.y-a.y,b.known.x-a.x); const clear=G.L.castRay(a.x,a.y,Math.cos(ang),Math.sin(ang),d,(x,y)=>G.L.solid(x,y));

    }

}

/* ================= input ================= */
const Input = {
  keys:new Set(), edge:new Set(), mx:0, my:0, dx:0, dy:0, wheel:0, touchMode:false, locked:false,
  stickL:{active:false,x:0,y:0,mag:0,id:null}, stickR:{active:false,x:0,y:0,mag:0,id:null},
  down(k){ return this.keys.has(k); }, pressed(k){ return this.edge.has(k); },
  press(k){ if(!this.keys.has(k)) this.edge.add(k); this.keys.add(k); }, release(k){ this.keys.delete(k); },
  clear(){ this.keys.clear(); this.edge.clear(); this.stickL.active=this.stickR.active=false; },
  endFrame(){ this.edge.clear(); this.wheel=0; this.dx=0; this.dy=0; },
  lock(){ const cv=$('#cv'); if(this.touchMode||document.pointerLockElement===cv||this.lockFailed) return; if(!cv.requestPointerLock){ this.lockFailed=true; return; } try{ const r=cv.requestPointerLock(); if(r&&r.catch) r.catch(()=>{ this.lockFailed=true; }); }catch(e){ this.lockFailed=true; } },
  unlock(){ try{ if(document.pointerLockElement) document.exitPointerLock(); }catch(e){} },
  init(){
    const inGame=()=>G.running && !G.demo && !UI.overlayOpen();
    window.addEventListener('keydown',e=>{
      if(!inGame()) { if(e.code==='Escape' && UI.cur==='pause') UI.resume(); return; }
      if(['Space','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyQ','KeyF','KeyG','KeyR','KeyC','KeyT','KeyV'].includes(e.code)) e.preventDefault();
      if(!e.repeat) this.press(e.code);
    });
    window.addEventListener('keyup',e=>this.release(e.code));
    window.addEventListener('blur',()=>this.clear());
    const cv=$('#cv');
    window.addEventListener('mousemove',e=>{ this.mx=e.clientX; this.my=e.clientY; if(inGame()&&!this.touchMode&&(this.locked||e.buttons||this.lockFailed)){ this.dx+=e.movementX||0; this.dy+=e.movementY||0; } });
    document.addEventListener('pointerlockerror',()=>{ this.lockFailed=true; });
    document.addEventListener('pointerlockchange',()=>{ this.locked=document.pointerLockElement===cv; if(!this.locked && UI.cur==='game' && G.running && !G.paused && !G.demo && G.phase!=='post') UI.pause(); });
    cv.addEventListener('mousedown',e=>{ if(!inGame()) return; this.touchMode=false; UI.syncTouch(); if(!this.locked && !this.lockFailed){ this.lock(); if(e.button===0) return; } this.press('Mouse'+e.button); e.preventDefault(); });
    window.addEventListener('mouseup',e=>this.release('Mouse'+e.button));
    cv.addEventListener('contextmenu',e=>e.preventDefault());
    cv.addEventListener('wheel',e=>{ if(inGame()){ this.wheel=Math.sign(e.deltaY); e.preventDefault(); } },{passive:false});
    // touch
    const mark=()=>{ if(!this.touchMode){ this.touchMode=true; UI.syncTouch(); } };
    cv.addEventListener('touchstart',e=>{ mark(); if(inGame() && G.player && !G.player.alive){ this.press('KeyE'); setTimeout(()=>this.release('KeyE'),60); } },{passive:true});
    const stick=(el,st)=>{
      const knob=el.querySelector('.knob');
      const upd=(e)=>{ const r=el.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2; let dx=(e.clientX-cx)/(r.width/2), dy=(e.clientY-cy)/(r.height/2); const m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; } st.x=dx; st.y=dy; st.mag=Math.min(1,m); knob.style.transform='translate('+(dx*r.width*0.32)+'px,'+(dy*r.height*0.32)+'px)'; };
      el.addEventListener('pointerdown',e=>{ mark(); st.active=true; st.id=e.pointerId; try{ el.setPointerCapture(e.pointerId); }catch(_){} upd(e); e.preventDefault(); });
      el.addEventListener('pointermove',e=>{ if(st.active&&e.pointerId===st.id) upd(e); });
      const end=e=>{ if(e.pointerId!==st.id) return; st.active=false; st.x=st.y=st.mag=0; knob.style.transform=''; };
      el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
    };
    stick($('#stickL'),this.stickL); stick($('#stickR'),this.stickR);
    $$('#touch button').forEach(b=>{
      const k=b.dataset.k, hold=b.dataset.hold;
      b.addEventListener('pointerdown',e=>{ e.preventDefault(); mark(); if(k==='Escape'){ if(inGame()) UI.pause(); return; } this.press(k); b.classList.add('on'); if(!hold) setTimeout(()=>{ this.release(k); b.classList.remove('on'); },80); });
      const up=()=>{ if(hold){ this.release(k); b.classList.remove('on'); } };
      b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('pointerleave',up);
    });
  },
};

    const u=s.u||[0]; G.uplink=u[0]?{planted:true,x:d50(u[1]),y:d50(u[2]),t:u[3]/10,defused:!!u[4],beep:(G.uplink&&G.uplink.beep)||0}:{planted:false};
    if(G.secure&&s.sc){ G.secure.prog=s.sc[0]/10; G.secure.contested=!!s.sc[1]; }
    if(G.kase&&s.ka){ const k=G.kase; k.x=d50(s.ka[0]); k.y=d50(s.ka[1]); const c=s.ka[2]?byId.get(s.ka[2]):null; if(c!==k.carrier&&c&&c.isPlayer) say('You have the case · get it to an attacker spawn','#f2c14e'); k.carrier=c||null; k.delivered=!!s.ka[3]; }
    if(G.tdm&&s.td){ G.tdm.atk=s.td[0]; G.tdm.def=s.td[1]; }
    for(const e of s.a){ const a=byId.get(e[0]); if(!a) continue; const f=e[6], alive=!!(f&1);
      if(a.isPlayer){ const hx=d50(e[1]), hy=d50(e[2]);
        if((!a.alive&&alive)||dist(a.x,a.y,hx,hy)>2.5){ a.x=a.px=hx; a.y=a.py=hy; }
        if(a.alive&&!alive){ a.alive=false; a.interact=null; G.view.mode='spec'; G.view.spec=nextSpec(null,1); }
        else if(!a.alive&&alive){ a.alive=true; G.view.mode='body'; a.weapons.forEach(w=>{ w.mag=w.w.mag; w.reserve=w.w.mag*w.w.mags; }); }
        a.hp=e[5]; a.gadN=e[12]; a.utilN=e[13]; a.reinf=e[14]; a.carrying=!!(f&256);
        if(!(f&128)&&a.reload<=0&&Math.abs(a.wp.reserve-e[10])>a.wp.w.mag){ a.wp.mag=e[9]; a.wp.reserve=e[10]; }
      } else {
        a.tx=d50(e[1]); a.ty=d50(e[2]); a.ta=e[3]/100; a.pitch=e[4]/100; a.hp=e[5];
        if(a.alive&&!alive){ a.alive=false; } else if(!a.alive&&alive){ a.alive=true; a.x=a.tx; a.y=a.ty; }
        a.crouch=!!(f&2); a.moving=!!(f&4); a.walking=!!(f&8); a.ads=!!(f&16); if(f&64) a.muzzle=0.06; a.reload=(f&128)?Math.max(a.reload,0.4):0; a.carrying=!!(f&256); a.dashT=(f&512)?0.1:0;
        if(a.wi!==e[7]&&(e[7]===0||e[7]===1)){ a.wi=e[7]; } a.leanT=e[8]/10;
        a.interact=e[11]?{type:ITYPES[Math.floor(e[11]/100)-1],t:(e[11]%100)/20,need:1}:null;
      }
      a.rev=(f&32)?G.t+0.4:0; a.kills=e[15]; a.deaths=e[16]; a.score=e[17];
    }
    // gadgets
    const seen=new Set();
    for(const b of (s.g||[])){ const [nid,ti,x,y,tb]=b, type=GTYPES[ti]; seen.add(nid); let g=this.gmap.get(nid);
      if(!g){ g={nid,type,team:tb?'def':'atk',x:d50(x),y:d50(y),r:type==='holo'?0.3:type==='node'?0.18:0.16,hp:1}; this.gmap.set(nid,g);
        if(type==='holo'){ const ow=byId.get(b[6]); g.uni=ow?ow.uni:ITEMS.u_wisp_0; g.skin=ow?ow.wp.skin:null; } }
      g.x=d50(x); g.y=d50(y);
      if(type==='spike'){ g.panel=b[5]; g.t=b[6]/10; g.max=3; } else if(type==='aegis'){ g.x1=d50(b[5]); g.y1=d50(b[6]); g.x2=d50(b[7]); g.y2=d50(b[8]); } else if(type==='trip'){ g.angle=b[5]/100; g.arm=b[6]; } else if(type==='node'){ g.charges=b[5]; } else if(type==='holo'){ g.angle=b[5]/100; }
    }
    for(const [nid,g] of this.gmap) if(!seen.has(nid)){ this.gmap.delete(nid); g.dead=true; }
    G.gadgets=[...this.gmap.values()];
    for(const c of (s.cp||[])){ if(!this.pcams.has(c[0])){ const g=this.gmap.get(c[0])||{type:'cam',x:d50(c[1]),y:d50(c[2])}; const cam={kind:'cam',team:'def',x:d50(c[1]),y:d50(c[2]),r:0.16,alive:true,prism:true,gref:g,name:'Watcher '+(this.pcams.size+1),yaw:c[3]/100,pitch:0,h:1.1}; this.pcams.set(c[0],cam); G.cams.push(cam); } }
    const cm=s.cm||''; G.cams.forEach((c,i)=>{ if(i<cm.length) c.alive=cm[i]==='1'; });
    for(const d of (s.dr||[])){ const dr=G.drones.find(x=>x.owner.id===d[0]); if(!dr) continue; dr.alive=!!d[4]; if(!(G.view.mode==='drone'&&G.view.drone===dr)){ dr.x=d50(d[1]); dr.y=d50(d[2]); dr.angle=d[3]/100; } }
    G.projs=(s.p||[]).map(p=>({type:PTYPES[p[0]],x:d50(p[1]),y:d50(p[2]),t:p[3]/10}));
    G.fires=(s.f||[]).map(f=>({x:d50(f[0]),y:d50(f[1]),r:1.6,t:f[2]/10}));
    for(const [q,i,t,hp] of (s.tl||[])){ if(q<=this.lastTile) continue; this.lastTile=q; if(i<0||i>=W*H) continue; const was=L.t[i]; L.t[i]=t; L.hp[i]=hp; L.markDirty(i%W,(i/W)|0); if(was!==t&&(t===T.RUBBLE||t===T.DOOR||t===T.OPEN)) debris(i%W+0.5,((i/W)|0)+0.5,was===T.SOFT?'#cdbfa6':'#8a6440',8); }
    for(const e of (s.e||[])){ if(e[0]<=this.lastEv) continue; this.lastEv=e[0]; this.clientEvent(e,byId); }
  },
  clientEvent(e,byId){
    const me=G.player;
    switch(e[1]){
      case 'tr': { const a=byId.get(e[2]); if(!a||a===me) break; const ex=e[3]/20, ey=e[4]/20, ez=e[5]/20; G.tracers.push({x1:a.px,y1:a.py,z1:a.eye-0.15,x2:ex,y2:ey,z2:ez,t:0.08,col:a.wp.skin&&a.wp.skin.tracer?a.wp.skin.tracer:(a.team==='atk'?'#ffd38a':'#a8ecff')}); a.muzzle=0.06; if(Sfx.gate('nshot'+a.id,40)) playAt(a.x,a.y,v=>Sfx.shot(a.wp.w.type,v*(a.wp.ms&&a.wp.ms.noise<1?0.45:1))); for(let k=0;k<2;k++) addPart(ex,ey,rand(-1,1),rand(-1,1),0.3,'#cdbfa6',0.04,ez,rand(0,2)); break; }
      case 'hit': { const src=byId.get(e[2]), vic=byId.get(e[3]); if(vic) vic.hurtT=0.25; if(src===me&&vic&&vic.team!==me.team){ G.hitMark=0.16; G.headMark=e[4]?0.25:0; Sfx.hit(); } if(vic===me){ G.dmgFlash=Math.min(1,G.dmgFlash+0.35); Sfx.hurt(); if(src) G.dmgDirs.push({ang:Math.atan2(src.y-me.y,src.x-me.x),t:1.2}); } if(vic) for(let k=0;k<4;k++) addPart(vic.x,vic.y,rand(-1.5,1.5),rand(-1.5,1.5),0.4,'#a3222c',0.05,1.2,rand(0,1.5)); break; }
      case 'kill': { const k=byId.get(e[2]), v=byId.get(e[3]); if(!v) break; G.feed.push({t:G.t,killer:k||null,victim:v,kind:e[4]}); if(G.feed.length>6) G.feed.shift(); G.decals.push({type:'blood',x:v.x,y:v.y,r:rand(0.5,0.75)}); if(k===me){ G.killMark=0.5; Sfx.kill(); } if(v===me) say(G.mode==='skirmish'?'Eliminated · respawning in 5 seconds':'You were eliminated','#e5534b'); break; }
      case 'boom': { const x=e[2]/20, y=e[3]/20, r=e[4]/10; G.booms.push({x,y,r,t:0,max:0.45}); G.decals.push({type:'scorch',x,y,r:r*0.7}); for(let k=0;k<22;k++){ const a=rand(0,TAU), s=rand(1,7); addPart(x,y,Math.cos(a)*s,Math.sin(a)*s,rand(0.4,1),pick(['#ffb347','#ff7a2a','#ffd76a','#5a5f66']),rand(0.06,0.16),rand(0.1,0.8),rand(1,6)); } G.shake=Math.max(G.shake,clamp(1.2-dist(G.view.x,G.view.y,x,y)/14,0,1)); playAt(x,y,v=>Sfx.boom(v)); break; }
    }
  },
  clientRoundEnd(){
    if(this.roundRec) return; this.roundRec=true; const m=G.match, p=G.player; if(!p) return;
    const won=G.result.winner===G.side; if(won) m.roundsWon++;
    m.rounds.push({n:m.round,side:G.side,won,draw:G.result.winner==='draw',reason:G.result.reason,op:p.op.id,k:p.kills,d:G.mode==='skirmish'?p.deaths:(p.alive?0:1),score:p.score});
    m.kills+=p.kills; m.deaths+=G.mode==='skirmish'?p.deaths:(p.alive?0:1); m.score+=p.score+(won?60:0);
    banner(G.result.winner==='draw'?'DRAW':won?'ROUND WON':'ROUND LOST',G.result.reason,G.result.winner==='draw'?'#e3e8ed':won?'#5bc26e':'#e5534b',3.2); Sfx.round(won);
  },
  clientFrame(dt){
    const p=G.player;
    if(!G.running||!G.netClient){ Input.endFrame(); return; }
    if(G.phase==='post'){ G.postT-=dt; if(G.postT<=0&&!this.postShown){ this.postShown=true; G.running=false; UI.roundOver(); Input.endFrame(); return; } }
    if(p){ if(!G.paused) playerControl(dt); else { p.mx=p.my=0; p.leanT=0; } if(p.alive) agentTick(p,dt); }
    for(const a of G.agents){ if(a===p||a.tx==null) continue; const k=Math.min(1,dt*14);
      if(dist(a.x,a.y,a.tx,a.ty)>3){ a.x=a.tx; a.y=a.ty; } else { a.x+=(a.tx-a.x)*k; a.y+=(a.ty-a.y)*k; }
      a.angle=angNorm(a.angle+angDiff(a.angle,a.ta)*k); a.lean+=clamp(a.leanT-a.lean,-dt*7,dt*7); updatePeek(a);
      if(a.moving) a.walkPh+=dt*3.4*2.6*(a.walking?0.5:1)*(a.crouch?0.55:1); if(a.muzzle>0) a.muzzle-=dt; if(a.hurtT>0) a.hurtT-=dt; if(a.reload>0) a.reload-=dt; }
    G.t+=dt; if(G.phase!=='post') G.phaseT=Math.max(0,G.phaseT-dt); if(G.uplink.planted) G.uplink.t=Math.max(0,G.uplink.t-dt);
    computeVision(); updateFx(dt); Input.endFrame();
  },
  clientEnd(fin){ const m=this.ensureMatch(); m.teamWins={1:fin.tw[0],2:fin.tw[1]}; m.you=m.teamWins[m.myTeam]; m.them=m.teamWins[m.myTeam===1?2:1]; G.running=false; G.netClient=false; UI.matchEnd(); },
  drawHUD(ctx,w,h,top,right){
    const n=this.role==='host'?this.players().length:(this.hostPeer()?this.players().length:0);
    ctx.save(); ctx.textAlign='right'; ctx.font='700 11px '+FONT_D; ctx.fillStyle=this.room&&this.room.connected()?'#5bc26e':'#e5534b';
    ctx.fillText((this.role==='host'?'HOSTING ':'ONLINE ')+this.code+' · '+n+' PLAYER'+(n===1?'':'S'),right,h-(Input.touchMode?14:94)); ctx.restore();
  },
};
/* ================= boot ================= */
function boot(data){
  Save.load(data && data.save);
  Sfx.vol=Save.d.settings.vol;
  R.init(); Input.init(); UI.init(); if(typeof Net!=='undefined') Net.init();
  let last=performance.now();
  function frame(now){
    const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now;
    try{
      update(dt); if(typeof Net!=='undefined') Net.frame(dt); R.render(dt,now);
      if(UI.cur!=='game') UI.drawPreviews(now);
      UI.drawCache(now);
    }catch(e){ console.error(e); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
try{ window.claude?.hot?.snapshot?.(()=>({save:Save.d})); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
</script>
