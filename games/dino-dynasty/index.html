<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2526">
<link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<title>Dino Dynasty</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Dino Dynasty by 2trapz games: open fossil packs, collect 36 dinosaurs and grow a tiny island into a dino park empire.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one-screen game. Island stage on the left (top on phones), management panel on the right (bottom on phones). Single dark tropical look. */
:root {
  --ink: #0b2526; --panel: #113334; --panel-2: #164142; --raised: #1d4f50; --raised-2: #256061;
  --line: rgba(220, 255, 240, .09); --text: #eef8f2; --muted: #98bdb2; --dim: #6f958b;
  --sand: #f6e2b3; --gold: #ffc23d; --gold-deep: #c98a12; --gold-ink: #3a2400;
  --coral: #ff6f4a; --coral-deep: #c54a2a; --crystal: #63e6f0; --amber: #ff9f1c; --good: #6be07a; --bad: #ff7a6b;
  --rC: #c3d1cc; --rU: #6be07a; --rR: #4bb0ff; --rE: #b97bff; --rL: #ffb52e; --rM: #ff4f9a;
  --display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ink); color: var(--text); font: 700 14px/1.35 var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--crystal); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; box-sizing: border-box; gap: 8px; }

/* ---------- HUD ---------- */
#hud { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.brand { display: flex; flex-direction: column; line-height: 1; margin-right: auto; min-width: 0; }
.logo { font-family: var(--display); font-size: 26px; letter-spacing: .5px; color: var(--sand); text-shadow: 0 3px 0 #6b3d14, 0 4px 10px rgba(0,0,0,.4); white-space: nowrap; }
.logo em { font-style: normal; color: var(--gold); }
.by { font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.stats { display: flex; gap: 8px; align-items: center; }
.stat { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; font-variant-numeric: tabular-nums; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 19px; letter-spacing: .3px; }
.stat small { color: var(--good); font-weight: 900; font-size: 12px; }
.stat.bump { animation: bump .25s ease; }
@keyframes bump { 50% { transform: scale(1.08); } }
.ico { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.ico.coin { background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc928 45%, #d48e0b); box-shadow: inset 0 -2px 0 rgba(120,60,0,.4); }
.ico.coin::after { content: ''; width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(140,80,0,.55); }
.ico.gem { background: none; }
.ico.gem::before { content: ''; width: 18px; height: 18px; background: linear-gradient(135deg, #e0fdff, #63e6f0 45%, #1aa6b8); clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%); }
.ico.amberi::before { content: ''; width: 18px; height: 20px; border-radius: 50% 50% 45% 45%; background: radial-gradient(circle at 35% 30%, #ffe0a0, #ff9f1c 55%, #b4560a); }
.ico.sm { width: 18px; height: 18px; }
.ico.sm.coin::after { width: 7px; height: 7px; border-width: 1.5px; }
.ico.sm.gem::before { width: 13px; height: 13px; }
.hud-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:hover { background: var(--panel-2); }
a.icon-btn { color: var(--text); text-decoration: none; flex: none; }

/* ---------- buttons ---------- */
.btn { --b: var(--gold); --s: var(--gold-deep); --f: var(--gold-ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 12px; background: var(--b); color: var(--f); box-shadow: 0 4px 0 var(--s); font-family: var(--display); font-size: 16px; letter-spacing: .3px; line-height: 1; transition: transform .06s, box-shadow .06s, filter .1s; white-space: nowrap; font-variant-numeric: tabular-nums; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--s); }
.btn.coral { --b: var(--coral); --s: var(--coral-deep); --f: #fff; }
.btn.teal { --b: #2fb5a5; --s: #1c7f73; --f: #fff; }
.btn.crys { --b: var(--crystal); --s: #2a9eaa; --f: #06393e; }
.btn.ghost { --b: var(--raised); --s: #0f3233; --f: var(--text); }
.btn.sm { padding: 7px 10px; font-size: 14px; border-radius: 10px; }
.btn.lg { padding: 13px 22px; font-size: 20px; border-radius: 14px; }
.btn[disabled], .btn.off { --b: #2a4a4a; --s: #173233; --f: #7f9e96; filter: none; cursor: not-allowed; }
.btn.wide { width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: var(--raised); font-size: 12px; font-weight: 900; white-space: nowrap; }

/* ---------- main layout ---------- */
#main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 12px; }
#world { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 8px; }
#zoneTabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; }
#zoneTabs::-webkit-scrollbar { display: none; }
.ztab { position: relative; flex: 1 0 auto; min-width: 92px; padding: 7px 10px 9px; border-radius: 12px; background: var(--panel); border: 2px solid transparent; text-align: left; overflow: hidden; }
.ztab .zn { font-family: var(--display); font-size: 15px; display: block; letter-spacing: .3px; }
.ztab .zs { font-size: 11px; color: var(--muted); display: block; font-variant-numeric: tabular-nums; }
.ztab.on { border-color: var(--gold); background: var(--panel-2); }
.ztab.locked .zn { color: var(--dim); }
.ztab .fill { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--gold); border-radius: 0 2px 0 0; transition: width .3s; }
.ztab .fill.full { background: var(--coral); animation: pulse 1s infinite; }
.ztab .dot { position: absolute; top: 6px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 3px rgba(255,111,74,.25); }
@keyframes pulse { 50% { opacity: .55; } }
#coach { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: linear-gradient(90deg, #ffe7a8, #ffd166); color: #3a2400; font-weight: 800; }
#coach .step { font-family: var(--display); font-size: 13px; background: #3a2400; color: #ffd166; border-radius: 999px; padding: 2px 8px; flex: none; }
#coach .skip { margin-left: auto; font-size: 12px; text-decoration: underline; opacity: .7; flex: none; }
#stage { position: relative; flex: 1; min-height: 0; border-radius: 18px; overflow: hidden; background: #0f3030; box-shadow: inset 0 0 0 2px rgba(255,255,255,.06); }
#scene { position: absolute; inset: 0; display: block; touch-action: manipulation; cursor: pointer; }
.ov { position: absolute; z-index: 2; }
#zoneInfo { top: 10px; left: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; max-width: 55%; }
.glass { background: rgba(8, 32, 34, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 12px; padding: 7px 11px; }
#zoneInfo .zt { font-family: var(--display); font-size: 18px; line-height: 1.05; letter-spacing: .3px; }
#zoneInfo .zi { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#zoneInfo .zi b { color: var(--good); }
.boost { font-size: 12px; font-weight: 900; padding: 4px 9px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); font-variant-numeric: tabular-nums; }
.boost.fr { background: var(--coral); color: #fff; }
#chestBox { top: 10px; right: 10px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; }
.chest-ico { width: 34px; height: 28px; position: relative; flex: none; }
.chest-ico::before { content: ''; position: absolute; inset: 9px 0 0; border-radius: 4px; background: linear-gradient(#a8662d, #7a4519); box-shadow: inset 0 0 0 2px #4d2a0c; }
.chest-ico::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 12px; border-radius: 10px 10px 2px 2px; background: linear-gradient(#c27a38, #94541f); box-shadow: inset 0 0 0 2px #4d2a0c; }
.chest-ico i { position: absolute; left: 13px; top: 9px; width: 8px; height: 8px; background: var(--gold); border-radius: 2px; z-index: 1; box-shadow: 0 0 0 1.5px #4d2a0c; }
.chest-ico.full { animation: wiggle 1s infinite; }
@keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(-8deg); } 90% { transform: rotate(8deg); } }
.chest-meta { display: flex; flex-direction: column; gap: 3px; min-width: 86px; }
.chest-meta b { font-size: 13px; font-variant-numeric: tabular-nums; }
.cbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
.cbar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
.ranger-tag { font-size: 12px; color: var(--good); font-weight: 900; }
#lockOverlay { inset: 0; display: grid; place-items: center; padding: 16px; z-index: 3; }
.lockcard { background: rgba(8,32,34,.88); border: 1px solid var(--line); border-radius: 18px; padding: 18px; max-width: 420px; width: 100%; text-align: center; display: grid; gap: 12px; justify-items: center; }
.lockcard h3 { margin: 0; font: 400 26px var(--display); color: var(--sand); letter-spacing: .4px; }
.lockcard p { margin: 0; color: var(--muted); font-weight: 700; max-width: 34ch; }
.silrow { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.silrow img { width: 52px; height: 40px; border-radius: 8px; }
#bubble { z-index: 4; transform: translate(-50%, -100%); min-width: 170px; padding: 9px 10px; display: grid; gap: 6px; pointer-events: auto; }
#bubble .bn { font-family: var(--display); font-size: 16px; letter-spacing: .3px; }
#bubble .bm { font-size: 12px; color: var(--muted); }
#bubble .bm b { color: var(--good); }
#bubble .row { display: flex; gap: 6px; }
#bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-top-color: rgba(8,32,34,.72); border-bottom: 0; }

/* ---------- panel ---------- */
#panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-radius: 18px; border: 1px solid var(--line); overflow: hidden; }
#tabs { display: flex; flex: none; padding: 6px; gap: 4px; background: rgba(0,0,0,.18); }
.tab { flex: 1; position: relative; padding: 8px 2px 7px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 900; letter-spacing: .3px; }
.tab svg { width: 22px; height: 22px; }
.tab.on { background: var(--raised); color: var(--text); }
.tab .badge { position: absolute; top: 3px; right: calc(50% - 22px); min-width: 17px; height: 17px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: var(--coral); color: #fff; font-size: 11px; line-height: 17px; text-align: center; }
#panelBody { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
#panelBody::-webkit-scrollbar { width: 8px; } #panelBody::-webkit-scrollbar-thumb { background: var(--raised); border-radius: 4px; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec > h4 { margin: 0; display: flex; align-items: baseline; gap: 8px; font: 400 18px var(--display); letter-spacing: .4px; color: var(--sand); }
.sec > h4 small { font: 800 12px var(--body); color: var(--muted); letter-spacing: 0; }
.sec > h4 .r { margin-left: auto; }
.note { color: var(--muted); font-size: 12.5px; font-weight: 700; margin: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .t { font-family: var(--display); font-size: 16px; letter-spacing: .3px; }
.item .t .lv { font-family: var(--body); font-weight: 900; font-size: 12px; color: var(--gold); margin-left: 4px; }
.item .d { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.item.hl { border-color: rgba(255,194,61,.55); background: linear-gradient(90deg, rgba(255,194,61,.12), transparent 70%), var(--panel-2); }
.uico { width: 44px; height: 44px; border-radius: 12px; flex: none; display: grid; place-items: center; background: var(--raised); }
.uico svg { width: 26px; height: 26px; }

/* packs */
.packs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pack { position: relative; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(160deg, var(--pa), var(--pb)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18), 0 6px 0 rgba(0,0,0,.25); overflow: hidden; }
.pack::before { content: ''; position: absolute; inset: -40% -60%; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.35) 50%, transparent 60%); transform: translateX(-60%); animation: foil 4.5s ease-in-out infinite; pointer-events: none; }
@keyframes foil { 60%, 100% { transform: translateX(60%); } }
.pack .ptitle { font: 400 17px var(--display); letter-spacing: .4px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); line-height: 1.05; }
.pack .psub { font-size: 11px; font-weight: 900; color: rgba(255,255,255,.85); text-transform: uppercase; letter-spacing: 1px; }
.pack img { width: 100%; aspect-ratio: 22/15; max-width: 100%; border-radius: 10px; display: block; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
.pack .pbtns { display: flex; gap: 6px; }
.pack .pbtns .btn { flex: 1; padding-inline: 6px; }
.pack .odds { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.3); color: #fff; font-size: 12px; font-weight: 900; z-index: 1; }
.pack.locked { filter: grayscale(.85) brightness(.6); }
.freebar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: linear-gradient(90deg, rgba(99,230,240,.16), rgba(99,230,240,.04)); border: 1px solid rgba(99,230,240,.3); }
.freebar .grow { flex: 1; min-width: 0; }

/* cards */
.zchips { display: flex; gap: 6px; flex-wrap: wrap; }
.zchip { padding: 6px 10px; border-radius: 999px; background: var(--panel-2); font-size: 12px; font-weight: 900; color: var(--muted); border: 1px solid var(--line); }
.zchip.on { background: var(--sand); color: #3a2400; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.card { --rc: var(--rC); position: relative; border-radius: 12px; padding: 4px 4px 6px; background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--rc); display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; }
.card.r-U { --rc: var(--rU); } .card.r-R { --rc: var(--rR); } .card.r-E { --rc: var(--rE); } .card.r-L { --rc: var(--rL); } .card.r-M { --rc: var(--rM); }
.card.r-E, .card.r-L, .card.r-M { background: linear-gradient(160deg, color-mix(in srgb, var(--rc) 22%, var(--panel-2)), var(--panel-2) 60%); }
.card .art { position: relative; border-radius: 9px; overflow: hidden; aspect-ratio: 22/17; }
.card .art img { width: 100%; height: 100%; display: block; object-fit: cover; }
.card .cname { font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 3px; }
.card .cmeta { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 900; color: var(--rc); padding: 0 3px; text-transform: uppercase; letter-spacing: .4px; }
.card .cmeta span:last-child { color: var(--gold); }
.card .dbar { position: relative; height: 13px; margin: 0 3px; border-radius: 7px; background: rgba(0,0,0,.35); overflow: hidden; }
.card .dbar i { position: absolute; inset: 0 auto 0 0; background: var(--good); border-radius: 7px; }
.card .dbar span { position: relative; display: block; text-align: center; font-size: 9.5px; line-height: 13px; font-weight: 900; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.6); }
.card .dbar.ready i { background: var(--gold); animation: pulse 1s infinite; }
.card .tagp { position: absolute; top: 7px; left: 7px; font-size: 9.5px; font-weight: 900; padding: 1px 6px; border-radius: 6px; background: rgba(8,32,34,.8); color: var(--good); }
.card .tagn { position: absolute; top: 7px; right: 7px; font-size: 10px; font-weight: 900; padding: 1px 6px; border-radius: 6px; background: var(--coral); color: #fff; animation: pop .4s ease; }
.card.unk { --rc: rgba(255,255,255,.12); }
.card.unk .cname, .card.unk .cmeta { color: var(--dim); }
.card.hidden-card { visibility: hidden; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } }
.setbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.setbar .grow { flex: 1; min-width: 0; }
.pbar { height: 8px; border-radius: 4px; background: rgba(0,0,0,.35); overflow: hidden; margin-top: 5px; }
.pbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--good), #b8ff7a); }

/* collector */
.npc { display: flex; gap: 12px; align-items: center; }
.avatar { width: 54px; height: 54px; border-radius: 16px; flex: none; background: linear-gradient(160deg, #ffd59e, #e0904a); display: grid; place-items: center; font: 400 22px var(--display); color: #5a2f0a; box-shadow: inset 0 -4px 0 rgba(0,0,0,.15); }
.req { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.req img { width: 72px; height: 56px; border-radius: 10px; flex: none; }
.req .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.req .who { font-size: 11px; color: var(--muted); font-weight: 900; text-transform: uppercase; letter-spacing: .8px; }
.rewards { display: flex; gap: 6px; flex-wrap: wrap; }

/* achievements & settings */
.achs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ach { padding: 9px 10px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; opacity: .55; }
.ach.done { opacity: 1; border-color: rgba(255,194,61,.5); }
.ach b { font-size: 13px; } .ach span { font-size: 11.5px; color: var(--muted); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.sw { width: 46px; height: 26px; border-radius: 13px; background: #2a4a4a; position: relative; flex: none; transition: background .15s; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw.on { background: var(--good); } .sw.on::after { transform: translateX(20px); }
textarea { width: 100%; box-sizing: border-box; min-height: 70px; border-radius: 10px; background: var(--ink); color: var(--text); border: 1px solid var(--line); padding: 8px; font: 600 11px ui-monospace, Menlo, monospace; resize: vertical; user-select: text; -webkit-user-select: text; }
.stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.stats-grid b { color: var(--text); float: right; font-variant-numeric: tabular-nums; }
.prest { padding: 14px; border-radius: 16px; background: linear-gradient(160deg, #4a2516, #2a1a14); border: 1px solid rgba(255,159,28,.35); display: grid; gap: 10px; }
.prest h5 { margin: 0; font: 400 20px var(--display); color: var(--amber); letter-spacing: .4px; }
.credit { text-align: center; color: var(--dim); font-size: 12px; padding: 4px 0 8px; }
.credit b { color: var(--muted); }

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(3, 16, 17, .72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }

'use strict';
const TAU = Math.PI * 2;

function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

function shade(hex, amt) { // amt -1..1 (negative darkens)

// ---------- drawing primitives ----------
let P = null; // current palette while drawing a dino
function pal(sp, sil) {
  if (sil) { const k = '#173a3c'; return { c: k, d: k, b: k, a: k, ol: '#0b2224', eye: k, horn: k, sil: true, glow: false }; }
  return { c: sp.c, d: shade(sp.c, -0.18), b: sp.b, a: sp.a, ol: shade(sp.c, -0.62), eye: '#1b1b1b', horn: '#f4ecd6', sil: false, glow: sp.f.includes('glow') };
}
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU); }
function fillOl(c, fill, lw) { c.fillStyle = fill; c.fill(); c.lineWidth = lw == null ? 3 : lw; c.strokeStyle = P.ol; c.stroke(); }
function blob(c, x, y, rx, ry, rot, fill, lw) { ell(c, x, y, rx, ry, rot); fillOl(c, fill, lw); }
function limb(c, pts, w, fill) {

}
function qpt(p0, p1, p2, t) { const u = 1 - t; return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]; }
// tapered tube along quadratic bezier
function taper(c, p0, p1, p2, w0, w1, fill, noStroke) {
  const N = 18, L = [], R = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, p = qpt(p0, p1, p2, t), q = qpt(p0, p1, p2, Math.min(1, t + 0.02)), q0 = qpt(p0, p1, p2, Math.max(0, t - 0.02));

function eye(c, x, y, r, st, look) {

function stripes(c, x, y, rx, ry, n, rot) {

  c.strokeStyle = rgba(P.a, 0.55); c.lineWidth = rx * 0.12; c.lineCap = 'round';

function feather(c, x, y, len, ang, w) { c.save(); c.translate(x, y); c.rotate(ang); ell(c, len / 2, 0, len / 2, w); fillOl(c, P.a, 2); c.restore(); }

// ---------- body types (local space: facing right, feet at y=0) ----------
function legPhase(st, off) { return Math.sin(st.phase + off) * st.walk; }

function drawBiped(c, sp, st, kind) {
  const big = kind === 'rex' || kind === 'spino';
  const sway = Math.sin(st.t * 2.2) * 1;
  const L1 = legPhase(st, 0), L2 = legPhase(st, Math.PI);
  const bodyY = -46 - Math.abs(Math.sin(st.phase)) * st.walk * 2 - st.breath;
  const H = sp.f.includes('claws');
  // far leg
  limb(c, [[-8, bodyY + 8], [-4 + L2 * 8, -18], [-6 + L2 * 12, -2]], big ? 12 : 9, P.d);
  blob(c, -2 + L2 * 12, -2, big ? 9 : 7, 3.5, 0, P.d, 2.5);
  // tail
  const tailLen = kind === 'raptor' ? 96 : 86;
  taper(c, [-20, bodyY - 2], [-52, bodyY - 6 + sway * 3], [-tailLen, bodyY + (kind === 'raptor' ? -6 : 8) + sway * 9], big ? 24 : 16, 2, P.c);
  if (kind === 'raptor' && sp.f.includes('feathers') && !P.sil) { for (let i = 0; i < 4; i++) feather(c, -60 - i * 9, bodyY - 4 + sway * (4 + i * 1.5), 12, -2.8 + i * 0.1, 3); }
  // sail
  if (kind === 'spino') {
    c.beginPath(); c.moveTo(-34, bodyY - 10); c.bezierCurveTo(-28, bodyY - 62, 14, bodyY - 66, 26, bodyY - 14); c.closePath();
    fillOl(c, P.sil ? P.c : P.a, 3);
    if (!P.sil) { c.strokeStyle = rgba(shade(P.a, -0.5), 0.6); c.lineWidth = 2; for (let i = 0; i < 6; i++) { const x = -26 + i * 9; c.beginPath(); c.moveTo(x, bodyY - 12); c.lineTo(x + 2, bodyY - 30 - Math.sin(i / 5 * Math.PI) * 26); c.stroke(); } }
  }
  // body
  const brx = big ? 34 : kind === 'pachy' ? 27 : 26, bry = big ? 24 : kind === 'pachy' ? 20 : 16;
  blob(c, 0, bodyY, brx, bry, -0.12, P.c);
  belly(c, 7, bodyY + bry * 0.4, brx * 0.7, bry * 0.55, -0.2);
  if (sp.f.includes('stripes')) stripes(c, -4, bodyY, brx, bry, 4, -0.12);
  if (sp.f.includes('spots')) spots(c, 0, bodyY, brx, bry, -0.12, sp.i * 13);
  ell(c, 0, bodyY, brx, bry, -0.12); c.lineWidth = 3; c.strokeStyle = P.ol; c.stroke();

  blob(c, -6, bodyY + 6, big ? 15 : 11, big ? 18 : 14, 0.2, P.c);
  limb(c, [[-4, bodyY + 16], [0 + L1 * 8, -16], [-2 + L1 * 12, -2]], big ? 12 : 9, P.c);
  blob(c, 2 + L1 * 12, -2, big ? 10 : 8, 4, 0, P.c, 2.5);
  if (!P.sil && kind === 'raptor') { c.strokeStyle = P.horn; c.lineWidth = 2.5; c.beginPath(); c.arc(6 + L1 * 12, -6, 5, -1.4, 0.4); c.stroke(); }

  if (H && !P.sil) { c.strokeStyle = P.horn; c.lineWidth = 3; c.lineCap = 'round'; for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(nx + 16, bodyY + 10); c.quadraticCurveTo(nx + 28, bodyY + 12 + i * 3, nx + 30 - i * 2, bodyY + 24 + i * 2); c.stroke(); } }
  if (kind === 'raptor' && sp.f.includes('feathers') && !P.sil) { feather(c, nx + 6, bodyY + 8, 14, 2.3, 3); feather(c, nx + 10, bodyY + 10, 12, 2.0, 3); }

function drawDuck(c, sp, st) {

  ell(c, 0, bodyY, 34, 23, -0.08); c.lineWidth = 3; c.strokeStyle = P.ol; c.stroke();
  blob(c, -10, bodyY + 6, 15, 18, 0.2, P.c);
  limb(c, [[-8, bodyY + 18], [-4 + L1 * 8, -16], [-6 + L1 * 10, -2]], 12, P.c);
  blob(c, -4 + L1 * 10, -2, 10, 4, 0, P.c, 2.5);
  limb(c, [[22, bodyY + 12], [26 + L2 * 6, -14], [28 + L2 * 8, -2]], 7, P.c);
  const hb = Math.sin(st.t * 2.6) * 1.4 + st.headBob;
  const hx = 42, hy = bodyY - 26 + hb;

  c.save(); c.translate(hx, hy); c.rotate(st.jaw * -0.15);

  else { blob(c, 0, -8, 9, 6, 0, P.sil ? P.c : P.a, 2); }
  blob(c, 6, 0, 16, 10, 0.05, P.c);

function drawQuad(c, sp, st, kind) {
  const L1 = legPhase(st, 0), L2 = legPhase(st, Math.PI);
  const sway = Math.sin(st.t * 1.8) * 1;
  const cfg = {
    sauropod: { by: -58, rx: 42, ry: 26, leg: 12, lx: [-24, 22], tail: [[-36, -58], [-72, -48], [-108, -24]], tw: 22 },
    trike:    { by: -38, rx: 36, ry: 22, leg: 11, lx: [-20, 18], tail: [[-30, -40], [-50, -38], [-68, -26]], tw: 16 },
    stego:    { by: -44, rx: 36, ry: 21, leg: 10, lx: [-22, 18], tail: [[-30, -48], [-56, -50], [-86, -40]], tw: 16 },
    ankylo:   { by: -28, rx: 40, ry: 17, leg: 10, lx: [-22, 20], tail: [[-34, -30], [-56, -28], [-78, -22]], tw: 14 },
  }[kind];
  const by = cfg.by - st.breath, [bx, fx] = cfg.lx;
  // far legs
  limb(c, [[bx + 6, by + 6], [bx + 6 + L1 * 7, -2]], cfg.leg, P.d);
  limb(c, [[fx - 6, by + 6], [fx - 6 + L2 * 7, -2]], cfg.leg * 0.9, P.d);
  // tail
  const tp = cfg.tail;
  taper(c, tp[0], [tp[1][0], tp[1][1] + sway * 3], [tp[2][0], tp[2][1] + sway * 8], cfg.tw, kind === 'ankylo' ? 7 : 2.5, P.c);
  if (kind === 'stego' && !P.sil) {
    const tx = tp[2][0], ty = tp[2][1] + sway * 8;
    for (const [t, a] of [[0.8, -2.0], [0.8, -2.5], [0.93, -2.1], [0.93, -2.65]]) {
      const p = qpt(tp[0], [tp[1][0], tp[1][1] + sway * 3], [tx, ty], t);
      c.save(); c.translate(p[0], p[1]); c.rotate(a);
      c.beginPath(); c.moveTo(0, -3.5); c.lineTo(18, 0); c.lineTo(0, 3.5); c.closePath(); fillOl(c, P.horn, 2); c.restore();
    }
  }
  if (kind === 'ankylo') { const tx = tp[2][0], ty = tp[2][1] + sway * 8; blob(c, tx + 3, ty, 12, 9, 0, P.sil ? P.c : P.a); blob(c, tx - 3, ty - 1, 7, 6, 0, P.sil ? P.c : shade(P.a, 0.15), 2); }
  // back plates / sail
  if (kind === 'stego') {
    const spikes = sp.f.includes('spikes');
    for (let i = 0; i < 7; i++) {
      const t = i / 6, x = -30 + t * 54, y = by - cfg.ry * Math.sin(Math.PI * (0.15 + t * 0.7)) * 0.95;
      const h = (spikes && i > 3 ? 14 : 16) + Math.sin(Math.PI * t) * 12;
      c.beginPath();
      if (spikes && i > 3) { c.moveTo(x - 4, y + 2); c.lineTo(x - 2, y - h); c.lineTo(x + 4, y + 2); }
      else { c.moveTo(x - 8, y + 4); c.lineTo(x - 6, y - h * 0.55); c.lineTo(x, y - h); c.lineTo(x + 6, y - h * 0.55); c.lineTo(x + 8, y + 4); }
      c.closePath(); fillOl(c, P.sil ? P.c : (spikes && i > 3 ? P.horn : P.a), 2.5);
    }
  }
  // body
  blob(c, 0, by, cfg.rx, cfg.ry, kind === 'stego' ? 0.08 : 0, P.c);
  belly(c, 4, by + cfg.ry * 0.5, cfg.rx * 0.75, cfg.ry * 0.42, 0);
  if (sp.f.includes('stripes')) stripes(c, 0, by, cfg.rx, cfg.ry, 5, 0);
  if (sp.f.includes('spots')) spots(c, 0, by, cfg.rx, cfg.ry, 0, sp.i * 7);
  if (kind === 'ankylo') {
    blob(c, 0, by - 4, cfg.rx - 2, cfg.ry - 1, 0, P.sil ? P.c : P.a);
    if (!P.sil) { for (let r = 0; r < 2; r++) for (let i = 0; i < 6; i++) { ell(c, -28 + i * 11 + r * 5, by - 12 + r * 9, 3.6, 3); c.fillStyle = shade(P.a, 0.25); c.fill(); c.lineWidth = 1.5; c.strokeStyle = P.ol; c.stroke(); } }
    for (let i = 0; i < 5; i++) { const x = -30 + i * 14; c.beginPath(); c.moveTo(x - 4, by + 6); c.lineTo(x, by + 14); c.lineTo(x + 4, by + 6); c.closePath(); fillOl(c, P.sil ? P.c : P.horn, 1.5); }
  }
  ell(c, 0, by, cfg.rx, cfg.ry, kind === 'stego' ? 0.08 : 0); c.lineWidth = 3; c.strokeStyle = P.ol; c.stroke();
  // near legs
  limb(c, [[bx, by + 8], [bx + L2 * 7, -2]], cfg.leg + 2, P.c);
  blob(c, bx + L2 * 7 + 2, -2, cfg.leg * 0.8, 3.5, 0, P.c, 2.5);
  limb(c, [[fx, by + 8], [fx + L1 * 7, -2]], cfg.leg + 1, P.c);
  blob(c, fx + L1 * 7 + 2, -2, cfg.leg * 0.75, 3.5, 0, P.c, 2.5);
  const hb = Math.sin(st.t * 2.4) * 1.2 + st.headBob;
  if (kind === 'sauropod') {
    const hx = 56 + Math.sin(st.t * 0.9) * 3, hy = by - 82 + hb;
    taper(c, [24, by - 6], [52, by - 30], [hx, hy + 6], 22, 11, P.c);
    if (sp.f.includes('spots')) { /* neck spots */ if (!P.sil) { c.fillStyle = rgba(P.a, 0.5); for (let i = 0; i < 4; i++) { const p = qpt([24, by - 6], [52, by - 30], [hx, hy + 6], 0.2 + i * 0.2); ell(c, p[0] - 2, p[1], 3, 2.4); c.fill(); } } }
    if (sp.f.includes('flowers') && !P.sil) {
      const cols = ['#ff8fc0', '#fff176', '#ffffff', '#ffab91'];
      for (let i = 0; i < 7; i++) { const x = -30 + i * 10, y = by - cfg.ry * Math.sin(Math.PI * (0.12 + i / 6 * 0.76)) + 2; flower(c, x, y, 5, cols[i % 4]); }
    }
    c.save(); c.translate(hx, hy); c.rotate(st.jaw * -0.15);
    blob(c, 8, 0, 15, 9, 0.1, P.c);
    eye(c, 6, -3, 3.6, st, 1);
    if (!P.sil) { c.beginPath(); c.moveTo(14, 5); c.quadraticCurveTo(19, 7, 22, 4); c.lineWidth = 2; c.strokeStyle = P.ol; c.stroke(); }
    c.restore();
  } else if (kind === 'trike') {
    const hx = 38, hy = by + 4 + hb;
    c.save(); c.translate(hx, hy); c.rotate(-0.08 + st.jaw * -0.1);
    // frill
    const frR = sp.f.includes('nohorn') ? 18 : 24;
    blob(c, -6, -12, frR, frR * 0.95, -0.4, P.sil ? P.c : P.a);
    if (sp.f.includes('spikyfrill')) { for (let i = 0; i < 6; i++) { const a = -2.6 + i * 0.36; c.beginPath(); c.moveTo(-6 + Math.cos(a - 0.12) * frR * 0.85, -12 + Math.sin(a - 0.12) * frR * 0.85); c.lineTo(-6 + Math.cos(a) * (frR + 20), -12 + Math.sin(a) * (frR + 20)); c.lineTo(-6 + Math.cos(a + 0.12) * frR * 0.85, -12 + Math.sin(a + 0.12) * frR * 0.85); c.closePath(); fillOl(c, P.sil ? P.c : P.horn, 2); } }
    if (!P.sil) { ell(c, -6, -12, frR * 0.62, frR * 0.58, -0.4); c.fillStyle = shade(P.a, 0.3); c.fill(); for (let i = 0; i < 7; i++) { const a = -2.8 + i * 0.5; ell(c, -6 + Math.cos(a) * frR * 0.86, -12 + Math.sin(a) * frR * 0.86, 2.4, 2.4); c.fillStyle = P.horn; c.fill(); } }
    blob(c, 10, 2, 20, 13, 0.15, P.c);
    c.beginPath(); c.moveTo(26, -2); c.quadraticCurveTo(36, 4, 28, 12); c.lineTo(22, 8); c.closePath(); fillOl(c, P.sil ? P.c : shade(P.c, -0.3), 2);
    if (!sp.f.includes('nohorn') && !sp.f.includes('nohorn2')) {
      for (const [x, y, l, a] of [[4, -8, 28, -0.75], [12, -8, 26, -0.6]]) { c.save(); c.translate(x, y); c.rotate(a); c.beginPath(); c.moveTo(-4, 0); c.quadraticCurveTo(l * 0.5, -3, l, -6); c.quadraticCurveTo(l * 0.5, 3, 4, 2); c.closePath(); fillOl(c, P.sil ? P.c : P.horn, 2); c.restore(); }
      c.beginPath(); c.moveTo(20, -4); c.lineTo(26, -14); c.lineTo(26, -2); c.closePath(); fillOl(c, P.sil ? P.c : P.horn, 2);
    } else if (sp.f.includes('nohorn2')) { blob(c, 18, -6, 7, 4, -0.3, P.sil ? P.c : P.horn, 2); }
    eye(c, 6, -2, 4.2, st, 1);
    c.restore();
  } else if (kind === 'stego' || kind === 'ankylo') {
    const hx = kind === 'stego' ? 42 : 42, hy = by + (kind === 'stego' ? 18 : 6) + hb;
    taper(c, [24, by + 4], [34, by + 10], [hx, hy], 15, 11, P.c);
    c.save(); c.translate(hx, hy); c.rotate(st.jaw * -0.12);
    blob(c, 6, 0, kind === 'ankylo' ? 14 : 12, kind === 'ankylo' ? 10 : 8, 0.1, P.c);
    if (kind === 'ankylo') { for (const [x, y] of [[-2, -8], [6, -10]]) { c.beginPath(); c.moveTo(x - 3, y + 2); c.lineTo(x - 6, y - 6); c.lineTo(x + 3, y + 1); c.closePath(); fillOl(c, P.sil ? P.c : P.horn, 1.5); } }
    eye(c, 6, -2, 3.4, st, 1);
    c.restore();
  }
}

function flower(c, x, y, r, col) {
  c.fillStyle = col; for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; ell(c, x + Math.cos(a) * r * 0.6, y + Math.sin(a) * r * 0.6, r * 0.5, r * 0.5); c.fill(); }
  ell(c, x, y, r * 0.35, r * 0.35); c.fillStyle = '#ffd54f'; c.fill();
}

function drawPtero(c, sp, st) {
  const flap = Math.sin(st.t * 7) * 0.9;
  const y0 = -50 + Math.sin(st.t * 2.5) * 4;
  c.save(); c.translate(0, y0);
  const wing = (dir, col) => {
    const tipY = -18 - flap * 26 * dir;
    c.beginPath(); c.moveTo(-6, -2); c.quadraticCurveTo(-30, tipY - 10, -64, tipY + (dir < 0 ? 6 : 0));
    c.quadraticCurveTo(-34, tipY + 18, -14, 10); c.closePath(); fillOl(c, col, 2.5);
    if (!P.sil) { c.beginPath(); c.moveTo(-6, -2); c.quadraticCurveTo(-30, tipY - 10, -64, tipY + (dir < 0 ? 6 : 0)); c.lineWidth = 4; c.strokeStyle = shade(P.c, -0.25); c.stroke(); }
  };
  c.save(); c.scale(-0.75, 0.8); c.translate(6, -6); wing(-1, P.sil ? P.c : shade(P.a, -0.2)); c.restore();
  // body
  limb(c, [[-14, 6], [-20, 18]], 3, P.d);
  blob(c, -4, 2, 18, 9, -0.1, P.c);
  belly(c, -2, 6, 12, 4, -0.1);
  wing(1, P.sil ? P.c : rgba(P.a, 1));
  // head
  c.save(); c.translate(14, -6); c.rotate(-0.1 + st.jaw * -0.1);
  c.beginPath(); c.moveTo(2, -4); c.lineTo(-24, -18); c.lineTo(-4, 2); c.closePath(); fillOl(c, P.sil ? P.c : P.a, 2);
  blob(c, 4, 0, 10, 7, 0, P.c);
  c.save(); c.rotate(st.jaw * 0.35); c.beginPath(); c.moveTo(8, 2); c.lineTo(42, 4); c.lineTo(8, 6); c.closePath(); fillOl(c, P.sil ? P.c : '#f6c552', 2); c.restore();
  c.beginPath(); c.moveTo(8, -3); c.lineTo(44, 3); c.lineTo(8, 3); c.closePath(); fillOl(c, P.sil ? P.c : '#f6c552', 2);
  eye(c, 4, -2, 3.4, st, 1);
  c.restore();
  c.restore();
}

function drawPlesio(c, sp, st) {
  const sway = Math.sin(st.t * 1.6);
  // water pool
  if (!P.sil) {
    ell(c, 0, -2, 62, 13); c.fillStyle = '#3fb7d6'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#1f7f9b'; c.stroke();
    ell(c, 0, -3, 52, 9); c.fillStyle = '#69d1e8'; c.fill();
  }
  const by = -6 + Math.sin(st.t * 2) * 1.5 - st.breath * 0.5;
  // back hump & tail
  c.save(); c.beginPath(); c.rect(-120, -200, 260, 196); c.clip();
  taper(c, [-20, by], [-44, by + 2], [-58, by + 4 + sway * 3], 14, 2, P.c);
  blob(c, -6, by, 28, 13, 0, P.c);
  if (sp.f.includes('spots')) spots(c, -6, by, 28, 13, 0, sp.i * 5);
  ell(c, -6, by, 28, 13, 0); c.lineWidth = 3; c.strokeStyle = P.ol; c.stroke();
  c.restore();
  // flipper splash
  if (!P.sil) { const f = Math.sin(st.t * 3); ell(c, 24, -4, 8 + f * 2, 3); c.fillStyle = 'rgba(255,255,255,.7)'; c.fill(); ell(c, -36, -4, 7 - f * 2, 2.6); c.fill(); }
  // neck
  const hx = 34 + sway * 5, hy = -86 + Math.sin(st.t * 1.3) * 3 + st.headBob;
  taper(c, [14, by - 4], [34 + sway * 3, -40], [hx, hy + 6], 16, 9, P.c);
  if (!P.sil && sp.f.includes('spots')) { c.fillStyle = rgba(P.a, 0.5); for (let i = 0; i < 4; i++) { const p = qpt([14, by - 4], [34 + sway * 3, -40], [hx, hy + 6], 0.2 + i * 0.2); ell(c, p[0], p[1], 2.6, 2); c.fill(); } }
  c.save(); c.translate(hx, hy); c.rotate(st.jaw * -0.15);
  c.save(); c.rotate(st.jaw * 0.4); blob(c, 12, 4, 11, 3.5, 0, P.c); c.restore();
  blob(c, 8, 0, 13, 7, 0.05, P.c);
  teeth(c, 6, 18, 4, 1);
  eye(c, 4, -2, 3.4, st, 1);
  c.restore();
}

function defaultState(t) { return { t: t || 0, phase: 0, walk: 0, blink: false, jaw: 0, headBob: 0, breath: 0, jump: 0 }; }

// Draw a dino centred at its feet (x,y). facing: 1 right, -1 left.
function drawDino(c, sp, x, y, scale, facing, st, sil) {
  P = pal(sp, sil);
  c.save(); c.translate(x, y - st.jump); c.scale(scale * facing, scale);
  if (P.glow && !sil) {
    const g = c.createRadialGradient(0, -50, 10, 0, -50, 110);
    const pulse = 0.35 + Math.sin(st.t * 3) * 0.1;
    g.addColorStop(0, rgba(sp.a, pulse)); g.addColorStop(1, rgba(sp.a, 0));
    c.fillStyle = g; c.fillRect(-120, -170, 240, 190);
  }
  switch (sp.t) {
    case 'rex': drawBiped(c, sp, st, 'rex'); break;
    case 'spino': drawBiped(c, sp, st, 'spino'); break;
    case 'raptor': drawBiped(c, sp, st, 'raptor'); break;
    case 'pachy': drawBiped(c, sp, st, 'pachy'); break;
    case 'duck': drawDuck(c, sp, st); break;
    case 'ptero': drawPtero(c, sp, st); break;
    case 'plesio': drawPlesio(c, sp, st); break;
    default: drawQuad(c, sp, st, sp.t);
  }
  if (P.glow && !sil) { // sparkles
    for (let i = 0; i < 5; i++) {
      const a = st.t * 0.9 + i * 1.256, r = 58 + Math.sin(st.t * 2 + i) * 8;
      const sx = Math.cos(a) * r, sy = -50 + Math.sin(a) * r * 0.55;
      sparkle(c, sx, sy, 3 + Math.sin(st.t * 5 + i) * 1.5, '#fff');
    }
  }
  c.restore();
}
function sparkle(c, x, y, r, col) {
  c.save(); c.translate(x, y); c.fillStyle = col; c.beginPath();
  for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, rr = i % 2 ? r * 0.35 : r * 1.4; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  c.closePath(); c.fill(); c.restore();
}

// approximate local bounds per type for framing portraits [minX, minY, maxX, maxY]
const TYPE_BOUNDS = {
  rex: [-92, -112, 80, 4], spino: [-92, -124, 90, 4], raptor: [-100, -108, 62, 4], pachy: [-90, -96, 56, 4],
  duck: [-90, -110, 70, 4], sauropod: [-112, -158, 78, 4], trike: [-72, -88, 80, 4], stego: [-102, -96, 62, 4],
  ankylo: [-94, -60, 62, 4], ptero: [-70, -92, 64, -24], plesio: [-66, -102, 66, 12],
};

const portraitCache = new Map();
function portrait(sp, sil, w, h) {
  w = w || 220; h = h || 170;
  const key = sp.id + (sil ? ':s' : '') + ':' + w;
  if (portraitCache.has(key)) return portraitCache.get(key);
  const cv = document.createElement('canvas'); const dpr = 2; cv.width = w * dpr; cv.height = h * dpr;
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const z = ZONES[sp.z];
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, sil ? '#24504f' : z.sky[0]); g.addColorStop(1, sil ? '#1a3d3d' : z.sky[1]);
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = sil ? '#163737' : z.ground; c.beginPath(); c.ellipse(w / 2, h * 0.98, w * 0.75, h * 0.26, 0, 0, TAU); c.fill();
  if (!sil) { c.fillStyle = rgba(z.ground2, 0.8); c.beginPath(); c.ellipse(w / 2, h * 0.84, w * 0.3, h * 0.05, 0, 0, TAU); c.fill(); }
  const b = TYPE_BOUNDS[sp.t]; const bw = b[2] - b[0], bh = b[3] - b[1];
  const s = Math.min((w * 0.86) / bw, (h * 0.82) / bh);
  const cx = w / 2 - (b[0] + bw / 2) * s, cy = h * 0.9 - b[3] * s;
  const st = defaultState(1.3); st.walk = 0;
  drawDino(c, sp, cx, cy, s, 1, st, sil);
  if (sil) { c.fillStyle = 'rgba(255,255,255,.75)'; c.font = `900 ${Math.round(h * 0.28)}px Nunito, system-ui, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', w / 2, h * 0.45); }
  const url = cv.toDataURL('image/png');
  portraitCache.set(key, url);
  return url;
}

// ---------- zone scenery ----------
function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function palm(c, x, y, h, lean) {
  c.save(); c.translate(x, y);
  c.strokeStyle = '#8a5a35'; c.lineWidth = h * 0.08; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(lean * h * 0.3, -h * 0.5, lean * h * 0.35, -h); c.stroke();
  c.strokeStyle = 'rgba(0,0,0,.15)'; c.lineWidth = 2; for (let i = 1; i < 8; i++) { const p = qpt([0, 0], [lean * h * 0.3, -h * 0.5], [lean * h * 0.35, -h], i / 8); c.beginPath(); c.moveTo(p[0] - h * 0.04, p[1]); c.lineTo(p[0] + h * 0.04, p[1] + 2); c.stroke(); }
  const tx = lean * h * 0.35, ty = -h;
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (i - 2.5) * 0.55; const L = h * 0.55;
    c.fillStyle = i % 2 ? '#3f9b4a' : '#4fb35a';
    c.beginPath(); c.moveTo(tx, ty);
    c.quadraticCurveTo(tx + Math.cos(a - 0.3) * L * 0.6, ty + Math.sin(a - 0.3) * L * 0.6 - 10, tx + Math.cos(a) * L, ty + Math.sin(a) * L * 0.5 + L * 0.35);
    c.quadraticCurveTo(tx + Math.cos(a + 0.2) * L * 0.5, ty + Math.sin(a + 0.2) * L * 0.4, tx, ty); c.fill();
  }
  c.fillStyle = '#6b4226'; for (const o of [-5, 4]) { c.beginPath(); c.arc(tx + o, ty + 6, 4.5, 0, TAU); c.fill(); }
  c.restore();
}

// ===== Dino Dynasty — state & economy =====
'use strict';

// ---------- formatting ----------
const SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td'];
function fmtNum(n, dec) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmtNum(-n, dec);
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(dec == null ? 1 : dec) : Math.floor(n).toString();

}
function fmtPct(x) { return Math.round(x * 100) + '%'; }
function fmtTime(s) {

}

function cardBase(sp) { const c = S.cards[sp.id]; return RARITIES[RIDX[sp.r]].inc * ZONES[sp.z].tier * Math.pow(LEVEL_MULT, ((c && c.lv) || 1) - 1); }

    const want = { 0: 4, 1: 6, 2: 14, 3: 16, 4: 24, 5: 60 }[zi];
    while (this.amb.length < want) {
      const p = { x: Math.random() * W, y: Math.random() * H, s: Math.random(), ph: Math.random() * 10, z: zi };
      if (zi === 4) p.y = L.horizon + Math.random() * (H - L.horizon);
      this.amb.push(p);
    }
    for (const p of this.amb) {
      p.ph += dt;
      if (zi === 0) { p.x += dt * (12 + p.s * 10); p.y = L.horizon * (0.12 + p.s * 0.3) + Math.sin(p.ph * 2) * 6; if (p.x > W + 20) p.x = -20; }
      if (zi === 1) { p.x += Math.sin(p.ph * 1.3) * dt * 30 + dt * 8; p.y += Math.cos(p.ph * 1.7) * dt * 20; if (p.y < L.horizon) p.y = L.horizon + 10; if (p.y > H) p.y = L.horizon + 20; if (p.x > W) p.x = 0; }
      if (zi === 2) { p.x += Math.sin(p.ph * 0.7 + p.s * 9) * dt * 12; p.y += Math.cos(p.ph * 0.6) * dt * 10; }
      if (zi === 3) { p.x += dt * (40 + p.s * 60); p.y += Math.sin(p.ph) * dt * 6; if (p.x > W + 10) { p.x = -10; p.y = L.horizon + Math.random() * (H - L.horizon); } }
      if (zi === 4) { p.y -= dt * (20 + p.s * 40); p.x += Math.sin(p.ph * 2) * dt * 10; if (p.y < 0) { p.y = H; p.x = Math.random() * W; } }
      if (zi === 5) { p.y += dt * (18 + p.s * 30); p.x += Math.sin(p.ph + p.s * 6) * dt * 14; if (p.y > H) { p.y = -5; p.x = Math.random() * W; } }
    }
  },
  drawAmbientBack(c, zi) {
    const W = this.W, L = this.L, t = this.t;
    // clouds
    if (zi !== 2 && zi !== 4) {
      c.fillStyle = zi === 3 ? 'rgba(255,240,220,.75)' : 'rgba(255,255,255,.85)';
      for (let i = 0; i < 3; i++) {
        const x = ((t * (6 + i * 3) + i * W * 0.4) % (W + 200)) - 100, y = L.horizon * (0.18 + i * 0.16);
        const s = 0.7 + i * 0.25;
        ell(c, x, y, 34 * s, 12 * s); c.fill(); ell(c, x + 22 * s, y - 8 * s, 22 * s, 14 * s); c.fill(); ell(c, x - 18 * s, y - 4 * s, 18 * s, 10 * s); c.fill();
      }
    }
    if (zi === 0) { // sea glints
      c.strokeStyle = 'rgba(255,255,255,.65)'; c.lineWidth = 2; c.lineCap = 'round';
      for (let i = 0; i < 8; i++) { const x = ((i * 137 + t * 14) % (W + 40)) - 20, y = L.horizon * (0.78 + (i % 3) * 0.07); c.beginPath(); c.moveTo(x, y); c.lineTo(x + 10 + (i % 3) * 4, y); c.stroke(); }
      // gentle shore wave
      const wy = L.horizon + 4 + Math.sin(t * 1.2) * 3;
      c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.moveTo(0, L.horizon); for (let x = 0; x <= W; x += 12) c.lineTo(x, wy + Math.sin(x * 0.05 + t * 2) * 2); c.lineTo(W, L.horizon); c.fill();
    }
    if (zi === 4) { // smoke from volcano
      const vx = W * 0.5, vy = L.horizon * 0.28;
      for (let i = 0; i < 6; i++) { const k = ((t * 0.15 + i / 6) % 1); c.fillStyle = `rgba(60,50,55,${0.45 * (1 - k)})`; ell(c, vx + Math.sin(k * 6 + i) * 20 + k * 40, vy - k * L.horizon * 0.35, 14 + k * 40, 10 + k * 26); c.fill(); }
    }
    if (zi === 5) { // aurora
      for (let b = 0; b < 2; b++) {
        const g = c.createLinearGradient(0, 0, 0, L.horizon * 0.6);
        g.addColorStop(0, `rgba(120,255,200,${0.0})`); g.addColorStop(0.5, `rgba(${b ? '180,140,255' : '120,255,200'},${0.28})`); g.addColorStop(1, 'rgba(120,255,200,0)');
        c.fillStyle = g; c.beginPath(); c.moveTo(0, L.horizon * 0.1);
        for (let x = 0; x <= W; x += 16) c.lineTo(x, L.horizon * (0.18 + b * 0.1) + Math.sin(x * 0.012 + t * 0.6 + b * 2) * 14);
        for (let x = W; x >= 0; x -= 16) c.lineTo(x, L.horizon * (0.42 + b * 0.08) + Math.sin(x * 0.014 + t * 0.5 + b) * 18);
        c.fill();
      }
    }
    if (zi === 4) { // lava crack pulse
      c.fillStyle = `rgba(255,90,30,${0.05 + Math.sin(t * 2) * 0.03})`; c.fillRect(0, L.horizon, W, this.H - L.horizon);
    }
  },
  drawAmbientFront(c, zi) {
    const t = this.t;
    for (const p of this.amb) {
      if (zi === 0) { // seagull
        c.strokeStyle = 'rgba(60,70,80,.8)'; c.lineWidth = 1.8; const f = Math.sin(p.ph * 6) * 3; c.beginPath(); c.moveTo(p.x - 7, p.y - f); c.quadraticCurveTo(p.x - 3, p.y - 4, p.x, p.y); c.quadraticCurveTo(p.x + 3, p.y - 4, p.x + 7, p.y - f); c.stroke();
      } else if (zi === 1) { // butterflies
        const f = Math.abs(Math.sin(p.ph * 12)); c.fillStyle = p.s > 0.5 ? '#ffb74d' : '#f48fb1';
        ell(c, p.x - 3 * f, p.y, 3.5 * f + 0.5, 3); c.fill(); ell(c, p.x + 3 * f, p.y, 3.5 * f + 0.5, 3); c.fill();
      } else if (zi === 2) { // fireflies
        const a = 0.4 + Math.sin(p.ph * 3 + p.s * 10) * 0.4; c.fillStyle = `rgba(230,255,140,${a})`; ell(c, p.x, p.y, 2.2, 2.2); c.fill(); c.fillStyle = `rgba(230,255,140,${a * 0.25})`; ell(c, p.x, p.y, 6, 6); c.fill();
      } else if (zi === 3) { c.fillStyle = 'rgba(255,230,190,.45)'; ell(c, p.x, p.y, 1.5 + p.s * 2, 1); c.fill(); }
      else if (zi === 4) { const a = 0.5 + Math.sin(p.ph * 6) * 0.3; c.fillStyle = `rgba(255,${140 + p.s * 80 | 0},40,${a})`; ell(c, p.x, p.y, 1.6 + p.s * 1.4, 1.6 + p.s * 1.4); c.fill(); }
      else if (zi === 5) { c.fillStyle = 'rgba(255,255,255,.9)'; ell(c, p.x, p.y, 1.2 + p.s * 1.8, 1.2 + p.s * 1.8); c.fill(); }
    }
  },

  update(dt) {
    this.t += dt;
    const zi = S.view, z = S.zones[zi];
    if (z.open) {
      for (let pi = 0; pi < 6; pi++) {
        const a = pi < z.slots ? this.actor(zi, pi) : null;
        if (a) this.updateActor(a, dt, this.penPos(pi), zi, pi);
      }
    }
    // other zones' actors still tick for pops (cheap)
    this.ambient(zi, dt);
    this.ensureVisitors();
    const L = this.L;
    for (const v of this.visitors) {
      if (v.stop > 0) { v.stop -= dt; if (v.stop <= 0 && v.camera && Math.random() < 0.8) this.flash = 0.12; continue; }
      v.x += v.dir * v.sp * dt; v.y = L.pathY + v.yo;
      if (v.x > this.W + 20) v.x = -20; if (v.x < -20) v.x = this.W + 20;
      if (Math.random() < dt * 0.08 && z.open) v.stop = 1.2 + Math.random() * 1.5;
    }
    for (const p of this.parts) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.kind === 'coin' || p.kind === 'confetti') p.vy += 600 * dt; else if (p.kind === 'heart') p.vy -= 10 * dt; else { p.vx *= 0.96; p.vy = p.vy * 0.96 + 80 * dt; }
    }
    this.parts = this.parts.filter(p => p.life > 0);
    for (const f of this.floaters) { f.life -= dt; f.y -= dt * 34; }
    this.floaters = this.floaters.filter(f => f.life > 0);
    this.shake = Math.max(0, this.shake - dt * 3); this.flash = Math.max(0, this.flash - dt);
    // golden pteranodon
    const now = performance.now();
    if (!this.golden && now > this.nextGolden && document.visibilityState === 'visible') {
      const dir = Math.random() < 0.5 ? 1 : -1;
      this.golden = { x: dir > 0 ? -60 : this.W + 60, y: L.horizon * (0.35 + Math.random() * 0.35), dir, st: defaultState(0), life: 0 };
      Sound.sfx.golden();
    }
    if (this.golden) {
      const g = this.golden; g.life += dt; g.st.t += dt; g.x += g.dir * Math.max(70, this.W / 11) * dt; const yy = g.y + Math.sin(g.life * 2) * 12;
      if (Math.random() < dt * 20 && !S.settings.lowFx) this.part(g.x - g.dir * 20, yy - 60 * this.L.rx / 78, -g.dir * 20, 20, 'spark', 0.7, '#ffe082');
      if ((g.dir > 0 && g.x > this.W + 80) || (g.dir < 0 && g.x < -80)) { this.golden = null; this.nextGolden = now + (80 + Math.random() * 90) * 1000; }
    }
  },

  draw() {
    const c = this.c, W = this.W, H = this.H, zi = S.view, z = S.zones[zi], L = this.L;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this.shake) c.translate((Math.random() - 0.5) * this.shake * 8, (Math.random() - 0.5) * this.shake * 8);
    if (!this.bg[zi]) this.bg[zi] = buildZoneBg(zi, W, H, this.dpr, L);
    c.drawImage(this.bg[zi], 0, 0, W, H);
    this.drawAmbientBack(c, zi);
    if (!z.open) {
      c.fillStyle = 'rgba(8,28,30,.55)'; c.fillRect(0, 0, W, H);
      this.drawAmbientFront(c, zi); this.drawGolden(c);
      return;
    }
    // back row then visitors then front row
    const order = [3, 4, 5, 'visitors', 0, 1, 2];
    for (const o of order) {
      if (o === 'visitors') { const vs = this.visitors.slice().sort((a, b) => a.y - b.y); for (const v of vs) drawVisitor(c, v, this.t); continue; }
      this.drawPen(c, zi, o);
    }
    this.drawAmbientFront(c, zi);
    // particles
    for (const p of this.parts) {
      const a = Math.min(1, p.life / p.max * 2);
      if (p.kind === 'coin') { c.save(); c.translate(p.x, p.y); c.scale(Math.cos(p.rot), 1); c.fillStyle = `rgba(255,201,40,${a})`; ell(c, 0, 0, 5, 5); c.fill(); c.strokeStyle = `rgba(180,110,10,${a})`; c.lineWidth = 1.5; c.stroke(); c.restore(); }
      else if (p.kind === 'heart') { c.fillStyle = `rgba(255,90,120,${a})`; c.font = '700 16px Nunito, sans-serif'; c.textAlign = 'center'; c.fillText('♥', p.x, p.y); }
      else if (p.kind === 'confetti') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.color; c.globalAlpha = a; c.fillRect(-4, -2, 8, 4); c.restore(); }
      else { c.globalAlpha = a; sparkle(c, p.x, p.y, 3, p.color || '#fff'); c.globalAlpha = 1; }
    }
    this.drawGolden(c);
    // floaters
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const f of this.floaters) {
      const a = Math.min(1, f.life / f.max * 2.2);
      c.font = `900 ${f.size}px Nunito, system-ui, sans-serif`;
      c.lineWidth = 3.5; c.strokeStyle = `rgba(30,20,0,${a * 0.7})`; c.strokeText(f.text, f.x, f.y);
      c.globalAlpha = a; c.fillStyle = f.color; c.fillText(f.text, f.x, f.y); c.globalAlpha = 1;
    }
    if (this.flash > 0) { c.fillStyle = `rgba(255,255,255,${this.flash * 2})`; c.fillRect(0, 0, W, H); }
    const now = Date.now();
    if (S.frenzyUntil > now) { c.strokeStyle = `rgba(255,200,40,${0.5 + Math.sin(this.t * 8) * 0.3})`; c.lineWidth = 6; c.strokeRect(3, 3, W - 6, H - 6); }
  },
  drawGolden(c) {
    if (!this.golden) return; const g = this.golden;
    const s = Math.max(0.55, this.L.rx / 78) * 0.9;
    drawDino(c, GOLD_SP, g.x, g.y + Math.sin(g.life * 2) * 12 + 50 * s, s, g.dir, g.st, false);
  },
  drawPen(c, zi, pi) {
    const z = S.zones[zi], pos = this.penPos(pi);
    const state = pi >= z.slots ? 'locked' : z.pens[pi] ? 'full' : 'empty';
    if (state === 'locked' && pi > z.slots) { // future slots: faint
      c.globalAlpha = 0.35; drawPenBack(c, zi, pos.x, pos.y, pos.rx, pos.ry, 'locked'); c.globalAlpha = 1; return;
    }
    drawPenBack(c, zi, pos.x, pos.y, pos.rx, pos.ry, state);
    if (state === 'locked') {
      // padlock + price
      const cost = expandCost(zi), can = S.coins >= cost;
      c.save(); c.translate(pos.x, pos.y - pos.ry * 0.3);
      c.strokeStyle = '#ffffff'; c.lineWidth = 4; c.beginPath(); c.arc(0, -10, 8, Math.PI, 0); c.stroke();
      c.fillStyle = can ? '#ffc23d' : '#e6eee9'; c.beginPath(); c.roundRect(-12, -10, 24, 18, 4); c.fill();
      c.restore();
      this.pill(c, pos.x, pos.y + pos.ry + 12, 'Expand · ' + fmtNum(cost), can ? '#ffc23d' : 'rgba(10,30,32,.75)', can ? '#2a1a00' : '#fff');
      return;
    }
    if (state === 'empty') {
      c.fillStyle = 'rgba(255,255,255,.95)'; c.font = `900 ${Math.round(pos.rx * 0.5)}px Nunito, system-ui, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
      const b = Math.sin(this.t * 3 + pi) * 2; c.fillText('+', pos.x, pos.y - 2 + b);
      this.pill(c, pos.x, pos.y + pos.ry + 12, 'Place a dino', 'rgba(10,30,32,.75)', '#fff');
      drawPenFront(c, zi, pos.x, pos.y, pos.rx, pos.ry, state);
      return;
    }
    const a = this.actor(zi, pi); const sp = SP[a.id]; const sc = this.dinoScale(sp, pos) * (1 - a.spawn * 0.6);
    const dx = pos.x + a.x * pos.rx * 0.55;
    ell(c, dx, pos.y + 1, pos.rx * 0.42 * (1 - Math.min(0.5, a.jumpY / 120)), pos.ry * 0.35); c.fillStyle = 'rgba(0,0,0,.22)'; c.fill();
    if (sp.r === 'L' || sp.r === 'M') { const rr = RARITIES[RIDX[sp.r]]; c.strokeStyle = rgba(rr.color, 0.55 + Math.sin(this.t * 3) * 0.2); c.lineWidth = 3; ell(c, pos.x, pos.y, pos.rx * 0.86, pos.ry * 0.8); c.stroke(); }
    drawDino(c, sp, dx, pos.y + 2, sc, a.facing, a.st, false);
    drawPenFront(c, zi, pos.x, pos.y, pos.rx, pos.ry, state);
    const card = S.cards[a.id], rr = RARITIES[RIDX[sp.r]];
    const label = this.W > 640 ? `Lv${card.lv} ${sp.name}` : `Lv${card.lv}`;
    this.pill(c, pos.x, pos.y + pos.ry + 12, label, 'rgba(10,30,32,.78)', '#fff', rr.color);
    if (sp.z === zi && this.W > 380) { c.font = '800 10px Nunito, system-ui, sans-serif'; }
  },
  pill(c, x, y, text, bg, fg, dot) {
    c.font = '800 12px Nunito, system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    const w = c.measureText(text).width + (dot ? 26 : 16), h = 20;
    c.fillStyle = bg; c.beginPath(); c.roundRect(x - w / 2, y - h / 2, w, h, 10); c.fill();
    if (dot) { c.fillStyle = dot; ell(c, x - w / 2 + 11, y, 4, 4); c.fill(); }
    c.fillStyle = fg; c.fillText(text, x + (dot ? 5 : 0), y + 0.5);
  },

  // returns { kind, pi } for a canvas point
  hit(x, y) {
    if (this.golden) { const g = this.golden; const s = Math.max(0.55, this.L.rx / 78) * 0.9; const gy = g.y + Math.sin(g.life * 2) * 12; if (Math.hypot(x - g.x, y - gy) < Math.max(48, 70 * s)) return { kind: 'golden' }; }
    const z = S.zones[S.view]; if (!z.open) return null;
    for (const pi of [0, 1, 2, 3, 4, 5]) {
      const pos = this.penPos(pi);
      const inPad = ((x - pos.x) ** 2) / ((pos.rx * 1.1) ** 2) + ((y - pos.y) ** 2) / ((pos.ry * 2.2) ** 2) <= 1;
      const top = pos.y - pos.rx * 1.6;
      const inBody = Math.abs(x - pos.x) < pos.rx * 0.95 && y > top && y < pos.y;
      const inLabel = Math.abs(x - pos.x) < pos.rx * 0.8 && y > pos.y && y < pos.y + pos.ry + 24;
      if (inPad || inBody || inLabel) {
        if (pi >= z.slots) return pi === z.slots ? { kind: 'expand', pi } : null;
        return { kind: z.pens[pi] ? 'dino' : 'empty', pi };
      }
    }
    return { kind: 'ground' };
  },
};

// Full-screen FX layer for coins flying to the HUD and confetti
const FX = {
  cv: null, c: null, items: [], dpr: 1,
  init(cv) { this.cv = cv; this.c = cv.getContext('2d'); this.resize(); window.addEventListener('resize', () => this.resize()); },
  resize() { this.dpr = Math.min(2, window.devicePixelRatio || 1); this.cv.width = innerWidth * this.dpr; this.cv.height = innerHeight * this.dpr; },
  coins(x0, y0, x1, y1, n, onArrive, color) {
    if (S.settings.lowFx) n = Math.min(n, 4);
    for (let i = 0; i < n; i++) this.items.push({ k: 'coin', x0: x0 + (Math.random() - 0.5) * 40, y0: y0 + (Math.random() - 0.5) * 30, x1, y1, t: -i * 0.035, dur: 0.6 + Math.random() * 0.25, cx: x0 + (Math.random() - 0.5) * 220, cy: Math.min(y0, y1) - 60 - Math.random() * 80, cb: i === n - 1 ? onArrive : null, color: color || '#ffc928' });
  },
  confetti(x, y, n) {
    const cols = ['#ffc23d', '#ff6f4a', '#63e6f0', '#b97bff', '#6be07a', '#ff4f9a'];
    if (S.settings.lowFx) n = Math.min(n, 20);
    for (let i = 0; i < n; i++) { const a = Math.random() * TAU, s = 200 + Math.random() * 500; this.items.push({ k: 'conf', x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 300, life: 1.6 + Math.random(), rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, color: cols[i % cols.length] }); }
  },
  update(dt) {
    const c = this.c; c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); c.clearRect(0, 0, innerWidth, innerHeight);
    if (!this.items.length) return;
    for (const it of this.items) {
      if (it.k === 'coin') {
        it.t += dt; if (it.t < 0) continue; const k = Math.min(1, it.t / it.dur), e = k * k * (3 - 2 * k);
        const u = 1 - e, x = u * u * it.x0 + 2 * u * e * it.cx + e * e * it.x1, y = u * u * it.y0 + 2 * u * e * it.cy + e * e * it.y1;
        c.save(); c.translate(x, y); c.scale(Math.cos(it.t * 14), 1); c.fillStyle = it.color; c.beginPath(); c.arc(0, 0, 7, 0, TAU); c.fill(); c.strokeStyle = 'rgba(120,70,0,.7)'; c.lineWidth = 2; c.stroke(); c.restore();
        if (k >= 1) { it.done = true; if (it.cb) it.cb(); }
      } else {
        it.life -= dt; it.x += it.vx * dt; it.y += it.vy * dt; it.vy += 900 * dt; it.vx *= 0.99; it.rot += it.vr * dt;
        c.save(); c.translate(it.x, it.y); c.rotate(it.rot); c.globalAlpha = Math.min(1, it.life); c.fillStyle = it.color; c.fillRect(-5, -3, 10, 6); c.restore();
        if (it.life <= 0 || it.y > innerHeight + 40) it.done = true;
      }
    }
    this.items = this.items.filter(i => !i.done);
  },
};

// ---------- toasts ----------
function toast(msg, kind, ms) {
  const t = document.createElement('div'); t.className = 'toast ' + (kind || ''); t.innerHTML = msg;
  const box = $('#toasts'); box.appendChild(t); while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, ms || 2400);
}
function needCoins(cost) { Sound.sfx.error(); toast(`You need ${coin(true)} ${fmtNum(cost - S.coins)} more`, 'bad'); }
function needGems(cost) { Sound.sfx.error(); toast(`You need ${gem(true)} ${fmtNum(cost - S.crystals)} more crystals`, 'bad'); }

// ---------- modal ----------
function openModal(html, cls, onClose) {
  const m = $('#modal'); m.innerHTML = `<div class="sheet ${cls || ''}" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false; modalOnClose = onClose || null;
}
function closeModal() {
  if (modalLock) return; const m = $('#modal'); m.hidden = true; m.innerHTML = '';
  const f = modalOnClose; modalOnClose = null; if (f) f();
  renderPanel();
  if (modalQueue.length) setTimeout(() => { if ($('#modal').hidden && modalQueue.length) modalQueue.shift()(); }, 250);
}
function queueModal(fn) { if ($('#modal').hidden) fn(); else modalQueue.push(fn); }
const closeBtn = '<button class="x" data-act="close" aria-label="Close">×</button>';

// ---------- static chrome ----------
function buildChrome() {
  $('#tabs').innerHTML = TABS.map(([id, name]) => `<button class="tab${tab === id ? ' on' : ''}" data-act="tab" data-t="${id}">${IC[id]}<span>${name}</span><span class="badge" id="badge-${id}" hidden></span></button>`).join('');

  $('#chestBox').innerHTML = `<div class="chest-ico" id="chestIco"><i></i></div><div class="chest-meta"><b id="chestAmt">0</b><div class="cbar"><i id="chestBar"></i></div></div><button class="btn sm" data-act="collect" id="collectBtn">Collect</button>`;

}
function updateSoundBtn() { const on = S.settings.sfx || S.settings.music; $('#soundBtn').innerHTML = on ? IC.soundOn : IC.soundOff; $('#soundBtn').setAttribute('aria-pressed', on); }

function buildZoneView() {
  const zi = S.view, z = S.zones[zi];
  for (let i = 0; i < ZONES.length; i++) $('#zt' + i).classList.toggle('on', i === zi);
  const lo = $('#lockOverlay');
  if (!z.open) {
    const prevOpen = zi === 0 || S.zones[zi - 1].open, cost = ZONES[zi].unlock;
    lo.innerHTML = `<div class="lockcard"><span class="chip">Zone ${zi + 1} of ${ZONES.length} · dinos earn ×${fmtNum(ZONES[zi].tier)}</span><h3>${ZONES[zi].name}</h3><p>${ZONE_DESC[zi]}</p>
      <div class="silrow">${ZONE_SPECIES[zi].map(sp => `<img src="${portrait(sp, !S.cards[sp.id], 110, 85)}" alt="${S.cards[sp.id] ? esc(sp.name) : 'Undiscovered dino'}">`).join('')}</div>
      ${prevOpen ? `<button class="btn lg" data-act="unlock" data-z="${zi}" data-cost="${cost}">Unlock ${coin()} ${fmtNum(cost)}</button>` : `<p>Unlock ${ZONES[zi - 1].name} first.</p>`}</div>`;
    lo.hidden = false;

// ---------- panel rendering ----------
function renderPanel() {
  const body = $('#panelBody'); const keep = body.dataset.tab === tab ? body.scrollTop : 0;
  body.dataset.tab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  body.innerHTML = ({ packs: viewPacks, cards: viewCards, collector: viewCollector, upgrades: viewUpgrades, more: viewMore })[tab]();
  body.scrollTop = keep;
  refresh(true);
}
function freePackZone() { if (S.zones[S.view].open) return S.view; for (let i = ZONES.length - 1; i >= 0; i--) if (S.zones[i].open) return i; return 0; }

    <div class="item"><div class="uico">${IC.warp}</div><div class="grow"><span class="t">Time Warp</span><span class="d">Collect 1 hour of income right now: <b id="warpAmt">${fmtNum(totalIncome() * 3600)}</b> coins.</span></div><button class="btn crys" data-act="warp" data-gcost="40">${gem(1)} 40</button></div>

function cardHTML(sp, opts) {
  opts = opts || {};

  if (!c) return `<button class="card unk" data-act="card" data-id="${sp.id}"><div class="art"><img src="${portrait(sp, true, 220, 170)}" alt="Undiscovered"></div><div class="cname">???</div><div class="cmeta"><span>${rr.name}</span><span></span></div><div class="dbar"><span>Not found</span></div></button>`;

// ---------- periodic refresh ----------

  $('#amberStat').hidden = !S.amber; $('#amber').textContent = S.amber;

  else if (S.rallyReadyAt > now) { rl.textContent = fmtTime((S.rallyReadyAt - now) / 1000); rb.classList.add('off'); rb.classList.remove('ghost'); }
  else { rl.textContent = 'Rally ×2'; rb.classList.remove('off', 'ghost'); }
  // zone tabs

    tb.classList.toggle('locked', !Z.open);

// ---------- pack opening ----------
function packOpening(title, sub, cols, cards, again) {
  modalLock = true;

    setTimeout(() => { bp.classList.add('gone'); setTimeout(() => dealCards(cards, again), 260); }, S.settings.skipAnim ? 120 : 380);
  };

}
let dealt = null;
function dealCards(cards, again) {

  if (cards.length > 5) { // multi-pack: one card per species with a count
    const g = new Map();
    for (const c of cards) { const e = g.get(c.sp.id); if (e) { e.count++; e.isNew = e.isNew || c.isNew; } else g.set(c.sp.id, { sp: c.sp, isNew: c.isNew, count: 1 }); }
    order = [...g.values()].sort((a, b) => RIDX[b.sp.r] - RIDX[a.sp.r] || b.count - a.count);
    small = order.length > 5;
  }
  dealt = { cards: order, again, flipped: 0 };

    return `<div class="flip${small ? ' small' : ''}${RIDX[sp.r] >= 3 ? ' r-hi' : ''}" style="--glow:${rr.color}88;animation-delay:${i * (small ? 30 : 90)}ms" data-act="flip" data-i="${i}">

function doBuyPack(zi, n) {

function openPlace(id) {

// ---------- stage input ----------
function onStagePointer(e) {
  Sound.init();
  const r = Scene.cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = Scene.hit(x, y);
  if (!hit) return;
  if (hit.kind === 'golden') return catchGolden();
  if (hit.kind === 'dino') {
    const now = performance.now();
    combo = now - lastTapAt < 650 ? Math.min(30, combo + 1) : 0; lastTapAt = now;
    const mult = 1 + combo * 0.05;
    const base = Math.max(1, zoneIncome(S.view) * 0.06 + totalIncome() * 0.01);
    const v = base * (1 + 0.5 * S.up.tap) * mult;
    earn(v); S.stats.taps++;
    const p = Scene.tapActor(S.view, hit.pi);
    Scene.float(x, y - 14, '+' + fmtNum(v), combo >= 10 ? '#ff9f6b' : '#ffe066', 16 + Math.min(10, combo / 2));
    if (combo > 0 && combo % 5 === 0) Scene.float(x, y - 40, `Combo ×${mult.toFixed(2).replace(/0$/, '')}`, '#ffffff', 15);
    Sound.sfx.tap(combo);
    const pos = Scene.penPos(hit.pi);
    showBubble(S.view, hit.pi, pos.x, pos.y - pos.rx * 1.25);
    return;
  }
  if (hit.kind === 'empty') { hideBubble(); Sound.sfx.click(); return openPen(S.view, hit.pi); }
  if (hit.kind === 'expand') { hideBubble(); return act.expand({ z: S.view }); }
  hideBubble();
}
function catchGolden() {
  const g = Scene.golden; if (!g) return; Scene.golden = null; Scene.nextGolden = performance.now() + (80 + Math.random() * 90) * 1000;
  S.stats.golden++; Sound.sfx.golden(); Scene.burst(g.x, g.y, '#ffe082', 40);
  const r = Math.random(); let msg;
  if (r < 0.4) { const v = Math.max(300, totalIncome() * 150); earn(v); msg = `Golden Pteranodon dropped ${coin(true)} ${fmtNum(v)}!`; Scene.float(g.x, g.y, '+' + fmtNum(v), '#ffd54f', 22); }
  else if (r < 0.72) { S.frenzyUntil = Math.max(Date.now(), S.frenzyUntil) + 45000; msg = 'Feeding Frenzy! Triple income for 45s.'; Scene.float(g.x, g.y, 'FRENZY ×3', '#ff9f6b', 22); }
  else if (r < 0.92) { const n = Math.round((3 + Math.floor(Math.random() * 6)) * crystalMult()); S.crystals += n; msg = `Golden Pteranodon left ${gem(true)} ${n} crystals!`; Scene.float(g.x, g.y, '+' + n + ' crystals', '#63e6f0', 20); }
  else { S.freePacks++; msg = 'Golden Pteranodon dropped a free pack!'; Scene.float(g.x, g.y, 'FREE PACK', '#b97bff', 22); }
  toast(msg, 'gold', 3000);
  const r2 = Scene.cv.getBoundingClientRect(); FX.confetti(r2.left + g.x, r2.top + g.y, 50);
  renderPanel();
}
