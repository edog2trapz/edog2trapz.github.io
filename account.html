<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your account · 2trapz games</title>
<meta name="description" content="Sign in to 2trapz games with Google, GitHub or email. Your Player ID, progress and reviews.">
<meta name="theme-color" content="#ff8a00">
<meta property="og:type" content="website">
<meta property="og:site_name" content="2trapz games">
<meta property="og:title" content="Your account · 2trapz games">
<meta property="og:description" content="Sign in to 2trapz games with Google, GitHub or email. Your Player ID, progress and reviews.">
<meta property="og:image" content="https://edog2trapz.github.io/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script>try{var t=JSON.parse(localStorage.getItem('tz.theme'));if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
.acct{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px;align-items:start;margin-top:26px}
@media (max-width:940px){.acct{grid-template-columns:1fr}}
/* ---- player ID keycard ---- */
.idwrap{perspective:1100px}
.idcard{position:relative;width:100%;max-width:560px;aspect-ratio:1.586;margin:0 auto;border-radius:22px;overflow:hidden;color:var(--ink);
  background:linear-gradient(160deg,var(--chrome1) 0%,var(--chrome2) 100%);border:1px solid var(--glass-edge);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 30px 60px rgba(20,30,45,.25),0 6px 16px rgba(20,30,45,.15);
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;transform-style:preserve-3d}
.idcard::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 35%),
  radial-gradient(120% 90% at 110% 110%,rgba(255,138,0,.22),transparent 55%);pointer-events:none;z-index:3}
.id-band{position:absolute;left:0;right:0;top:0;height:28%;background:linear-gradient(120deg,#ff9a1f,#f25c05 55%,#d8340f);z-index:0}
.id-band::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.12) 0 6px,transparent 6px 14px)}
.id-swoosh{position:absolute;left:-5%;right:-5%;top:20%;height:18%;z-index:1}
.id-in{position:absolute;inset:0;z-index:2;display:grid;grid-template-rows:auto 1fr auto;padding:5% 6%}
.id-top{display:flex;align-items:center;gap:10px;color:#fff}
.id-top .orb{width:36px;height:36px}.id-top .orb b{font-size:15px}
.id-top b{display:block;font-family:var(--display);font-weight:900;font-style:italic;letter-spacing:.12em;font-size:clamp(12px,2.4vw,16px);text-shadow:0 1px 2px rgba(120,30,0,.5)}
.id-top small{display:block;font-size:clamp(9px,1.6vw,11px);font-weight:800;letter-spacing:.24em;opacity:.9}
.id-chip{margin-left:auto;width:clamp(34px,7vw,46px);aspect-ratio:1.3;border-radius:7px;background:linear-gradient(135deg,#ffe7a3,#e0a93a 45%,#fff0c2 60%,#c98c22);
  box-shadow:inset 0 0 0 1px rgba(120,80,0,.4);position:relative}
.id-chip::after{content:"";position:absolute;inset:22% 18%;border:1px solid rgba(120,80,0,.45);border-radius:3px;box-shadow:inset 0 0 0 4px transparent}
.id-main{display:flex;align-items:center;gap:5%;padding-top:4%}
.id-photo{width:30%;aspect-ratio:1;border-radius:18px;flex:none;display:grid;place-items:center;font-size:clamp(40px,9vw,66px);overflow:hidden;
  background:radial-gradient(circle at 50% 35%,#fff,#e8ecf0);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--o2),0 10px 20px rgba(0,0,0,.2)}
.id-photo img{width:100%;height:100%;object-fit:cover}
.id-info{min-width:0;flex:1}
.id-info small{display:block;font-size:clamp(8px,1.5vw,10px);font-weight:900;letter-spacing:.2em;color:var(--ink3)}
.id-tag{display:block;font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(18px,4.2vw,30px);line-height:1.05;margin:2px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.id-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.id-grid b{display:block;font-size:clamp(12px,2.4vw,16px);font-weight:900;line-height:1.2}
.id-grid .on{color:#17a35a}.id-grid .off{color:var(--o-text)}
.id-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.barcode{width:42%;height:clamp(22px,5vw,34px);background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px);opacity:.75}
.id-no{font:800 clamp(9px,1.7vw,12px)/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;color:var(--ink2)}
.holo{position:absolute;z-index:4;left:52%;bottom:5%;width:10%;aspect-ratio:1;border-radius:50%;opacity:.75;mix-blend-mode:screen;
  background:conic-gradient(from var(--h,0deg),#ff8a00,#ffe08a,#7fe0ff,#c4b5fd,#ff7a5c,#ff8a00);filter:saturate(1.3);animation:holo 6s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 55%,transparent 56%),repeating-radial-gradient(circle,#000 0 2px,transparent 2px 4px);mask:radial-gradient(circle,#000 55%,transparent 56%)}
@property --h{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes holo{to{--h:360deg}}
.idnote{text-align:center;margin-top:14px;color:var(--ink3);font-weight:700;font-size:13px}
/* ---- sign in portal ---- */
.portal{padding:30px}
.portal h2{margin:8px 0 6px;font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(26px,3.6vw,36px);line-height:1}
.portal h2 span{color:var(--o-text)}
.portal > p{margin:0 0 20px;color:var(--ink2)}
.prov{display:grid;gap:10px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:12px;height:52px;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;width:100%;transition:transform .12s,box-shadow .2s}
.pbtn:hover{transform:translateY(-2px)}
.pbtn.google{background:#fff;color:#1f1f1f;border:1px solid #dadce0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pbtn.google:hover{box-shadow:0 0 0 2px var(--o2),0 6px 16px rgba(0,0,0,.15)}
.pbtn.github{background:#1f2328;color:#fff;border:1px solid #1f2328}
.pbtn.github:hover{box-shadow:0 0 0 2px var(--o2),0 6px 16px rgba(0,0,0,.25)}
.or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--ink3);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line2)}
.etabs{display:flex;gap:4px;padding:4px;border-radius:var(--pill);background:linear-gradient(180deg,var(--chrome2),var(--chrome1));border:1px solid var(--chrome-edge);margin-bottom:14px}
.etabs button{flex:1;height:36px;border:0;border-radius:var(--pill);background:none;cursor:pointer;font-weight:800;color:var(--ink2)}
.etabs button[aria-selected="true"]{color:#fff;background:linear-gradient(180deg,#ffb44d 0%,#ff9010 49%,#f26a00 51%,#ff8a1a 100%);text-shadow:0 1px 1px rgba(110,35,0,.5)}
.eform{display:grid;gap:12px}
.linkbtn{background:none;border:0;padding:0;color:var(--o-text);font-weight:800;cursor:pointer;text-decoration:underline;font-size:14px}
.amsg{min-height:20px;font-size:14px;font-weight:700}
.amsg.bad{color:var(--red)}.amsg.good{color:#17a35a}
.perks{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px}
.perks li{display:flex;gap:12px;align-items:flex-start;color:var(--ink2);font-size:15px}
.perks .orb{width:38px;height:38px;font-size:18px;flex:none}
.perks b{color:var(--ink);display:block}
/* ---- signed-in dashboard ---- */
.box{padding:22px}
.box h3{margin:0 0 14px;font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:19px;display:flex;align-items:center;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{padding:12px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);text-align:center}
.tile b{display:block;font-family:var(--display);font-weight:900;font-style:italic;font-size:26px;color:var(--o-text);line-height:1.1}
.tile small{font-weight:800;font-size:12px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.avgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.avgrid button{width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;border:1px solid var(--line2);background:var(--glass2);padding:0;line-height:1;transition:transform .12s}
.avgrid button:hover{transform:scale(1.1)}
.avgrid button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--o2);background:#fff}
.syncpill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:var(--pill);font-size:12px;font-weight:800;background:rgba(61,220,132,.14);color:#17a35a;border:1px solid rgba(61,220,132,.4)}
.syncpill.syncing{background:rgba(255,138,0,.12);color:var(--o-text);border-color:rgba(255,138,0,.35)}
.syncpill.error{background:rgba(229,48,27,.1);color:var(--red);border-color:rgba(229,48,27,.35)}
.myrv{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--glass2);margin-bottom:8px}
.myrv .ti{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:22px;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2))}
.myrv b{display:block;font-size:14px}.myrv small{color:var(--ink3);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.myrv > span:nth-child(2){min-width:0;flex:1}
.st{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:var(--pill);white-space:nowrap}
.st.live{background:rgba(61,220,132,.15);color:#17a35a}.st.pending{background:rgba(255,138,0,.14);color:var(--o-text)}.st.hidden{background:var(--line);color:var(--ink3)}
.danger{border:1px solid rgba(229,48,27,.35)!important}
</style>
</head>
<body data-page="account">
<main id="main">
<div class="wrap">
  <section class="panel phero hud">
    <svg class="deco" viewBox="0 0 300 300" aria-hidden="true" fill="none"><circle cx="190" cy="110" r="70" stroke="var(--o2)" stroke-width="2" opacity=".6"/><circle cx="190" cy="110" r="100" stroke="var(--tech)" stroke-width="2" stroke-dasharray="3 10"/><circle cx="190" cy="110" r="135" stroke="var(--o2)" stroke-width="1.5" stroke-dasharray="60 20 6 20" opacity=".5"/><text x="190" y="128" text-anchor="middle" font-size="52">🪪</text></svg>
    <div class="kicker">2trapz Network</div>
    <h1 id="ttl">Your <span>account</span></h1>
    <p id="sub">Your Player ID, progress and reviews in one place.</p>
    <span class="tag-id">2TZ // ACC-05</span>
  </section>
  <div class="acct" id="acct"></div>
</div>
</main>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
(() => {
  const { $, $$, esc, GAMES, bySlug, ACH, unlocked, score, level, plays, favs, account, accountsOn, ACC, AVATARS } = TZ;
  const root = $('#acct');
  const P = new URLSearchParams(location.search);
  const next = /^[a-z0-9-]+\.html(\?[^#<>"']*)?$/i.test(P.get('next') || '') ? P.get('next') : '';
  const providers = (ACC.providers || ['google', 'email']).map(String);
  const G_LOGO = `<svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>`;
  const GH_LOGO = `<svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>`;

  const idNumber = seed => { let h = 2166136261; for (const c of String(seed)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); const x = (h >>> 0).toString(16).toUpperCase().padStart(8, '0'); return '2TZ-' + x.slice(0, 4) + '-' + x.slice(4, 8); };
  function keycard(){
    const p = TZ.profile(), u = account.user(), lv = level();
    const since = u && u.created ? new Date(u.created) : new Date((TZ.get('tz.days', [])[0] || TZ.today()) + 'T12:00:00');
    const status = u ? '<b class="on">● ONLINE</b>' : '<b class="off">GUEST</b>';
    return `<div class="idwrap"><div class="idcard" id="idcard">
      <div class="id-band"></div>
      <svg class="id-swoosh" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40C90 0 200 60 400 10V22C220 70 100 18 0 52Z" fill="#ffb347" opacity=".75"/><path d="M0 46C120 14 230 62 400 20" stroke="#fff" stroke-width="2" fill="none" opacity=".8"/></svg>
      <div class="id-in">
        <div class="id-top"><span class="orb"><b>2t</b></span><div><b>2TRAPZ NETWORK</b><small>PLAYER IDENTIFICATION</small></div><span class="id-chip" aria-hidden="true"></span></div>
        <div class="id-main">
          <div class="id-photo">${p.avatar}</div>
          <div class="id-info"><small>GAMERTAG</small><b class="id-tag">${esc(p.tag)}</b>
            <div class="id-grid"><div><small>LEVEL</small><b>${lv.lv}</b></div><div><small>TZ SCORE</small><b>${score()}</b></div>
            <div><small>STATUS</small>${status}</div><div><small>MEMBER SINCE</small><b>${since.toLocaleDateString(undefined, { month:'short', year:'numeric' }).toUpperCase()}</b></div></div></div>
        </div>
        <div class="id-bottom"><span class="barcode" aria-hidden="true"></span><span class="id-no">ID ${idNumber(u ? u.uid : p.tag)}</span></div>
      </div><div class="holo" aria-hidden="true"></div></div></div>`;
  }
  function editor(){
    const p = TZ.profile();
    return `<section class="panel box"><h3>✏️ Edit your ID</h3>
      <label class="field"><span>Gamertag</span><input id="tagIn" maxlength="18" value="${esc(p.tag)}" autocomplete="off" spellcheck="false"></label>
      <div class="avgrid" role="group" aria-label="Avatar">${AVATARS.map(a => `<button data-pick="${a}" aria-pressed="${a === p.avatar}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div></section>`;
  }
  function stats(){
    const u = unlocked(), p = plays(), got = ACH.filter(a => u[a.id]).length;
    const launches = Object.values(p).reduce((s, x) => s + x, 0), mine = TZ.myReviews().length;
    return `<section class="panel box"><h3>📊 Stats</h3><div class="tiles">
      <div class="tile"><b>${got}/${ACH.length}</b><small>Achievements</small></div>
      <div class="tile"><b>${Object.keys(p).filter(bySlug).length}</b><small>Games tried</small></div>
      <div class="tile"><b>${launches}</b><small>Launches</small></div>
      <div class="tile"><b>${favs().length}</b><small>Favorites</small></div>
      <div class="tile"><b>${mine}</b><small>Reviews</small></div>
      <div class="tile"><b>${level().lv}</b><small>Level</small></div></div>
      <div class="row" style="margin-top:14px"><a class="btn sm" href="achievements.html">🏆 Trophy room</a><a class="btn sm ghost" href="leaderboard.html">📈 Ranks</a></div></section>`;
  }

  function guestView(){
    root.innerHTML = `<div>${keycard()}<p class="idnote">Hover or tilt the card ✨</p></div>
      <div style="display:grid;gap:20px">
        <section class="panel box"><h3>🪪 Guest Player ID</h3><p class="muted" style="margin:0">Online accounts are coming soon. Until then, your Player ID, achievements and favorites are saved on this device, so use the same browser to keep your progress.</p></section>
        ${editor()}${stats()}</div>`;
    $('#ttl').innerHTML = 'Player <span>ID</span>';
    bind();
  }
  function signInView(){
    const show = k => providers.includes(k);
    root.innerHTML = `<section class="panel portal">
        <div class="kicker">Sign in</div><h2>Join the <span>2trapz Network</span></h2>
        <p>One account for every game. Your progress follows you to any device.</p>
        <div class="prov">
          ${show('google') ? `<button class="pbtn google" data-prov="google">${G_LOGO} Sign in with Google</button>` : ''}
          ${show('github') ? `<button class="pbtn github" data-prov="github">${GH_LOGO} Sign in with GitHub</button>` : ''}
        </div>
        ${show('email') ? `${show('google') || show('github') ? '<div class="or">or use email</div>' : ''}
        <div class="etabs" role="tablist"><button role="tab" data-mode="in" aria-selected="true">Sign in</button><button role="tab" data-mode="up" aria-selected="false">Create account</button></div>
        <form class="eform" id="eform" novalidate>
          <label class="field"><span>Email</span><input id="em" type="email" autocomplete="email" required></label>
          <label class="field"><span>Password</span><input id="pw" type="password" autocomplete="current-password" minlength="6" required></label>
          <div class="row" style="justify-content:space-between"><button class="btn" type="submit" id="esub">Sign in</button><button type="button" class="linkbtn" id="forgot">Forgot password?</button></div>
        </form>` : ''}
        <p class="amsg" id="amsg" role="status"></p>
        <p class="muted" style="font-size:13px;margin:6px 0 0">By signing in you agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy policy</a>.</p>
      </section>
      <div style="display:grid;gap:20px">${keycard()}
        <section class="panel box"><h3>Why sign in?</h3><ul class="perks">
          <li><span class="orb">☁️</span><span><b>Progress everywhere</b>Achievements, favorites and play history saved to your account.</span></li>
          <li><span class="orb">🏆</span><span><b>Join the Ranks</b>Your TZ score goes on the public leaderboard.</span></li>
          <li><span class="orb">⭐</span><span><b>Write reviews</b>Rate games and help other players.</span></li>
          <li><span class="orb">🔒</span><span><b>Your email stays private</b>Only your gamertag and avatar are public.</span></li></ul></section></div>`;
    $('#ttl').innerHTML = 'Sign <span>in</span>';
    let mode = 'in';
    const msg = (t, good) => { const m = $('#amsg'); m.textContent = t; m.className = 'amsg ' + (good ? 'good' : 'bad'); };
    const done = () => { msg('Signed in! Loading your profile…', true); TZ.sfx('ok'); if (next) setTimeout(() => { location.href = next; }, 600); };
    $$('[data-prov]').forEach(b => b.addEventListener('click', async () => {
      msg('');
      try { await account.signIn(b.dataset.prov); done(); } catch (e){ msg(account.errorText(e)); TZ.sfx('err'); }
    }));
    $$('[data-mode]').forEach(b => b.addEventListener('click', () => {
      mode = b.dataset.mode; $$('[data-mode]').forEach(x => x.setAttribute('aria-selected', String(x === b)));
      $('#esub').textContent = mode === 'in' ? 'Sign in' : 'Create account'; $('#pw').autocomplete = mode === 'in' ? 'current-password' : 'new-password';
    }));
    const ef = $('#eform');
    if (ef) ef.addEventListener('submit', async e => {
      e.preventDefault(); const em = $('#em').value.trim(), pw = $('#pw').value;
      if (!em || !pw) return msg('Type your email and password.');
      $('#esub').disabled = true;
      try { if (mode === 'in') await account.signInEmail(em, pw); else { await account.signUpEmail(em, pw); } done(); }
      catch (err){ msg(account.errorText(err)); TZ.sfx('err'); }
      finally { $('#esub').disabled = false; }
    });
    const fg = $('#forgot');
    if (fg) fg.addEventListener('click', async () => {
      const em = $('#em').value.trim(); if (!em) return msg('Type your email first, then tap "Forgot password?".');
      try { await account.resetPassword(em); msg('Check your inbox for a reset link.', true); } catch (e){ msg(account.errorText(e)); }
    });
    tilt();
  }
  function signedInView(){
    const u = account.user();
    root.innerHTML = `<div style="display:grid;gap:20px">${keycard()}
        <section class="panel box"><h3>☁️ Account</h3>
          <p style="margin:0 0 6px"><b>${esc(u.name || 'Player')}</b> <span class="muted">${esc(u.email)}</span></p>
          <p style="margin:0 0 14px" class="muted">Signed in with ${u.provider === 'google.com' ? 'Google' : u.provider === 'github.com' ? 'GitHub' : 'email'} · <span class="syncpill" id="sync">☁️ Synced</span></p>
          ${u.provider === 'password' && !u.verified ? '<p class="muted" style="margin:0 0 12px;font-size:14px">📬 Check your inbox to verify your email.</p>' : ''}
          <div class="row"><button class="btn ghost" data-signout>Sign out</button>${account.isAdmin() ? '<a class="btn" href="admin.html">🛠️ Admin console</a>' : ''}</div></section>
      </div>
      <div style="display:grid;gap:20px">${editor()}${stats()}
        <section class="panel box"><h3>⭐ Your reviews</h3><div id="myrv"><p class="muted" style="margin:0">Loading…</p></div></section>
        <section class="panel box danger"><h3>⚠️ Danger zone</h3><p class="muted" style="margin:0 0 12px">Deleting your account removes your profile and leaderboard spot for good.</p>
          <button class="btn red sm" id="del">Delete my account</button><p class="amsg" id="amsg"></p></section></div>`;
    $('#ttl').innerHTML = 'Your <span>account</span>';
    bind();
    paintSync(account.sync());
    account.myReviews().then(list => {
      $('#myrv').innerHTML = list.length ? list.sort((a, b) => String(b.date).localeCompare(String(a.date))).map(r => { const g = bySlug(r.game) || { title:r.game, icon:'🎮', colors:['#333','#777'] };
        return `<div class="myrv"><span class="ti" style="--c1:${esc(g.colors[0])};--c2:${esc(g.colors[1])}">${g.icon}</span><span><b>${esc(g.title)} · ${'★'.repeat(r.stars)}</b><small>${esc(r.text)}</small></span><span class="st ${r.status === 'approved' ? 'live' : r.status === 'hidden' ? 'hidden' : 'pending'}">${r.status === 'approved' ? 'Live' : r.status === 'hidden' ? 'Hidden' : 'Pending'}</span></div>`; }).join('')
        : `<p class="muted" style="margin:0 0 12px">No reviews yet.</p><a class="btn sm" href="reviews.html#write">Write one</a>`;
    }).catch(() => { $('#myrv').innerHTML = '<p class="muted" style="margin:0">Couldn\'t load your reviews right now.</p>'; });
    $('#del').addEventListener('click', async () => {
      if (!confirm('Delete your 2trapz account for good? Your profile and leaderboard spot will be removed.')) return;
      try { await account.deleteAccount(); location.href = 'index.html'; }
      catch (e){ const m = $('#amsg'); m.className = 'amsg bad'; m.textContent = account.errorText(e); }
    });
  }
  function paintSync(s){
    const el = $('#sync'); if (!el) return;
    el.className = 'syncpill' + (s === 'syncing' ? ' syncing' : s === 'error' ? ' error' : '');
    el.textContent = s === 'syncing' ? '⏳ Saving…' : s === 'error' ? '⚠️ Not saved' : '☁️ Synced';
  }
  document.addEventListener('tz:sync', e => paintSync(e.detail));

  function bind(){
    const tagIn = $('#tagIn');
    if (tagIn){
      const commit = () => { TZ.setTag(tagIn.value); refreshCard(); };
      tagIn.addEventListener('change', commit);
      tagIn.addEventListener('keydown', e => { if (e.key === 'Enter'){ commit(); tagIn.blur(); } });
    }
    $$('[data-pick]').forEach(b => b.addEventListener('click', () => {
      TZ.setAvatar(b.dataset.pick); TZ.sfx('click');
      $$('[data-pick]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); refreshCard();
    }));
    tilt();
  }
  function refreshCard(){ const w = $('.idwrap'); if (w) w.outerHTML = keycard(); tilt(); }
  function tilt(){
    const card = $('#idcard'); if (!card || TZ.reduce) return;
    const move = (x, y) => { const r = card.getBoundingClientRect(); const px = (x - r.left) / r.width - .5, py = (y - r.top) / r.height - .5;
      card.style.setProperty('--ry', (px * 16).toFixed(2) + 'deg'); card.style.setProperty('--rx', (-py * 12).toFixed(2) + 'deg'); };
    card.addEventListener('pointermove', e => move(e.clientX, e.clientY));
    card.addEventListener('pointerleave', () => { card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); });
  }

  function render(){
    if (!accountsOn || account.failed) return guestView();
    if (account.loading){ root.innerHTML = `<section class="panel box" style="grid-column:1/-1;text-align:center;padding:40px"><div style="font-size:44px">⏳</div><h3 style="justify-content:center">Connecting to the 2trapz Network…</h3></section>`; return; }
    if (account.user()) signedInView(); else signInView();
  }
  document.addEventListener('tz:auth', () => { render(); if (account.user() && next) location.href = next; });
  document.addEventListener('tz:profile', () => { if (!$('#tagIn') || document.activeElement !== $('#tagIn')) refreshCard(); });
  render();
})();
</script>
</body>
</html>
