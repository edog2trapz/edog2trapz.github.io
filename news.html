<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News · 2trapz games</title>
<meta name="description" content="The latest news, new games and updates on 2trapz games.">
<meta name="theme-color" content="#ff8a00">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4591809197740975"
     crossorigin="anonymous"></script>
<meta property="og:type" content="website">
<meta property="og:site_name" content="2trapz games">
<meta property="og:title" content="News · 2trapz games">
<meta property="og:description" content="The latest news, new games and updates on 2trapz games.">
<meta property="og:image" content="https://edog2trapz.github.io/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script>try{var t=JSON.parse(localStorage.getItem('tz.theme'));if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
.feed{position:relative;margin-top:30px;padding-left:64px}
.feed::before{content:"";position:absolute;left:25px;top:10px;bottom:10px;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--o1),var(--o3) 60%,transparent);box-shadow:0 0 14px rgba(255,130,0,.5)}
.post{position:relative;margin-bottom:24px}
.post .node{position:absolute;left:-64px;top:14px;width:54px;height:54px}
.post .node .orb{width:54px;height:54px;font-size:24px}
.post .node::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--o2);opacity:.4;animation:ping 2.4s ease-out infinite}
@keyframes ping{from{transform:scale(.85);opacity:.6}to{transform:scale(1.45);opacity:0}}
.post article{padding:22px 24px}
.post .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:13px;color:var(--ink3)}
.post .tg{padding:3px 10px;border-radius:var(--pill);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,#ffb44d,#f26a00);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.post h2{margin:8px 0 8px;font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(22px,3vw,30px);line-height:1.05}
.post p{margin:0;color:var(--ink2);font-size:16px}
.post .gl{margin-top:14px;max-width:420px}
.signal{display:flex;align-items:center;gap:10px;font:800 12px/1 ui-monospace,Consolas,monospace;letter-spacing:.18em;color:var(--o-text);margin-top:14px}
.signal i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}
@media (max-width:560px){.feed{padding-left:48px}.feed::before{left:17px}.post .node{left:-48px;width:38px;height:38px}.post .node .orb{width:38px;height:38px;font-size:18px}.post article{padding:18px}}
</style>
</head>
<body data-page="news">
<main id="main">
<div class="wrap">
  <section class="panel phero hud">
    <svg class="deco" viewBox="0 0 300 300" aria-hidden="true" fill="none"><circle cx="190" cy="110" r="70" stroke="var(--o2)" stroke-width="2" opacity=".6"/><circle cx="190" cy="110" r="100" stroke="var(--tech)" stroke-width="2" stroke-dasharray="3 10"/><circle cx="190" cy="110" r="135" stroke="var(--o2)" stroke-width="1.5" stroke-dasharray="60 20 6 20" opacity=".5"/><text x="190" y="128" text-anchor="middle" font-size="52">📡</text></svg>
    <div class="kicker">Transmissions</div>
    <h1>Latest <span>news</span></h1>
    <p>New games, updates and everything happening on 2trapz games.</p>
    <div class="signal"><i></i> LIVE FEED · <span id="cnt"></span></div>
    <span class="tag-id">2TZ // NWS-08</span>
  </section>
  <div class="feed" id="feed"></div>
</div>
</main>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
(() => {
  const { $, esc, bySlug, detailHref, fmtDate } = TZ;
  const N = (typeof NEWS !== 'undefined' ? NEWS : []).filter(Boolean);
  const ICON = { launch:'🚀', 'new games':'🎮', 'new game':'🎮', update:'🛠️', event:'🎉', fix:'🔧' };
  $('#cnt').textContent = N.length + ' transmission' + (N.length === 1 ? '' : 's');
  $('#feed').innerHTML = N.length ? N.map(n => { const g = n.game && bySlug(n.game);
    return `<div class="post reveal"><div class="node"><span class="orb">${ICON[String(n.tag || '').toLowerCase()] || '📡'}</span></div>
      <article class="panel"><div class="meta">${n.tag ? `<span class="tg">${esc(n.tag)}</span>` : ''}<span>${esc(fmtDate(n.date))}</span></div>
        <h2>${esc(n.title)}</h2><p>${esc(n.text)}</p>
        ${g ? `<a class="gl" href="${detailHref(g)}" style="--c1:${esc(g.colors[0])};--c2:${esc(g.colors[1])}"><span class="ti">${g.icon}</span><span><b>${esc(g.title)}</b><small>${esc(g.genre)}</small></span><span class="go">›</span></a>` : ''}
      </article></div>`; }).join('')
    : `<div class="panel empty"><div class="big">📡</div><h3>No transmissions yet</h3><p>Check back soon.</p></div>`;
  TZ.reveal();
})();
</script>
</body>
</html>
